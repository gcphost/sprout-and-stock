<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <title>Sprout &amp; Stock</title>
  <style>
    :root {
      --ink: #3a3128;
      --panel: rgba(255, 252, 245, 0.94);
      /* The same colour at full alpha. Anything that pins itself over scrolling
         content needs this rather than --panel: 94% over 94% is still see-
         through, and rows sliding under a "solid" header read as a fault. */
      --panel-solid: #fffcf5;
      --line: rgba(58, 49, 40, 0.14);
      --accent: #e2564a;
      --good: #5aa356;
      /* The step between "fine" and "you have a problem" — a gauge that only
         had the two would jump straight from green to alarm with no warning. */
      --warn: #e0a63c;
      /* ---- the bottom stack -------------------------------------------------
         Everything you press lives in one column at the bottom centre now, so
         its offsets are arithmetic off two numbers rather than a scattering of
         literals that have to be kept in step by hand. Bottom up: the nav, then
         the bar (`--build-h`, measured, 0 when no bar is up), then the panel. */
      --nav-h: 40px;
      --nav-bot: 14px;
      --nav-top: calc(var(--nav-bot) + var(--nav-h) + 8px);
      --build-h: 0px;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; overflow: hidden; }
    body {
      font: 14px/1.45 ui-rounded, "SF Pro Rounded", "Nunito", system-ui, sans-serif;
      color: var(--ink);
      background: #cfe9f5;
      -webkit-font-smoothing: antialiased;
      user-select: none;
    }
    /*
     * `touch-action: none` is not a nicety — without it the browser claims
     * every touch gesture on the canvas as a scroll or a page zoom, and takes
     * it by firing `pointercancel` a couple of events into the drag. Measured:
     * a two-finger twist arrived as 2 pointerdowns, 2 pointermoves and 2
     * pointercancels, so panning, pinch-zoom and the twist all did nothing at
     * all on a touchscreen while working perfectly under a mouse.
     *
     * `-webkit-touch-callout` is the same problem wearing iOS clothes: the
     * long press that opens a fixture's menu is also the press Safari uses to
     * offer its own callout over the element.
     */
    #game {
      display: block; width: 100vw; height: 100vh;
      touch-action: none;
      overscroll-behavior: none;
      -webkit-touch-callout: none;
    }

    #boot {
      position: fixed; inset: 0; display: grid; place-items: center;
      background: #cfe9f5; font-size: 18px; font-weight: 600; z-index: 50;
    }

    /* ---- the front door ---------------------------------------------------
       Pick a shop, or start one. Sits above #boot rather than inside the HUD:
       there is no world behind it yet, so none of the panel system's rules
       about floating over a live canvas apply. See client/menu.js. */
    #menu {
      position: fixed; inset: 0; z-index: 60; overflow-y: auto;
      background: #cfe9f5; display: grid; place-items: center; padding: 24px 16px;
    }
    #menu[hidden] { display: none; }
    .menu-box { width: min(440px, 100%); }
    .menu-box h1 {
      margin: 0; font-size: 30px; font-weight: 800; letter-spacing: -.02em; text-align: center;
    }
    .menu-box h1 span { color: var(--accent); }
    .menu-tag { margin: 2px 0 18px; text-align: center; opacity: .55; font-size: 12.5px; }

    .menu-field {
      display: flex; align-items: center; gap: 10px; background: var(--panel);
      border-radius: 12px; padding: 7px 12px; margin-bottom: 10px;
      box-shadow: 0 3px 12px rgba(58,49,40,.1);
    }
    .menu-field span { font-size: 11px; font-weight: 800; opacity: .5; text-transform: uppercase; letter-spacing: .04em; }
    .menu-field input {
      flex: 1; min-width: 0; border: 0; background: none; outline: 0; font: inherit;
      font-size: 14px; font-weight: 700; color: var(--ink);
    }

    /* Three small numbers side by side, because stacked they read as three
       decisions to make rather than one row to skip. `min-width: 0` on the
       field or a number input's intrinsic width shoves the row wider than the
       card. The spinners go: they are unhittable at this size and the field is
       already clamped at both ends by the server. */
    .menu-row { display: flex; gap: 8px; }
    .menu-row .menu-field { flex: 1; min-width: 0; gap: 6px; padding: 7px 10px; }
    .menu-row .menu-field span { flex: none; }
    .menu-row input { width: 100%; }
    .menu-row input::-webkit-outer-spin-button,
    .menu-row input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
    .menu-row input[type=number] { -moz-appearance: textfield; appearance: textfield; }

    .menu-list { display: flex; flex-direction: column; gap: 8px; margin: 14px 0 10px; }
    .menu-empty, .menu-note {
      font-size: 12px; opacity: .55; text-align: center; padding: 14px 4px; line-height: 1.45;
    }
    .menu-note { text-align: left; padding: 2px 2px 8px; }
    .menu-err {
      background: var(--accent); color: #fff; border-radius: 10px;
      padding: 7px 12px; font-size: 12.5px; font-weight: 700; margin-bottom: 6px;
    }
    /* "The shop in your link is gone" is news, not a failure — you are already
       looking at the list that answers it. */
    .menu-err.soft { background: #ffd66b; color: var(--ink); }

    .wcard {
      background: var(--panel); border-radius: 15px; padding: 11px 13px 10px;
      box-shadow: 0 4px 16px rgba(58,49,40,.13);
    }
    /* The shop you were in last, so a family of four save slots opens on yours. */
    .wcard.last { box-shadow: 0 4px 16px rgba(58,49,40,.13), inset 0 0 0 2px #ffd66b; }
    .wtop { display: flex; align-items: baseline; gap: 8px; }
    .wname { font-size: 16px; font-weight: 800; flex: 1; min-width: 0;
             overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .wlive {
      flex: none; background: #d8f0d2; color: #3f7a3c; border-radius: 99px;
      padding: 1px 8px; font-size: 10px; font-weight: 800;
    }
    .wstats { display: flex; gap: 9px; align-items: baseline; margin-top: 2px; font-size: 13px; }
    .wstats b { font-weight: 800; }
    .wstats span { opacity: .6; font-weight: 600; text-transform: capitalize; }
    .wsub { font-size: 10.5px; opacity: .5; margin-top: 1px; font-weight: 600; }

    /* Armed to delete. The card itself changes, not just the button, because a
       list of five cards is scanned by shape — a single word swapped inside one
       of three buttons is exactly the thing a mis-click already wasn't reading. */
    .wcard.arm { box-shadow: 0 4px 16px rgba(58,49,40,.13), inset 0 0 0 2px var(--accent); }

    /* Two things that take it in turns, stacked in one grid cell so the cell is
       always as big as the biggest of them and swapping which one shows moves
       nothing. Arming a delete used to insert the warning and relabel the
       button, which grew the card, pushed every card under it down and widened
       the row — under a cursor that is one button from Play, on a screen where
       the latch also expires by itself and puts it all back four seconds later.
       Both halves of a swap are in the DOM at rest; the resting one is child 1.
       `visibility` rather than `opacity`, so a screen reader reads one label. */
    .wswap { display: grid; }
    .wswap > * { grid-area: 1 / 1; }
    .wswap > :nth-child(2) { visibility: hidden; }
    .wswap.on > :nth-child(1) { visibility: hidden; }
    .wswap.on > :nth-child(2) { visibility: visible; }

    /* Shares the `.wsub` line's cell — the one line on the card that isn't the
       shop's name or what it is worth, and so the one you can spend on saying
       what a second click does. Keep it to a line at this width or every card
       carries the taller of the two as blank space for a state that is off. */
    .wwarn {
      margin-top: 1px; font-size: 11px; line-height: 1.4; font-weight: 700;
      color: var(--accent);
    }

    .wacts { display: flex; gap: 6px; margin-top: 9px; }
    .wacts button {
      border: 0; font: inherit; cursor: pointer; border-radius: 9px;
      padding: 6px 14px; font-size: 12.5px; font-weight: 800;
    }
    .wplay { background: var(--good); color: #fff; flex: 1; }
    .wghost { background: rgba(58,49,40,.08); color: var(--ink); }
    .wghost:hover { background: rgba(58,49,40,.16); }
    .wdel:hover { background: var(--accent); color: #fff; }
    .wdel.on { background: var(--accent); color: #fff; }

    .menu-add {
      width: 100%; border: 0; font: inherit; cursor: pointer; border-radius: 12px;
      padding: 10px; font-size: 13px; font-weight: 800; color: var(--ink);
      background: rgba(255,252,245,.6); box-shadow: inset 0 0 0 2px rgba(58,49,40,.12);
    }
    .menu-add:hover { background: var(--panel); }
    .menu-new { background: var(--panel); border-radius: 15px; padding: 11px 13px;
                box-shadow: 0 4px 16px rgba(58,49,40,.13); }
    .menu-new .menu-field { background: rgba(58,49,40,.06); box-shadow: none; }
    .menu-foot { text-align: center; font-size: 11px; opacity: .5; margin: 12px 0 0; }

    .hud { position: fixed; z-index: 10; }

    /* Icons are inline SVG sized in em, so every font-size rule that used to
       size an emoji still sizes the icon. `display:block` because an inline
       SVG sits on the text baseline and drags a gap under every button. */
    .ico > svg, .bico > svg, #panel-title > svg, #panel-close > svg { display: block; margin: 0 auto; }

    /* ---- top left: the passive readouts, stacked --------------------------
       One fixed column rather than two independently-pinned panels. The demand
       meter used to carry `top: 58px`, which is the height #stats happened to be
       on the day it was written — adding a row to the gauges slid the money
       panel down over it. Nothing up here has a fixed height, so nothing up here
       gets to hardcode where the next thing starts, and the cashflow readout
       going into #stats is exactly the change that would have broken it. */
    #topleft {
      top: 12px; left: 12px;
      display: flex; flex-direction: column; align-items: flex-start; gap: 8px;
    }
    /* top-left: money + day
       Sized down about a fifth from where it started, and the reason is what it
       is competing with rather than anything wrong with it: this is a readout
       you glance at, pinned over the one thing in the game you are actually
       looking at. Everything in here scales together — type, bars, sparkline,
       padding — because a panel where only some of it shrank reads as a panel
       with a mistake in it. */
    #stats {
      background: var(--panel); border-radius: 11px;
      padding: 4px 9px; box-shadow: 0 3px 11px rgba(58,49,40,.14);
      display: flex; gap: 8px; align-items: center;
    }

    /* ---- top centre: what to do about it ---------------------------------
       A single line, sized to clear the stats panel on the left and the rail on
       the right. A stack cost vertical space in the middle of the screen, which
       is the one place the game is actually happening. */
    #hq {
      top: 12px; left: 50%; transform: translateX(-50%);
      display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
      justify-content: center; pointer-events: none;
      max-width: min(860px, calc(100vw - 360px));
    }
    /* ---- nothing in this row may move sideways ---------------------------
       Every cell here holds a number that changes while you watch it, and they
       sit in one flex row — so a digit that is a pixel wider than the last one
       slides the clock, the buttons and the gauges along with it. It reads as
       the HUD being unable to keep still.
       Two rules, and both are needed. Tabular numerals stop a `4` being
       narrower than a `0`, which is the per-tick jitter; a floor on the width
       stops the *number of digits* changing anything, which is the jolt you
       get crossing $10,000 or Day 100. Sized to what a shop plausibly reaches
       rather than to today's value, since a floor that today's value already
       exceeds is a floor that does nothing. */
    #cash {
      font-size: 14px; font-weight: 800; letter-spacing: -.02em;
      font-variant-numeric: tabular-nums; min-width: 86px;
    }
    #day  { font-weight: 700; font-size: 10px; line-height: 1.25; min-width: 44px; }
    #season { text-transform: capitalize; opacity: .65; font-size: 8.5px; line-height: 1.25; }
    /* ---- the clock, and the two switches on it ---------------------------
       The time was a readout for as long as opening was something the clock did
       to you. It is a control now: the doors are yours (`Game.setOpen`) and so
       is whether time runs at all, and both of those are decisions you make
       while looking at the hour — so they live on it rather than in a menu.
       A shut shop reads shut in two ways at once on purpose. The strike-through
       is the state and the button is the way out of it: a struck-through clock
       with nothing beside it was the whole story before, which said what had
       happened and never that anything could be done about it. */
    /* A row rather than a stack: the buttons under the clock made #stats a line
       taller than the gauges beside them needed it to be, which is height spent
       on two controls you press twice a day. */
    #time { display: flex; align-items: center; gap: 5px; }
    #clock { font-variant-numeric: tabular-nums; font-weight: 700; font-size: 11px; }
    #clock.shut { opacity: .4; text-decoration: line-through; }
    /* Paused outranks shut, because it is the bigger claim: a shut shop is still
       a shop having a night, and a paused one is not having anything. */
    #clock.paused {
      opacity: 1; text-decoration: none; color: var(--accent);
      animation: clockhold 1.6s ease-in-out infinite;
    }
    @keyframes clockhold { 0%, 100% { opacity: 1; } 50% { opacity: .35; } }

    /* Two pips, and they are round and chunky on purpose.
       Words came first: "Open up" and "Close up" are different lengths, so the
       panel changed width every time the shop did and everything to the right
       of it slid — and at ~110px for two labels they were the widest thing in a
       readout that is otherwise five numbers. Square icon buttons fixed both and
       read as a settings toolbar, which is the wrong genre for a HUD you play
       through. A circle, a solid fill and a hard bottom edge that goes away when
       you press it is the difference; the text moved into `title`. */
    #timebtns { display: flex; gap: 3px; }
    #timebtns button {
      border: 0; padding: 0; cursor: pointer; border-radius: 50%;
      width: 18px; height: 18px; display: grid; place-items: center;
      font-size: 9.5px; background: rgba(58,49,40,.12); color: var(--ink);
      box-shadow: 0 1.5px 0 rgba(58,49,40,.2);
      transition: filter .12s, background .12s;
    }
    #timebtns button > svg { display: block; }
    #timebtns button:hover { filter: brightness(.94); }
    /* Presses down and stops standing proud, which is most of what makes a
       button feel like a thing rather than a rectangle that changed colour. */
    #timebtns button:active { transform: translateY(1.5px); box-shadow: none; }
    /* Coloured only when it has something to say: green while the shop is SHUT,
       because it is then the one control on screen asking to be pressed, and red
       while time is stopped, because that is a state you must not forget you
       left it in. Otherwise both are quiet. */
    #btn-open.go, #btn-pause.on { color: #fff; }
    #btn-open.go { background: var(--good); box-shadow: 0 1.5px 0 rgba(47,89,45,.55); }
    #btn-pause.on { background: var(--accent); box-shadow: 0 1.5px 0 rgba(140,54,34,.5); }
    #btn-open.go:hover, #btn-pause.on:hover { filter: brightness(1.09); }

    /* ---- cashflow: the rate, beside the balance -------------------------------
       Cash on hand was the only money on screen, and a balance is not a rate —
       you can watch it climb all week while every single day loses money against
       the wages. This is today's net, an arrow against yesterday, and the week's
       shape, in that order: the number you want most, then the comparison, then
       the trend. Tabular numerals because it changes ten times a second and
       proportional digits make it jitter sideways as it does. */
    /* `min-width` for the same reason as #cash above — this is the fastest
       changing number on screen, so it is the one that shifts the row most. */
    #flow {
      display: flex; flex-direction: column; gap: 1px; align-items: flex-start;
      min-width: 70px;
    }
    .flow {
      display: inline-flex; align-items: baseline; gap: 3px;
      font-variant-numeric: tabular-nums; font-size: 10.5px; font-weight: 800;
      letter-spacing: -.01em;
    }
    .flow.up { color: var(--good); }
    .flow.down { color: var(--accent); }
    /* The arrow says which way against *yesterday*, which is a different
       question from whether today is in profit — a better-than-yesterday day can
       still be a loss. So it is coloured on its own and never inherits. */
    .flow i { font-style: normal; font-size: 7.5px; }
    .flow i.up { color: var(--good); }
    .flow i.down { color: var(--accent); }
    .flow i.flat { color: var(--ink); opacity: .35; }
    .spark { display: block; overflow: visible; }
    .spark rect.up { fill: var(--good); opacity: .75; }
    .spark rect.down { fill: var(--accent); opacity: .8; }
    .spark line.axis { stroke: rgba(58, 49, 40, .22); stroke-width: .75; }
    /* ---- the three gauges -------------------------------------------------
       Reputation is the shop's long memory, mood is how the room feels right
       now, and full is whether there is room for anybody else. One was an
       unlabelled 52px sliver, which is fine when it is the only bar on screen
       and unreadable the moment there are three — so they get names.

       All three fill rightwards and all three are read the same way: **a long
       bar is the shop doing well.** That is why FULL is drawn against the
       turn-away line rather than against capacity. A bar that filled as the
       shop got busier would mean "good" at one end of the panel and "bad" at
       the other, and the eye does not re-read a direction per row. */
    .gauges { display: grid; gap: 2px; }
    .gg { display: grid; grid-template-columns: 22px 42px; align-items: center; gap: 5px; }
    .gg-tag {
      font-size: 6.5px; font-weight: 800; letter-spacing: .04em;
      text-transform: uppercase; opacity: .5; text-align: right;
    }
    .repwrap { width: 42px; height: 4px; background: var(--line); border-radius: 99px; overflow: hidden; }
    .repwrap > div { height: 100%; background: var(--good); transition: width .4s, background .4s; }
    /* Past the line the shop is refusing people, which is not a shade of busy —
       it is a different thing happening, so it stops being a bar and pulses. */
    #full.shut { animation: fullpulse 1.1s ease-in-out infinite; }
    @keyframes fullpulse { 50% { opacity: .35; } }

    /* ---- top left, under the money: the demand meter ----------------------
       An RCI meter, and built like one: a fixed set of channels in a fixed
       order, on screen whether or not anything is happening.

       It used to draw the active world-event modifiers folded per tag, which
       looks like this and was a different thing entirely — the rows were
       whichever tags the AI director had written about, so they appeared and
       expired under you, mixed departments with moods (PANTRY next to TRENDY),
       and a week with no events drew nothing at all. You cannot learn to read a
       panel whose rows move; the only shape it ever had was "some things are
       happening". Now the twelve departments are always all there, always in
       `DEPARTMENTS` order, and only the lengths change.

       Right is "they asked and you were short", left is "this space is not
       earning". A department with nothing to say draws no bar — see DEADBAND in
       client/hud-meters.js for why a stub on every row is worse than a gap.

       It stacks under #stats because it is a passive readout and belongs with
       the other passive readouts, and because a column can carry its labels
       inline — a row of columns has to write each name sideways-on under a
       narrow bar, and "beverage" does not fit under nine pixels. */
    /* Faded until you want it, because it is the one readout up here that is
       always saying something. Twelve rows of live bars over the shop floor is
       a lot of ink for a thing you consult rather than watch, and the corner it
       sits in is where the farm is. Full strength the moment you point at it —
       so it costs a glance to read and nothing to ignore.

       It is also draggable (see `wireDrag` in client/ui.js): it is its own
       handle, hence `cursor: grab`. Dragging pins it with an inline
       `position: fixed`, and double-clicking gives it back to this column —
       which is why nothing here hardcodes a `top`. See the note above #topleft
       for what happened the last time anything up here did. */
    #rci {
      width: 146px;
      display: flex; flex-direction: column; gap: 2px;
      background: var(--panel); border-radius: 13px; padding: 7px 10px;
      box-shadow: 0 4px 14px rgba(58,49,40,.14);
      opacity: .45; transition: opacity .12s ease;
      cursor: grab; touch-action: none;
    }
    /* `:active` as well as `:hover`, because a drag captures the pointer and can
       take it outside the element — without it the meter fades out from under
       you halfway through moving it, which reads as having dropped it. */
    #rci:hover, #rci:active { opacity: 1; }
    #rci:active { cursor: grabbing; }
    .mtr { display: grid; grid-template-columns: 1fr 56px; align-items: center; gap: 7px; }
    .mtr-tag {
      font-size: 8.5px; font-weight: 800; letter-spacing: .02em;
      text-transform: uppercase; opacity: .55; text-align: right;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    /* A world event pulling this department. On the label rather than the bar,
       because the bar already has the event folded into its length and marking
       it twice would read as two facts. */
    .mtr-tag.hot { opacity: .95; color: var(--accent); }
    .mtr-tag.cold { opacity: .3; }
    /* A fixed plot with the zero line down its middle, so every bar is measured
       against the same axis instead of against its own. Each row draws its own
       segment; stacked, they form one continuous line. */
    .mtr-plot { position: relative; height: 7px; }
    .mtr-plot::after {
      content: ''; position: absolute; left: 50%; top: -3px; bottom: -3px;
      width: 1px; background: rgba(58,49,40,.16);
    }
    .mtr-bar { position: absolute; top: 0; bottom: 0; border-radius: 2px; }
    .mtr.up .mtr-bar { left: 50%; background: var(--good); }
    .mtr.down .mtr-bar { right: 50%; background: var(--accent); }

    /* What to actually do about all of the above. Derived entirely from the
       same snapshot — no new server field — and capped at three, because a
       to-do list you can't finish is wallpaper rather than a prompt. */
    #todo { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; }
    #todo:empty, #rci:empty { display: none; }
    .todo {
      background: var(--panel); border-radius: 99px; padding: 2px 9px 2px 7px;
      font-size: 11.5px; font-weight: 600; color: var(--ink);
      box-shadow: 0 2px 7px rgba(58,49,40,.11);
      display: inline-flex; align-items: center; gap: 5px;
    }
    .todo svg { width: 12px; height: 12px; opacity: .7; flex: none; }
    .todo b { font-weight: 800; }
    /* The one that is costing you money right now, rather than merely pending. */
    .todo.hot { background: #ffd66b; box-shadow: 0 2px 9px rgba(200,150,20,.32); }
    .todo.hot svg { opacity: .9; }

    /* The nav: one icon per menu, along the bottom centre. The only thing on
       screen that says the game has menus at all — before it, three unrelated
       letter keys were the entire discovery story.

       It ran down the top-right corner until the build palette moved to the
       bottom. With the thing you press most at the bottom centre and the way
       into every menu diagonally opposite it, every session was a stream of
       corner-to-corner mouse journeys. Now the nav, the bar above it and the
       panel above that are one column under the pointer. */
    #rail {
      bottom: var(--nav-bot); left: 50%; transform: translateX(-50%);
      display: flex; gap: 6px; max-width: calc(100vw - 16px); flex-wrap: wrap;
      justify-content: center;
    }
    .rail-btn {
      position: relative; width: 40px; height: 40px; border: 0; cursor: pointer;
      background: var(--panel); border-radius: 12px; color: var(--ink);
      box-shadow: 0 4px 14px rgba(58,49,40,.15); display: grid; place-items: center;
      font: inherit; transition: background .12s, transform .12s;
    }
    .rail-btn:hover { transform: translateY(-2px); }
    /* Lit means "this menu is open" — except on Build, which is a mode rather
       than a menu, where it means the world is in it. */
    .rail-btn.on { background: #ffd66b; }
    .rail-btn .ico { font-size: 18px; line-height: 1; }
    .rail-btn .kb { position: absolute; bottom: 2px; right: 5px; font-size: 8px; font-weight: 800; opacity: .35; }
    .rail-btn .badge {
      position: absolute; top: -4px; right: -4px; min-width: 16px; height: 16px; padding: 0 4px;
      border-radius: 99px; background: var(--accent); color: #fff;
      font-size: 10px; font-weight: 800; display: grid; place-items: center;
      box-shadow: 0 2px 6px rgba(58,49,40,.25);
    }
    .rail-btn .badge[hidden] { display: none; }

    /* The delivery ring. It traces the button's own border — see RING_PATH in
       client/rail.js for why that shape rather than a circle.

       `pointer-events: none` is not a nicety: the svg covers the whole button,
       so without it the ring eats every click on the one control it is drawn
       on. It sits first in the markup so the badge and the icon paint over it
       at the corner, where the two overlap by a pixel or so.

       Both strokes are faded in together rather than the arc alone, or an empty
       ring at the start of a wait is indistinguishable from no ring at all —
       the track is what says "this is filling up", and it is the half that
       makes a countdown legible from one glance rather than two. */
    .rail-btn .ring {
      position: absolute; inset: 0; width: 100%; height: 100%;
      pointer-events: none; overflow: visible;
    }
    .rail-btn .ring path { fill: none; stroke-width: 2.5; opacity: 0; transition: opacity .25s; }
    .rail-btn .ring .trk { stroke: var(--line); }
    .rail-btn .ring .arc {
      stroke: var(--warn); stroke-linecap: round;
      /* Long and linear, because the arc is written about once a minute (see
         `updateRings`) — the transition is what turns a hundred stepped writes
         into something that looks like it is moving at all. An eased one would
         visibly stall between steps. */
      transition: stroke-dashoffset .5s linear, stroke .3s, opacity .25s;
    }
    .rail-btn.waiting .ring path { opacity: 1; }

    /* How much is on the way. Opposite corner to the badge, and a different
       colour, because they are different kinds of news: the badge is a problem
       you can act on (red, top right, where every notification count in the
       world lives) and this is money already spent that has not landed yet.
       Sharing one slot would have them flicker between two unrelated numbers.

       It wears the ring's colour rather than its own, so the count and the arc
       read as one readout — the number is what the ring is counting down. */
    .rail-btn .cargo {
      position: absolute; bottom: -4px; left: -4px; min-width: 16px; height: 16px; padding: 0 4px;
      border-radius: 99px; background: var(--warn); color: #fff;
      font-size: 10px; font-weight: 800; display: grid; place-items: center;
      box-shadow: 0 2px 6px rgba(58,49,40,.25);
      transition: background .3s;
    }
    .rail-btn .cargo[hidden] { display: none; }
    .rail-btn.landing .cargo { background: var(--good); }
    /* Pulling in. Green because the wait is over, and moving because a full
       ring holding still is the same picture as a full ring that has finished. */
    .rail-btn.landing .ring .arc { stroke: var(--good); animation: van-in 1.1s ease-in-out infinite; }
    @keyframes van-in { 50% { opacity: .3; } }
    @media (prefers-reduced-motion: reduce) {
      .rail-btn.landing .ring .arc { animation: none; }
    }

    /* ---- the tooltip -------------------------------------------------------
       One element, moved to whatever is hovered — see client/tip.js for why it
       is not an `::after` on the button.

       Above the HUD (10) and below the modal layers (50/60): it explains the
       HUD, so it has to clear it, and it explains nothing about a dialog that
       has taken the whole screen. `pointer-events: none` is load-bearing rather
       than tidy — the box sits directly over the row above the rail, and a tip
       that could be hovered would swallow clicks on whatever it covers, as well
       as fighting its own `pointerout`. */
    #tip {
      position: fixed; z-index: 40; pointer-events: none;
      max-width: 240px; padding: 7px 10px 8px;
      background: var(--panel-solid); color: var(--ink);
      border-radius: 11px; box-shadow: 0 8px 22px rgba(58,49,40,.22);
      font-size: 12px; line-height: 1.3;
      opacity: 0; transform: translateY(5px) scale(.93);
      /* Out fast and flat, in slower with an overshoot past 1: a tip that
         springs into place reads as the shop answering you, and the same curve
         on the way out reads as it bouncing off the screen. Leaving is not an
         event and should not be animated like one. */
      transition: opacity .09s ease, transform .09s ease;
    }
    #tip.show {
      opacity: 1; transform: translateY(0) scale(1);
      transition: opacity .13s ease, transform .22s cubic-bezier(.34, 1.56, .64, 1);
    }
    /* Flipped below, for anything near the top of the screen. It springs DOWN
       out of its caret rather than up, or a tip under the meters would rise
       into the thing it is describing.

       These sit after `.show` deliberately: `#tip.down` and `#tip.show` are the
       same specificity, so the later rule is the one that wins the transform,
       and swapping the two blocks would break the flip with nothing in either
       one looking wrong. */
    #tip.down { transform: translateY(-5px) scale(.93); }
    #tip.down.show { transform: translateY(0) scale(1); }
    /* Shadow cast the other way with it. Left pointing down it would fall
       across the box it is attached to, which reads as a smudge on the card. */
    #tip.down .arrow { bottom: auto; top: -3px; box-shadow: -2px -2px 6px rgba(58,49,40,.12); }

    #tip .row { display: flex; align-items: center; gap: 8px; }
    #tip .ttl { font-weight: 800; letter-spacing: -.01em; }
    /* The hotkey as a key cap, which is the same thing `.kb` says on the button
       itself — said properly, because here there is room for it. */
    #tip .key {
      margin-left: auto; padding: 1px 5px; border-radius: 5px;
      background: rgba(58,49,40,.09); box-shadow: inset 0 -1px 0 rgba(58,49,40,.14);
      font-size: 9.5px; font-weight: 800; opacity: .6;
    }
    #tip .key[hidden] { display: none; }
    /* The second line: what the thing is doing right now. Quieter than the
       name, because you read the name to find the button and this to find out
       what it has to say. */
    #tip .note { margin-top: 2px; opacity: .62; font-size: 11px; }
    #tip .note[hidden] { display: none; }
    /* ...unless it is live, in which case it is the reason you hovered. It
       wears the same two colours the delivery ring does, so the arc on the
       button and the sentence above it are visibly one readout. */
    #tip .note[data-tone] { opacity: 1; font-weight: 700; }
    #tip .note[data-tone="warn"] { color: #b5801f; }
    #tip .note[data-tone="good"] { color: #46803f; }
    /* The caret. A rotated square rather than a border triangle, so it takes
       the box's own background and shadow and stays one shape with it — and it
       is positioned by script rather than centred here, because a tip pushed
       off the screen edge must still point at its button. */
    #tip .arrow {
      position: absolute; bottom: -3px; width: 10px; height: 10px;
      margin-left: -5px; border-radius: 2px;
      background: var(--panel-solid); transform: rotate(45deg);
      /* The box's own shadow stops at the box, so without this the caret is a
         flat tab hanging off a lifted card. Offset down-and-right in the
         element's own axes, which after the 45° turn is straight down the
         screen — a shadow is transformed with the thing that casts it. */
      box-shadow: 2px 2px 6px rgba(58,49,40,.12);
    }
    @media (prefers-reduced-motion: reduce) {
      #tip, #tip.show { transition: opacity .1s ease; transform: none; }
    }

    /* The drag joystick draws nothing — see client/main.js. */

    /* bottom-left: event log */
    #log { left: 12px; max-width: 300px; display: flex; flex-direction: column; gap: 3px; }
    #log div {
      background: var(--panel); border-radius: 9px; padding: 3px 9px;
      font-size: 11.5px; line-height: 1.35; box-shadow: 0 2px 7px rgba(58,49,40,.09);
      transition: opacity .3s, transform .3s;
    }
    #log div.out { opacity: 0; transform: translateX(-8px); }
    #carry { right: 12px; font-weight: 700; background: var(--panel);
             border-radius: 9px; padding: 3px 9px; font-size: 11.5px;
             box-shadow: 0 2px 7px rgba(58,49,40,.09); }
    #carry:empty { display: none; }

    /* "Harvesting…" — what standing here is about to do. Sits low and centre,
       near where your hand already is, and vanishes the moment nothing is in
       range. */
    #prompt {
      left: 50%; transform: translate(-50%, 8px); opacity: 0;
      background: rgba(58,49,40,.86); color: #fff; padding: 7px 16px;
      border-radius: 99px; font-size: 14px; font-weight: 600;
      pointer-events: none; transition: opacity .14s, transform .14s;
      white-space: nowrap;
    }
    #prompt.show { opacity: 1; transform: translate(-50%, 0); }
    #prompt.going { background: #ffd66b; color: var(--ink); }
    #prompt b { font-weight: 800; }

    /* toast */
    /* Just below #hq's single strip. */
    #toast {
      top: 66px; left: 50%; transform: translate(-50%, -12px); opacity: 0;
      background: var(--ink); color: #fff; padding: 6px 14px; border-radius: 99px;
      font-size: 12.5px; font-weight: 700; pointer-events: none; transition: .25s;
    }
    #toast.show { opacity: 1; transform: translate(-50%, 0); }
    #toast.bad { background: var(--accent); }

    /* The panel is what the nav expands into: it rises out of the button you
       pressed, above whatever bar is up, and is the top of the same column. */
    #panel {
      bottom: calc(var(--nav-top) + var(--build-h) + 8px);
      left: 50%; transform: translateX(-50%);
      /* Wider than it was, and it can afford to be: 214px was the width of a
         strip pinned against the right rail, and at that width a worker's
         read-out wrapped every line — "looking for something to do" over two,
         "New behind the counter" over two — so the head ate the room the job
         list needed. Wider costs horizontal space nothing else is using and
         buys back four rows of vertical.

         The height is the real space above the stack rather than a flat vh, so
         a taller bar shortens the panel instead of pushing it off the top. */
      width: min(430px, calc(100vw - 24px));
      max-height: min(72vh, calc(100vh - var(--nav-top) - var(--build-h) - 20px));
      background: var(--panel);
      border-radius: 18px; box-shadow: 0 10px 34px rgba(58,49,40,.22);
      display: none; flex-direction: column; overflow: hidden;
    }
    #panel.show { display: flex; }
    /* The header is also the grab handle: drag to move the panel, double-click
       to give it back to the stylesheet. `touch-action` because without it a
       drag on a touchscreen is a scroll gesture before it is ever a drag. */
    #panel header {
      display: flex; justify-content: space-between; align-items: center;
      padding: 7px 10px; border-bottom: 1px solid var(--line); font-weight: 800;
      cursor: move; touch-action: none;
    }
    #panel-title { display: flex; align-items: center; gap: 7px; font-size: 12.5px; }
    #panel-close {
      border: 0; background: none; font: inherit; cursor: pointer; font-size: 15px;
      color: var(--ink); opacity: .5; padding: 0;
    }
    #panel-close:hover { opacity: 1; }
    /* The scroller. Its padding is named because the sticky head and foot below
       have to cancel it exactly — a sticky `top: 0` pins to the padding edge, so
       without that the rows scroll through a sliver of gap above the pinned
       block and it reads as a rendering fault. */
    #panel-body { --panel-pad: 3px; overflow-y: auto; padding: var(--panel-pad); }

    /* A menu that declared a middle pane. The body stops scrolling and becomes
       a column: head, tabs, the one thing that scrolls, foot. `min-height: 0`
       on the scroller is the whole trick — a flex child defaults to
       `min-height: auto`, which means "as tall as my content", so without it
       the pane never overflows, never scrolls, and pushes the foot off the
       bottom of the panel instead. */
    #panel-body.paned {
      display: flex; flex-direction: column; overflow: hidden;
      /* It is itself a flex child of #panel, and it stopped being a scroller —
         so without these it grows to fit its content and takes the panel's
         max-height with it. `overflow-y: auto` was doing this job implicitly. */
      flex: 1 1 auto; min-height: 0;
    }
    #panel-body.paned .pnl-mid { flex: 1 1 auto; min-height: 0; overflow-y: auto; }
    #panel-body.paned .pnl-head,
    #panel-body.paned .pnl-foot,
    #panel-body.paned .tabs { flex: none; }
    /* Sticky was how these pinned themselves when the whole body scrolled.
       Nothing scrolls past them now, so the offsets that cancelled the body's
       padding would only shift them by it. */
    #panel-body.paned .pnl-head,
    #panel-body.paned .pnl-foot,
    #panel-body.paned .tabs { position: static; }

    /* A game does not get the operating system's scrollbar. Thin, in the
       panel's own ink, and only over the pane that actually scrolls — the
       default is 15px of grey chrome down the side of a 214px panel, which is
       7% of the width spent looking like a settings dialog.

       Both spellings, because they are not the same feature: `scrollbar-width`
       is the standard one Firefox has, `::-webkit-scrollbar` is what Chrome and
       Safari read, and neither is a fallback for the other. */
    #panel-body, #panel-body .pnl-mid {
      scrollbar-width: thin;
      scrollbar-color: rgba(58,49,40,.22) transparent;
    }
    #panel-body::-webkit-scrollbar,
    #panel-body .pnl-mid::-webkit-scrollbar { width: 6px; height: 6px; }
    #panel-body::-webkit-scrollbar-track,
    #panel-body .pnl-mid::-webkit-scrollbar-track { background: transparent; }
    #panel-body::-webkit-scrollbar-thumb,
    #panel-body .pnl-mid::-webkit-scrollbar-thumb {
      background: rgba(58,49,40,.2); border-radius: 99px;
    }
    #panel-body::-webkit-scrollbar-thumb:hover,
    #panel-body .pnl-mid::-webkit-scrollbar-thumb:hover { background: rgba(58,49,40,.34); }

    /* Search and tag chips. A comprehensive catalogue you cannot search is
       what mods get written to fix, and ours grows live while you play. */
    #panel-filter { padding: 5px 7px; border-bottom: 1px solid var(--line); }
    #panel-filter[hidden] { display: none; }
    #panel-searchwrap {
      display: flex; align-items: center; gap: 7px; padding: 0 9px;
      background: rgba(58,49,40,.06); border-radius: 9px;
    }
    #panel-searchwrap:focus-within { outline: 2px solid #ffd66b; }
    #panel-searchwrap .ico { font-size: 13px; opacity: .4; }
    #panel-search {
      flex: 1; border: 0; background: none; color: var(--ink); outline: 0;
      padding: 5px 0; font: inherit; font-size: 12px; font-weight: 600; min-width: 0;
    }
    /* The tag chips that used to sit here listed every tag on screen — thirty
       above eighteen items — to do what typing in the box already does. */
    /* Icon tabs at the top of a menu that declared groups. Sticky, because the
       body is what scrolls — tabs that scrolled away would leave you in a list
       with no way back to the one you wanted. Icon-only: the panel is 214px and
       four labelled tabs would each get nine characters. */
    .tabs {
      position: sticky; top: 0; z-index: 2; display: flex; gap: 3px;
      padding: 2px 0 6px; margin-bottom: 4px;
      background: var(--panel-solid); border-bottom: 1px solid var(--line);
    }
    .tab {
      flex: 1; display: grid; place-items: center; padding: 5px 0;
      border: 0; border-radius: 8px; background: transparent;
      color: var(--ink); opacity: .4; font-size: 13px; cursor: pointer;
      transition: opacity .1s, background .1s;
    }
    .tab:hover { opacity: .8; background: rgba(58,49,40,.06); }
    .tab.on { opacity: 1; background: #ffd66b; }
    .tab svg { display: block; }

    .row { display: flex; align-items: center; gap: 7px; padding: 4px 7px; border-radius: 9px; }
    .row:hover { background: rgba(58,49,40,.05); }
    .row.owned { opacity: .5; }
    /* The title stays on one line — it's short, and a wrapping bold heading
       reads as two rows. The description wraps but is clamped at two lines, so
       a menu fed from a live database still can't grow taller than the screen;
       anything past that is on the hover title. */
    .row .name {
      flex: 1; min-width: 0; font-size: 12px; font-weight: 700;
      display: flex; flex-direction: column;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .row .tags {
      font-weight: 500; font-size: 10.5px; line-height: 1.3; opacity: .55;
      white-space: normal; overflow: hidden;
      display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2;
    }
    /* The name gets a line to itself, and everything said ABOUT the item shares
       the one under it.
       Three arrangements to get here and the middle one is the lesson: the pill
       next to the name reads better in a mock-up and is wrong in the panel,
       because it is a fixed-width thing competing with the only elastic thing in
       the row. Nine characters of pill came straight off the name, so "Berry
       Smoothie" ellipsised to "Berry S…" and the list stopped being readable at
       the one column that identifies a row. News and description sit together on
       line two; the name never gives way to either. */
    .row .name > .t { overflow: hidden; text-overflow: ellipsis; }
    .row .meta { display: flex; align-items: center; gap: 6px; min-width: 0; }
    .row .meta .tags { min-width: 0; }
    .row .heat {
      flex: none; padding: 0 5px; border-radius: 99px;
      font-size: 9.5px; font-weight: 800; letter-spacing: .01em;
      font-variant-numeric: tabular-nums;
    }
    .row .heat.up { background: #d8f0d2; color: #3f7a3c; }
    .row .heat.down { background: #f6dcd7; color: #a8442f; }
    /* The key hint never shrinks and never wraps — it's the shortest thing in
       the row and the whole reason the row is there, so the name gives way. */
    .row .price {
      font-weight: 700; font-variant-numeric: tabular-nums;
      flex: none; white-space: nowrap; font-size: 11px; opacity: .85;
    }
    .row button {
      border: 0; background: var(--good); color: #fff; border-radius: 8px;
      padding: 3px 9px; font: inherit; font-size: 11px; font-weight: 700; cursor: pointer; flex: none;
    }
    .row .have { font-size: 10.5px; opacity: .6; }

    /* One item's standing order, on the row it is about.
       Inline rather than behind a tap, because these are the rows you scan to
       decide what to set — a rule you have to open a thing to see is a rule you
       forget you set. It is what the panel got wider for. */
    /* Every selector here has to out-specify `.row button` above, which paints
       any button in a row as the big green buy pill. It does not — a class beats
       nothing but a class-plus-type beats a class — so the steppers came out as
       seven green blobs across the row. Scoped to `.row` to win it back. */
    .row .rule { display: flex; align-items: center; gap: 4px; flex: none; }
    /* Min over max rather than beside it. The row is two lines tall because of
       the name and its caption, so the second line is already paid for — and
       side by side these two ran nearly the width of the panel and ellipsised
       the name to buy back height nothing was going to use. */
    .row .rule .stack { display: flex; flex-direction: column; gap: 2px; }
    /* A label, a number and two nudges. The number is the widest thing in it and
       it must not resize as it changes, or every press shuffles the row under
       your finger — hence a fixed width and tabular figures. */
    .row .stp {
      display: flex; align-items: center; gap: 0;
      background: rgba(58,49,40,.06); border-radius: 7px; padding: 1px;
    }
    .row .stp i {
      font-style: normal; font-size: 8px; font-weight: 800; letter-spacing: .03em;
      text-transform: uppercase; opacity: .38; padding: 0 3px 0 4px;
    }
    .row .stp b {
      min-width: 15px; text-align: center; font-size: 10.5px; font-weight: 800;
      font-variant-numeric: tabular-nums;
    }
    /* Unset is a dash, not a zero: "no minimum" and "a minimum of nothing" are
       different sentences and only one of them is true here. */
    .row .stp b.none { opacity: .28; font-weight: 700; }
    .row .rbtn {
      border: 0; background: transparent; color: var(--ink);
      border-radius: 5px; padding: 0; width: 15px; height: 16px; line-height: 1;
      font: inherit; font-size: 12px; font-weight: 800; cursor: pointer;
      display: grid; place-items: center; flex: none; opacity: .5;
    }
    .row .rbtn:hover { background: rgba(58,49,40,.14); opacity: 1; }
    /* The one that is a state rather than a nudge. Off is the loud one, because
       "never order this" is the exception and the default has nothing to say. */
    .row .rbtn.tog {
      width: 20px; height: 20px; font-size: 12px; opacity: .28;
      background: rgba(58,49,40,.06); margin-right: 1px;
    }
    .row .rbtn.tog svg { display: block; width: 1em; height: 1em; }
    .row .rbtn.tog.on { opacity: .7; }
    .row .rbtn.tog.off { background: rgba(190,60,45,.13); color: var(--accent); opacity: 1; }

    /* How many you are holding, on the row that orders more. The one number the
       supplier never showed and the whole reason it read as a catalogue rather
       than a stock list — "should I buy eggs" is unanswerable without it. */
    .row .held {
      flex: none; min-width: 30px; text-align: right; white-space: nowrap;
      font-size: 12px; font-weight: 800; font-variant-numeric: tabular-nums;
    }
    .row .held.short { color: var(--accent); }
    /* Nothing on the shelf. A dash rather than a 0 for the same reason an unset
       minimum is one, and dimmed on its own rather than by a `zero` class on the
       whole column, which is what this replaced — since deliveries take time the
       column can hold "none here, six coming", and fading that pair together
       fades the half that is news. */
    .row .held i.none { font-style: normal; opacity: .25; font-weight: 700; }
    /* What is on a van, hung off the count instead of taking a column of its
       own. Green because it is the answer to the red number beside it, and
       small because it is a promise rather than stock: you cannot sell it yet,
       and a row that shouted it would read as though you could. */
    .row .held .coming {
      font-style: normal; font-size: 9.5px; font-weight: 800;
      color: var(--good); margin-left: 2px; opacity: .9;
    }
    /* The sub-line is a reason now rather than a tag list, and the one reason
       that is a refusal rather than a note says so in the accent colour: you
       cannot put this anywhere, so buying it is a mistake whatever else is true. */
    .row .tags.warn { color: var(--accent); opacity: .85; font-weight: 700; }

    /* Section rows. Where the whole row is the button — picking a thing to
       build, picking a seed — the row is clickable and says so. */
    .sec-row { align-items: flex-start; }
    .sec-row.clickable { cursor: pointer; }
    .sec-row.picked { background: #fff3d0; box-shadow: inset 0 0 0 2px #ffd66b; }
    .sec-row .bico { font-size: 14px; line-height: 1.2; width: 19px; text-align: center; }
    .sec-row .name { gap: 2px; }
    .sec-row .tags { line-height: 1.35; }
    /* Icon over price, one narrow column. */
    .lead { display: flex; flex-direction: column; align-items: center; gap: 1px; width: 26px; flex: none; }
    .lead .cost { font-size: 9px; font-weight: 700; opacity: .6; font-variant-numeric: tabular-nums; }
    .sep {
      font-size: 9px; font-weight: 800; text-transform: uppercase; letter-spacing: .06em;
      opacity: .45; padding: 6px 7px 2px; border-top: 1px solid var(--line); margin-top: 4px;
    }
    .foot { font-size: 10px; opacity: .55; padding: 6px 7px; line-height: 1.35; }

    /* ---- a menu with more rows than fit ----------------------------------
       What the thing IS stays at the top, what you can DO stays at the bottom,
       and the list between them scrolls. Sticky rather than a three-pane flex
       rebuild of #panel-body, because `.tabs` already pins itself this way and
       #panel-body is already the scroller — one mechanism, not two.

       The background has to be opaque or the rows scroll visibly *through* the
       pinned parts; --panel is the same colour the panel is already painted. */
    .pnl-head, .pnl-foot { position: sticky; z-index: 2; background: var(--panel-solid); }
    .pnl-head {
      top: calc(-1 * var(--panel-pad)); padding-top: var(--panel-pad);
      border-bottom: 1px solid var(--line);
    }
    .pnl-foot {
      bottom: calc(-1 * var(--panel-pad)); padding-bottom: var(--panel-pad);
      border-top: 1px solid var(--line);
    }
    /* Its own border is the divider; the heading's would double it. */
    .pnl-foot .sep { border-top: 0; margin-top: 0; }

    /* The verbs, as one row of squares rather than five labelled lines.
       Deliberately the mirror of `.tabs` at the other end of the panel: the
       same trade, the same size, the same reason — 214px does not have room
       for five words AND the list they act on. Tabs choose what you are
       looking at, these do something to it, and having them read as a matched
       pair top and bottom is worth more than either being prettier alone. */
    .fx-verbs { display: flex; gap: 3px; padding: 4px 0 2px; }
    .fx-verb {
      /* `min-width: 0` or the longest caption sets every square's width and the
         row overflows the panel instead of five equal columns ellipsising. */
      flex: 1; min-width: 0; position: relative;
      display: flex; flex-direction: column; align-items: center; gap: 1px;
      padding: 5px 2px 4px; border: 0; border-radius: 8px; background: transparent;
      color: var(--ink); opacity: .55; font: inherit; font-size: 13px; cursor: pointer;
      transition: opacity .1s, background .1s;
    }
    /* The word under the icon, and it is not decoration: a tooltip is a hover,
       and half of this game is played with a finger. Same treatment the build
       bar's `.tool .nm` gets, for the same reason. */
    .fx-verb .ico { font-size: 15px; line-height: 1; }
    .fx-verb .nm {
      max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      font-size: 9.5px; font-weight: 700; letter-spacing: -.01em;
    }
    .fx-verb:hover { opacity: 1; background: rgba(58,49,40,.07); }
    .fx-verb.danger:hover { background: rgba(190,60,45,.12); color: var(--accent); }
    /* Refused, not missing. It keeps its place in the row so the four you can
       press never shuffle sideways under your thumb, and `disabled` is what
       stops the press — greying without it is a button that lies. */
    .fx-verb.off { opacity: .25; cursor: default; }
    .fx-verb.off:hover { background: transparent; }
    /* A verb that is a TOGGLE, and currently on. Amber rather than the accent
       `armed` uses: red is "one press from something you cannot undo", and a
       camera that is following somebody is neither a warning nor a decision —
       it is a state, and it has to be readable as one from the same glance that
       reads Let go as dangerous. */
    .fx-verb.on {
      opacity: 1; background: rgba(217,155,31,.18);
      box-shadow: inset 0 0 0 1px rgba(217,155,31,.5);
    }
    .fx-verb.on:hover { background: rgba(217,155,31,.28); }
    /* One press from something that cannot be taken back. It has to be loud
       here in a way it did not have to be as a row: a row said "Tap again to
       let them go" in words, and a caption has no room for a sentence. */
    .fx-verb.armed {
      opacity: 1; background: var(--accent); color: #fff;
    }
    .fx-verb.armed:hover { background: var(--accent); color: #fff; }
    .fx-verb svg { display: block; }
    /* The price or the count — the two things an icon cannot say. Same corner
       and same treatment the build bar's `.have` badge uses. */
    .fx-verb .have {
      position: absolute; top: 0; right: 2px;
      font-size: 9px; font-weight: 800; line-height: 1;
      color: var(--good); opacity: .95; pointer-events: none;
      font-variant-numeric: tabular-nums;
    }

    /* One fixture's own menu. The read-out at the top says what this thing is
       doing right now; the rows below are what you can do about it. */
    .fx-detail { padding: 4px 8px 5px; }
    /* Tight on purpose: this block is pinned, so every pixel it takes is one
       the scrolling list below it does not get. */
    .fx-line { display: flex; justify-content: space-between; gap: 12px; padding: 1px 0; font-size: 11.5px; }
    .fx-line span { opacity: .55; font-weight: 600; }
    .fx-line b { font-weight: 800; text-align: right; }
    /* One recipe and what it wants. Ingredients are counted against the hopper,
       so the row that isn't green is the reason the machine is standing idle. */
    .fx-recipe { border-top: 1px solid var(--line); margin-top: 5px; padding-top: 4px; }
    .fx-recipe-h { display: flex; justify-content: space-between; gap: 12px; font-size: 11.5px; padding: 1px 0 2px; }
    .fx-recipe-h span { font-weight: 800; }
    .fx-recipe-h b { font-weight: 700; opacity: .45; }
    .fx-ing { display: flex; justify-content: space-between; gap: 12px; padding: 1px 0 1px 10px; font-size: 11px; }
    .fx-ing span { opacity: .55; font-weight: 600; }
    .fx-ing b { font-weight: 800; font-variant-numeric: tabular-nums; color: #c8553d; }
    .fx-ing.ok b { color: #4e9a4e; }
    /* One board, one line: name, count, price, and the button that takes an
       armful. It used to be two lines — the name and count, then a "Price" row
       under it — so a shelf holding three things read as six rows and you had
       to pair them up by eye. A stepper reading `− $8.50 +` does not need the
       word Price in front of it; sitting on the same line as the name is what
       says which board it belongs to. */
    .fx-board {
      display: flex; align-items: center; gap: 5px;
      padding: 2px 0; font-size: 11.5px;
    }
    /* The one flexible column, and the only one allowed to lose: an authored
       item name has no length limit and everything to its right is a control
       that stops working if it shrinks. */
    .fx-board .nm {
      flex: 1; min-width: 0; font-weight: 700; opacity: .85;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    /* How many, over what it holds — the capacity dimmed, because the number
       that moves is the first one and it now has a price sat next to it. */
    .fx-board .qty { font-weight: 800; font-variant-numeric: tabular-nums; }
    .fx-board .qty i { font-style: normal; font-weight: 700; opacity: .4; }
    /* What is on a van, hung off the board's own count the way the supplier
       hangs it off the shelf count — same colour, same reason. Green because it
       is the answer to the low number beside it, and small because it is a
       promise: you cannot sell it yet, and a row that shouted it would read as
       though you could. It overrides the dimmed `/cap` above rather than sitting
       next to it, or the news would be the faintest thing on the row. */
    .fx-board .qty i.coming {
      font-size: 9.5px; color: var(--good); opacity: .95; margin-left: 2px;
    }
    /* The stepper itself is shared — a hire's job weights use it too (`wk-w`),
       so what is specific to a board row is scoped to one below rather than
       left here to move somebody else's buttons. */
    .fx-price { display: flex; align-items: center; gap: 2px; font-size: 11.5px; }
    .fx-board .fx-price { margin-left: 3px; }
    .fx-price b { font-weight: 800; min-width: 46px; text-align: center; font-variant-numeric: tabular-nums; }
    .fx-price button {
      border: 0; background: rgba(58,49,40,.09); color: var(--ink); border-radius: 7px;
      width: 22px; height: 22px; font: inherit; font-weight: 800; line-height: 1; cursor: pointer;
    }
    .fx-price button:hover { background: rgba(58,49,40,.18); }
    .fx-take {
      border: 0; background: rgba(58,49,40,.09); color: var(--ink); border-radius: 7px;
      width: 24px; height: 22px; font-size: 12px; cursor: pointer; flex: none;
      display: flex; align-items: center; justify-content: center;
    }
    .fx-take:hover { background: rgba(58,49,40,.18); }
    .fx-take:disabled { opacity: .25; cursor: default; background: transparent; }
    .fx-take svg { display: block; }
    /* Delete this board. Quiet until you are over it — it sits next to a button
       you press all the time, and a red bin on every row would read as a shelf
       full of warnings. Never disabled: an empty board is exactly the one you
       most want gone, and the goods land in a crate rather than nowhere. */
    .fx-clear { opacity: .45; }
    .fx-clear:hover { opacity: 1; background: rgba(200,85,61,.16); color: var(--accent); }
    /* Order more of this board. Disabled is the interesting state and it is a
       sentence rather than a shrug — "6 already on the way" and "the bay is
       full" are both in the title, because a greyed-out button that never says
       why is the thing that reads as broken. */
    .fx-order:not(:disabled) { color: var(--good); }
    .fx-order:not(:disabled):hover { background: rgba(90,163,86,.18); }
    .fx-act { cursor: pointer; align-items: flex-start; }
    .fx-act:hover { background: rgba(58,49,40,.07); }
    .fx-act .bico { font-size: 14px; line-height: 1.2; width: 18px; text-align: center; }
    .fx-act .name { gap: 2px; }
    .fx-act .tags { line-height: 1.35; }
    .fx-act .price { color: var(--good); }
    .fx-act.danger .price { color: var(--accent); }
    /* Greyed out rather than hidden: "you need at least one till" is the whole
       answer to why the button isn't there, and hiding it never says so. */
    .fx-act.off { cursor: default; opacity: .42; }
    .fx-act.off:hover { background: none; }

    /* One hire's own menu: the dial on each job row saying how much of their
       day it gets. It borrows the fixture price control wholesale — same
       buttons, same tabular value — and only shrinks it, because a weight is
       one digit where a price is five. */
    .wk-w { flex: none; gap: 4px; padding: 0; }
    .wk-w b { min-width: 16px; font-size: 11px; }
    .wk-w button { width: 24px; height: 24px; }
    .wk-job .name { padding: 2px 0; }

    /* How much is left in the tank. The bar sits behind the word rather than
       beside it, because the row is already two columns wide and a third one
       would push the label onto its own line. */
    .wk-energy {
       position: relative; display: inline-block; padding: 1px 7px;
       border-radius: 99px; overflow: hidden; font-size: 11px;
    }
    .wk-energy i {
      position: absolute; inset: 0 auto 0 0; background: rgba(90,163,86,.28);
    }
    .wk-energy.low i { background: rgba(226,86,74,.3); }
    /* The build bar. Hidden entirely unless you're building — the shop floor is
       the game, and a permanent toolbar would make it look like a level editor.

       Two tiers, because the palette is a database anyone can add to: tabs for
       what sort of thing, then that tab's entries in a strip that scrolls
       sideways. A flat row could only show its first nine, which is why there
       used to be a second copy of this palette in a panel. */
    #build {
      bottom: var(--nav-top); left: 50%; transform: translate(-50%, 26px); opacity: 0;
      display: flex; flex-direction: column; align-items: center; gap: 6px;
      pointer-events: none; transition: .18s;
    }
    #build.on { opacity: 1; transform: translate(-50%, 0); pointer-events: auto; }
    #build-bar {
      display: flex; flex-direction: column; gap: 5px;
      background: var(--panel); border-radius: 16px; padding: 6px;
      box-shadow: 0 8px 26px rgba(58,49,40,.24);
      max-width: min(960px, calc(100vw - 28px));
    }

    /* Tier one: what sort of thing. */
    #build-groups {
      display: flex; gap: 3px; padding-bottom: 5px; border-bottom: 1px solid var(--line);
    }
    .cat {
      flex: 1; display: flex; align-items: center; justify-content: center; gap: 5px;
      border: 0; border-radius: 10px; background: transparent; cursor: pointer;
      font: inherit; color: var(--ink); opacity: .5; padding: 5px 10px;
      white-space: nowrap; transition: opacity .1s, background .1s, box-shadow .1s;
    }
    .cat:hover { opacity: .85; background: rgba(58,49,40,.06); }
    /* The open tab is a raised card, not a grey wash. It is the one thing on the
       bar that says where you are, and at .5-versus-1 opacity it was saying it
       about as loudly as the four that aren't. */
    .cat.on {
      opacity: 1; background: linear-gradient(#fffdf8, #f3ead9);
      box-shadow: 0 1px 3px rgba(58,49,40,.18), inset 0 0 0 1px rgba(58,49,40,.1);
    }
    .cat .ico { font-size: 15px; line-height: 1; }
    .cat .nm { font-size: 11.5px; font-weight: 800; }

    /* Tier two, and only for a tab that split: which part of it. Deliberately
       quieter than the row above — smaller, chip-shaped, no divider of its own
       and centred under the tab it belongs to, so the eye reads one tab bar with
       a caption rather than two competing ones. */
    #build-subs {
      display: flex; justify-content: center; gap: 3px; padding-bottom: 2px;
    }
    #build-subs[hidden] { display: none; }
    .subcat {
      display: flex; align-items: center; gap: 4px;
      border: 0; border-radius: 8px; background: transparent; cursor: pointer;
      font: inherit; font-size: 10.5px; font-weight: 700; color: var(--ink);
      opacity: .45; padding: 3px 10px; white-space: nowrap; transition: opacity .1s, background .1s;
    }
    .subcat:hover { opacity: .8; background: rgba(58,49,40,.06); }
    .subcat.on { opacity: 1; background: rgba(58,49,40,.09); }
    .subcat .ico { font-size: 12px; line-height: 1; }

    /* Tier three: that tab's entries. Scrolls rather than wraps, so the bar keeps
       one row's height however much anybody authors. */
    #build-tools {
      display: flex; gap: 6px; overflow-x: auto; overflow-y: hidden;
      scrollbar-width: thin; scrollbar-color: rgba(58,49,40,.25) transparent;
    }
    #build-tools::-webkit-scrollbar { height: 5px; }
    #build-tools::-webkit-scrollbar-thumb {
      background: rgba(58,49,40,.22); border-radius: 99px;
    }
    /* An entry, and it is a slot rather than a line of text: the thing itself in
       a recessed well, its name under it, what it costs under that. Sized by a
       floor and a ceiling rather than its contents — a person's note is
       "carrying 4x tomato" where a fixture's is "$45", and a strip whose buttons
       are each as wide as their longest line is one you cannot scan. Both lines
       ellipsise instead. */
    .tool {
      position: relative; border: 0; cursor: pointer; flex: none;
      font: inherit; color: var(--ink); border-radius: 13px; padding: 6px 8px 5px;
      display: flex; flex-direction: column; align-items: center; gap: 2px;
      min-width: 74px; max-width: 132px;
      background: linear-gradient(#fffdf8, #f6efe0);
      box-shadow: inset 0 0 0 1px rgba(58,49,40,.09), 0 1px 0 rgba(58,49,40,.07);
      transition: transform .09s, box-shadow .09s, background .09s;
    }
    .tool:hover { transform: translateY(-2px); box-shadow: inset 0 0 0 1px rgba(58,49,40,.14), 0 4px 10px rgba(58,49,40,.16); }
    .tool:active { transform: translateY(0); }
    /* Armed. A ring rather than a fill under the art, so the thing you are about
       to build stays the brightest object in its own button — a solid amber
       block behind a wooden shelf turns both to mud. */
    .tool.on {
      background: linear-gradient(#ffe6a8, #ffd66b);
      box-shadow: inset 0 0 0 1.5px #d99b1f, 0 4px 12px rgba(217,155,31,.34);
      transform: translateY(-2px);
    }
    /* The key it answers to, as a key. */
    .tool .key {
      position: absolute; top: 3px; left: 4px; z-index: 1;
      font-size: 8.5px; font-weight: 800; line-height: 12px; min-width: 12px; height: 12px;
      border-radius: 4px; color: rgba(58,49,40,.55);
      background: rgba(58,49,40,.07); box-shadow: inset 0 0 0 1px rgba(58,49,40,.09);
    }
    .tool.on .key { color: rgba(58,49,40,.72); background: rgba(255,255,255,.5); }
    /* How many are already standing in the shop. Opposite corner to the key,
       because they are answers to different questions and both are one glyph. */
    .tool .have {
      position: absolute; top: 3px; right: 4px; z-index: 1;
      font-size: 8.5px; font-weight: 800; line-height: 13px; min-width: 13px; height: 13px;
      border-radius: 99px; color: #fffcf5; background: rgba(58,49,40,.58);
      font-variant-numeric: tabular-nums;
    }
    /* The well the thing stands in. It is what makes a row of art read as a row
       of *slots* — without it every button is a picture floating on cream and
       the strip has no grid to it. */
    .tool .ico {
      font-size: 19px; line-height: 1; display: grid; place-items: center;
      width: 100%; height: 38px; border-radius: 9px;
      background: radial-gradient(120% 100% at 50% 18%, rgba(255,255,255,.9), rgba(58,49,40,.055));
      box-shadow: inset 0 0 0 1px rgba(58,49,40,.06);
    }
    .tool.on .ico { background: radial-gradient(120% 100% at 50% 18%, rgba(255,255,255,.92), rgba(160,110,20,.14)); }
    /* Art gets the well; a glyph is a category rather than a thing, so it stays
       small and centred instead of being blown up to fill one. */
    .tool .ico.art { padding: 3px; }
    .tool .ico.art svg { width: 100%; height: 100%; display: block; }
    .tool .nm, .tool .cost { max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .tool .nm { font-size: 11px; font-weight: 700; }
    .tool .cost { font-size: 10px; font-weight: 800; opacity: .55; font-variant-numeric: tabular-nums; }
    /* Somebody the sim cannot place — their kind was deleted out from under
       them. That is a problem rather than a job, and it should not read as one. */
    .tool.warn .cost { color: var(--accent); opacity: .9; }
    /* A glyph on these two is a category rather than a thing, and an empty
       recess under one is a slot with the thing missing out of it — so a glyph
       keeps the old flat button. Art does not: a hire IS drawn, and their well
       has to be the same fixed height every other slot's is or the button
       changes height with the drawing in it. */
    #build.browse .tool .ico:not(.art) { background: none; box-shadow: none; height: auto; }
    /* A ROSTER ENTRY MUST NOT RESIZE ITSELF. Its note is what that person is
       doing right now — "on the till", then "carrying 4x tomato", then "off for
       a break" — so a button sized to its own text is one that grows and
       shrinks every few seconds and shunts every button after it sideways. You
       cannot press a moving target, and the whole point of the strip is that
       who is on the tills is a glance rather than a menu.

       So the browse bars fix the width instead of ranging between the floor and
       the ceiling above, and both lines ellipsise into it. The tooltip carries
       the whole sentence, which is where an ellipsis sends you. */
    #build.browse .tool { width: 108px; min-width: 108px; max-width: 108px; }
    /* …and it gets TWO lines to say it in, centred, clamped. One line of 108px
       cut "carrying 4x tomato" down to about "carrying 4x to", which is a
       readout you have to hover to read. Two lines is most of what anybody is
       ever doing.

       The height is fixed at both of them rather than left to the text, for the
       same reason the width is: a note that dropped to one line would shorten
       the button, and the bar measures itself (`--build-h`) so the whole HUD
       above it would step down with it. A one-line note simply sits in the top
       half. */
    #build.browse .tool .cost {
      white-space: normal; text-align: center; line-height: 1.15; height: 2.3em;
      display: -webkit-box; -webkit-line-clamp: 2; line-clamp: 2;
      -webkit-box-orient: vertical; overflow: hidden;
    }

    /* The last tier, and only when the piece you have picked comes in more than
       one — a shape is not another thing to buy, so it never takes a number key.
       It also goes when the piece does: browse to another tab and this row is a
       label for something no longer on screen. */
    #build-shapes {
      display: flex; align-items: center; gap: 4px; flex-wrap: wrap;
      padding-top: 5px; border-top: 1px solid var(--line);
    }
    #build-shapes[hidden] { display: none; }
    #build-shapes .lbl {
      font-size: 9px; font-weight: 800; text-transform: uppercase; letter-spacing: .06em;
      opacity: .45; padding: 0 4px;
    }
    .shape {
      display: flex; align-items: center; gap: 5px;
      border: 0; border-radius: 8px; background: rgba(58,49,40,.07); cursor: pointer;
      font: inherit; font-size: 11px; font-weight: 700; color: var(--ink);
      padding: 3px 9px 3px 5px; opacity: .75;
    }
    .shape:hover { opacity: 1; }
    .shape.on { background: #ffd66b; opacity: 1; box-shadow: inset 0 0 0 1.5px #d99b1f; }
    /* Each shape wearing its own shape. Small enough to sit on the word rather
       than replace it — a corner shelf and a straight one are one silhouette
       apart, and at 18px that is a hint, not a label. */
    .shape .ico.art { width: 20px; height: 18px; display: block; }
    .shape .ico.art svg { width: 100%; height: 100%; display: block; }

    /* Above the bar, and only when it has something to report — see
       `renderBuildHint`. Below it, it sat on the very bottom edge of the screen
       and pushed everything else up for a line that was usually restating the
       lit button. */
    #build-hint {
      background: rgba(58,49,40,.82); color: #fff; border-radius: 99px;
      padding: 4px 12px; font-size: 12px; font-weight: 600;
    }
    #build-hint[hidden] { display: none; }
    /* Amber is a consequence you may still choose; red is a no. Same two
       colours the ghost on the ground is using, so the words and the box can
       never disagree about what is about to happen. */
    #build-hint.warn { background: var(--warn); color: var(--ink); }
    #build-hint.bad { background: var(--accent); color: #fff; }
    /* The corner HUD clears the same stack, by the same arithmetic. `--build-h`
       is 0 when no bar is up, so there is one rule rather than one per mode —
       `body.building #log` and friends were three literals that had to be kept
       in step with a bar whose height nobody could predict. */
    #log, #carry, #prompt { bottom: calc(var(--nav-top) + var(--build-h) + 8px); }

    @media (max-width: 720px) {
      #log { display: none; }
      .tool { min-width: 52px; padding: 6px 8px 5px; }
      /* Narrower, but still ONE width — see the rule above. A roster that
         stopped shifting on a desktop and went on shifting on a phone would be
         the same bug with a media query in front of it. */
      #build.browse .tool { width: 84px; min-width: 84px; max-width: 84px; }
      /* No room for five labelled tabs — the icon is the tab at this width. */
      .cat { padding: 5px 6px; }
      .cat .nm { display: none; }
      /* The sub-tabs keep their words. There are three of them, they are the
         only thing naming the tab you are in once .cat loses its label, and
         "walls" and "floors" are not guessable from an icon. */
      .subcat { padding: 3px 7px; }
    }
  </style>
</head>
<body>
  <canvas id="game"></canvas>
  <div id="boot">Opening the shop…</div>
  <div id="menu" hidden></div>

  <div id="topleft" class="hud">
    <div id="stats">
      <span id="cash">$0.00</span>
      <div>
        <div id="day">Day 1</div>
        <div id="season">spring</div>
      </div>
      <div id="flow"></div>
      <div id="time">
        <span id="clock">08:00</span>
        <div id="timebtns">
          <button id="btn-open" type="button" title="Open the shop (O)"></button>
          <button id="btn-pause" type="button" title="Stop the clock (P)"></button>
        </div>
      </div>
      <div class="gauges">
        <div class="gg"><span class="gg-tag">Rep</span>
          <div class="repwrap"><div id="rep" style="width:50%"></div></div></div>
        <div class="gg"><span class="gg-tag">Mood</span>
          <div class="repwrap"><div id="mood" style="width:100%"></div></div></div>
        <div class="gg"><span class="gg-tag">Room</span>
          <div class="repwrap"><div id="full" style="width:100%"></div></div></div>
      </div>
    </div>
    <div id="rci"></div>
  </div>
  <div id="hq" class="hud">
    <div id="todo"></div>
  </div>
  <div id="rail" class="hud"></div>
  <div id="log" class="hud"></div>
  <div id="carry" class="hud"></div>
  <div id="prompt" class="hud"></div>
  <div id="toast" class="hud"></div>

  <div id="build" class="hud">
    <div id="build-hint" hidden></div>
    <div id="build-bar">
      <div id="build-groups"></div>
      <div id="build-subs" hidden></div>
      <div id="build-tools"></div>
      <div id="build-shapes" hidden></div>
    </div>
  </div>

  <div id="panel" class="hud">
    <header><span id="panel-title">Panel</span><button id="panel-close">✕</button></header>
    <div id="panel-filter" hidden>
