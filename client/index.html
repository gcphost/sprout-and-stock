    .dtab:hover { opacity: .9; background: rgba(58,49,40,.14); }
    /* The same yellow the icon tab uses for "you are here", because it is the
       same fact one row down — two colours for one state would read as two
       different kinds of selection. */
    .dtab.on { opacity: 1; background: #ffd66b; }

    .tab { position: relative; }
    .tab .tcount {
      position: absolute; top: 0; right: 2px;
      font-size: 8.5px; font-weight: 700; font-style: normal; line-height: 1;
      opacity: .75; pointer-events: none;
    }
    /* An empty tab is still drawn — that is what keeps the strip the same shape
       morning to morning — but it must not read as a place worth pressing. Faded
       past `.tab`'s resting .4, and its zero fades further: the tab is the
       answer, and the digit is only there so the fade is not ambiguous with the
       panel having failed to draw. */
    .tab.none { opacity: .22; }
    .tab.none .tcount { opacity: .5; }
    .tab.none.on { opacity: 1; }

    .row { display: flex; align-items: center; gap: 7px; padding: 4px 7px; border-radius: 9px; }
    .row:hover { background: rgba(58,49,40,.05); }
    .row.owned { opacity: .5; }
    /* "There is already one of these somewhere" — a nudge, not a refusal, so it
       has to stay clearly darker than `.owned`. At the same .5 a row you can
       still press looked exactly like one with nothing to press, and the list
       read as half disabled. The name keeps its weight and only the sub-line
       steps back, because what is muted is the ARGUMENT for the row, not the
       item's name — which is the thing you are scanning for. */
    .row.muted { opacity: .82; }
    .row.muted .tags { opacity: .72; }
    /* The title stays on one line — it's short, and a wrapping bold heading
       reads as two rows. The description wraps but is clamped at two lines, so
       a menu fed from a live database still can't grow taller than the screen;
       anything past that is on the hover title. */
    .row .name {
      flex: 1; min-width: 0; font-size: 12px; font-weight: 700;
      display: flex; flex-direction: column;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .row .tags {
      font-weight: 500; font-size: 10.5px; line-height: 1.3; opacity: .55;
      white-space: normal; overflow: hidden;
      display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2;
    }
    /* The name gets a line to itself, and everything said ABOUT the item shares
       the one under it.
       Three arrangements to get here and the middle one is the lesson: the pill
       next to the name reads better in a mock-up and is wrong in the panel,
       because it is a fixed-width thing competing with the only elastic thing in
       the row. Nine characters of pill came straight off the name, so "Berry
       Smoothie" ellipsised to "Berry S…" and the list stopped being readable at
       the one column that identifies a row. News and description sit together on
       line two; the name never gives way to either. */
    .row .name > .t { overflow: hidden; text-overflow: ellipsis; }
    .row .meta { display: flex; align-items: center; gap: 6px; min-width: 0; }
    .row .meta .tags { min-width: 0; }
    /* A state the row is in, as one glyph with the sentence in its tooltip —
       see `rowHtml`. `flex: none` for the reason the heat pill has it: this
       shares the line with the only elastic thing in the panel, and a glyph
       that could be squeezed would take its width out of the caption instead
       of holding its own. Sized off the text around it rather than in pixels,
       so it sits on the same baseline as the tags it stands in for. */
    .row .mark {
      flex: none; display: inline-flex; align-items: center;
      font-size: 12px; opacity: .5; cursor: help;
    }
    .row .mark.warn { color: var(--accent); opacity: .75; }
    .row .heat {
      flex: none; padding: 0 5px; border-radius: 99px;
      font-size: 9.5px; font-weight: 800; letter-spacing: .01em;
      font-variant-numeric: tabular-nums;
    }
    .row .heat.up { background: #d8f0d2; color: #3f7a3c; }
    .row .heat.down { background: #f6dcd7; color: #a8442f; }
    /* The key hint never shrinks and never wraps — it's the shortest thing in
       the row and the whole reason the row is there, so the name gives way. */
    .row .price {
      font-weight: 700; font-variant-numeric: tabular-nums;
      flex: none; white-space: nowrap; font-size: 11px; opacity: .85;
    }
    .row button {
      border: 0; background: var(--good); color: #fff; border-radius: 8px;
      padding: 3px 9px; font: inherit; font-size: 11px; font-weight: 700; cursor: pointer; flex: none;
    }
    /* Un-ordering, in the slot ordering lives in. `.row button.danger` rather
       than `.danger` alone for the reason the steppers below spell out: a bare
       class loses to `.row button`, and a Cancel pill would come out the same
       green as Buy — which is the one pair in this panel that must never look
       alike. */
    .row button.danger { background: var(--accent); }
    .row .have { font-size: 10.5px; opacity: .6; }

    /* How far along a row is. One rule, in the row system rather than in the
       menu that wanted it first, because "this thing has a target and you are
       part of the way to it" is not a fact about milestones. */
    .row .rbar {
      height: 4px; margin-top: 4px; border-radius: 99px;
      background: rgba(58,49,40,.12); overflow: hidden;
    }
    .row .rbar > i {
      display: block; height: 100%; border-radius: 99px; background: var(--good);
      transition: width .25s ease;
    }

    /* One item's standing order, on the row it is about.
       Inline rather than behind a tap, because these are the rows you scan to
       decide what to set — a rule you have to open a thing to see is a rule you
       forget you set. It is what the panel got wider for. */
    /* Every selector here has to out-specify `.row button` above, which paints
       any button in a row as the big green buy pill. It does not — a class beats
       nothing but a class-plus-type beats a class — so the steppers came out as
       seven green blobs across the row. Scoped to `.row` to win it back. */
    .row .rule { display: flex; align-items: center; gap: 4px; flex: none; }
    /* Min over max rather than beside it. The row is two lines tall because of
       the name and its caption, so the second line is already paid for — and
       side by side these two ran nearly the width of the panel and ellipsised
       the name to buy back height nothing was going to use. */
    .row .rule .stack { display: flex; flex-direction: column; gap: 2px; }
    /* A label, a number and two nudges. The number is the widest thing in it and
       it must not resize as it changes, or every press shuffles the row under
       your finger — hence a fixed width and tabular figures. */
    .row .stp {
      display: flex; align-items: center; gap: 0;
      background: rgba(58,49,40,.06); border-radius: 7px; padding: 1px;
    }
    .row .stp i {
      font-style: normal; font-size: 8px; font-weight: 800; letter-spacing: .03em;
      text-transform: uppercase; opacity: .38; padding: 0 3px 0 4px;
    }
    .row .stp b {
      min-width: 15px; text-align: center; font-size: 10.5px; font-weight: 800;
      font-variant-numeric: tabular-nums;
    }
    /* Unset is a dash, not a zero: "no minimum" and "a minimum of nothing" are
       different sentences and only one of them is true here. */
    .row .stp b.none { opacity: .28; font-weight: 700; }
    .row .rbtn {
      border: 0; background: transparent; color: var(--ink);
      border-radius: 5px; padding: 0; width: 15px; height: 16px; line-height: 1;
      font: inherit; font-size: 12px; font-weight: 800; cursor: pointer;
      display: grid; place-items: center; flex: none; opacity: .5;
    }
    .row .rbtn:hover { background: rgba(58,49,40,.14); opacity: 1; }
    /* The one that is a state rather than a nudge. Off is the loud one, because
       "never order this" is the exception and the default has nothing to say. */
    .row .rbtn.tog {
      width: 20px; height: 20px; font-size: 12px; opacity: .28;
      background: rgba(58,49,40,.06); margin-right: 1px;
    }
    .row .rbtn.tog svg { display: block; width: 1em; height: 1em; }
    .row .rbtn.tog.on { opacity: .7; }
    .row .rbtn.tog.off { background: rgba(190,60,45,.13); color: var(--accent); opacity: 1; }

    /* How many you are holding, on the row that orders more. The one number the
       supplier never showed and the whole reason it read as a catalogue rather
       than a stock list — "should I buy eggs" is unanswerable without it. */
    .row .held {
      flex: none; min-width: 30px; text-align: right; white-space: nowrap;
      font-size: 12px; font-weight: 800; font-variant-numeric: tabular-nums;
    }
    .row .held.short { color: var(--accent); }
    /* Nothing on the shelf. A dash rather than a 0 for the same reason an unset
       minimum is one, and dimmed on its own rather than by a `zero` class on the
       whole column, which is what this replaced — since deliveries take time the
       column can hold "none here, six coming", and fading that pair together
       fades the half that is news. */
    .row .held i.none { font-style: normal; opacity: .25; font-weight: 700; }
    /* What is on a van, hung off the count instead of taking a column of its
       own. Green because it is the answer to the red number beside it, and
       small because it is a promise rather than stock: you cannot sell it yet,
       and a row that shouted it would read as though you could. */
    .row .held .coming {
      font-style: normal; font-size: 9.5px; font-weight: 800;
      color: var(--good); margin-left: 2px; opacity: .9;
    }
    /* The sub-line is a reason now rather than a tag list, and the one reason
       that is a refusal rather than a note says so in the accent colour: you
       cannot put this anywhere, so buying it is a mistake whatever else is true. */
    .row .tags.warn { color: var(--accent); opacity: .85; font-weight: 700; }

    /* Section rows. Where the whole row is the button — picking a thing to
       build, picking a seed — the row is clickable and says so. */
    .sec-row { align-items: flex-start; }
    .sec-row.clickable { cursor: pointer; }
    .sec-row.picked { background: #fff3d0; box-shadow: inset 0 0 0 2px #ffd66b; }
    /* A row is a chip and a list of them is not a table, so they need air
       between them. Without it the failure is only visible when two rows are
       LIT: their rings meet and the pair reads as one block with a rule through
       it, since two 2px inset borders touching is a 4px seam and nothing else
       in the panel draws one. Adjacent-sibling, so a heading — which brings its
       own margin and its own rule — is not double-spaced, and the last row does
       not push against the panel's padding. */
    .sec-row + .sec-row, .fx-act + .fx-act { margin-top: 3px; }
    /* ...and the glyph is centred while the words stay top-aligned. Both rules
       are right about their own half: a caption that wraps to two lines should
       hang off the name, and a single mark for the WHOLE row lining up with the
       first line of it looks like it slipped. `align-self` rather than moving
       the row to `center`, which would take the price, the count and the
       steppers with it. */
    .sec-row > .lead, .fx-act > .bico { align-self: center; }
    .sec-row .bico { font-size: 14px; line-height: 1.2; width: 19px; text-align: center; }
    /* A row whose lead is a PICTURE of the thing rather than a glyph for its
       kind — a shape in the fixture menu, drawn from the same catalog row the
       game builds it from. The same well `.shape .ico.art` stands the palette's
       shape card in, at row size: art with no ground under it reads as a
       floating drawing, and the two lists are picking between the same shapes. */
    .sec-row .bico.art {
      width: 26px; height: 22px; padding: 2px; border-radius: 6px;
      background: radial-gradient(120% 100% at 50% 18%, rgba(255,255,255,.9), rgba(58,49,40,.055));
      box-shadow: inset 0 0 0 1px rgba(58,49,40,.06);
    }
    .sec-row .bico.art svg { width: 100%; height: 100%; display: block; }
    .sec-row .name { gap: 2px; }
    .sec-row .tags { line-height: 1.35; }
    /* Icon over price, one narrow column. */
    .lead { display: flex; flex-direction: column; align-items: center; gap: 1px; width: 26px; flex: none; }
    .lead .cost { font-size: 9px; font-weight: 700; opacity: .6; font-variant-numeric: tabular-nums; }
    .sep {
      font-size: 9px; font-weight: 800; text-transform: uppercase; letter-spacing: .06em;
      opacity: .45; padding: 6px 7px 2px; border-top: 1px solid var(--line); margin-top: 4px;
    }
    .foot { font-size: 10px; opacity: .55; padding: 6px 7px; line-height: 1.35; }

    /* ---- the shop report -------------------------------------------------
       The one menu that is a PICTURE rather than a list. Everything else in
       this panel is `.row`, which is right for anything you might press and
       wrong for a report: a list gives every number the same size, and the
       whole reading here is that today's profit and "4 picked" are not the
       same size of fact. See client/report.js for what each block is and why.

       Two colours do all the work and they are the ones the rest of the game
       already uses for this: --good and --accent, the same pair as the corner
       cashflow readout and every heat pill. They are also the worst pair alive
       for a red-green colourblind reader, so nothing in here rests on them —
       the week's sign is which side of the axis a column is on, the hero says
       "profit" or "loss" in words, and every delta carries an arrow. */
    .rp { padding: 2px 3px 6px; }
    .rp-blk { padding: 8px 8px 10px; }
    /* One column until there is room for two, and a real GRID when there is —
       cells in step across a row, not two independent columns side by side.
       That distinction is the whole of what makes it look segmented: two
       columns end wherever their own content ends, so the seam between them is
       ragged and a tall block on one side is marooned beside empty panel. Cells
       in a row are the same height by construction, so the lines run all the
       way across and meet the one down the middle.

       The lines ARE the grid gap: a 1px gutter with the rule colour behind it,
       and each cell painting itself back in over the top. One declaration draws
       every line in the panel, they cross exactly, and no cell has to know
       which of its four edges is an outside edge — which is the part that gets
       wrong by hand the moment a block moves. `--panel-solid` rather than
       `--panel`, because 94% over 94% is a line you can see through the cell
       next to it.

       The panel's own width moves on the same query: a 620px panel with one
       column of content in it is just a long line to read. */
    @media (min-width: 700px) {
      #panel.wide { width: 620px; }
      .rp.pnl-wide {
        display: grid; grid-template-columns: 1fr 1fr;
        gap: 1px; background: var(--line); padding: 0;
      }
      .rp.pnl-wide > .rp-blk { background: var(--panel-solid); }
      /* The gap draws every divider now. The stacked rule would double up on
         the one down the middle and miss the one across. */
      .rp.pnl-wide > .rp-blk + .rp-blk { border-top: none; }
      /* What went wrong belongs to neither column — it is the evidence for
         both — so it takes the whole bottom row, which is also the width its
         three tiles want. */
      .rp.pnl-wide > .rp-full { grid-column: 1 / -1; }
    }
    .rp-blk + .rp-blk { border-top: 1px solid var(--line); }
    .rp-blk h4 {
      margin: 0 0 8px; font-size: 9px; font-weight: 800;
      text-transform: uppercase; letter-spacing: .06em; opacity: .45;
      display: flex; align-items: baseline; gap: 6px;
    }
    .rp-blk h4 small { font-weight: 700; letter-spacing: 0; text-transform: none; opacity: .8; }
    /* Sentences under a block. Same size and weight as a row's `.tags`, because
       a caption in a report and a caption on a row are the same kind of thing
       and there is no reason for the panel to have two of them. */
    .rp-note { margin: 8px 0 0; font-size: 10.5px; line-height: 1.35; opacity: .55; }
    .rp-note b { font-weight: 800; opacity: .85; }

    /* --- today ---------------------------------------------------------- */
    /* THE hero figure — one per view. 34px against an 12px panel is three
       times the body, which is what "hero" means here; the 48px the desktop
       rule asks for is a number scaled to a full-page dashboard and would be a
       quarter of the width of this one. Proportional figures, not tabular:
       tabular gives every digit the width of a `0`, which at this size makes
       a number like $121 look full of holes. */
    .rp-hero { display: flex; align-items: baseline; gap: 10px; }
    .rp-hero > b { font-size: 34px; font-weight: 800; line-height: 1; letter-spacing: -.02em; }
    .rp-hero.up > b { color: var(--good); }
    .rp-hero.down > b { color: var(--accent); }
    /* Before the first sale of the day it is neither, and stays the panel's own
       ink — a green $0.00 is a claim about a day nothing has happened in. */
    .rp-hero.idle > b { opacity: .3; }
    .rp-heroside { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
    .rp-heroside > em { font-style: normal; font-size: 10.5px; font-weight: 700; opacity: .5; }
    .rp-delta {
      display: flex; align-items: baseline; gap: 4px;
      font-size: 11px; font-weight: 700; font-variant-numeric: tabular-nums;
    }
    .rp-delta > i { font-style: normal; font-size: 9px; }
    .rp-delta > em { font-style: normal; font-weight: 600; opacity: .45; font-size: 10px; }
    .rp-delta.up { color: var(--good); }
    .rp-delta.down { color: var(--accent); }
    .rp-delta.flat { opacity: .55; }

    /* Taken split into what went back out and what stayed. The gap between the
       two segments is 2px of the panel's own colour — a border round a fill is
       ink that isn't data, and at this height it would be most of the mark. */
    .rp-split { margin-top: 10px; }
    .rp-track {
      display: flex; gap: 2px; height: 10px; border-radius: 5px;
      background: rgba(58,49,40,.08);
    }
    .rp-seg { display: block; height: 100%; }
    .rp-seg:first-child { border-radius: 5px 0 0 5px; }
    .rp-seg:last-child { border-radius: 0 5px 5px 0; }
    .rp-seg:only-child { border-radius: 5px; }
    .rp-seg.base { background: rgba(58,49,40,.3); }
    .rp-seg.kept { background: var(--good); }
    .rp-seg.short { background: var(--accent); }
    .rp-split.empty .rp-track { background: rgba(58,49,40,.06); }
    .rp-legend {
      margin: 5px 0 0; display: flex; justify-content: space-between; gap: 8px;
      font-size: 10.5px; opacity: .55;
    }
    .rp-legend b { font-weight: 800; opacity: .85; font-variant-numeric: tabular-nums; }

    /* --- the week ------------------------------------------------------- */
    /* Two label bands, one at each end of the plot, and they are not optional.
       The best day's bar reaches the top of the plot BY CONSTRUCTION — it is
       what the scale is built from — so its value label always sits outside,
       and the worst day's always sits under the bottom edge. Without the bands
       the top one rides up into the heading and the bottom one lands exactly on
       the row of day numbers. Neither is visible in a week that happens to have
       its extremes in the middle of the range, because there is no such week. */
    .rp-week { padding-top: 14px; }
    /* The columns and the two hairlines share one positioning context, so the
       axis and the average are placed by the same arithmetic the bars are. */
    .rp-plot {
      position: relative; height: var(--plot);
      display: flex; align-items: stretch; gap: 4px; margin-bottom: 30px;
    }
    .rp-col { position: relative; flex: 1 1 0; min-width: 0; }
    /* Two stacked halves: everything above the axis, everything below it. The
       bar sits at the axis end of its half, which is what makes both signs
       grow OUT of the same line. */
    .rp-up, .rp-dn { display: flex; justify-content: center; }
    .rp-up { align-items: flex-end; }
    .rp-dn { align-items: flex-start; }
    .rp-up > i, .rp-dn > i { display: block; width: 18px; max-width: 100%; }
    .rp-up > i { background: var(--good); border-radius: 4px 4px 0 0; }
    .rp-dn > i { background: var(--accent); border-radius: 0 0 4px 4px; }
    /* The day number, under the plot. `tabular-nums` here and NOT on the hero,
       because these are a row of figures that have to line up with each other. */
    .rp-col > b {
      position: absolute; top: calc(var(--plot) + 16px); left: 0; right: 0;
      text-align: center; font-size: 9px; font-weight: 700; opacity: .4;
      font-variant-numeric: tabular-nums;
    }
    /* Only the best day and the worst carry a value — a number on every column
       is chaos and goes unread. It rides the far end of its own bar, so it can
       never sit on top of the mark it is labelling. */
    .rp-pin {
      position: absolute; left: 50%; transform: translateX(-50%);
      font-style: normal; font-size: 9.5px; font-weight: 800; white-space: nowrap;
      font-variant-numeric: tabular-nums;
    }
    .rp-pin.over { margin-bottom: 2px; color: var(--good); }
    .rp-pin.under { margin-top: 2px; color: var(--accent); }
    .rp-axis, .rp-avg {
      position: absolute; left: 0; right: 0; height: 0;
      border-top: 1px solid rgba(58,49,40,.22); pointer-events: none;
    }
    /* The average is a reference, so it is quieter than zero. Solid, like the
       axis: a dashed rule reads as a projection, and this is arithmetic on bars
       that are right there.
       It carries no label of its own — the figure is in the heading, because
       the only two places a chip on this line could sit are on top of a bar and
       in the band the best day's label already owns. The line says WHERE, the
       heading says what, and neither has to dodge the other. */
    .rp-avg { border-top-color: rgba(58,49,40,.14); }

    /* The same week in the shop's other currency, sharing the x axis and
       nothing else. It is deliberately the junior row: a third of the height,
       10px bars against the plot's 18, and a heading in the panel's quietest
       ink — two charts of equal weight stacked would read as a dashboard, and
       this is one chart with a footnote you can see the shape of. Colours are
       the same green and red as the plot above ON PURPOSE, because the whole
       job of the strip is to be compared with it row for row. */
    /* Air above it, and it is load-bearing: the plot reserves 30px under itself
       for the day numbers, so a strip that starts where that margin ends puts
       its own heading 3px under a row of labels and the two read as one
       jumbled band. The gap is what says the numbers belong to the chart above
       and the words below start something new. */
    .rp-strip { display: flex; flex-direction: column; gap: 4px; margin-top: 9px; }
    .rp-shead {
      font-size: 8.5px; font-weight: 800; text-transform: uppercase;
      letter-spacing: .06em; opacity: .32;
    }
    .rp-rep { position: relative; height: var(--rep); display: flex; align-items: stretch; gap: 4px; }
    .rp-rcol { position: relative; flex: 1 1 0; min-width: 0; }
    .rp-rup, .rp-rdn { display: flex; justify-content: center; }
    .rp-rup { align-items: flex-end; }
    .rp-rdn { align-items: flex-start; }
    .rp-rup > i, .rp-rdn > i { display: block; width: 12px; max-width: 100%; }
    .rp-rup > i { background: var(--good); border-radius: 3px 3px 0 0; }
    .rp-rdn > i { background: var(--accent); border-radius: 0 0 3px 3px; }
    .rp-raxis {
      position: absolute; left: 0; right: 0; height: 0;
      border-top: 1px solid rgba(58,49,40,.22); pointer-events: none;
    }

    /* --- going wrong ---------------------------------------------------- */
    .rp-tiles { display: flex; gap: 6px; }
    .rp-tile {
      flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; gap: 1px;
      padding: 6px 7px; border-radius: 10px; background: rgba(58,49,40,.05);
    }
    /* Status colour only where there is something to say. A tile at zero stays
       in the panel's own ink, so the eye finds the lit ones without reading. */
    .rp-tile.bad { background: #f9e2dd; }
    .rp-tile.warn { background: #fbeed3; }
    .rp-tile > b { font-size: 17px; font-weight: 800; line-height: 1.1; }
    /* NOT --accent and --warn themselves. Those are mark colours — they are
       measured against the panel and they are the right red and amber on a
       10px bar — and at 17px of text on a tinted tile they come out at 2.99:1
       and 3.14:1, under the 4.5:1 a figure this size owes a reader. These are
       the same two hues stepped down until they pass (4.8 and 5.4), and the red
       is the one the heat pills already use, so the shop has one dark red
       rather than two. The 34px hero is the other way round and stays on the
       mark colours: over 18.66px bold the bar is 3:1, and it clears it. */
    .rp-tile.bad > b { color: #a8442f; }
    .rp-tile.warn > b { color: #8a5410; }
    .rp-tname { font-size: 10px; font-weight: 700; }
    /* .7 rather than the .55 every caption in the panel wears: those sit on the
       panel's own cream, and a tinted tile is a lighter ground to be read off. */
    .rp-tsub {
      font-size: 9.5px; line-height: 1.25; opacity: .7;
      display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden;
    }

    /* --- reputation ------------------------------------------------------
       Where it stands, then what moved it. 20px is deliberately well under the
       hero's 34: there is one hero per view and it is today's profit, and this
       is the second-biggest fact in the panel rather than a rival to it. */
    .rp-rnow { display: flex; align-items: baseline; gap: 8px; }
    .rp-rnow > b { font-size: 20px; font-weight: 800; line-height: 1; letter-spacing: -.01em; }

    /* One row per cause, all of them measured off the same centre line: gains
       to the right of it, losses to the left. The sign is therefore carried by
       WHICH SIDE a bar is on and by the signed figure beside it, and the colour
       only agrees — which is what keeps the block legible to a reader who
       cannot tell this green from this red, and they are the worst pair alive
       for exactly that. */
    .rp-causes { margin-top: 9px; display: flex; flex-direction: column; gap: 7px; }
    .rp-cause { display: grid; grid-template-columns: 1fr auto; gap: 3px 8px; align-items: baseline; }
    .rp-cname { font-size: 11px; font-weight: 700; }
    /* NOT --good and --accent. Those are mark colours — right on the bar below
       and on the week's columns — and as 10.5px text on the panel's cream they
       come out at 3.0:1 and 3.6:1, under the 4.5:1 a figure this size owes a
       reader. These are the same two hues stepped down until they pass (5.1 and
       5.8), and the red is the one the heat pills and the warning tiles already
       use, so the shop still has one dark red rather than two. */
    .rp-cval { font-size: 10.5px; font-weight: 800; font-variant-numeric: tabular-nums; }
    .rp-cval.up { color: #3f7a3c; }
    .rp-cval.down { color: #a8442f; }
    .rp-ctrack {
      grid-column: 1 / -1; position: relative; height: 6px; border-radius: 99px;
      background: rgba(58,49,40,.06);
    }
    /* The centre. A hairline rather than a gap, because with one row on each
       side a gap is invisible and the whole reading rests on there being a line
       both are measured from. */
    .rp-ctrack::before {
      content: ''; position: absolute; left: 50%; top: -1px; bottom: -1px;
      width: 1px; background: rgba(58,49,40,.2);
    }
    .rp-ctrack > i { position: absolute; top: 0; bottom: 0; display: block; }
    .rp-ctrack > i.up { background: var(--good); border-radius: 0 99px 99px 0; }
    .rp-ctrack > i.dn { background: var(--accent); border-radius: 99px 0 0 99px; }

    /* --- the shop ------------------------------------------------------- */
    .rp-meter { display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; margin-bottom: 8px; }
    .rp-mname { font-size: 11px; font-weight: 700; }
    .rp-mval { font-size: 10.5px; opacity: .55; font-variant-numeric: tabular-nums; }
    /* The empty part of the track is a lighter step of the fill rather than
       neutral grey, so how full it is reads across the whole bar. */
    .rp-mtrack {
      grid-column: 1 / -1; height: 5px; border-radius: 99px;
      background: rgba(90,163,86,.18); overflow: hidden;
    }
    .rp-mtrack > i {
      display: block; height: 100%; border-radius: 99px;
      background: var(--good); transition: width .25s ease;
    }
    .rp-clear { margin: 0; font-size: 11px; opacity: .55; line-height: 1.4; }

    /* ---- a menu with more rows than fit ----------------------------------
       What the thing IS stays at the top, what you can DO stays at the bottom,
       and the list between them scrolls. Sticky rather than a three-pane flex
       rebuild of #panel-body, because `.tabs` already pins itself this way and
       #panel-body is already the scroller — one mechanism, not two.

       The background has to be opaque or the rows scroll visibly *through* the
       pinned parts; --panel is the same colour the panel is already painted. */
    .pnl-head, .pnl-foot { position: sticky; z-index: 2; background: var(--panel-solid); }
    .pnl-head {
      top: calc(-1 * var(--panel-pad)); padding-top: var(--panel-pad);
      border-bottom: 1px solid var(--line);
    }
    .pnl-foot {
      bottom: calc(-1 * var(--panel-pad)); padding-bottom: var(--panel-pad);
      border-top: 1px solid var(--line);
    }
    /* Its own border is the divider; the heading's would double it. */
    .pnl-foot .sep { border-top: 0; margin-top: 0; }

    /* The verbs, as one row of squares rather than five labelled lines.
       Deliberately the mirror of `.tabs` at the other end of the panel: the
       same trade, the same size, the same reason — 214px does not have room
       for five words AND the list they act on. Tabs choose what you are
       looking at, these do something to it, and having them read as a matched
       pair top and bottom is worth more than either being prettier alone. */
    .fx-verbs { display: flex; gap: 3px; padding: 4px 0 2px; }
    .fx-verb {
      /* `min-width: 0` or the longest caption sets every square's width and the
         row overflows the panel instead of five equal columns ellipsising. */
      flex: 1; min-width: 0; position: relative;
      display: flex; flex-direction: column; align-items: center; gap: 1px;
      padding: 5px 2px 4px; border: 0; border-radius: 8px; background: transparent;
      color: var(--ink); opacity: .55; font: inherit; font-size: 13px; cursor: pointer;
      transition: opacity .1s, background .1s;
    }
    /* The word under the icon, and it is not decoration: a tooltip is a hover,
       and half of this game is played with a finger. Same treatment the build
       bar's `.tool .nm` gets, for the same reason. */
    .fx-verb .ico { font-size: 15px; line-height: 1; }
    .fx-verb .nm {
      max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      font-size: 9.5px; font-weight: 700; letter-spacing: -.01em;
    }
    .fx-verb:hover { opacity: 1; background: rgba(58,49,40,.07); }
    .fx-verb.danger:hover { background: rgba(190,60,45,.12); color: var(--accent); }
    /* Refused, not missing. It keeps its place in the row so the four you can
       press never shuffle sideways under your thumb, and `disabled` is what
       stops the press — greying without it is a button that lies. */
    .fx-verb.off { opacity: .25; cursor: default; }
    .fx-verb.off:hover { background: transparent; }
    /* A verb that is a TOGGLE, and currently on. Amber rather than the accent
       `armed` uses: red is "one press from something you cannot undo", and a
       camera that is following somebody is neither a warning nor a decision —
       it is a state, and it has to be readable as one from the same glance that
       reads Let go as dangerous. */
    .fx-verb.on {
      opacity: 1; background: rgba(217,155,31,.18);
      box-shadow: inset 0 0 0 1px rgba(217,155,31,.5);
    }
    .fx-verb.on:hover { background: rgba(217,155,31,.28); }
    /* One press from something that cannot be taken back. It has to be loud
       here in a way it did not have to be as a row: a row said "Tap again to
       let them go" in words, and a caption has no room for a sentence. */
    .fx-verb.armed {
      opacity: 1; background: var(--accent); color: #fff;
    }
    .fx-verb.armed:hover { background: var(--accent); color: #fff; }
    .fx-verb svg { display: block; }
    /* The price or the count — the two things an icon cannot say. Same corner
       and same treatment the build bar's `.have` badge uses. */
    /* The key that does this without the button. Top LEFT, because the badge
       above owns top right and a price is the thing you came here to read. Same
       weight and the same faintness the rail's own `.kb` uses, so a key cap
       reads as a key cap wherever it is. */
    .fx-verb .kb {
      position: absolute; top: 1px; left: 4px;
      font-size: 8px; font-weight: 800; line-height: 1;
      opacity: .35; pointer-events: none;
    }
    .fx-verb .have {
      position: absolute; top: 0; right: 2px;
      font-size: 9px; font-weight: 800; line-height: 1;
      color: var(--good); opacity: .95; pointer-events: none;
      font-variant-numeric: tabular-nums;
    }

    /* One fixture's own menu. The read-out at the top says what this thing is
       doing right now; the rows below are what you can do about it. */
    .fx-detail { padding: 4px 8px 5px; }
    /* Tight on purpose: this block is pinned, so every pixel it takes is one
       the scrolling list below it does not get. */
    .fx-line { display: flex; justify-content: space-between; gap: 12px; padding: 1px 0; font-size: 11.5px; }
    .fx-line span { opacity: .55; font-weight: 600; }
    .fx-line b { font-weight: 800; text-align: right; }
    /* One recipe and what it wants. Ingredients are counted against the hopper,
       so the row that isn't green is the reason the machine is standing idle. */
    .fx-recipe { border-top: 1px solid var(--line); margin-top: 5px; padding-top: 4px; }
    .fx-recipe-h { display: flex; justify-content: space-between; gap: 12px; font-size: 11.5px; padding: 1px 0 2px; }
    .fx-recipe-h span { font-weight: 800; }
    .fx-recipe-h b { font-weight: 700; opacity: .45; }
    .fx-ing { display: flex; justify-content: space-between; gap: 12px; padding: 1px 0 1px 10px; font-size: 11px; }
    .fx-ing span { opacity: .55; font-weight: 600; }
    .fx-ing b { font-weight: 800; font-variant-numeric: tabular-nums; color: #c8553d; }
    .fx-ing.ok b { color: #4e9a4e; }
    /* One board, one line: name, count, price, and the button that takes an
       armful. It used to be two lines — the name and count, then a "Price" row
       under it — so a shelf holding three things read as six rows and you had
       to pair them up by eye. A stepper reading `− $8.50 +` does not need the
       word Price in front of it; sitting on the same line as the name is what
       says which board it belongs to. */
    .fx-board {
      display: flex; align-items: center; gap: 5px;
      padding: 2px 0; font-size: 11.5px;
    }
    /* The one flexible column, and the only one allowed to lose: an authored
       item name has no length limit and everything to its right is a control
       that stops working if it shrinks. */
    .fx-board .nm {
      flex: 1; min-width: 0; font-weight: 700; opacity: .85;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    /* How many, over what it holds — the capacity dimmed, because the number
       that moves is the first one and it now has a price sat next to it. */
    .fx-board .qty { font-weight: 800; font-variant-numeric: tabular-nums; }
    .fx-board .qty i { font-style: normal; font-weight: 700; opacity: .4; }
    /* What is on a van, hung off the board's own count the way the supplier
       hangs it off the shelf count — same colour, same reason. Green because it
       is the answer to the low number beside it, and small because it is a
       promise: you cannot sell it yet, and a row that shouted it would read as
       though you could. It overrides the dimmed `/cap` above rather than sitting
       next to it, or the news would be the faintest thing on the row. */
    .fx-board .qty i.coming {
      font-size: 9.5px; color: var(--good); opacity: .95; margin-left: 2px;
    }
    /* A board that is only a promise: kept for something, with nothing on it yet.
       It has to read as lighter than a board with goods on it — the two are the
       same row and the difference between them is the whole point of the count —
       but not as *disabled*, because two of its buttons work and ordering some is
       the reason you are looking at it. So the name and the count dim and the
       controls do not. */
    .fx-board.pending .nm, .fx-board.pending .qty { opacity: .5; }
    /* The stepper itself is shared — a hire's job weights use it too (`wk-w`),
       so what is specific to a board row is scoped to one below rather than
       left here to move somebody else's buttons. */
    .fx-price { display: flex; align-items: center; gap: 2px; font-size: 11.5px; }
    .fx-board .fx-price { margin-left: 3px; }
    .fx-price b { font-weight: 800; min-width: 46px; text-align: center; font-variant-numeric: tabular-nums; }
    .fx-price button {
      border: 0; background: rgba(58,49,40,.09); color: var(--ink); border-radius: 7px;
      width: 22px; height: 22px; font: inherit; font-weight: 800; line-height: 1; cursor: pointer;
    }
    .fx-price button:hover { background: rgba(58,49,40,.18); }
    /* Same as `.fx-take:disabled` below and for the same reason — a stepper on a
       board with nothing to price is drawn so the row keeps its grid, and one
       drawn identically to a live one is a button that looks like it works. */
    .fx-price button:disabled { opacity: .25; cursor: default; background: transparent; }
    .fx-price button:disabled:hover { background: transparent; }
    .fx-take {
      border: 0; background: rgba(58,49,40,.09); color: var(--ink); border-radius: 7px;
      width: 24px; height: 22px; font-size: 12px; cursor: pointer; flex: none;
      display: flex; align-items: center; justify-content: center;
    }
    .fx-take:hover { background: rgba(58,49,40,.18); }
    .fx-take:disabled { opacity: .25; cursor: default; background: transparent; }
    .fx-take svg { display: block; }
    /* Delete this board. Quiet until you are over it — it sits next to a button
       you press all the time, and a red bin on every row would read as a shelf
       full of warnings. Never disabled: an empty board is exactly the one you
       most want gone, and the goods land in a crate rather than nowhere. */
    .fx-clear { opacity: .45; }
    .fx-clear:hover { opacity: 1; background: rgba(200,85,61,.16); color: var(--accent); }
    /* Order more of this board. Disabled is the interesting state and it is a
       sentence rather than a shrug — "6 already on the way" and "the bay is
       full" are both in the title, because a greyed-out button that never says
       why is the thing that reads as broken. */
    .fx-order:not(:disabled) { color: var(--good); }
    .fx-order:not(:disabled):hover { background: rgba(90,163,86,.18); }
    .fx-act { cursor: pointer; align-items: flex-start; }
    .fx-act:hover { background: rgba(58,49,40,.07); }
    .fx-act .bico { font-size: 14px; line-height: 1.2; width: 18px; text-align: center; }
    .fx-act .name { gap: 2px; }
    .fx-act .tags { line-height: 1.35; }
    .fx-act .price { color: var(--good); }
    .fx-act.danger .price { color: var(--accent); }
    /* Greyed out rather than hidden: "you need at least one till" is the whole
       answer to why the button isn't there, and hiding it never says so. */
    .fx-act.off { cursor: default; opacity: .42; }
    .fx-act.off:hover { background: none; }

    /* ---- one hire's own menu ---------------------------------------------
       A PROFILE: the machine on the left, everything read off it on the right.
       It was five label-and-value lines stacked down a pinned head, which is a
       spec sheet for a thing you never see — a bot spends the game two tiles
       away with its back to you, and this menu is the one place it can be stood
       up and turned round. */
    .wk-profile { position: relative; display: flex; gap: 10px; padding: 6px 8px 7px; }

    /* The well the avatar turns in — the same radial the palette stands its art
       in, at the size a portrait wants. `overflow: hidden` is doing real work:
       it is the window the filmstrip below slides past. */
    .wk-face {
      flex: none; position: relative; width: 78px; height: 86px;
      border: 0; padding: 0; border-radius: 12px; overflow: hidden;
      background: radial-gradient(120% 100% at 50% 16%, rgba(255,255,255,.95), rgba(58,49,40,.075));
      box-shadow: inset 0 0 0 1px rgba(58,49,40,.07);
      color: var(--ink); font: inherit;
    }
    /* Only a shop with more than one look gets a button here — see `avatar`. */
    button.wk-face { cursor: pointer; }
    button.wk-face:hover { box-shadow: inset 0 0 0 1.5px rgba(58,49,40,.2); }
    /* The same handle the palette tile wears on the same gesture, so a hold is
       a thing you can see is on offer rather than one you have to be told. */
    .wk-face .more { position: absolute; right: 4px; bottom: 2px; font-size: 10px; opacity: .35; }
    button.wk-face:hover .more { opacity: .9; }

    /* THE TURNTABLE, and it is a filmstrip rather than a renderer: `thumb.js`
       hands over twenty-four stills of the same bot at fifteen degrees apart,
       laid in one row `--n` faces wide, and this slides it one face at a time.
       `steps(var(--n))` never reaches the -100% it animates to — it stops one
       frame short — which is exactly the frame before the first one comes round
       again. Nothing ticks, nothing is measured, and the whole animation costs a
       transform.

       The phase comes in as a NEGATIVE `animation-delay` from the menu, because
       this element is rebuilt every time the panel redraws. See `avatar`. */
    .wk-turn {
      display: flex; height: 100%; width: calc(100% * var(--n));
      /* Longhands rather than the shorthand, because the delay arrives inline
         and the two have to be read as one animation — a shorthand here would
         also be re-declaring the delay it is being handed. */
      animation-name: wk-spin;
      animation-duration: var(--spin);
      animation-timing-function: steps(var(--n));
      animation-iteration-count: infinite;
    }
    @keyframes wk-spin { to { transform: translateX(-100%); } }
    .wk-turn > span { flex: none; width: calc(100% / var(--n)); height: 100%; padding: 6px; }
    /* A kind nobody drew a model for. One still, in the same well. */
    .wk-still { display: block; height: 100%; padding: 6px; }
    .wk-turn svg, .wk-still svg { width: 100%; height: 100%; display: block; }
    /* A card you are reading, so the one moving thing on it gives way. */
    @media (prefers-reduced-motion: reduce) { .wk-turn { animation: none; } }

    /* What is read off them. Doing spans the block because it is the only one
       that is a sentence and the only one that moves while you watch; the four
       standing figures go in two columns under it, which is where the head got
       back the forty pixels the avatar costs. `auto-fit` so the same block is
       one column on a phone rather than two squeezed to an ellipsis. */
    .wk-facts { flex: 1; min-width: 0; }
    .wk-facts > .fx-line {
      border-bottom: 1px solid var(--line); padding-bottom: 4px; margin-bottom: 3px;
    }
    .wk-grid {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(132px, 1fr));
      column-gap: 14px;
    }
    /* One line per figure, whatever the content says. A rung is NAMED by
       content ("New behind the counter"), so the one cell in here that can be
       four words long is the one nothing in this file controls — and wrapped it
       took the label beside it out of line with the row above, which reads as a
       broken grid rather than as a long name. The whole of it is on the hover,
       the same deal every row in this panel makes with its caption.
       `min-width: 0` because a flex child will not shrink past its content
       without it, and an ellipsis that never triggers is not an ellipsis. */
    .wk-grid .fx-line { align-items: baseline; }
    .wk-grid .fx-line b {
      min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }

    /* The paints, out of the avatar you held. Rows are `.shape` — the build
       bar's shape card, which is the same question with the same shape of
       answer — so only where it hangs is new. Positioned against `.wk-profile`
       and not the head, because the head is `position: static` while the panel
       is paned and would hand the card the whole panel to be measured from. */
    .wk-skins {
      position: absolute; z-index: 5; left: 8px; top: calc(100% - 6px);
      display: flex; flex-direction: column; gap: 2px;
      width: 188px; max-width: calc(100% - 16px); max-height: 232px; overflow-y: auto;
      background: var(--panel-glass); border-radius: 12px; padding: 5px;
      backdrop-filter: blur(14px) saturate(1.15);
      -webkit-backdrop-filter: blur(14px) saturate(1.15);
      box-shadow: 0 10px 24px rgba(58,49,40,.28), inset 0 0 0 1px rgba(58,49,40,.09);
    }
    /* A bot is taller than it is broad, where a shelf is the other way about —
       so the well `.shape` stands its picture in gets the other proportion
       here. Everything else about the row is the build bar's. */
    .wk-skins .shape { padding: 3px 8px 3px 3px; }
    .wk-skins .shape .ico.art { width: 30px; height: 36px; }

    /* The directives, in TWO COLUMNS. It is a fixed vocabulary of eight short
       rows and one column of them was a scroll for no reason — with the tabs
       gone and the head shorter, the whole list now sits on screen at once,
       which is the difference between reading a hire's shift and hunting
       through it. `auto-fit` again, and again for the phone. */
    .wk-jobs {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(184px, 1fr));
      column-gap: 4px;
    }
    /* The dial on each job row. It borrows the fixture price control wholesale
       — same buttons, same tabular value — and only shrinks it, because a
       weight is one digit where a price is five. */
    .wk-w { flex: none; gap: 4px; padding: 0; }
    .wk-w b { min-width: 16px; font-size: 11px; }
    .wk-w button { width: 24px; height: 24px; }
    .wk-job { padding: 3px 4px; }
    .wk-job .name { padding: 2px 0; }

    /* What is left of their day, in the heading of the list that spends it.
       There is one pot and nine rows drawing on it, so the count belongs above
       all of them rather than on any one — and it is the reason the standing
       paragraph explaining what a weight is could go: a number running out
       under your thumb says it where you are pressing. */
    .sep .wk-cap {
      float: right; font-size: 10px; letter-spacing: 0; opacity: .85;
      font-variant-numeric: tabular-nums;
    }
    .sep .wk-cap i { font-style: normal; opacity: .5; }
    /* Only ever reached by rolling firmware BACK — a rung takes points away and
       deliberately does not touch the list, so this is somebody carrying more
       than they are allowed until you trim them. It has to be visible: every `+`
       in the list is dead until it clears, and a dead stepper with nothing
       saying why is the thing that reads as broken. */
    .sep .wk-cap.over { color: var(--accent); opacity: 1; }

    /* How much is left in the tank. The bar sits behind the word rather than
       beside it, because the row is already two columns wide and a third one
       would push the label onto its own line. */
    .wk-energy {
       position: relative; display: inline-block; padding: 1px 7px;
       border-radius: 99px; overflow: hidden; font-size: 11px;
    }
    .wk-energy i {
      position: absolute; inset: 0 auto 0 0; background: rgba(90,163,86,.28);
    }
    .wk-energy.low i { background: rgba(226,86,74,.3); }
    /* The build bar. Hidden entirely unless you're building — the shop floor is
       the game, and a permanent toolbar would make it look like a level editor.

       Two tiers, because the palette is a database anyone can add to: tabs for
       what sort of thing, then that tab's entries in a strip that scrolls
       sideways. A flat row could only show its first nine, which is why there
       used to be a second copy of this palette in a panel. */
    /* No `gap`. The only gap this column ever had was the one between the hint
       and the bar, and the hint carries it as a margin of its own now so that it
       can animate away with it — a gap belongs to the parent and cannot go, so a
       collapsed hint would leave 6px of nothing above the bar. */
    #build {
      bottom: var(--nav-top); left: 50%; transform: translate(-50%, 26px); opacity: 0;
      display: flex; flex-direction: column; align-items: center;
      pointer-events: none; transition: .18s;
    }
    #build.on { opacity: 1; transform: translate(-50%, 0); pointer-events: auto; }
    /* ONE WIDTH, WHATEVER IS IN IT. It used to size to its contents under a 960px
       ceiling, and the bar is centred — so a tab with four things in it was half
       the width of a tab with twelve, and switching between them slid the whole
       bar, every tab on it and the tile under your pointer sideways. You cannot
       aim at a thing that moves because you looked at something else. A width
       that is the same on every tab means the tabs are always in the same place
       and the tiles always start at the same edge; a short tab has room to its
       right, which is what a strip that scrolls looks like when it doesn't need
       to. */
    #build-bar {
      display: flex; flex-direction: column; gap: 5px;
      background: var(--panel-glass); border-radius: 16px; padding: 6px;
      backdrop-filter: blur(14px) saturate(1.15);
      -webkit-backdrop-filter: blur(14px) saturate(1.15);
      box-shadow: 0 8px 26px rgba(58,49,40,.24);
      width: min(760px, calc(100vw - 28px));
      /* What the shape card is positioned against. It hangs off the top of this,
         over the world, rather than being a row inside it — see `#build-shapes`. */
      position: relative;
    }

    /* TIER ONE AND TWO SHARE A ROW. They were two stacked rows, at two different
       visual weights, and the second of them came and went — so changing tab
       changed the height of the bar, and nothing on screen said which of the two
       rows `Tab` was steering. One row is one question (where am I) read left to
       right, and it is 25px of screen back. */
    #build-nav {
      display: flex; align-items: center; gap: 6px;
      padding-bottom: 5px; border-bottom: 1px solid var(--line);
    }
    #build-groups { display: flex; gap: 3px; }
    /* NOT `flex: 1`. Five tabs stretched across `#build-bar`'s full width is most
       of why this bar read as enormous: the row was a wall of empty gradient, and
       each tab was a 190px target for a 15px glyph. Content width — the row is as
       wide as the words on it, and the space left over is space. */
    .cat {
      flex: none; display: flex; align-items: center; justify-content: center; gap: 5px;
      border: 0; border-radius: 10px; background: transparent; cursor: pointer;
      font: inherit; color: var(--ink); opacity: .5; padding: 5px 8px;
      white-space: nowrap; transition: opacity .1s, background .1s, box-shadow .1s;
    }
    .cat:hover { opacity: .85; background: rgba(58,49,40,.06); }
    /* The open tab is a raised card, not a grey wash. It is the one thing on the
       bar that says where you are, and at .5-versus-1 opacity it was saying it
       about as loudly as the four that aren't. */
    .cat.on {
      opacity: 1; background: linear-gradient(#fffdf8, #f3ead9);
      box-shadow: 0 1px 3px rgba(58,49,40,.18), inset 0 0 0 1px rgba(58,49,40,.1);
    }
    .cat .ico { font-size: 15px; line-height: 1; }
    /* An inactive tab is its icon; the open one wears its name. Five labels
       competing is five things to read to find the one that says where you are,
       and the label belongs on the tab that IS where you are. The blurb is the
       tooltip either way, on all of them. */
    .cat .nm { display: none; font-size: 11.5px; font-weight: 800; }
    .cat.on .nm { display: block; }

    /* Tier two, and only for a tab that split: which part of it. Deliberately
       quieter than the tabs beside it — smaller, chip-shaped, words rather than
       glyphs, because "walls" and "floors" are not guessable from an icon and
       these are the labels the tabs gave up. The divider is this row's own left
       border, so it is there exactly when there is something to its left of. */
    #build-subs {
      display: flex; align-items: center; gap: 3px;
      padding-left: 8px; border-left: 1px solid var(--line);
    }
    #build-subs[hidden] { display: none; }
        .subcat {
      display: flex; align-items: center; gap: 4px;
      border: 0; border-radius: 8px; background: transparent; cursor: pointer;
      font: inherit; font-size: 10.5px; font-weight: 700; color: var(--ink);
      opacity: .45; padding: 3px 10px; white-space: nowrap; transition: opacity .1s, background .1s;
    }
    .subcat:hover { opacity: .8; background: rgba(58,49,40,.06); }
    .subcat.on { opacity: 1; background: rgba(58,49,40,.09); }
    .subcat .ico { font-size: 12px; line-height: 1; }

    /* Tier three: that tab's entries. Scrolls rather than wraps, so the bar keeps
       one row's height however much anybody authors.

       NO SCROLLBAR. A grey pill under a row of cards is an operating system in
       the middle of a shop — and it was answering two questions at once, badly:
       "is there more" and "take me there". Those are split now. The strip is
       DRAGGED (`wireStrip`, bar.js), which is the same gesture the world behind
       it already answers to, and each end that has more wears an arrow you can
       press — so the answer to "is there more" is a thing you can act on rather
       than a bar you have to hit.

       THE SCROLLER OWNS THE INSET so those ends are the panel's ends: it is
       pulled out over `#build-bar`'s 6px and given that 6px back as padding of
       its own, which puts the tiles exactly where they sat while letting the
       row scroll the full width of the panel. Without it a tile parks 6px short
       of the edge and the fade beside it has a margin of dead glass to sit in.
       `scroll-padding` is the other half — `scrollIntoView` aligns to the
       scrollport, so the tile a number key selects would otherwise land flush
       against the panel edge with none of the inset the rest of the row has. */
    /* CLIPPED TO THE PANEL'S OWN CORNERS. Pulling the strip out to the bar's
       edges is what puts the ends of the row at the ends of the bar — and it
       also hands the scroll a square box where the bar has a 16px radius, so a
       tile scrolled hard against either end pokes its corner out over the world
       and reads as the bar having sprung a leak. The rounding cannot go on
       `#build-bar` itself: `#build-shapes` hangs off the top of it on purpose,
       and clipping there would cut the shape card off at the bar.
       Bottom corners only, because that is the pair this element shares with
       the panel — its top edge is in the middle of it. */
    #build-strip {
      position: relative; margin: 0 -6px -6px;
      border-radius: 0 0 16px 16px; overflow: hidden;
    }
    #build-tools {
      display: flex; gap: 6px; overflow-x: auto; overflow-y: hidden;
      padding: 0 6px 6px; scroll-padding-inline: 22px;
      scrollbar-width: none;
      /* A drag scrolls it; a touch still flicks it natively, which is why the
         pointer handler ignores anything that isn't a mouse. */
      touch-action: pan-x;
    }
    #build-tools::-webkit-scrollbar { display: none; }
    /* The ends, when there is more past them. A fade rather than a hard edge,
       so a tile half off the strip reads as *continuing* instead of as cut —
       and it is `pointer-events: none` because the tile under it is still a
       button you can press. Painted in the panel's own glass, which is what
       makes it read as the bar rather than as a shadow on the row. */
    #build-strip::before, #build-strip::after {
      content: ''; position: absolute; top: 0; bottom: 6px; width: 46px;
      pointer-events: none; z-index: 2; opacity: 0; transition: opacity .12s;
    }
    #build-strip::before {
      left: 0; background: linear-gradient(90deg, var(--panel-glass) 22%, rgba(255,252,245,0));
    }
    #build-strip::after {
      right: 0; background: linear-gradient(270deg, var(--panel-glass) 22%, rgba(255,252,245,0));
    }
    #build-strip.more-back::before, #build-strip.more-on::after { opacity: 1; }
    /* …and the arrow in it. A round chip rather than a bare glyph: it is a
       button, it sits over a row of buttons, and the one thing it must not read
       as is part of whichever tile it happens to be floating over. */
    .nudge {
      position: absolute; top: 50%; transform: translateY(calc(-50% - 3px));
      z-index: 3; width: 22px; height: 22px; padding: 0;
      display: grid; place-items: center; cursor: pointer;
      border: 0; border-radius: 99px; font: inherit; font-size: 14px; line-height: 1;
      color: var(--ink); background: linear-gradient(#fffdf8, #f1e8d6);
      box-shadow: 0 2px 6px rgba(58,49,40,.24), inset 0 0 0 1px rgba(58,49,40,.11);
      opacity: .92; transition: opacity .1s, transform .1s;
    }
    .nudge:hover { opacity: 1; transform: translateY(calc(-50% - 3px)) scale(1.08); }
    .nudge[hidden] { display: none; }
    .nudge svg { display: block; }
    #build-back { left: 2px; }
    #build-on { right: 2px; }
    /* An entry, and it is a slot rather than a line of text: the thing itself in
       a recessed well, its name under it, what it costs under that. Sized by a
       floor and a ceiling rather than its contents — a person's note is
       "carrying 4x tomato" where a fixture's is "$45", and a strip whose buttons
       are each as wide as their longest line is one you cannot scan. Both lines
       ellipsise instead. */
    .tool {
      position: relative; border: 0; cursor: pointer; flex: none;
      font: inherit; color: var(--ink); border-radius: 13px; padding: 6px 8px 5px;
      display: flex; flex-direction: column; align-items: center; gap: 2px;
      min-width: 74px; max-width: 132px;
      /* Slightly see-through, so the glass under the strip reads as glass rather
         than as a frame around a row of solid cards. The armed one below stays
         opaque on purpose — it is the one thing here that is not scenery. */
      background: linear-gradient(rgba(255,253,248,.84), rgba(246,239,224,.76));
      box-shadow: inset 0 0 0 1px rgba(58,49,40,.09), 0 1px 0 rgba(58,49,40,.07);
      transition: transform .09s, box-shadow .09s, background .09s;
    }
    .tool:hover { transform: translateY(-2px); box-shadow: inset 0 0 0 1px rgba(58,49,40,.14), 0 4px 10px rgba(58,49,40,.16); }
    .tool:active { transform: translateY(0); }
    /* Armed. A ring rather than a fill under the art, so the thing you are about
       to build stays the brightest object in its own button — a solid amber
       block behind a wooden shelf turns both to mud. */
    .tool.on {
      background: linear-gradient(#ffe6a8, #ffd66b);
      box-shadow: inset 0 0 0 1.5px #d99b1f, 0 4px 12px rgba(217,155,31,.34);
      transform: translateY(-2px);
    }
    /* The key it answers to, as a key. */
    .tool .key {
      position: absolute; top: 3px; left: 4px; z-index: 1;
      font-size: 8.5px; font-weight: 800; line-height: 12px; min-width: 12px; height: 12px;
      border-radius: 4px; color: rgba(58,49,40,.55);
      background: rgba(58,49,40,.07); box-shadow: inset 0 0 0 1px rgba(58,49,40,.09);
    }
    .tool.on .key { color: rgba(58,49,40,.72); background: rgba(255,255,255,.5); }
    /* How many are already standing in the shop. Opposite corner to the key,
       because they are answers to different questions and both are one glyph. */
    .tool .have {
      position: absolute; top: 3px; right: 4px; z-index: 1;
      font-size: 8.5px; font-weight: 800; line-height: 13px; min-width: 13px; height: 13px;
      border-radius: 99px; color: #fffcf5; background: rgba(58,49,40,.58);
      font-variant-numeric: tabular-nums;
    }
    /* The well the thing stands in. It is what makes a row of art read as a row
       of *slots* — without it every button is a picture floating on cream and
       the strip has no grid to it. */
    .tool .ico {
      font-size: 19px; line-height: 1; display: grid; place-items: center;
      width: 100%; height: 38px; border-radius: 9px;
      background: radial-gradient(120% 100% at 50% 18%, rgba(255,255,255,.9), rgba(58,49,40,.055));
      box-shadow: inset 0 0 0 1px rgba(58,49,40,.06);
    }
    .tool.on .ico { background: radial-gradient(120% 100% at 50% 18%, rgba(255,255,255,.92), rgba(160,110,20,.14)); }
    /* Art gets the well; a glyph is a category rather than a thing, so it stays
       small and centred instead of being blown up to fill one. */
    .tool .ico.art { padding: 3px; }
    .tool .ico.art svg { width: 100%; height: 100%; display: block; }
    .tool .nm, .tool .cost { max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .tool .nm { font-size: 11px; font-weight: 700; }
    .tool .cost { font-size: 10px; font-weight: 800; opacity: .55; font-variant-numeric: tabular-nums; }
    /* Somebody the sim cannot place — their kind was deleted out from under
       them. That is a problem rather than a job, and it should not read as one. */
    .tool.warn .cost { color: var(--accent); opacity: .9; }

    /* MORE THAN YOU HAVE. Not `disabled`, because the tip explaining why is a
       hover away and a disabled button is the one that most needs to be able to
       answer for itself — the press is refused in `bar.js` instead.

       The picture goes grey and quiet while the PRICE goes bright: the number is
       the reason, so it is the one thing on the tile that should get louder, and
       greying the whole button would fade the only part of it worth reading. No
       lift on hover and no pointer either, which between them are what a tile
       says about itself before you press it. It can be `on` as well — money
       spent after you armed something — and then the amber ring stays, because
       the tool genuinely is still in your hand. */
    .tool.poor { cursor: not-allowed; }
    .tool.poor:hover { transform: none; box-shadow: inset 0 0 0 1px rgba(58,49,40,.09), 0 1px 0 rgba(58,49,40,.07); }
    .tool.poor .ico { opacity: .34; filter: grayscale(1); }
    .tool.poor .nm { opacity: .45; }
    .tool.poor .cost { color: var(--accent); opacity: .95; }
    /* Armed and unaffordable keeps its ring — see above — so the well under the
       art must not be greyed back to nothing against it. */
    .tool.on.poor:hover, .tool.on.poor {
      box-shadow: inset 0 0 0 1.5px #d99b1f, 0 4px 12px rgba(217,155,31,.34);
      transform: translateY(-2px);
    }

    /* THE BUILD STRIP IS TILES. A picture, the key it answers to, how many you
       already own, what it costs — and that is the whole button.

       The NAME is what came off it, and only the name. It used to sit under every
       entry permanently, which with the price made each one three lines and 78px
       tall at ~100px wide: eight fitted on screen and the strip read as a wall of
       small text rather than as a row of things. The art is already the label
       here — `thumb.js` draws the actual piece off its own row, which is the
       entire reason five floors stopped being five grey glyphs — and a name is
       long, ragged and only ever a question about ONE entry: the one under the
       pointer. `tip.js` answers that, at the tile, which is where the question
       was asked. It went to a caption at the end of the tab row for a while, and
       that was the same answer given at the other end of the bar.

       THE PRICE STAYS. It is four characters, it is right-aligned arithmetic, and
       it is the actual decision: $40 against $110 across a row of lamps is a
       comparison, and a comparison you have to hover for one item at a time is
       not one you can make. Putting it back costs 10px of tile height and buys
       the only thing on the button anybody was reading.

       Browse bars keep their cards. A hire's note is what they are doing right
       now — a readout, not a hover question — and their glyph is a category
       rather than a picture of them, so there is nothing on the button to read
       them off of. */
    #build:not(.browse) .tool {
      width: 48px; min-width: 48px; max-width: 48px;
      padding: 4px; border-radius: 12px; gap: 1px;
    }
    #build:not(.browse) .tool .nm { display: none; }
    /* This one comes in shapes: hold it, or press this. A hold nothing on screen
       mentions is a gesture nobody finds, and a shape is cosmetic enough that
       never finding it would read as the game not having them.

       In the bottom-right of the WELL rather than of the button — the well is
       4px down and 38px tall, so 30px puts a 10px chip inside its lower corner,
       clear of the price line underneath. Over the art, so it needs its own
       ground to stay legible against a dark shelf. */
    #build:not(.browse) .tool .more {
      position: absolute; top: 30px; right: 4px; z-index: 1;
      height: 10px; padding: 0 2px; border-radius: 4px;
      font-size: 9px; font-weight: 800; line-height: 10px;
      color: rgba(58,49,40,.62); background: rgba(255,253,248,.8);
      box-shadow: inset 0 0 0 1px rgba(58,49,40,.11);
    }
    #build:not(.browse) .tool:hover .more, #build:not(.browse) .tool.on .more {
      color: rgba(58,49,40,.85); background: rgba(255,255,255,.95);
    }
    #build:not(.browse) .tool .ico { height: 38px; border-radius: 8px; }
    /* Line height pinned, not left to the font: this is the last line in a button
       whose height the whole HUD is measured off (`--build-h`), and 1.2× of a
       9.5px font is a different number of pixels in every browser. */
    #build:not(.browse) .tool .cost { font-size: 9.5px; line-height: 11px; }

    /* A glyph on these two is a category rather than a thing, and an empty
       recess under one is a slot with the thing missing out of it — so a glyph
       keeps the old flat button. Art does not: a hire IS drawn, and their well
       has to be the same fixed height every other slot's is or the button
       changes height with the drawing in it. */
    #build.browse .tool .ico:not(.art) { background: none; box-shadow: none; height: auto; }
    /* A ROSTER ENTRY MUST NOT RESIZE ITSELF. Its note is what that person is
       doing right now — "on the till", then "carrying 4x tomato", then "off for
       a break" — so a button sized to its own text is one that grows and
       shrinks every few seconds and shunts every button after it sideways. You
       cannot press a moving target, and the whole point of the strip is that
       who is on the tills is a glance rather than a menu.

       So the browse bars fix the width instead of ranging between the floor and
       the ceiling above, and both lines ellipsise into it. The tooltip carries
       the whole sentence, which is where an ellipsis sends you. */
    #build.browse .tool { width: 108px; min-width: 108px; max-width: 108px; }
    /* A RUN LABEL — the word in the gap before the first entry of a kind.
       Upright, because the strip's whole budget here is horizontal: a heading
       laid flat costs as much room as another hire, and the bar is a row you
       scroll. The rotation is on the inner `i` rather than on the label itself,
       or the hairline that separates one run from the last comes out on the
       wrong side of it.

       Quiet and small on purpose. It is a caption for the four buttons after
       it, and a heading that reads louder than the names it is grouping is a
       strip you scan twice. No hairline on the first, which would be a rule
       down the left of the whole bar rather than between anything. */
    #build-tools .run {
      flex: none; display: flex; align-items: center; justify-content: center;
      width: 15px; padding-left: 5px; border-left: 1px solid rgba(58,49,40,.13);
    }
    #build-tools .run:first-child { border-left: 0; padding-left: 0; }
    #build-tools .run i {
      writing-mode: vertical-rl; transform: rotate(180deg);
      font-size: 9px; font-weight: 800; font-style: normal;
      letter-spacing: .1em; text-transform: uppercase;
      color: var(--ink); opacity: .42; white-space: nowrap;
      max-height: 100%; overflow: hidden;
    }
    /* …and it gets TWO lines to say it in, centred, clamped. One line of 108px
       cut "carrying 4x tomato" down to about "carrying 4x to", which is a
       readout you have to hover to read. Two lines is most of what anybody is
       ever doing.

       The height is fixed at both of them rather than left to the text, for the
       same reason the width is: a note that dropped to one line would shorten
       the button, and the bar measures itself (`--build-h`) so the whole HUD
       above it would step down with it. A one-line note simply sits in the top
       half. */
    #build.browse .tool .cost {
      white-space: normal; text-align: center; line-height: 1.15; height: 2.3em;
      display: -webkit-box; -webkit-line-clamp: 2; line-clamp: 2;
      -webkit-box-orient: vertical; overflow: hidden;
    }

    /* The last tier, and the only one that is not part of the bar.

       It was a row along the bottom, drawn whenever the armed piece came in more
       than one shape — and a row that comes and goes changes the height of the
       bar, which moves every tab on it and the tile you were aiming at. Twice:
       once arriving, once leaving. A card hanging off the top of `#build-bar`
       costs the bar no height at all, so nothing moves, and it can sit over the
       world because the world behind the palette is not what you are reading.

       `left` is set by `placeChoice` — over the tile it is about. A shape is
       still not another thing to buy, so it never takes a number key, and it
       still goes when the piece does: browse to another tab and it would be a
       label for something no longer on screen. */
    /* A LIST, not a wrapped row of chips. Wrapping made a card whose shape
       changed with the number of shapes in it and whose names landed in a
       different place on every line — six things to read in a ragged block,
       when they are one question with six answers. A column is one column of
       pictures down the left and one column of words beside them, which is the
       same button the strip below is made of, stood up. */
    #build-shapes {
      position: absolute; bottom: calc(100% + 8px); left: 0;
      display: flex; flex-direction: column; align-items: stretch; gap: 2px;
      width: 186px; max-width: calc(100vw - 40px);
      background: var(--panel-glass); border-radius: 12px; padding: 5px;
      backdrop-filter: blur(14px) saturate(1.15);
      -webkit-backdrop-filter: blur(14px) saturate(1.15);
      box-shadow: 0 10px 24px rgba(58,49,40,.28), inset 0 0 0 1px rgba(58,49,40,.09);
    }
    #build-shapes[hidden] { display: none; }
    /* One row per shape: its picture on the left, its name beside it, both hard
       against the same two edges on every row so the list reads down. */
    .shape {
      display: flex; align-items: center; gap: 7px; text-align: left;
      border: 0; border-radius: 8px; background: transparent; cursor: pointer;
      font: inherit; font-size: 11.5px; font-weight: 700; color: var(--ink);
      padding: 2px 8px 2px 3px; opacity: .8;
    }
    .shape:hover { opacity: 1; background: rgba(58,49,40,.06); }
    .shape.on { background: #ffd66b; opacity: 1; box-shadow: inset 0 0 0 1.5px #d99b1f; }
    /* The same well the tiles in the strip stand their art in, at list size —
       this is that button stood up, not a chip with a picture on it, and a
       column of art with no ground under it is a column of floating drawings. */
    .shape .ico.art {
      flex: none; width: 30px; height: 26px; padding: 2px; border-radius: 7px;
      background: radial-gradient(120% 100% at 50% 18%, rgba(255,255,255,.9), rgba(58,49,40,.055));
      box-shadow: inset 0 0 0 1px rgba(58,49,40,.06);
    }
    .shape.on .ico.art { background: radial-gradient(120% 100% at 50% 18%, rgba(255,255,255,.92), rgba(160,110,20,.14)); }
    .shape .ico.art svg { width: 100%; height: 100%; display: block; }
    /* Vertically centred beside the picture rather than sitting on the baseline
       of a 26px box, and one line whatever its name is — "Wall corner (other
       way)" is the longest thing in here and wrapping it would make one row of
       the list twice the height of the others. */
    .shape .nm {
      min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }

    /* Above the bar, and only when it has something to report — see
       `renderBuildHint`. Below it, it sat on the very bottom edge of the screen
       and pushed everything else up for a line that was usually restating the
       lit button. */
    #build-hint {
      background: rgba(58,49,40,.82); color: #fff; border-radius: 99px;
      padding: 4px 12px; font-size: 12px; font-weight: 600;
      /* It grows out of the bar and sinks back into it. Appearing and vanishing
         between two frames is what made this harsh — a line of text arriving at
         full contrast on the bottom edge of the screen reads as an alert, and
         "Nothing armed" is not one.

         The height is animated as well as the fade, because this element is IN
         FLOW: everything above the bar is positioned off `--build-h`, so a hint
         that only faded would still shove the HUD up the instant it appeared and
         drop it the instant it went. `max-height` rather than `height`, because
         the line has to stay free to wrap — a refusal reason on a narrow window
         is two lines and a fixed height would cut one off. The cost of that is
         the usual one: the animation ends at 4.5em rather than at the real
         height, so a one-line hint has finished growing about two thirds of the
         way through and coasts the rest on the fade and the slide, which are
         still moving. The padding goes with it or a collapsed box is 8px tall. */
      margin-bottom: 6px; max-height: 4.5em; overflow: hidden;
      pointer-events: none;
      transition: opacity .15s, transform .18s, max-height .18s,
        margin-bottom .18s, padding-top .18s, padding-bottom .18s;
    }
    /* Down and away, which is the same direction the whole bar arrives from
       (`#build` above) — so a hint leaving looks like it went back behind the
       bar rather than like it was switched off. */
    #build-hint.gone {
      opacity: 0; transform: translateY(7px);
      max-height: 0; margin-bottom: 0; padding-top: 0; padding-bottom: 0;
    }
    /* Amber is a consequence you may still choose; red is a no. Same two
       colours the ghost on the ground is using, so the words and the box can
       never disagree about what is about to happen. */
    #build-hint.warn { background: var(--warn); color: var(--ink); }
    #build-hint.bad { background: var(--accent); color: #fff; }
    /* The corner HUD clears the same stack, by the same arithmetic. `--build-h`
       is 0 when no bar is up, so there is one rule rather than one per mode —
       `body.building #log` and friends were three literals that had to be kept
       in step with a bar whose height nobody could predict.

       `#log` is deliberately not in here any more — see its own rule. These two
       are things you read *while pressing something*, so they have to move with
       the bar; the feed is not. */
    #carry, #prompt { bottom: calc(var(--nav-top) + var(--build-h) + 8px); }

    /* ---- the award card ---------------------------------------------------
       The one thing on screen that is allowed to look like a game rather than
       like a shop's paperwork. Everything else in this HUD is cream, rounded
       and quiet on purpose — it sits over the thing you are actually looking
       at — and an award drawn to those rules would read as another menu having
       opened. So: gold, a medal hanging off the top over a turning sunburst,
       and a pop on the way in.

       z-index 45 puts it over the tip (40) and under the front door (60): it
       covers everything in the shop, and the shop list is not in the shop.
       See client/award.js — the world is paused underneath it. */
    /* ---- the tutorial ------------------------------------------------------
       A veil that BLOCKS, a hole that does not, a ring round the hole and a
       robot beside it. See client/tutor.js for why the veil is four boxes
       rather than one with a hole cut in it.

       z-index 30 is over the whole HUD (10) and its notes (12) and under the
       tip (40) and the award (45). Both of those are right: an award is the
       shop congratulating you and outranks anything, and a tooltip belongs on
       top of the button it describes even when that button is the lit one. */
    #tutor { position: fixed; inset: 0; z-index: 30; pointer-events: none; }
    #tutor[hidden] { display: none; }

    /* The blackout. `pointer-events: auto` is the whole feature — a veil that
       only darkened would be a picture of a tutorial. Positioned by JS, all
       four, every frame the target could have moved. */
    .tt-veil {
      position: absolute; pointer-events: auto;
      background: rgba(28, 24, 20, .58);
      opacity: 0; transition: opacity .2s ease;
      /* A tap on the dark is a tap on nothing, and a cursor that still says
         "you could click here" is the veil lying about itself. */
      cursor: not-allowed;
    }
    #tutor.show .tt-veil { opacity: 1; }

    /* The hole's outline. It is drawn OUTSIDE the rect (a spread shadow rather
       than a border) so it never covers a pixel of the thing it is pointing at
       — a 3px border on a 40px rail button eats the badge in its corner. */
    .tt-ring {
      position: absolute; border-radius: 14px; pointer-events: none;
      box-shadow: 0 0 0 3px var(--good), 0 0 0 9px rgba(90, 163, 86, .3);
      animation: ttpulse 1.9s ease-in-out infinite;
    }
    .tt-ring[hidden] { display: none; }
    @keyframes ttpulse {
      0%, 100% { box-shadow: 0 0 0 3px var(--good), 0 0 0 8px rgba(90, 163, 86, .28); }
