<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <title>Sprocket &amp; Stock</title>

  <!-- THE LINK CARD.
       Nobody searches for this game, so none of this is SEO and it should not
       grow in that direction. What it is for is the one thing that actually
       happens: somebody pastes the URL into Discord, or a group chat, or a
       forum. Unfurled without these, that is a bare grey link with no picture
       and no sentence, which is a thing people scroll past.

       EVERY URL IN HERE IS ABSOLUTE, and that is the whole trap. The unfurler
       is not a browser sitting on this page — it is a crawler somewhere else
       that fetches exactly the string it is handed — so a relative `./og.png`
       resolves against nothing and the card ships with a hole where the picture
       goes. Which also means the origin is written out below rather than
       derived: it is baked at build time, it is the deployed site's, and a
       custom domain is a change to this one constant and the four lines under
       it. See `ogImage` in vite.config.js for how og.png gets emitted at a name
       that does not move.

       The description is the game in one sentence, for somebody who has never
       heard of it and is not a programmer. -->
  <meta name="description" content="Build a shop, hire robots to run it, and grow the food indoors in racks and vats. Free, in your browser." />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Sprocket &amp; Stock" />
  <meta property="og:title" content="Sprocket &amp; Stock" />
  <meta property="og:description" content="Build a shop, hire robots to run it, and grow the food indoors in racks and vats. Free, in your browser." />
  <meta property="og:url" content="https://sprocket-and-stock.pages.dev/" />
  <meta property="og:image" content="https://sprocket-and-stock.pages.dev/og.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <!-- What the shop looks like, for somebody who cannot see the picture. -->
  <meta property="og:image:alt" content="A long shop seen from above with its front wall cut away: robots working the aisles, full shelves and chillers, and shoppers walking in off the street." />
  <!-- `summary_large_image` is the difference between a thumbnail beside the
       text and the picture across the top of the card. -->
  <meta name="twitter:card" content="summary_large_image" />

  <!-- The tab icon. A relative reference rather than an absolute one, and
       rather than a data: URI: Vite resolves it, emits it with a content hash
       and rewrites this href, which is why it works with `publicDir: false` —
       there is no static folder in this project for a favicon to sit in.

       `type` is not optional here. Without it some browsers sniff, and one that
       guesses wrong on an SVG silently falls back to asking for /favicon.ico —
       which does not exist, so what you get is the default page glyph and
       nothing anywhere saying why. See client/favicon.svg for the art. -->
  <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
  <style>
    :root {
      --ink: #3a3128;
      /* The CONTOUR, and it is not `--ink`. That one is the brown you read text
         in; this is `INK.COLOR` from client/render/look.js — the line the post
         pass lays over the shop to say where a thing stops. The chrome borrows
         it so a button and a shelf are outlined in the same colour, and the two
         must not be unified: text in the contour is too cold and a contour in
         the text brown is a border rather than a line. */
      --ink-line: #171219;
      /* The SAME line, a third as strong — `INK.CREASE_INK` is 0.39. A contour
         is where an object stops; a crease is where two faces of ONE object
         meet, and every hairline inside a card is the second thing. Full
         strength in there reads as two cards butted together, which is what a
         divider exists to say it is not. */
      --crease: rgba(23, 18, 25, .39);
      /* THE RESTING CONTOUR. `INK.FADE` is 0.29 in client/render/look.js — the
         shop's own line gets WEAKER on the things you are not up against, so a
         far shelf is drawn more lightly than the one you are standing at. The
         chrome borrowed the colour and threw that away, and a flat #171219 on
         every edge on screen at once is the difference between a drawing and a
         wireframe: nothing is nearer than anything else, so the line stops
         ranking and starts fencing.
         So a card you are not pointing at keeps its contour and does not shout
         it, and full `--ink-line` is what hover, `.on` and `.armed` step UP to.
         That is the whole of why no state in this file needs a second mark
         beside the line to say "this one" — the line itself is the state. */
      --ink-soft: rgba(23, 18, 25, .66);
      /* THE ONLY SHADOW LEFT, and it is occlusion rather than a copy of the
         shape. What was here was `2px 3px 0 var(--ink-line)` on everything down
         to a 16px badge: a solid black duplicate of the box, offset down and
         right. That is a sticker lying ON the page rather than an object drawn
         on it, and it is the single move that made a line-art HUD read as
         brutalism — the two are otherwise the same recipe, and this is the
         ingredient that decides which one you get.
         What a drawing cannot do is say a card is NEARER than the shop, which
         is a real thing these panels have to say, because they hang over a 3D
         scene rather than sitting on a page. So: short, soft, warm-dark, never
         black, and the same at every size — a shadow's length comes off how far
         a thing is lifted, not off how big it is, which is why the old pair
         scaled 2px/4px with the card and read as two different lights.
         ONLY THINGS THAT FLOAT OVER THE WORLD GET ONE. Anything standing on
         paper — a tile in the build bar, a badge on a button, a pill in a list —
         gets nothing at all, because two objects on one sheet do not cast on
         each other, and that rule is most of what "one contour per object"
         buys back. */
      --cast: 0 2px 6px rgba(23, 18, 25, .15), 0 8px 22px rgba(23, 18, 25, .09);
      --cast-sm: 0 1px 3px rgba(23, 18, 25, .16);
      /* THE BUTTON'S OWN SIDE, and it is not a shadow — which is the whole
         distinction `--cast` is on the other side of. A cast has an x-offset
         and belongs to a thing floating over the shop; this has none, sits
         directly under the face, and is the 2px of THICKNESS that makes a
         control an object you can push. The press moves the face down onto it
         (`--press`, the same number) and the side disappears, because it has
         been closed up.
         The front door has had exactly this since it was written and it is the
         one piece of feedback on that screen that never needed defending — see
         `.wacts button`. It is 3px there and 2px here because its controls are
         44px tall and the HUD's are 26 to 40: a side is read against the face
         it belongs to, so a fixed number would be a lip on one screen and a
         plinth on the other.
         There is NO transition on it, and that is a rule rather than an
         omission: a squash that eases is a lag, and what it reads as is the
         game being slow to answer. */
      /* ...and it is the CONTOUR's colour now rather than a wash of it. A side
         is a face of the object, so the line down its bottom edge is the same
         line that goes round the rest of it — 30% of the ink was a side trying
         not to be noticed, which on a warm cream face reads as a smudge rather
         than as thickness. See the ink scale below for why it is `--d2` and not
         a number. */
      --edge: 0 var(--d2) 0 var(--ink-line);
      --press: var(--d2);
      /* The same side on something under about 24px — a 16px chip with a 2px
         lip is an eighth of its own height spent on edge, which reads as a
         bevel rather than as a thing. A small button does not get its own
         `:active` rule for it: it REDEFINES `--edge` and `--press` on itself,
         so the one press rule at the foot of this file goes on being the one
         press rule. */
      --edge-sm: 0 var(--d3) 0 var(--ink-line);
      --press-sm: var(--d3);
      /* ---- THE INK SCALE ----------------------------------------------------
         THE LINE IS RANKED BY HOW BIG THE THING IS. This is `INK.FADE`'s
         argument — the shop draws a far shelf more lightly than the one you are
         standing at — said about SIZE instead of distance, and the badge rule
         further down has always made it in miniature: "1.5px of near-black round
         a 16px pill is a quarter of its area spent on edge".
         One weight on everything is what a wireframe is, and it is what the
         drawn line was brought in to escape. It escaped it by wandering, which
         cost a nib, four SVG filters, a ResizeObserver, a leak argument and a
         module — and it never actually fixed the thing it was aimed at, because
         a wobbling 1.5px round a 40px button is still a fifth of that button
         spent on outline, only now it is noisy about it. Ranked, a plain line
         does the job the wander was standing in for: the eye reads the heaviest
         edge as the outermost object and stops reading the rest as a fence.
         The SIDE ranks with it, because a side is read against the face it
         belongs to — the same reason `--edge` is 2px here and 3px on the front
         door. Pair them or a 54px tile gets a hairline outline on a plinth. */
      --k1: 2px;    --d1: 4px;   /* cards: #stats, #panel, the build bar */
      --k2: 1.5px;  --d2: 2px;   /* controls: rail buttons, palette tiles */
      --k3: 1.25px; --d3: 1px;   /* small: tabs, switches, rows, fields */
      --k4: 1px;                 /* chips: glyphs, badges — and no side at all */
      /* ONE CORNER FOR THE WHOLE UI, and the reason it is a token rather than a
         number typed in 136 places is what it replaced: fifteen different radii
         between 3 and 20px, plus 23 capsules and 8 circles, none of which was
         ever chosen against the others — each was picked for the thing it was
         on, on the day that thing was written.
         2px because the shop is boxes with hard edges: shelving, crates,
         appliances, the building itself. A 12px corner on a 40px card is a third
         of the way to a circle and reads as somebody else's app sat on top of
         the game, which is the same complaint the blurred drop shadows were.
         The contour is what says "this is a hard object" now, so the radius has
         very little left to do — and it is 0, because there is nothing left for
         it to do at all. It was 2px to stop the ink meeting itself at a point,
         which is a real problem for a 1.5px hairline drawn by a nib and is not
         one for a ranked square line: `--k1` is 2px of solid ink and a mitred
         corner in it is a corner, the same way the corner of a crate is.
         Nothing in the shop is round. The player's head and a wheel are the two
         exceptions in the entire game, and neither of them is a panel.
         A `0` corner in a directional radius stays 0: those are cards welded to
         an edge of the screen, and which corners they round is a fact about
         where they are rather than about how round anything is — that rule is
         unchanged and is now simply the only rule, since every corner is 0. */
      --r: 0px;
      --panel: rgba(255, 252, 245, 0.94);
      /* The same colour at full alpha. Anything that pins itself over scrolling
         content needs this rather than --panel: 94% over 94% is still see-
         through, and rows sliding under a "solid" header read as a fault. */
      --panel-solid: #fffcf5;
      /* And the same colour with the shop showing through it, for the two things
         that sit over the world rather than over the page: the build bar and its
         shape card. Only ever used WITH `backdrop-filter` — glass without the
         blur is a panel you read a shelf through, and the text on it stops being
         readable the moment somebody paints a dark floor under the bar. */
      --panel-glass: rgba(255, 252, 245, 0.76);
      /* The same paper, standing back. For the two corner widgets that are
         faded until you point at them: they used to drop the whole element's
         `opacity`, which was right while a card was a fill and a blur and is
         wrong now that it has a CONTOUR — #171219 at 45% is a soft grey line,
         which is the one thing an ink pass is not. So the fill recedes and the
         line does not, and the card goes on being a drawing. */
      --panel-dim: rgba(255, 252, 245, 0.55);
      --line: rgba(58, 49, 40, 0.14);
      --accent: #e2564a;
      --good: #5aa356;
      /* The step between "fine" and "you have a problem" — a gauge that only
         had the two would jump straight from green to alarm with no warning. */
      --warn: #e0a63c;
      /* ---- the bottom stack -------------------------------------------------
         Everything you press lives in one column at the bottom centre now, so
         its offsets are arithmetic off two numbers rather than a scattering of
         literals that have to be kept in step by hand. Bottom up: the nav, then
         the bar (`--build-h`, measured, 0 when no bar is up), then the panel. */
      --nav-h: 40px;
      --nav-bot: 14px;
      --nav-top: calc(var(--nav-bot) + var(--nav-h) + 8px);
      --build-h: 0px;
      /* The two put-away-able corner widgets are one column, so they are one
         width — a meter and a radio that disagreed by a few pixels would read
         as one of them being misaligned rather than as two panels. It is a var
         because the narrow query shrinks both together and the whole point of
         them being one column is that nothing can shrink half of it. */
      --corner-w: 146px;
      /* ---- HOW BIG ALL OF IT IS ---------------------------------------------
         Every length above and below this line is a literal px, and that is the
         right call — a 10.5px caption and a 40px nav button were each chosen
         against the things beside them, not as a fraction of one font size. The
         cost is that "a bit smaller" had no dial at all: it was four hundred
         edits, none of which is the decision being made.
         This is the dial. `.hud` wears it as `zoom`, which multiplies every used
         length in the subtree, so the whole HUD steps down together and not one
         proportion in this file moves. It is on `.hud` and NOT on the root
         because the canvas may not be touched — the shop is drawn at device
         pixels and picked at pointer coordinates, and a zoomed root is a
         renderer aiming at a viewport the mouse is no longer in.
         The number is a default rather than the setting: how big a HUD wants to
         be is a fact about the window it is in, so client/ui-scale.js overwrites
         this from what the person chose, and the stepper is on the View tab.
         READ THE HEADER OF THAT FILE BEFORE MEASURING ANYTHING IN JS. A zoom
         splits pixels into two spaces — rects and pointers are in the viewport's,
         `offset*` and inline `left` are in this one — and mixing them does not
         error, it drifts. */
      --ui: .85;
    }
    * { box-sizing: border-box; }
    /* The grey flash a mobile browser paints over whatever a finger just landed
       on. It is a webkit default and it is right for a page — it is the only
       feedback a link gets — and wrong for every surface in here: the canvas is
       the whole screen, so a tap anywhere in the shop tints the shop, and every
       control already answers a press with its own state (`.on`, the pressed-in
       ring, the ripple, the wind of an action ring). What it reads as is the
       screen glitching on every press, because it lands on the element the
       touch hit rather than on the thing you pressed. Inherited, so it is one
       declaration rather than one per surface. */
    html { -webkit-tap-highlight-color: transparent; }
    /* `overscroll-behavior-x` on the root is the one place that turns off the
       trackpad's swipe-back, and it has to be said here rather than on `#game`
       — where it already is, and where it does nothing, because a canvas is not
       a scroll container. The canvas was never the exposure anyway: its wheel
       handler is non-passive and calls `preventDefault`, so a two-finger swipe
       over the shop is already swallowed. What is exposed is every HUD list —
       and `wireScroll` deliberately does NOT swallow a notch at either END of a
       horizontal strip, so that the wheel goes on to whatever is behind it. The
       build bar is exactly that: flick the palette sideways, hit the end, and
       the leftover delta reaches the document as a history gesture. Which
       navigates AWAY FROM THE GAME mid-build — a whole page teardown, so what
       you get is the tab going white and then a reload, and nothing anywhere
       connects it to the strip you were scrolling. */
    html, body { margin: 0; height: 100%; overflow: hidden; overscroll-behavior-x: none; }
    body {
      /* THE LETTERFORMS HAVE THE SAME CORNERS THE CRATES DO — which is the
         whole of this line, and it was the single loudest thing in the chrome
         that disagreed with the game. `ui-rounded` / "SF Pro Rounded" / Nunito
         are the ROUNDED cuts specifically: circular bowls, soft terminals, a
         `t` with a curled foot. Every glyph on screen was drawn that way, over
         a shop made of boxes with hard edges, and no amount of squaring the
         panels fixes a HUD whose text is still apologising for them.
         `ui-sans-serif` is the neutral cut of the same system face, which is
         what `#boot` has always asked for — so this is two stacks in one client
         becoming one rather than a new dependency.
         THE NEXT STEP, IF THIS IS NOT ENOUGH CHARACTER, is a bundled `woff2`:
         Vite will hash and emit one from `client/` with no config, and it works
         offline, which the Steam and standalone builds need. It is deliberately
         not done here — a face is a licence and a download, and neither is
         needed to stop the game speaking in rounded letters. */
      font: 14px/1.45 ui-sans-serif, system-ui, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
      color: var(--ink);
      background: #cfe9f5;
      -webkit-font-smoothing: antialiased;
      /* Both spellings, for the reason `#panel-body` gives further down: these
         are not the same feature, and neither is a fallback for the other. The
         unprefixed one alone left every HUD label in the game selectable on
         WebKit — so a press and hold anywhere on the screen highlighted the
         nearest words and put a text caret in a shop. */
      user-select: none; -webkit-user-select: none;
    }
    /*
     * `touch-action: none` is not a nicety — without it the browser claims
     * every touch gesture on the canvas as a scroll or a page zoom, and takes
     * it by firing `pointercancel` a couple of events into the drag. Measured:
     * a two-finger twist arrived as 2 pointerdowns, 2 pointermoves and 2
     * pointercancels, so panning, pinch-zoom and the twist all did nothing at
     * all on a touchscreen while working perfectly under a mouse.
     *
     * `-webkit-touch-callout` is the same problem wearing iOS clothes: the
     * long press that opens a fixture's menu is also the press Safari uses to
     * offer its own callout over the element.
     */
    #game {
      display: block; width: 100vw; height: 100vh;
      touch-action: none;
      overscroll-behavior: none;
      -webkit-touch-callout: none;
      /* Said again here rather than left to `body`, because this is the element
         a drag STARTS on: every gesture in the game is a press held on the
         canvas and then moved, which is also the shape of a text selection, and
         a selection that begins here runs on across whatever HUD it reaches. */
      user-select: none; -webkit-user-select: none;
    }

    /* ---- THE EDGE: what the whole screen is doing -------------------------
     *
     * Three states, one frame. Each is a fact about the world rather than about
     * a thing in it, and each was being said by one small control at the bottom
     * or the corner of a screen you are looking at the MIDDLE of: build mode by
     * a 40px button, the shutters by a door in the readout, the pause by a
     * struck-through clock. A frame round the glass is the one mark that is in
     * view wherever you happen to be looking, which is exactly the property all
     * three of those lack.
     *
     * The colour is the whole vocabulary, so it is one variable and one shape:
     * gold you are building, grey the shop is shut, red the clock is stopped.
     *
     * PRECEDENCE IS THE ORDER OF THESE RULES, and it is deliberate: shut, then
     * paused (the clock's own note says why — a shut shop is still a shop having
     * a night, a paused one is not having anything), then building LAST, because
     * it is the only one of the three that changes what your hands do. Building
     * at night is a thing you do on purpose and the gold is the answer you need
     * while you are doing it.
     *
     * Under `.hud` (z-index 10) on purpose: this is a fact about the world below
     * the HUD, so the bar, the panel and the toast sit over it rather than
     * inside it. Behind the pointer entirely (`pointer-events: none`) — a band
     * that ate the first click near an edge of the screen would be a mode you
     * cannot build in.
     *
     * The glow is the whole of why it is not just a border: at a hairline,
     * against a canvas of grass and floorboards, a line round the edge reads as
     * the window rather than as a state. The band is 3px and the spread carries
     * it another 44px inward, which is what makes it a tint belonging to the
     * game rather than a rule drawn on the glass.
     */
    #edge {
      position: fixed; inset: 0; pointer-events: none; z-index: 9;
      opacity: 0; transition: opacity .22s;
      box-shadow: inset 0 0 0 3px var(--edge), inset 0 0 var(--edge-spread, 44px) var(--edge-glow);
    }
    /* Shut is the quiet one: it is true every single night, so it says "not
       trading" at the weight of dusk rather than of an alarm.
       QUIET IS NOT THE SAME AS FAINT, and DARK is not a colour. It was grey at
       .5, which is the two mistakes at once: too weak to see, and made of the
       one ink that reads as a shadow rather than as a state — a dark band round
       a sunlit canvas is what a vignette looks like, or a window edge, so the
       eye files it as the screen instead of as the shop. Darkening it further
       only made it a better vignette.
       So it is a COLOUR, and the colour is dusk: the other two are the accent
       and gold, and blue is the one that cannot be mistaken for either while
       saying the thing this state actually means. It keeps the stillness — the
       pulse belongs to paused, and two states wearing one animation is what
       this whole block is ordered against — and it gets reach instead, which is
       the half that reads as evening closing in rather than as a border.
       `--edge-spread` is a var so widening it here cannot widen the other two. */
    body.shut #edge {
      opacity: 1; --edge: rgba(72,102,178,.85); --edge-glow: rgba(72,102,178,.5);
      --edge-spread: 92px;
    }
    /* Held is the loud one, and it breathes on the clock's own 1.6s so the two
       marks for one state cannot fall out of step. */
    body.held #edge {
      opacity: 1; --edge: rgba(226,86,74,.9); --edge-glow: rgba(226,86,74,.26);
      animation: clockhold 1.6s ease-in-out infinite;
    }
    body.building #edge {
      opacity: 1; --edge: rgba(255,214,107,.95); --edge-glow: rgba(255,214,107,.26);
      animation: none;
    }

    /* ---- outdoors ---------------------------------------------------------
       THE GROUND THE FRONT DOOR STANDS ON, and it is one flat colour.

       It was a place: a four-step sky, a seven-band stack of land read down from
       the horizon, an ink line where the ground stopped and a sun in the corner
       — every colour of it copied out of `palette.js` and `look.js`, so that the
       door and the shop it opens onto were looking at the same countryside. All
       of that was true and it is gone, because the thing standing on it changed.
       The menu is a PANEL now (see client/menu.js): one cream card with a
       contour, which is a piece of paper. A picture of a place behind a piece of
       paper is a photograph with a sticker on it, and the card has to be the
       drawing.

       So it is `PALETTE.floor` — the shop's own floor — and the front door is
       standing on the same surface the game is. No gradient and no sun: the shop
       is cel-shaded flat, and a ramp behind a flat game is the one surface on
       screen not obeying its own rules. What is left is the one thing the old
       stack was actually for, which is that this cannot go stale against art it
       is not made of.

       A CLASS rather than `#menu`, because the loading screen wears it too. The
       two screens are consecutive views of the same place — so a change here is
       a change to both, and that is the point rather than a side effect: a
       loader on a blue sky handing over to a menu on a tan floor is a page that
       has navigated. The other half of that decision is in client/boot.js: #boot
       HIDES while #menu is up rather than sitting under it.

       The picture the sky used to be did not go far: it is the art band across
       the top of the card, where it is a shop rather than a backdrop. See
       client/frontart.js. */
    .outdoors {
      position: fixed; inset: 0; overflow: hidden;
      display: grid; place-items: center; padding: 24px 16px;
      background: #e8dac0; /* `PALETTE.floor` */
    }
    .outdoors[hidden] { display: none; }

    /* ---- the loading screen ----------------------------------------------
       See client/boot.js. A bot, a line, and a bar that does not pretend to
       know how far through it is. */
    /* CENTRED, which it was not for as long as there was a horizon to miss.
       `.outdoors` used to put a lawn across the bottom third, and a box this
       short centred straight onto the join — the bar came out sitting exactly
       on the line where the grass started, which reads as a seam through the
       middle of the screen rather than as a place. So it was pushed up by a
       third of the viewport. The ground is one flat colour now (see
       `.outdoors`), there is no line anywhere to land on, and a loading screen
       that is nudged off centre for a reason that no longer exists is just off
       centre. A guard that retires with the thing it guards is a guard nobody
       removed. */
    #boot { z-index: 50; }
    /* GOING, and the fade is the last of the loading rather than a flourish on
       it. What is underneath by the time this runs is a finished frame — the
       shop built, the first snapshot in, the camera settled (see `stepReveal`
       in client/main.js) — so a hard cut would be honest and would still land
       as a jolt: two complete, entirely different pictures on consecutive
       frames. A third of a second of one over the other is the whole of the
       difference between the shop appearing and the shop being *revealed*.
       The element is removed on `transitionend`, and `boot.js` keeps a timer
       behind that: reduced motion below takes the transition away, and a
       transition that does not run never fires the event that tidies it up. */
    #boot { transition: opacity .3s ease-out; }
    #boot.done { opacity: 0; pointer-events: none; }
    .boot-box {
      position: relative; z-index: 1;
      display: flex; flex-direction: column; align-items: center;
      width: min(300px, 100%);
    }
    /* The bot's well. Reserved at full height from the first frame even though
       it is empty — the crew is a fetch, and a stage that grew when it landed
       would jump the line and the bar down the screen at the one moment
       somebody is reading them. */
    .boot-stage { height: 168px; display: grid; place-items: center; }
    /* THE WELL THE TURNTABLE SPINS IN, and it is load-bearing rather than
       decoration: `.wk-turn` is a filmstrip `--n` faces wide that slides
       sideways, so without a clipping parent you get twenty-four robots in a
       row (see `turntable`, client/greeter.js).
       It lives HERE now, and the move is the point. It was a front-door rule —
       the bot stood over the wordmark — and the front door has no bot on it any
       more: the picture at the top of that card is the art band. So the one
       screen still spinning one is the only screen that should own the well,
       and `#boot .boot-bot` below is what it used to have to override.
       It stands ON something: a bot floating over a loading screen reads as a
       sticker, and the same soft ellipse the shop draws under everything else
       makes it a thing in the world it is standing in. */
    .menu-bot {
      height: 132px; width: 132px; overflow: hidden;
      margin: 0 auto -10px; pointer-events: none;
      filter: drop-shadow(0 10px 10px rgba(40, 60, 30, .28));
    }
    .menu-bot .wk-turn > span { padding: 0; }
    /* The size, which is bigger here because on this screen the bot is the
       whole picture. A second selector rather than a change to the rule above,
       because that one is the CLIP and this one is the frame it is seen
       through. */
    #boot .boot-bot { width: 168px; height: 168px; margin: 0; animation: boot-in .45s ease-out both; }
    @keyframes boot-in { from { opacity: 0; transform: translateY(6px); } }

    /* Same trick the title and the tagline use: it sits on the sky, so it is
       cut out of it with a cream keyline rather than laid on top of it. */
    .boot-say {
      margin-top: 4px; font-size: 15px; font-weight: 800; text-align: center;
      color: rgba(58,49,40,.72); letter-spacing: -.01em;
      -webkit-text-stroke: 4px rgba(255,252,245,.8); paint-order: stroke fill;
    }
    /* INDETERMINATE, and the comment in boot.js says why: nothing on this path
       reports progress, so a bar that filled would be a number invented to look
       reassuring. A shuttle across a track instead — it says "still going"
       without claiming to say how far. */
    .boot-bar {
      margin-top: 14px; width: 150px; height: 6px; border-radius: var(--r);
      overflow: hidden; background: rgba(58,49,40,.14);
      box-shadow: inset 0 1px 2px rgba(58,49,40,.12), 0 1px 0 rgba(255,255,255,.5);
    }
    .boot-bar i {
      display: block; width: 42%; height: 100%; border-radius: var(--r);
      background: linear-gradient(90deg, rgba(255,255,255,0), var(--accent), rgba(255,255,255,0));
      animation: boot-run 1.5s cubic-bezier(.6,0,.4,1) infinite;
    }
    /* The end stop is arithmetic, not taste: `translateX` is a percentage of
       the SHUTTLE, and the shuttle is 42% of the track — so it has left the
       right-hand end at 238%, and every percent past that is a bar with nothing
       on it. At 360% that was a third of every cycle spent empty, which reads
       as the thing having finished and then starting again. */
    @keyframes boot-run {
      from { transform: translateX(-110%); }
      to { transform: translateX(240%); }
    }
    /* Failed: the sentence is the whole message now, so the thing that was
       saying "still going" has to stop saying it. */
    #boot.failed .boot-bar { display: none; }
    /* A sentence rather than two words, so it gets the room to be one. */
    #boot.failed .boot-box { width: min(420px, 100%); }
    /* The STEPPED-DOWN red, not `--accent`, for the reason the Shop report's
       warning tiles use it: `--accent` is a *mark* colour measured against a
       panel, and at 15px on a cream keyline it comes out under the 4.5:1 a
       sentence somebody has to read owes them. The bar above may keep it —
       it is a shape rather than a word, and `aria-hidden` either way. */
    #boot.failed .boot-say { color: #a8442f; }
    /* The bar is the only motion on this screen and it is decorative. */
    @media (prefers-reduced-motion: reduce) {
      .boot-bar i { animation: none; width: 100%; opacity: .5; }
      #boot .boot-bot { animation: none; }
      /* ...and the reveal cuts. A cross-fade is motion nobody asked for, and the
         thing it is smoothing is a screen going away — which is the one case
         where an instant answer is also a perfectly good one. */
      #boot { transition: none; }
    }

    /* ---- the front door ---------------------------------------------------
       Pick a shop, or start one. See client/menu.js.

       IT IS A `#panel`, AND THAT IS THE WHOLE OF THE DESIGN.

       This screen used to be its own look, and the look was one the HUD has
       since left behind: a column of cards standing on a sky, each with a
       contour, a side and a hard offset shadow under it. Everything else in the
       game went to cream paper, one ranked contour drawn as an overlay, creases
       inside and no drop shadows — and the front door did not come with it, so
       the door onto the game was the one screen in it drawn in a different
       vocabulary. Nothing below is a new one. It is `#panel`'s rules applied to
       a screen that had been answering the same questions in its own words:

       - ONE OBJECT. The card is the drawn thing; every hairline in it is a
         `--crease`, which is what `--line` is redefined to for the whole
         subtree. A line eight pixels inside another line is two boxes rather
         than a thing on a thing, which is why the saves are ROWS now and not
         cards inside a card.
       - NO CAST. `--cast` is worth having because it says a panel is nearer
         than the SHOP, and it is the one thing a drawing cannot do. There is no
         shop behind this screen — the ground is a flat tan (see `.outdoors`) —
         so a shadow under this card is a sticker on a photograph.
       - NO DISPLAY FACE. The HUD speaks in the neutral system cut and so does
         this: `ui-sans-serif`, inherited from `body`, at the sizes below.
       - THE SIDE STAYS. `--edge` is the 3px of thickness that makes a control
         an object you can push, it has been on this screen since it was
         written, and it is the one piece of feedback here nobody has ever had
         to defend. It is not the sticker shadow: no x-offset, and the press
         moves the face down onto it.

       What the card has that no in-game panel does is the ART BAND across the
       top, which is where the sky went — a drawing of a shop rather than a
       backdrop behind a form. client/frontart.js. */
    /* The PAGE does not scroll; the list of shops does. A browser scrollbar
       down the side of a title screen is the single most web-page thing on it,
       and the game already answers this everywhere else — `wireScroll`, a drag
       with a fade at whichever end has more past it. So the box is a column
       that fits the viewport and `.menu-list` is the one part of it that gives.
       `min-height: 0` is what makes that work: a grid/flex child will not
       shrink below its content without it, so the list would grow the box and
       put the bar back on the body. */
    #menu { z-index: 60; }
    /* Over both. The box is the only thing on this screen you interact with. */
    .menu-box {
      position: relative; z-index: 1;
      display: flex; flex-direction: column; text-align: left;
      max-height: calc(100vh - 48px); max-height: calc(100dvh - 48px);
      background: var(--panel-solid);
      /* THE ONE MEASUREMENT IN HERE, and everything indents, bleeds and clears
         by it. The header, the top block and the footer pad by it; a save row
         bleeds by exactly minus it. Two numbers here would be a crease that
         stops short of the edge on one row and not the next. */
      --pad: 14px;
      /* EVERY HAIRLINE INSIDE IT IS A CREASE, which is `#panel`'s own
         declaration for its own subtree copied word for word: the card is one
         object, and the things standing in it are recesses rather than cards. */
      --line: var(--crease);
    }
    /* `min-width: 0` is not belt and braces, it is the whole of whether this
       screen fits on a phone. `.outdoors` is a grid and the box is its item, so
       the box's automatic minimum is its MIN-CONTENT — which means `width:
       min(440px, 100%)` is a ceiling and not a limit, and any row inside that
       cannot get narrower than the screen pushes the entire front door off the
       right of it: the wordmark, the buttons, all of it, with the ground ending
       where the viewport does and the box carrying on past it. It was two text
       fields side by side that did it (an `<input>` carries an intrinsic
       twenty-character width, so a pair of them ask for 395px on a 390px
       phone), and there are no fields left — but the point of putting this here
       rather than there is that the next row somebody adds must not be able to
       do the same thing. */
    .menu-box { width: min(440px, 100%); min-width: 0; }
    /* THE FRONT DOOR'S OWN SIDE, redefined for the whole subtree rather than
       typed onto each control. `--edge` is 2px at `:root` and says why in its
       own comment: a side is read against the FACE it belongs to, so a fixed
       number is a lip on one screen and a plinth on another. The HUD's controls
       are 26–40px tall and this screen's are 38–44 — so 3px here.
       Redefining the token rather than writing `0 3px 0` on each control is what
       lets the ONE press rule at the foot of this file press this screen too:
       `--press` moves the face by exactly the height of the side, so the two can
       never drift apart, and a smaller control steps both down to the small pair
       the way any control under ~24px does.
       It is on `.menu-box` and not on `#menu` deliberately — the loading screen
       shares `.outdoors` and has no controls on it at all, so a token scoped to
       the ground would be a promise about a screen that cannot keep it. */
    .menu-box { --edge: 0 3px 0 var(--ink-line); --press: 3px; }
    /* THE CONTOUR IS NOT A SHADOW ON THIS SCREEN, so `--sil` — which every
       control in the game stores its line in, and which the one press rule at
       the foot of this file drops back to — is an invisible shadow by default
       here. That keeps the press rule literally unchanged: `box-shadow:
       var(--sil), var(--edge)` still draws the side, pressing still closes it
       up, and the card's own drawn line is a pseudo-element that sits out the
       whole exchange. The controls that carry a crease set `--sil` themselves. */
    .menu-box { --sil: 0 0 0 0 transparent; }

    /* ---- the art band -----------------------------------------------------
       Full bleed, and the line under it is the card's own contour weight
       (`--k1`) because the band is an EDGE of the card rather than a thing
       inside it — the one hairline in here that is not a crease, and the header
       under it is divided by one that is. `height: auto` with a viewBox, so the
       drawing keeps its shape at both widths this card is ever drawn at. */
    .menu-art {
      display: block; flex: none; width: 100%; height: auto;
      border-bottom: var(--k1) solid var(--ink-line);
    }

    /* ---- the header -------------------------------------------------------
       THE WORDMARK STOPPED BEING A TRICK. It wore a 6px cream `text-stroke` and
       a `drop-shadow`, and both were right: it stood on a blue sky and had to be
       cut out of it. On paper it is just a word. So the keyline, the side and
       the whole printing trick go, and the tagline's with it.

       CENTRED, not baselined. The tagline wraps to two lines and the wordmark
       is one, so a shared baseline hangs the second line below the logo and the
       header reads as two things that missed each other. */
    .menu-head {
      flex: none; display: flex; align-items: center; justify-content: space-between;
      gap: 12px; padding: 13px var(--pad) 12px;
      border-bottom: 1px solid var(--line);
    }
    .menu-box h1 {
      margin: 0; font-size: 25px; font-weight: 800; letter-spacing: -.035em;
      line-height: 1; color: var(--ink-line);
    }
    .menu-box h1 span { color: var(--accent); }
    .menu-tag {
      margin: 0; text-align: right; max-width: 15ch;
      font-size: 10.5px; font-weight: 600; line-height: 1.3;
      color: rgba(58,49,40,.55);
    }

    /* ---- what you came here to do -----------------------------------------
       Starting a shop comes BEFORE the list of them, and the form takes the
       button's place rather than opening under it. Both are the same point:
       what you came here to do is at the top either way, and a list that grows
       by one every time you play does not push it further down each time.

       `position: relative` and a z-index, which is the one thing this block
       needs that is not spacing: an open dropdown hangs over the list of saves
       below it, and the list is a scroll container. */
    .menu-top {
      flex: none; position: relative; z-index: 2;
      padding: var(--pad) var(--pad) 0;
    }
    /* EQUAL AIR EITHER SIDE, and the bottom is 3px more than the top on
       purpose: a `box-shadow` side takes no layout space, so a control's visible
       bottom edge sits 3px below its own box. Matched as numbers, the gap under
       a row of buttons reads as half the gap above it. */
    .menu-row { display: flex; gap: 8px; margin-bottom: calc(var(--pad) + 3px); }
    .menu-btn {
      flex: 1; min-width: 0; border: 0; font: inherit; cursor: pointer;
      border-radius: var(--r); padding: 12px 8px;
      font-size: 13.5px; font-weight: 800; color: var(--ink);
      background: rgba(58,49,40,.09);
      /* A CREASE, AND NOT A DRAWN CONTOUR, which is rule one said about the one
         place on this screen it is easiest to break: the card these stand in is
         the drawn object, so a contour on the button is a second outline a few
         pixels inside the first. A coloured button with no line at all is the
         other failure — the one shape on a drawn screen that is only a fill —
         so it keeps a line, at the weight a hairline inside an object is
         supposed to be. */
      --sil: inset 0 0 0 1px var(--crease);
      box-shadow: var(--sil), var(--edge);
      transition: background .12s, box-shadow .12s;
    }
    html.can-hover .menu-btn:hover { background: rgba(58,49,40,.16); }
    /* THE ONE YOU MEAN TAKES THE GOLD, and it is a colour rather than a heavier
       line because of what the row is saying. New shop and Join share it two
       thirds to one, and two greys with the same black side read as ONE BAR:
       the eye joins two identical lines at the same height, the 8px gap between
       them goes unread, and the split disappears exactly where that split is
       the whole message. `#ffd66b` is `.tab.on`'s — the one colour in this
       chrome that has ever meant "this one" — and it is the only warm-side
       colour the palette has that a cream card does not swallow.
       ITS SIDE IS A DARKER CUT OF ITS OWN FACE, which is the rule the old Play
       button already stated: a side belongs to the face above it, so two
       different colours at one height cannot merge into a bar. As an `--edge`
       override rather than a `box-shadow` of its own, so the one press rule at
       the foot of the file still closes it up. */
    .menu-btn.go {
      flex: 2; color: var(--ink-line); background: #ffd66b;
      --sil: inset 0 0 0 var(--k2) var(--ink-line);
      --edge: 0 3px 0 #b8912f;
    }
    html.can-hover .menu-btn.go:hover { background: #ffe08a; }

    /* ---- the new-shop form ------------------------------------------------
       THREE DECISIONS, ONE ROW. Nine buttons became three, and what you read
       across the form is the shop you are about to get — "Corner shop, Normal,
       Countryside" — rather than nine options of which six are off. Dropping
       the labels is what stops the row wrapping at 392px, and it costs nothing:
       the words say what they are. */
    .menu-drops { display: flex; gap: 5px; }
    .drop { position: relative; flex: 1; min-width: 0; }
    .dbtn {
      width: 100%; display: flex; align-items: center; gap: 5px;
      padding: 7px 6px 7px 9px; text-align: left;
      border: 0; font: inherit; cursor: pointer; border-radius: var(--r);
      background: rgba(58,49,40,.09); color: var(--ink-line);
      font-size: 12.5px; font-weight: 800;
      --sil: inset 0 0 0 1px var(--crease);
      /* THE MIDDLE PAIR off the ink scale, not this screen's 3px: at 30px a 3px
         side is a tenth of the control's own height spent on edge, which reads
         as a bevel. `--press` moves with it or the face stops a pixel short of
         its own edge. */
      --edge: 0 var(--d2) 0 var(--ink-line); --press: var(--d2);
      box-shadow: var(--sil), var(--edge);
      transition: background .12s, box-shadow .12s;
    }
    html.can-hover .dbtn:hover { background: rgba(58,49,40,.16); }
    .dbtn .lab { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    /* THE INDICATOR IS A PART OF THE BUTTON, not a glyph in the text: a well
       sunk into the face with a solid triangle in it, which is the same "a
       control is an object you can push" the side says, at the size of a chip. */
    .caret {
      flex: none; width: 15px; height: 15px; display: grid; place-items: center;
      color: var(--ink-line); background: var(--panel-solid);
      box-shadow: inset 0 0 0 1px var(--crease);
      transition: transform .12s;
    }
    .caret svg { display: block; }
    .drop.open .dbtn {
      background: #ffd66b;
      --sil: inset 0 0 0 var(--k2) var(--ink-line);
      --edge: 0 var(--d2) 0 #b8912f;
    }
    .drop.open .caret { transform: rotate(180deg); }
    /* The list is a card in its own right — a second object rather than a
       region of this one — so it is the one thing inside `.menu-box` that gets
       a full contour rather than a crease.
       WIDER THAN THE BUTTON IT HANGS OFF, because the whole reason these are
       dropdowns is that an option can carry its own blurb, and a third of a
       440px card is not a width you can read a sentence in. The last one opens
       to the right or it hangs off the edge of the card. */
    /* THE RING IS OUTSET AND NOT INSET, which is the bug this rule shipped
       with. An inset `box-shadow` is painted with the element's BACKGROUND, so
       anything inside it that runs full width paints straight over it — and
       every row in here does, because the lit one is a fill: the gold option
       bled across the contour on both sides and the card appeared to have a
       hole in it. That is "WHO IS INKED"'s own note about `#panel`, arriving on
       the one card in the game that cannot use its answer: an `::after` overlay
       is positioned against the padding box, and this thing SCROLLS, so the
       ring would slide up with the options. A ring drawn outside the border box
       is under nothing at all. */
    .dlist {
      position: absolute; left: 0; top: calc(100% + 5px); z-index: 3;
      min-width: 100%; width: 216px;
      max-height: min(320px, 52vh); overflow-y: auto; scrollbar-width: none;
      background: var(--panel-solid);
      box-shadow: 0 0 0 var(--k1) var(--ink-line);
      display: none;
    }
    .dlist::-webkit-scrollbar { display: none; }
    .drop:last-child .dlist { left: auto; right: 0; }
    .drop.open .dlist { display: block; }
    .dopt {
      display: block; width: 100%; text-align: left; padding: 8px 9px;
      border: 0; border-top: 1px solid var(--line); background: none;
      font: inherit; cursor: pointer; color: var(--ink);
    }
    .dopt:first-child { border-top: 0; }
    html.can-hover .dopt:hover { background: rgba(58,49,40,.09); }
    .dopt.on { background: #ffd66b; }
    .dopt b { display: block; font-size: 12.5px; font-weight: 800; color: var(--ink-line); }
    /* What the option actually MEANS, off the table's own blurb. This is the
       thing a row of nine buttons had nowhere to put — it went on a `title`,
       which is a sentence nobody on a phone has ever read. */
    .dopt i {
      font-style: normal; display: block; margin-top: 2px;
      font-size: 10.5px; font-weight: 600; line-height: 1.35;
      color: rgba(58,49,40,.6);
    }
    .dopt.on i { color: rgba(58,49,40,.72); }

    /* WHAT YOU OPEN WITH, as the things themselves. Two paragraphs used to sit
       here — the four counts spelled out, and then a sentence saying the same in
       shop words — and a form that opens with three paragraphs of prose is a
       page of notes rather than a thing you press. The art says the counts, and
       says them better: every tile is drawn from the catalog row the shop draws
       its own fixtures from. See `kitTiles` in client/menu.js.
       THE MONEY IS THE FIRST CHIP rather than a row of its own underneath,
       because what a size hands you is money and then things, in that order. */
    .kit { margin: 11px 0 calc(var(--pad) + 3px); }
    .kitrow { display: flex; gap: 5px; }
    /* THE TILE IS THE BUILD PALETTE'S OWN, which is where these same pictures
       are seen an hour later: `#fffcf5`, a crease, and the art standing on it.
       It was `rgba(58,49,40,.09)` like every other quiet chip in here, and that
       is a warm GREY — where a freezer, a till and a grow rack are pale steel
       and pale blue, so most of the row was grey on grey and the shapes went.
       Nothing about the art can be changed to fix it: these are the shop's own
       pieces drawn through `artForPiece`, at the colours the shop draws them,
       which is the whole point of them being here. So the ground moves instead,
       and paper is what `.tool` already decided that ground is. */
    .kitem {
      flex: 1; min-width: 0; display: flex; flex-direction: column;
      align-items: center; gap: 3px; padding: 7px 2px 6px;
      border-radius: var(--r); background: var(--panel-solid);
      box-shadow: inset 0 0 0 1px var(--crease), 0 1px 0 var(--ink-line);
    }
    .kmoney { border: 0; font: inherit; cursor: pointer; touch-action: manipulation; user-select: none; }
    .kmoney:hover, .kmoney:focus-visible { background: #fff5d7; }
    .kmoney:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    /* No well round the art. The tile IS the slot now that it has a crease box
       of its own — which inverts what the palette does and is the right way
       round both times: a `.tool` has a contour, so its art needs no frame; a
       row of bare pictures on a card needs the thing that gives it a grid. */
    .kart { width: 100%; height: 30px; display: grid; place-items: center; }
    .kart svg { width: 100%; height: 100%; display: block; }
    /* One line, and it may not wrap: five tiles across 412px is about 78px
       each, and "×1 freezer" breaking in two is the row growing a line as you
       change size. */
    .kitem > span {
      max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      font-size: 10px; font-weight: 800; letter-spacing: .01em; color: var(--ink);
      font-variant-numeric: tabular-nums;
    }
    .kitem em { font-style: normal; font-weight: 600; color: rgba(58,49,40,.55); }
    .kmoney b {
      display: block; height: 30px; line-height: 30px;
      font-size: 15px; font-weight: 800; color: var(--accent);
      letter-spacing: -.03em; font-variant-numeric: tabular-nums;
    }

    /* ---- the saves --------------------------------------------------------
       ROWS separated by creases, not cards on a card — see the doctrine at the
       top of this section. */
    .menu-list {
      flex: 1; min-height: 0; overflow-y: auto; scrollbar-width: none;
      padding: 0 var(--pad) var(--pad);
    }
    .menu-list::-webkit-scrollbar { display: none; }
    .menu-empty {
      font-size: 12px; opacity: .55; text-align: center;
      padding: 10px 4px 4px; line-height: 1.45;
    }
    /* A CREASE GOES WALL TO WALL. Inset by the list's own padding it is a line
       drawn ON the card rather than the card being divided, so it reads as a
       stray rule — and the panel already has the answer: `.tabs`, `.dwrap` and
       `.heads` bleed by a negative `margin-inline` of exactly the padding, and
       put it back inside themselves.
       THE WIDTH HAS TO BE SAID, and it has to include the bleed: `width: 100%`
       is wrong the other way round, because a declared width is not widened by
       a negative margin — the box stays the container's width and just shifts
       left, hanging off one edge and falling short of the other. The container
       plus both margins is the only spelling that is the bleed.
       And it lands on the WRAPPER rather than on the button, which is the other
       half of the same trap: a `<button>` shrink-wraps to its contents whatever
       its `display`, so a row left to itself is as wide as its own longest line
       and the crease above it stops somewhere different on every save. */
    .shop-row {
      position: relative;
      width: calc(100% + var(--pad) * 2);
      margin-inline: calc(-1 * var(--pad));
      border-top: 1px solid var(--line);
      transition: background .1s;
    }
    .shop-row:first-child { border-top: 0; }
    /* The shop you were in last, so a family of four save slots opens on yours.
       The warm paper carries the whole claim — there is no line on a row to
       step up, which is what makes this the one state here that IS a fill. */
    .shop-row.last { background: linear-gradient(#fffdf6, #fff6df); }
    html.can-hover .shop-row:hover { background: #f7f0e2; }
    /* Armed to delete. The row itself changes and not just the ✕, because a
       list of five rows is scanned by shape — a single glyph going red inside
       one of them is exactly the thing a mis-click already wasn't reading. */
    .shop-row.arm, html.can-hover .shop-row.arm:hover { background: rgba(226,86,74,.10); }
    /* THE ROW IS THE BUTTON. Play was a slab per save — eight of them down a
       list, all identical, all saying the thing the row already says. Pressing
       the row plays it, and Delete is a ✕ that only turns up when you are on
       the row, which is `.fx-clear`'s rule about a bin standing next to a
       button you press all the time. */
    .shop {
      --row: 76px;
      display: flex; gap: 12px; align-items: flex-start; width: 100%;
      padding: 12px var(--pad); text-align: left;
      border: 0; background: none; font: inherit; color: inherit; cursor: pointer;
    }
    .shop .th {
      flex: none; position: relative; width: var(--row); height: var(--row);
      overflow: hidden;
    }
    /* An OVERLAY, for the reason `.dlist` gives one line up and `#panel` gives
       at length: the Open band below runs full bleed across the foot of this
       box, so an inset ring on the box itself is painted out along that whole
       edge. This one does not scroll, so it gets the answer the panels get. */
    .shop .th::after {
      content: ''; position: absolute; inset: 0; pointer-events: none;
      box-shadow: inset 0 0 0 var(--k2) var(--ink-line);
    }
    .shop .th svg { display: block; width: 100%; height: 100%; }
    /* OPEN IS A BAND ACROSS THE FOOT OF THE PICTURE. Beside the name it was a
       second object on the one line that should only ever hold one thing — and
       because it is there on some saves and not others, everything after it
       started at a different x on every row. Down here it is on the only
       surface in the row that is always the same size, it cannot push anything,
       and green goes back to being a mark on art rather than a chip arguing
       with the three below it. */
    .shop .live {
      position: absolute; left: 0; right: 0; bottom: 0; padding: 2px 0;
      text-align: center; font-size: 8.5px; font-weight: 800;
      letter-spacing: .1em; text-transform: uppercase;
      color: var(--panel-solid); background: #4b8a47;
      border-top: var(--k2) solid var(--ink-line);
    }
    /* ONE HEIGHT, DECLARED ONCE. The row was three things that each ended
       wherever their own content ran out: a picture, a text block of whatever
       three lines came to, and a chip row under it. Three ragged bottom edges
       per row, eight rows, and nothing lining up with anything. So the picture
       and the column are BOTH `--row` tall, and the column distributes its three
       lines into that height rather than stacking them and hoping. Change the
       number in one place and the row stays square. */
    .shop .col {
      flex: 1; min-width: 0; height: var(--row);
      display: flex; flex-direction: column; justify-content: space-between;
    }
    /* Clear of the corner `.when` and the ✕ share — both are out of flow, so
       nothing else is going to hold this line's end open for them. */
    .shop .nm {
      font-size: 16.5px; font-weight: 800; line-height: 1; letter-spacing: -.01em;
      color: var(--ink-line); padding-right: 94px;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    /* THE MONEY IS THE HERO. Day, cash, season, staff and the date were five
       facts at one size, so the row had no first thing to read. */
    .shop .cash {
      font-size: 20px; font-weight: 800; line-height: 1; letter-spacing: -.03em;
      color: var(--ink-line); font-variant-numeric: tabular-nums;
    }
    .shop .cash em {
      font-style: normal; font-size: 12px; font-weight: 600; letter-spacing: 0;
      margin-left: 8px; color: rgba(58,49,40,.55);
    }
    /* WHAT YOU PICKED, which is the only thing that tells one save from another
       before you open it — every one of them is called `Shop N`.
       A CHIP IS 18px TALL AND NEVER WRAPS, so the row's third line is exactly
       one line: a wrapping chip row is what makes one save 20px taller than the
       next. And there is NO OUTLINE on them — a line is what says a thing can
       be pushed, and the only pressable thing in this row is the row. */
    .tags { display: flex; gap: 5px; overflow: hidden; }
    .tg {
      display: inline-flex; align-items: center; gap: 4px; flex: none;
      height: 18px; padding: 0 6px; min-width: 0;
      font-size: 10.5px; font-weight: 700; line-height: 1; color: var(--ink);
      background: rgba(58,49,40,.10); white-space: nowrap;
      overflow: hidden; text-overflow: ellipsis;
    }
    .tg svg { display: block; flex: none; opacity: .7; }
    /* Hard is the one worth spotting from across a list, so it is the one that
       takes a colour — and it is the STEPPED-DOWN red rather than `--accent`,
       for the reason the Shop report's warning tiles use it: `--accent` is a
       mark colour measured against a panel, and 10.5px of it on a tint is under
       the contrast a word somebody has to read owes them. */
    .tg.hard { color: #a8442f; background: rgba(200,85,61,.15); }
    .tg.hard svg { opacity: .95; }
    /* The warning takes the chips' own grid cell, so the row is exactly as tall
       armed as not. See `.wswap` below, and `Menu.remove` for why growing it
       under the cursor is the thing this exists to stop. */
    .shop .warn {
      font-size: 11px; line-height: 18px; font-weight: 700; color: var(--accent);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }

    /* WHEN AND THE ✕ SHARE ONE ANCHOR, and it is the row's own top-right corner
       rather than the end of whatever text happens to precede them. In flow
       they were pushed along by the name and the badge, so "just now" and "61
       min ago" sat at two different x on two rows of one list. Absolute, same
       coordinates, one fading out as the other fades in — so nothing moves and
       nothing reflows.
       WITH NO HOVER THEY CANNOT SHARE IT, because neither of them ever fades:
       on a touchscreen the ✕ is the only way to delete a shop at all, so it is
       visible from the start and the date stands to the left of it. */
    .shop-row .when, .shop-row .x { position: absolute; top: 12px; }
    .shop-row .when {
      right: calc(var(--pad) + 22px);
      font-size: 11px; font-weight: 600; line-height: 16px;
      color: rgba(58,49,40,.42); white-space: nowrap; pointer-events: none;
      transition: opacity .12s;
    }
    .shop-row .x {
      right: var(--pad);
      width: 16px; height: 16px; display: grid; place-items: center;
      border: 0; background: none; font: inherit; cursor: pointer;
      font-size: 15px; line-height: 1; color: var(--ink); opacity: .45;
      transition: opacity .12s, color .12s;
    }
    html.can-hover .shop-row .when { right: var(--pad); }
    html.can-hover .shop-row .x { opacity: 0; }
    html.can-hover .shop-row:hover .when { opacity: 0; }
    html.can-hover .shop-row:hover .x { opacity: .45; }
    html.can-hover .shop-row .x:hover { opacity: 1; color: var(--accent); }
    .shop-row.arm .x, html.can-hover .shop-row.arm .x { opacity: 1; color: var(--accent); }

    /* Two things that take it in turns, stacked in one grid cell so the cell is
       always as big as the biggest of them and swapping which one shows moves
       nothing. Arming a delete used to insert a warning and relabel a button,
       which grew the card, pushed every card under it down and widened the row
       — under a cursor that is one press from playing the shop, on a screen
       where the latch also expires by itself and puts it all back four seconds
       later. Both halves of a swap are in the DOM at rest; the resting one is
       child 1. `visibility` rather than `opacity`, so a screen reader reads one
       label. */
    .wswap { display: grid; }
    .wswap > * { grid-area: 1 / 1; }
    .wswap > :nth-child(2) { visibility: hidden; }
    .wswap.on > :nth-child(1) { visibility: hidden; }
    .wswap.on > :nth-child(2) { visibility: visible; }

    /* A CONTOUR AND NOT A CREASE would be wrong here now: this stands inside
       the card, so it is a recess in one object and not a second object. What
       it keeps is the fill, because "the shop in your link is gone" is news you
       have to be able to find. */
    .menu-err {
      border-radius: var(--r); padding: 7px 10px;
      font-size: 12.5px; font-weight: 700;
      background: var(--accent); color: #fff;
      box-shadow: inset 0 0 0 1px var(--crease);
      margin-bottom: 10px;
    }
    .menu-err.soft { background: #ffd66b; color: var(--ink); }

    /* ---- the two controls that are not about choosing a shop ---------------
       Both were pinned to the SCREEN — the tip jar bottom-left, the mute
       bottom-right — so they sat out on the ground with nothing under them,
       which is what made them read as leftovers. They are a footer of the card
       now, above one crease, which costs the list nothing: that was the whole
       reason they were moved out of the column in the first place.

       NEITHER GETS A BUTTON FACE. No fill, no line, no side, half opacity until
       you point at one — which is `#panel-close`'s treatment, the panel's own
       answer for a control that is not part of the job. As tiles they were two
       more objects competing with the thing somebody actually came here for, at
       the bottom of the card where the eye lands last.

       AND OPACITY IS THE RIGHT MARK HERE, which it is nowhere else on this
       screen: fading a drawn control fades its CONTOUR, because `opacity` is
       applied to the element's whole rendering — the trap `--panel-dim` exists
       to keep out of. These two have no line to fade, which is exactly what
       makes them the one case it is honest for. */
    .menu-under {
      flex: none; display: flex; align-items: center; justify-content: space-between;
      gap: 10px; padding: 10px var(--pad) 11px;
      border-top: 1px solid var(--line);
    }
    /* The tip jar. `inline-flex` keeps the hit area on the words: a BLOCK link
       is clickable across the dead space either side of it, which on a footer
       is a stray tap that leaves the game with an unsaved shop behind it. */
    .menu-support {
      display: inline-flex; align-items: center; gap: 7px;
      font-size: 11.5px; font-weight: 700; color: var(--ink);
      text-decoration: none; cursor: pointer;
      opacity: .5; transition: opacity .12s;
    }
    html.can-hover .menu-support:hover { opacity: 1; }
    .menu-busy { font-size: 11px; opacity: .5; }
    .menu-mute {
      display: grid; place-items: center; padding: 2px;
      border: 0; background: none; font: inherit; cursor: pointer;
      font-size: 15px; line-height: 1; color: var(--ink);
      opacity: .5; transition: opacity .12s;
    }
    html.can-hover .menu-mute:hover { opacity: 1; }
    .menu-support svg, .menu-mute svg { display: block; flex: none; }

    /* ...and the class every piece of chrome already carries is the one place
       the size dial can be spent. `zoom` and not `transform: scale()`: a
       transform draws a box at a size other than the one it was laid out at, so
       every rect anything reads back is a lie about where the thing is — and
       `#panel` is already spending its own transform on being centred. Zoom is
       a LAYOUT change, which is what "smaller HUD" means: the panel is narrower,
       so the list inside it wraps as a narrower list, rather than being a
       photograph of the wide one shrunk down.
       Verified rather than assumed, because the one thing a zoom could plausibly
       break here is the anchoring: `left: 50%` still lands on the middle of the
       screen and `right: 12px` still measures from the right-hand edge, so the
       nav stays centred and the corners stay in their corners at every step. */
    .hud { position: fixed; z-index: 10; zoom: var(--ui); }

    /* CINEMA — see client/cinema.js. Everything the game puts in front of the
       shop already carries `.hud`, so this is the whole of it: one selector,
       and a widget added tomorrow is covered on the day it exists.

       `display: none` rather than an opacity or a visibility, deliberately.
       The panel is a scroll container and the rail is a column of buttons, and
       either left in the layout at zero opacity is still swallowing every
       pointer event over a third of the screen — which is a recording session
       where the shop cannot be clicked and nothing anywhere says why. */
    body.cinema .hud { display: none !important; }

    /* The two bars, which are the only thing this ADDS. 2.39:1 across a 16:9
       window is about 8% off the top and the bottom, and they are `vh` so the
       crop is the same shape whatever the window is. Fixed, above everything,
       and inert: a bar you could click would be a strip of dead screen along
       the two edges the toolbar and the meters live on, which is exactly where
       the hand goes the moment the recording stops. */
    body.cinema::before, body.cinema::after {
      content: ''; position: fixed; left: 0; right: 0;
      height: 8vh; background: #000; z-index: 900; pointer-events: none;
    }
    body.cinema::before { top: 0; }

    /* ...and the bottom one says the way out, because it has to. This mode
       hides the panel the switch that turned it on lives on, so the key is the
       only way back and the letterbox is the only thing left on screen to
       print it. It fades rather than staying, on the same argument the shutter
       hint makes: it is there for the first few seconds, which is the only
       time anybody needs telling. */
    body.cinema::after {
      bottom: 0;
      content: 'C brings the HUD back';
      font: 600 12px/8vh ui-sans-serif, system-ui, sans-serif;
      letter-spacing: .08em; text-align: center;
      color: rgba(255,255,255,.5);
      animation: cine-hint 5s ease forwards;
    }
    @keyframes cine-hint {
      0%, 55% { color: rgba(255,255,255,.5); }
      100% { color: transparent; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No fade rather than an instant one: the words are the way out of a mode
         with nothing else on screen, so the safe failure is that they stay. */
      body.cinema::after { animation: none; }
    }

    /* Icons are inline SVG sized in em, so every font-size rule that used to
       size an emoji still sizes the icon. `display:block` because an inline
       SVG sits on the text baseline and drags a gap under every button. */
    .ico > svg, .bico > svg, #panel-close > svg { display: block; margin: 0 auto; }
    /* The title's icon is a PREFIX, not a glyph in a box, so it is the one that
       must not take `margin: 0 auto`. On a flex item an auto margin eats all the
       free space either side of it — and `#panel-title` is `flex: 1`, so that is
       most of the header: the icon settled in the middle and the name was shoved
       hard against the close button, which reads as a right-aligned title. It
       was wrong at every width and only looked survivable in a narrow panel in
       the corner of a big screen. */
    #panel-title > svg { display: block; margin: 0; }

    /* ---- top left: the passive readouts, stacked --------------------------
       One fixed column rather than two independently-pinned panels. The demand
       meter used to carry `top: 58px`, which is the height #stats happened to be
       on the day it was written — adding a row to the gauges slid the money
       panel down over it. Nothing up here has a fixed height, so nothing up here
       gets to hardcode where the next thing starts, and the cashflow readout
       going into #stats is exactly the change that would have broken it. */
    #topleft {
      top: 12px; left: 12px;
      display: flex; flex-direction: column; align-items: flex-start; gap: 8px;
    }
    /* top-left: money + day
       Sized down about a fifth from where it started, and the reason is what it
       is competing with rather than anything wrong with it: this is a readout
       you glance at, pinned over the one thing in the game you are actually
       looking at. Everything in here scales together — type, bars, sparkline,
       padding — because a panel where only some of it shrank reads as a panel
       with a mistake in it. */
    /* One line, and the spacing is a rule rather than a per-cell guess: groups
       are separated by a divider, and inside the date/money block a grid owns
       every gap there is (`.rows` below).
       The old row was five cells of five heights held apart by whatever margin
       each happened to carry, which is what put a hole between the balance and
       the clock. */
    #stats {
      position: relative;
      background: var(--panel); border-radius: var(--r);
      padding: 5px 10px;
      /* Only the cast is here — `#sign` runs full bleed down the left edge and
         would paint an inset line out along its whole height, so the contour is
         the `::after` overlay under "WHO IS INKED", for the reason it gives. */
      box-shadow: var(--cast-sm);
      display: flex; gap: 10px; align-items: center;
      /* THE CARD CLIPS ITS OWN CORNERS, which is what lets the sign be an EDGE
         of it rather than an object sitting inside it. `#sign` cancels the
         padding on three sides with negative margins and runs full bleed down
         the left; without this the strip would square off the two left corners
         and the panel would stop reading as a card. Clipping is the only way to
         round a child against a parent's radius — a matching radius on the
         child is the same number written twice, and they drift.
         Nothing in here overflows on purpose: every child is a flow-layout cell,
         and the one thing that used to poke out (the sign's cord, and the
         overhang that replaced it) went years ago — see `#doorway`. The one
         thing this DOES clip is an outline, which is why the focus ring below
         is drawn inset. */
      overflow: hidden;
      /* THE READOUTS OWN THE HEIGHT, AND THE FLOOR IS ONLY THERE FOR THE WORD.
         This was 58px, and 58 was never a decision about this card: `#doorway`
         was a fixed 48px plaque, so the sign was the tallest thing in the row
         and the card measured whatever a piece of lettering plus the padding
         came to. The strip that replaced it is sized BY the card, so the number
         was kept as a floor to stop the HUD quietly shrinking as a side effect
         of restyling a button — which was the right call at the time and leaves
         a card carrying about ten pixels of slack above and below two rows of
         type, on the one panel that is pinned over the thing you are looking at.
         The rows come to roughly 37px and the padding to 10, so the card now
         sits a shade under 48 and every pixel of that is a number.
         What the floor is for is the OTHER thing 58 was holding up, and it is
         the invariant `#doorway` names: four upright letters run about 40px at
         8px type, and a card shorter than they are crops the sign — which reads
         as the word being wrong rather than as the card being small. 46 is that
         claim written down. It does nothing today, deliberately: it is the thing
         that fails loudly if the type in this panel ever comes down, instead of
         a remembered height that also happened to keep the sign whole.
         The 640px bar below drops it to 0, because a full-width bar across the
         top of a phone genuinely should take its height from its contents — and
         it can afford to, because every figure in it is scaled up about a tenth,
         which puts its rows well clear of the word on their own. */
      min-height: 46px;
    }
    /* THE CONTOUR IS AN OVERLAY, and that is the ONE thing worth keeping from
       the drawn version — every other part of it has gone.

       It cannot be the host's own `box-shadow`, and each of the three cards
       makes the point differently. `#stats` clips and `#sign` runs full bleed
       down its left edge, so an inset ring is painted out along the whole of
       that side. `#panel`'s header, tabs and heads bleed full width, so a ring
       on the box is covered for 90px and the card appears to have a hole in it.
       `#build-bar`'s strip does the same on a smaller scale. A positioned
       pseudo-element paints AFTER its host's children, which is the whole
       answer, and it costs no element, no observer and no module.

       WHAT DID GO is the old `client/ink-edge.js` — an `<svg><rect>` per card pushed
       through `feTurbulence`, plus four filters, a nib table, a shared
       `ResizeObserver`, a scope object and a leak argument, so that the line
       would wander the way a nib does. The premise was right: one flat weight
       on every edge on screen is a wireframe rather than a drawing, because
       nothing ranks and the line stops describing objects and starts fencing
       them. The conclusion was the expensive way round. What makes a line rank
       is that it is HEAVIER ON BIGGER THINGS — see the ink scale in `:root` —
       and a wobble does not rank anything, it only makes an unranked line
       harder to read as a mistake. Ranked, this is four numbers.

       `--sil-w` and `--sil-stroke` are unchanged in name and meaning: they are
       still where a state moves the line, which is why hover, focus and `.on`
       still need no second mark beside it. */
    /* WHO IS INKED. This was six calls in a boot pass and six selectors in a
       method on `Menu`, and it is the same list — a thing is inked when it is an
       OBJECT IN ITS OWN RIGHT, floating over the world or standing on the sky.
       Anything inside one of these is a crease (`--crease`) and never a second
       contour, because a line eight pixels inside another line is two boxes
       rather than a thing on a thing.
       The z-indexes are the ones the drawn version passed per host, kept
       because they are answers about each host's own stacking rather than
       about ink. */
    /* ONLY #build-bar IS GIVEN A POSITION, and the eleven that are not is the
       whole of what there is to get wrong here.

       An `::after` needs its host to be a containing block, so the obvious
       move is `position: relative` on the list — and it is a disaster, because
       an ID beats the class the host is positioned BY. `#panel` is
       `class="hud"`, which is `position: fixed`; `.menu-support` is fixed to
       the bottom-left corner. Both were dropped into flow the moment this rule
       named them, and what that looks like is a menu opening off the bottom of
       the screen — a positioning bug with no positioning in the diff.

       Every other host on the list already carries a position of its own for
       reasons that predate ink, and ANY positioned value makes a containing
       block, so relative was never needed on one of them. `#build-bar` is the
       single static one.

       The rule for the next host added to the contour list: check what it is
       positioned by before naming it here, and if it has anything at all, do
       not name it. */
    #build-bar { position: relative; }

    /* The front door is ONE of these now and used to be six: a card per save, a
       card for the form, and four controls standing on the sky. It is a single
       panel, so it is a single contour — see the doctrine at the top of that
       section, and note that this is the whole of what "make the front door a
       `#panel`" cost the ink. */
    #stats::after, #build-bar::after, #panel::after, #rci::after, #radio::after,
    #build-shapes::after, .menu-box::after {
      content: ""; position: absolute; inset: 0;
      pointer-events: none; border-radius: inherit;
      box-shadow: inset 0 0 0 var(--sil-w, var(--k1)) var(--sil-stroke, var(--ink-line));
      transition: box-shadow .12s ease;
    }
    @media (prefers-reduced-motion: reduce) {
      #stats::after, #build-bar::after, #panel::after, #rci::after, #radio::after,
      #build-shapes::after, .menu-box::after { transition: none; }
    }
    #stats::after { z-index: 2; }
    #rci::after, #radio::after { z-index: 2; }
    #build-bar::after { z-index: 4; }
    #panel::after { z-index: 5; }
    #build-shapes::after { z-index: 6; }
    /* Over the art band and the rows, and under an open dropdown — which is the
       one thing on this screen that IS allowed outside the card. */
    .menu-box::after { z-index: 2; }
    /* NOTHING IN HERE SHRINKS. The card is a fixed readout in a corner, not a
       column of a page, and flex's default is to shrink an item that does not
       fit — so the widest cell (the rate: a number, an arrow and a 56px
       sparkline) was squeezed until its own contents wrapped, which put the
