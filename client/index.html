       arrow on one line and the balance on the next with the bars hanging off
       the end. There is no width to compete for here: the panel is as wide as
       what is in it. */
    #stats > * { flex: 0 0 auto; }

    /* ---- top centre: what to do about it ---------------------------------
       A single line, sized to clear the stats panel on the left and the rail on
       the right. A stack cost vertical space in the middle of the screen, which
       is the one place the game is actually happening. */
    /* IT IS ANCHORED PAST THE READOUTS, NOT CENTRED AND TRIMMED.

       This was `left: 50%` with `max-width: min(860px, calc(100vw - 360px))`,
       and the 360 was clearance for the stats card — the width #stats HAPPENED
       to be on the day it was written, halved onto each side. That is precisely
       the trap the note above #topleft describes, said about the other axis:
       nothing up here has a fixed size, so nothing up here gets to hardcode
       where the next thing starts. #stats has grown a sparkline, a town readout
       and three gauges since, so on a wide screen there is slack and nothing
       shows, and on a narrower one the chips sit straight on top of the gauges.
       The bug arrives on somebody else's monitor rather than on yours, which is
       why it lasted.

       Being a SUBTRACTION made it worse in the other direction, and the 240px
       floor that used to be in this rule is the scar: `100vw - 360px` goes to
       nothing on a narrow window and negative on a zoomed one, so the row was
       capped at a chip squeezed to one letter — a red sliver with no words on
       it, which reads as a stray button rather than as the shop saying it is
       shut, and that chip is the first thing a new world ever says. The floor
       bought a readable chip by accepting the overlap.

       Anchoring removes the trade rather than picking a side of it. There is no
       subtraction left to go negative: the row starts after the left-hand column
       and ends at the right edge, so it is always at least the whole of the free
       space, and it wraps rather than shrinks when three chips will not fit.

       `--hq-left` is the measured right edge of #topleft — see `UI.watchTopLeft`.
       #topleft and not #stats, because the column also holds the demand meter
       and the radio, and a wrapped second row of chips reaches down past them.

       IT STAYS ON THE SCREEN'S CENTRE, and gives that up last. Anchoring the
       box at `--hq-left` and centring inside it was tried first and is wrong for
       a reason no arithmetic shows: this row reads as the middle of the HUD, so
       centring it in the free space parks it visibly off-centre on a wide
       monitor — which is a thing everybody sees, to fix a thing only a narrow
       one has.

       So the padding is SYMMETRIC. Equal padding on a full-width box leaves the
       content centred on the viewport exactly as `left: 50%` did, while making
       it impossible for that content to begin before `--hq-left`. Centring and
       clearance stop being a choice, because one is now a consequence of the
       other — which is the whole trick here and the reason nothing has to be
       measured twice.

       The right-hand side is what gives when there is genuinely not enough
       room. Symmetric padding spends the clearance TWICE, so on a small window
       the inner strip closes to nothing — the sliver bug again, wearing the
       fix's clothes. The `clamp` spends it twice while that is affordable and
       walks the right-hand side back toward 12px when it is not: full symmetry
       and true centre wherever it fits, drifting right only as far as it must,
       and never once starting before the card. 320px is the width it protects,
       which is about one chip. Under that the chips simply wrap, and a chip
       wider than the strip overflows to the RIGHT, where there is nothing to
       overlap — the asymmetry of the two edges is the point: left is the bug,
       right is only untidy. */
    #hq {
      top: 12px; left: 0; right: 0;
      padding-left: var(--hq-left, 12px);
      padding-right: clamp(12px, calc(100vw - var(--hq-left, 12px) - 320px), var(--hq-left, 12px));
      display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
      justify-content: center; pointer-events: none;
    }
    /* ---- nothing in this row may move sideways ---------------------------
       Every cell here holds a number that changes while you watch it, and they
       sit in one flex row — so a digit that is a pixel wider than the last one
       slides the clock, the buttons and the gauges along with it. It reads as
       the HUD being unable to keep still.
       Two rules, and both are needed. Tabular numerals stop a `4` being
       narrower than a `0`, which is the per-tick jitter; a floor on the width
       stops the *number of digits* changing anything, which is the jolt you
       get crossing $10,000 or Day 100. Sized to what a shop plausibly reaches
       rather than to today's value, since a floor that today's value already
       exceeds is a floor that does nothing. */
    /* ---- A GROUP IS A LINE ------------------------------------------------
       WHAT IS BESIDE WHAT IS THE WHOLE DESIGN, and the card is small — so the
       groups are the two ROWS, and each row is read straight across:

         Day 122   00:26    Summer
         $32,906   $0.00 ▼  ▁▃█▅

       Both wrong shapes this went through are worth keeping written down,
       because they are the two obvious ones. Five cells in a row, each a
       two-line stack, is what a "column per number" gets you: whatever sits
       under a thing reads as belonging to it, so the date captioned the balance
       and the clock captioned a week of trading. Putting every group on one
       long line fixes that and makes the panel as wide as the screen, which for
       a corner readout is worse than what it fixed.

       Two rows, one subject each, is both: nothing stacks *across* subjects,
       and the card stays about 250px. What is above what still matters — but
       now the thing above the money is the date AND the hour, which is a row
       about when, not a caption on a number.

       A divider rather than a wider gap between the rows and what is beside
       them, because a gap is ambiguous by nature: "which side of this space
       does that belong to" is a question the eye answers by proximity, which is
       what put the clock with the money in the first place. */
    /* ONE GRID, SO THE TWO ROWS SHARE THEIR COLUMNS.
       They were two flex rows spread with `space-between`, which fills the width
       and lines nothing up: each row divides its own slack among its own items,
       so where the clock falls depends on how long "Day 122" is and where the
       sparkline falls depends on how many digits are in the balance. Two rows
       of three things each, none of them over the other — which is the "hard to
       read" and it is not a spacing problem, it is the absence of a column.
       Two columns, both rows in them: day over balance, hour over the day's
       take. Widths are `auto`, so a column is as wide as the wider of its two
       cells and neither row can push the other about.

       There were THREE, and the third held the season over the week's shape.
       Both were consultations rather than readings and both are gone; the
       column went with them, because a grid column is as wide as its widest
       cell and an absent cell is not a narrower one — left at three, the card
       would end in 56px of nothing. `#flow` is still `display: contents`
       (below) even though it is now one cell: it has to be, or the money row
       would be a single wrapper cell against the date row's two and the second
       column would mean nothing. */
    .rows {
      display: grid; grid-template-columns: auto auto;
      column-gap: 12px; row-gap: 1px; align-items: center;
    }
    /* Dividers only where a SUBJECT changes. Named rather than "every child
       after the first", because the door is not a group — it is the sign for
       the whole card, standing down the left of both rows the way it used to
       stand down the edge of the panel. */
    /* CREASE WEIGHT, NOT THE CONTOUR. Both of these are rules INSIDE one card,
       and `INK.CREASE_INK` is 0.39 of the outer line for exactly this reason:
       a full-strength line inside a contoured card reads as two cards butted
       together, which is the one thing a divider is there to say it is not. */
    #town, .gauges { border-left: 1px solid var(--crease); padding-left: 12px; }
    /* ...and the sign stands down the left of BOTH rows, which is what it is:
       one fact about the whole shop rather than a field in either line. It was
       a 5px stripe in exactly this position — quiet, which was the point, and a
       colour with no glyph on it can only ever say "some state changed", never
       which one. The door says which one, and being the full height of the card
       it is a target you can hit rather than 13px of its edge.

       IT IS THE LEFT EDGE OF THE CARD NOW, not a plaque standing near it.
       Three things that buys, and the last is the one that matters. The plaque
       was a coloured rectangle inside a coloured rectangle, inset by the card's
       own padding on every side — two nested boxes with 5px of cream between
       them, which reads as a badge that has been dropped on the readout rather
       than as part of it. It was also about 15px of a 34px column, so the strip
       of card either side of it was space that belonged to nothing: the button
       looked small and the gap looked like a mistake. And the target: a control
       that runs the full height and the full width of the column is one nobody
       has to aim at, where the plaque was a small object in a big space and the
       cream around it was dead to the pointer.
       The negative margins are the card's own padding, cancelled on the three
       sides it meets — so a change to `#stats`'s padding has to be made here
       too, in both places (the 640px bar sets its own). Clipped to the card's
       radius by `overflow: hidden` up there rather than rounded to match it. */
    #sign {
      align-self: stretch; display: flex;
      align-items: center; justify-content: center;
      border: 0; font: inherit; cursor: pointer;
      /* Top, right, bottom, left: eat 5px of padding above and below, meet the
         left edge, and leave the flex `gap` to hold the readouts off. */
      margin: -5px 0 -5px -10px; padding: 0; border-radius: 0;
      /* A number, and one of the few in this card that is a decision rather
         than a measurement: wide enough that the upright word has air either
         side of it, narrow enough that it stays a margin of the readout rather
         than a column of it. */
      flex: 0 0 34px; width: 34px;
      color: #fff; background: var(--good);
      /* The strip is an EDGE of the card rather than an object on it, so the
         line where it meets the readouts is a crease and not a second contour —
         the same call `#town`'s divider makes, and the reason the card's own
         outline only ever runs round the outside. */
      box-shadow: inset -1px 0 0 var(--crease);
      transition: background .15s, filter .12s;
    }
    /* Presses in rather than down, the same as the clock beside it — but on the
       colour rather than under it: the strip IS the fill now, so a translucent
       wash over it (what this was) would be a second colour mixed into the one
       thing on the card whose colour is the state. Brightness keeps the state
       the state and says "pressed" on top of it. */
    html.can-hover #sign:hover { filter: brightness(1.08); }
    #sign:active { filter: brightness(.92); }
    /* The floors stay where the jitter is — the date (which grows a digit at Day
       100) and the balance — and they are per GROUP now, since a group is the
       cell. See the note above about nothing in this row moving sideways. */
    /* Wider than it was, and for the same reason it was 50: the floor is
       measured off the widest the group ever gets, and the group grew a weekday
       in front of the count. Left at 50 it would stop being a floor at all —
       every date is wider than that now — and the digit Day 100 adds would go
       back to shoving the hour along. */
    #when { min-width: 68px; }
    #cash { min-width: 62px; }
    /* Lit while trading, and a shut door dropped to the weight of a caption —
       being shut is already said twice over (the clock is struck through and #hq
       puts up a hot chip naming the key), so this is the glance rather than the
       announcement. */
    /* It is the sign in a shop door, and it says so in words.
       A door glyph was the wrong instrument for the same reason the clock's
       missing play triangle was: it can only say "a state changed", and reading
       WHICH state out of it needs you to have seen the other one. An open/closed
       sign is the one object in a shop whose entire job is being read from the
       pavement by somebody who has never been in — so it carries the word, and
       there is nothing left to learn.
       The strip's width is a fixed 34px and the word does not set it, which is
       the card's own rule — nothing in it moves sideways — said about the one
       cell whose contents change on a press. A sign sized by its word would
       slide the day, the balance and the clock along every time you worked the
       shutters, which is why OPEN and SHUT are both four letters as well. */
    /* It hangs DOWN the card rather than across it, and that is the shape of the
       hole rather than a preference: `#sign` is `align-self: stretch` and stands
       to the left of both rows, so what it has is height. A horizontal plaque
       spends 44px of a row that is otherwise five numbers, to say one word; a
       vertical one costs about 15px and reads the same. It is also what the
       object is — the sign in a shop door hangs on a cord, and a hanging sign is
       taller than it is wide.
       `text-orientation: upright` and not a rotation: rotated words are read by
       tilting your head, and stacked upright letters are what is actually
       painted on one of these. */
    /* IT IS THE WORD AND NOT THE PLAQUE ANY MORE. Everything that made this a
       little card of its own — the fill, the radius, the inset ring, the fixed
       height — belonged to an object standing ON the readout. The object is the
       strip now, so all of that moved up to `#sign` (one of them, the height,
       simply died: see below), and what is left here is the lettering.
       Which is also the whole of what a sign in a door is: a coloured board
       with a word painted on it. Two boards, one inside the other, was the old
       shape's cost rather than its design. */
    #doorway {
      display: block; position: relative;
      writing-mode: vertical-rl; text-orientation: upright;
      /* NO HEIGHT AT ALL, which is the one property this element lost rather
         than handed upwards, and it is worth knowing why it ever had one. It
         was `48px` — a fixed number, because `#sign` is `align-self: stretch`
         and therefore has no definite height for a percentage to resolve
         against: `100%` resolved against the fixed full-screen overlay the card
         sits in instead, and drew a plaque a thousand pixels tall with the
         whole readout stretched down beside it. That number then had a second
         job nobody asked it to do — it was SETTING how tall the card was, which
         is what the 640px branch below had to undo on a phone.
         The strip takes its height from the card and the word is centred in it
         by `#sign`, so both problems are gone: nothing here is sized, and
         nothing here can size anything else. What has to stay true is that the
         word FITS — four upright letters run about 40px at this size, against a
         card interior that has never been under 48. That is the thing to check
         if the type in this panel ever comes down.
         Both words are four letters (OPEN / SHUT) on purpose, so the sign is
         the same object in both states. */
      text-align: center;
      /* Up from 6.5px: that was type sized for a 15px plaque, and it is 34px of
         card now. Still small — it is a label on a readout, not a heading — and
         white on `--good` at 800 weight clears its contrast either way. */
      font-size: 8px; font-weight: 800; line-height: 1;
      letter-spacing: .12em; text-transform: uppercase;
      transition: color .15s;
    }
    /* The cord it hung from is gone. It was five pixels meant to say "this is a
       card hooked on a door", and it only ever said that while the plaque was an
       outline — against a filled one it stops reading as a cord and starts
       reading as a stray line above the sign, which is what a 1.5px mark with
       nothing attached to it looks like. The overhang says the same thing
       without drawing anything. */
    /* Focus is for the keyboard, not for the mouse. A press on this leaves the
       button focused, and the browser's default ring then sits round the plaque
       for as long as you play — a permanent blue outline on one HUD control,
       which reads as the sign being stuck in some state. `:focus-visible` is the
       whole fix: it is the browser's own answer to "did they arrive here by
       keyboard", so tabbing still shows a ring and clicking never does. */
    #sign:focus { outline: none; }
    /* INSET, and that is `overflow: hidden` on the card rather than taste: an
       outline is drawn OUTSIDE the border box, so a positive offset on a child
       that meets three edges of a clipping parent is a ring with three of its
       sides cut off — which reads as a rendering fault rather than as focus.
       A negative offset draws it inside the strip, where nothing clips it. */
    #sign:focus-visible { outline: 2px solid #fff; outline-offset: -4px; }
    /* Shut is the other side of the same card: turned round, so it loses its
       colour and keeps its shape. Outlined rather than filled, which is the
       quiet the old dimmed door was reaching for — being shut is said twice more
       (the hour is struck through, #hq puts up a hot chip), so this is the
       glance rather than the announcement. */
    /* Shut is the other side of the same card: same strip, same word, the other
       colour. Filled rather than outlined, which is what keeps the two states one
       object rather than a sign and a ghost of a sign — and it matters more now
       that the sign is an edge of the panel: an outlined state would be a hole
       in the card, where a filled one is the card wearing a different colour.
       `#a8442f` and NOT `--accent`. That variable is a MARK colour, measured
       against the panel on a 10px bar — white on it is about 3.3:1, and this is
       8px type, which is the size that needs contrast most. The stepped-down
       red is the one the heat pills already use for exactly this reason, and it
       clears 4.5:1 against white. The trap is a later tidy-up that "unifies"
       this back onto the variable: it looks like removing a magic number and is
       losing a contrast pass. See the note in CLAUDE.md about the Shop report.
       It is on `#sign` rather than on `#doorway` because the colour is the
       STRIP now — put on the word it would paint a 34px-tall red rectangle in
       the middle of a green edge, which is the nested-boxes look this step
       exists to get rid of. */
    #sign.shut { background: #a8442f; }
    /* ...and once, for the shop that has never been opened.
       Being shut is said three ways already — this door dims, the clock is
       struck through, #hq puts up a hot chip — and every one of them is a mark
       you have to have seen the other state to read. That is fine for a shop you
       just closed and not fine on a world's first morning, where an empty floor
       is equally a shop nobody has walked into yet: three new worlds got played
       for a while with the shutters down. So the door ASKS, once, and stops for
       ever the first time the shutters are worked either way — see `shutterUsed`
       in ui.js. A prompt that came back would be a prompt you learn to skip.

       IT IS `asking` AND NOT `nudge`, AND THAT IS NOT A PREFERENCE. `.nudge` is
       already the build strip's round scroll arrow (see it below), and that rule
       is a BARE CLASS on a stylesheet every element in the game shares — so
       spelling this state `nudge` handed the sign `position: absolute`,
       `top: 50%`, a z-index and a 22px round chip. `#sign` sets no `position` of
       its own, so nothing competed: the door stopped being a cell of the card,
       resolved against the nearest positioned ancestor (`#topleft`, which is
       `.hud` and fixed), and landed halfway down the column — on top of the
       demand meter, wearing the arrow's shadow.
       It is invisible in every shop but a new one: the class is only on while
       the shutters are down AND nobody has ever worked them, so the one player
       who sees it is the one who has never seen where the button belongs. The
       trap is the name rather than the rule — a state class on an id-scoped
       selector reads as private and is not. */
    /* It pulses the STRIP's own colour rather than washing a tint over it, for
       the reason the hover does: this element's colour is the state, so the ask
       has to be something done TO that colour rather than a second one laid on
       top. It is only ever seen shut, so what breathes is the red. */
    #sign.asking { animation: signAsk 1.6s ease-in-out infinite; }
    @keyframes signAsk {
      0%, 100% { filter: brightness(1); }
      50% { filter: brightness(1.42); }
    }
    @media (prefers-reduced-motion: reduce) {
      #sign.asking { animation: none; filter: brightness(1.28); }
    }
    #when { display: flex; align-items: baseline; gap: 5px; line-height: 1.2; }
    #cash {
      font-size: 14px; font-weight: 800; letter-spacing: -.02em;
      font-variant-numeric: tabular-nums; line-height: 1.15;
    }
    #dow, #day { font-weight: 700; font-size: 9.5px; opacity: .75; }
    /* The weekday is the word and the count is the reference, so the dot is
       inside the count rather than between two equals: "Sat · Day 62" is one
       date read left to right, where two spans either side of a separator is
       two readouts that happen to be next to each other. It is a pseudo-element
       so the day number stays a bare string — `#when` is written every snapshot
       and the count is the half of it that changes. */
    #day::before { content: '·'; opacity: .55; margin-right: 4px; }
    /* ---- the clock, which IS the pause button ----------------------------
       The time was a readout for as long as opening was something the clock did
       to you. It is a control now: whether time runs at all is a decision you
       make while looking at the hour, so it lives on the hour rather than
       beside it.
       Two round pips used to sit here, and what they cost was about 45px of a
       row that is otherwise five numbers — to say what this element was already
       saying twice over, struck through for shut and accent-and-blinking for
       held. So what went is the pair of CONTROLS, not the pair of states: both
       states still read exactly as they did, and pressing the thing wearing one
       is the way out of it.
       Nothing about that is discoverable from a glyph, which is fine, because
       neither was a play triangle: the words were in `title` before and they
       still are, and the shutters have a hot chip in #hq naming the key. */
    /* It is the last word of the WHEN group — "Day 117 · Spring · 4:07pm", one
       sentence about when it is, read straight across. It used to be two cells
       further along, past the balance and the sparkline, and then (worse) above
       them: an hour captioning a week of takings. */
    #clock {
      border: 0; padding: 1px 3px; background: none; cursor: pointer; margin: 0 -3px;
      color: inherit; font: inherit;
      font-variant-numeric: tabular-nums; font-weight: 700; font-size: 11px;
      border-radius: var(--r); transition: background .12s;
      display: inline-flex; align-items: center; gap: 3px;
    }
    /* ...and the glyph, which the note above argued this button did not need.
       It was right about what a triangle TEACHES — nobody learns what a control
       does from one — and that is a different claim from what a triangle SAYS,
       which is whether the thing is running. The states it points at both hold:
       struck through for shut, accent-and-breathing for held. What neither of
       them is, is a shape you can read at a glance across a room, and stopped
       time is the one state where being wrong about it means the shop is not
       playing while you watch it. Media convention, so it names the press
       rather than the state: bars while it runs, a triangle while it does not.
       It sits AFTER the hour, which is the one thing about it that is about the
       row rather than about the button: the hour is a figure in a line of
       figures, and a glyph in front of it indents the time by its own width, so
       the number stops lining up with the date over it and the takings under
       it. Reading order says the same thing — the time, and then what is being
       done to it. */
    #clock-pp {
      display: inline-flex; width: 9px; height: 9px; opacity: .7;
      /* Never shrinks or reflows the row: the hour beside it is tabular for the
         same reason, and a glyph that changed width would nudge the season and
         the balance along on every press. */
      flex: 0 0 auto;
    }
    #clock-pp svg { width: 100%; height: 100%; display: block; }
    #clock.paused #clock-pp { opacity: 1; }
    html.can-hover #clock:hover { background: rgba(58,49,40,.11); }
    /* Presses in rather than down: this one is a piece of text, and a piece of
       text that jumps a pixel reads as the HUD twitching. */
    #clock:active { background: rgba(58,49,40,.2); }
    /* The strike is on the HOUR and not on the button, now that the button is a
       flex container with a glyph in it: text-decoration does not reliably reach
       across flex items, and a struck-through play triangle is not what was
       being asked for anyway — what is shut is the trading, which is a fact
       about the time. */
    #clock.shut { opacity: .4; }
    #clock.shut #clock-t { text-decoration: line-through; }
    /* Paused outranks shut, because it is the bigger claim: a shut shop is still
       a shop having a night, and a paused one is not having anything. */
    #clock.paused {
      opacity: 1; color: var(--accent);
      animation: clockhold 1.6s ease-in-out infinite;
    }
    #clock.paused #clock-t { text-decoration: none; }
    @keyframes clockhold { 0%, 100% { opacity: 1; } 50% { opacity: .35; } }

    /* ---- the town ---------------------------------------------------------
       How many people are in reach of the shop. `catchment` has been on the
       wire since the shop had customers and was never drawn anywhere, so the
       one term shopkeeping cannot restock its way out of was also the one
       number nobody could see — which made growing it (parking, charm, a better
       address, and now milestones) a purchase with no readout on the other end.

       Quiet on purpose: it is a ceiling rather than a takings, so it sits at the
       weight of a caption rather than competing with the money. `tabular-nums`
       earns its place twice over now that the town is banked daily rather than
       stepped by the occasional purchase — it moves most mornings, and a digit
       that changes width would shuffle the icon beside it every time.

       TWO CEILINGS, and the old readout drew one number against the wrong one.
       "9 / 51" put the headcount over the TOWN, which is not a capacity and can
       never be reached — nobody has ever had fifty-one people in a corner shop
       — so the fraction read as a shop that was 18% full when it might have been
       turning people away. What the near number is out of is what the building
       holds (`shopCapacity`), and the town is a second fact underneath it: how
       many could come at all, and what share of them your reputation brings in
       (`pull`). Three numbers, in the order the sentence goes.

       The word TOWN went with it. It was there because "3 / 50" of what is not
       obvious from a pair of numbers — but the icon says people, and the caption
       was naming the smaller half of what this now shows. */
    #town {
      display: flex; flex-direction: column; align-items: flex-start; gap: 1px;
      font-size: 11px; font-weight: 700; opacity: .55;
      font-variant-numeric: tabular-nums;
    }
    #town .tn { display: flex; align-items: baseline; gap: 4px; }
    #town .ico { font-size: 13px; display: block; align-self: center; }
    /* The ceiling, at the weight of a unit rather than of a number: "3" is what
       you are reading and "/50" is what it is out of, and drawn at the same
       weight the pair reads as a fraction you have to work out. */
    #town .of { font-size: 8.5px; font-weight: 700; opacity: .6; margin-left: -1px; }
    /* The town, under the shop. Caption weight because it is the slow half — it
       moves a handful of times in a game, where the line above it moves every
       minute — and flush left, not indented to the numbers above: an indent
       reserves the icon's column on a row the icon is not on, which draws as a
       glyph rowspanning two lines and a hole under it. The icon belongs to its
       own row. */
    #town .tw {
      font-size: 8px; font-weight: 700; opacity: .62;
      white-space: nowrap;
    }
    #town .tw:empty { display: none; }
    /* `.cap` lived here — the caption family shared with `.gg-tag`. Its one user
       was the word TOWN, and the icon says it now. */

    /* ---- the shutters -----------------------------------------------------
       An open sign belongs on the door, not in a toolbar — which is why this
       has never been a labelled button in a row of them, and why it is now a
       door drawn on the readout you are already looking at (`#sign` above).
       The two shapes it wore before were both about being quiet: an 18px pip
       that said what pressing it would DO, then a 5px stripe down the card's
       edge that said what was TRUE. The stripe is the better half of that and
       still could not say WHICH state — a colour with no glyph on it means "not
       the other one", and you have to have seen the other one.
       What the door adds is that it is legible cold, and what the block adds is
       the target: the sign and the thing you press to work it are the same
       object now, and it is the size of the card rather than 13px of its edge. */

    /* ---- cashflow: the rate, beside the balance -------------------------------
       Cash on hand was the only money on screen, and a balance is not a rate —
       you can watch it climb all week while every single day loses money against
       the wages. This is today's net and an arrow against yesterday: the number
       you want most, then the comparison. Tabular numerals because it changes
       ten times a second and proportional digits make it jitter sideways as it
       does. The week's SHAPE used to be here too, as a sparkline in a third
       column; the Shop report draws the same seven days at four times the size
       and with labels on it, which is where a trend is actually read. */
    /* THERE IS NO `min-width` HERE, and it is worth saying so, because the bug
       it was written for is the one this cell keeps having. It was a floor for
       the same reason `#cash` has one — this is the fastest changing number on
       screen — and it had to be kept equal to the sparkline's width by hand,
       since a floor of 70 over a 38px widget is 32px of empty column that all
       pools on one side: what you see is the clock adrift, half a panel away
       from the readout it is nearest, and neither the floor nor the widget is
       wrong. The grid retired both halves: a column is exactly as wide as the
       wider of the two things in it, which is the floor, computed, for every
       cell in the card at once. */
    /* `contents`, not a box: the day's take is a CELL of the card's grid (see
       `.rows`), under the clock — and a wrapper round it would be a cell holding
       a cell, which is exactly the alignment this card kept failing to have. It
       held two cells while the week's shape was beside it, and the reason it is
       still `contents` with one child is that the money row would otherwise have
       one cell to the date row's two. */
    #flow { display: contents; }
    .flow {
      display: inline-flex; align-items: baseline; gap: 3px;
      flex: 0 0 auto; white-space: nowrap;
      font-variant-numeric: tabular-nums; font-size: 10.5px; font-weight: 800;
      letter-spacing: -.01em;
    }
    .flow.up { color: var(--good); }
    .flow.down { color: var(--accent); }
    /* The arrow says which way against *yesterday*, which is a different
       question from whether today is in profit — a better-than-yesterday day can
       still be a loss. So it is coloured on its own and never inherits. */
    .flow i { font-style: normal; font-size: 7.5px; }
    .flow i.up { color: var(--good); }
    .flow i.down { color: var(--accent); }
    .flow i.flat { color: var(--ink); opacity: .35; }
    /* ---- the three gauges -------------------------------------------------
       Reputation is the shop's long memory, mood is how the room feels right
       now, and full is whether there is room for anybody else. One was an
       unlabelled 52px sliver, which is fine when it is the only bar on screen
       and unreadable the moment there are three — so they get names.

       All three fill rightwards and all three are read the same way: **a long
       bar is the shop doing well.** That is why FULL is drawn against the
       turn-away line rather than against capacity. A bar that filled as the
       shop got busier would mean "good" at one end of the panel and "bad" at
       the other, and the eye does not re-read a direction per row. */
    .gauges { display: grid; gap: 2px; }
    .gg { display: grid; grid-template-columns: 22px 42px; align-items: center; gap: 5px; }
    .gg-tag {
      font-size: 6.5px; font-weight: 800; letter-spacing: .04em;
      text-transform: uppercase; opacity: .5; text-align: right;
    }
    /* 5px AND A 1px LINE, and the two numbers are one decision. Inked at the
       card's own 1.5px there is a single pixel of fill left in a 4px bar, which
       stops being a gauge and becomes a dash — so the track grew a pixel and
       the line came down one. That is `INK.FADE` said about a small object: the
       pass draws a distant thing with a thinner stroke, and a 42x5 gauge is the
       smallest thing on this panel. The track's own fill goes with it — an
       outlined box does not also need a grey wash inside it. */
    /* 2px, the same as `.mtr-bar` under it — the two are the only bars in this
       column and a capsule beside a rectangle reads as two different readouts.
       A 99px radius on a 5px track is a capsule, which is the one shape in here
       that could not survive the corner coming off everything else. */
    .repwrap { width: 42px; height: 5px; background: transparent; border-radius: var(--r); overflow: hidden;
      box-shadow: inset 0 0 0 1px rgba(23, 18, 25, .5); }
    .repwrap > div { height: 100%; background: var(--good); transition: width .4s, background .4s; }
    /* Past the line the shop is refusing people, which is not a shade of busy —
       it is a different thing happening, so it stops being a bar and pulses. */
    #full.shut { animation: fullpulse 1.1s ease-in-out infinite; }
    @keyframes fullpulse { 50% { opacity: .35; } }

    /* ---- top left, under the money: the demand meter ----------------------
       An RCI meter, and built like one: a fixed set of channels in a fixed
       order, on screen whether or not anything is happening.

       It used to draw the active world-event modifiers folded per tag, which
       looks like this and was a different thing entirely — the rows were
       whichever tags the world director had written about, so they appeared and
       expired under you, mixed departments with moods (PANTRY next to TRENDY),
       and a week with no events drew nothing at all. You cannot learn to read a
       panel whose rows move; the only shape it ever had was "some things are
       happening". Now the twelve departments are always all there, always in
       `DEPARTMENTS` order, and only the lengths change.

       Right is "they asked and you were short", left is "this space is not
       earning". A department with nothing to say draws no bar — see DEADBAND in
       client/hud-meters.js for why a stub on every row is worse than a gap.

       It stacks under #stats because it is a passive readout and belongs with
       the other passive readouts, and because a column can carry its labels
       inline — a row of columns has to write each name sideways-on under a
       narrow bar, and "beverage" does not fit under nine pixels. */
    /* Faded until you want it, because it is the one readout up here that is
       always saying something. Twelve rows of live bars over the shop floor is
       a lot of ink for a thing you consult rather than watch, and the corner it
       sits in is where the farm is. Full strength the moment you point at it —
       so it costs a glance to read and nothing to ignore.

       It is also draggable (see `wireDrag` in client/ui.js): it is its own
       handle, hence `cursor: grab`. Dragging pins it with an inline
       `position: fixed`, and double-clicking gives it back to this column —
       which is why nothing here hardcodes a `top`. See the note above #topleft
       for what happened the last time anything up here did. */
    #rci {
      position: relative;
      width: var(--corner-w);
      background: var(--panel-dim); border-radius: var(--r); padding: 7px 10px;
      box-shadow: var(--cast-sm);
      transition: background .12s ease;
      cursor: grab; touch-action: none;
    }
    /* The rows are a child rather than the panel's own children, because the
       close button is a child too and `ui.update` rewrites the meter from
       `innerHTML` ten times a second — anything sharing that element with the
       bars lives about a tenth of a second. See client/corner.js.

       It is also what carries the fade now (see `--panel-dim`): the widget's
       own `opacity` was the whole of it and could not be, since that took the
       contour with it. */
    #rci-rows { display: flex; flex-direction: column; gap: 2px; opacity: .62; transition: opacity .12s ease; }
    /* `:active` as well as `:hover`, because a drag captures the pointer and can
       take it outside the element — without it the meter fades out from under
       you halfway through moving it, which reads as having dropped it. */
    html.can-hover #rci:hover, html.can-hover #rci:active { background: var(--panel); }
    html.can-hover #rci:hover #rci-rows, html.can-hover #rci:active #rci-rows { opacity: 1; }

    /* ---- putting a corner readout away ------------------------------------
       Both of these are always on screen and neither is urgent, so both can be
       closed and both come back from the Menu — see client/corner.js for why
       the way back may not be on the thing you closed.

       One class rather than a rule per widget, and `!important` because #rci
       sets its own `display` at an id's specificity: a widget you put away must
       not come back the next time somebody edits the rule above. */
    .corner-off { display: none !important; }
    /* A chip on the corner rather than a button inside it. The meter is twelve
       rows on a fixed pitch and the radio is a screen with four buttons under
       it — neither has a spare line, and hanging it off the edge means adding
       one costs no layout at all. Hidden until you point at the widget, which
       is the same moment the widget itself comes up to full strength: it is a
       control for a thing you are already looking at. */
    .corner-x {
      position: absolute; top: -6px; right: -6px;
      /* ABOVE THE WIDGET'S OWN CONTOUR, which is a real z-index rather than a
         tidy one. The line round `#rci` and `#radio` is a drawn stroke on an
         overlay now (the `::after` contour, z-index 2) where it used to be an inset
         shadow on the element — and an inset shadow paints under its children
         while an overlay paints over them. So the widget's edge was being drawn
         straight THROUGH this chip, which reads as the button being broken
         rather than as two things in the wrong order.
         Over is also the right answer on its own terms: the chip is stuck on
         the OUTSIDE of the corner, so the card's line passes behind it the way
         it would behind anything sitting on top of the card. */
      z-index: 3;
      /* 20px AND A 12px MARK, where it was 17 and 9. `ICONS.close` is drawn at
         `width: 1em`, so the glyph is whatever `font-size` says — and a 9px ✕
         with 4px of air on every side of it is a smudge on a pale chip rather
         than a cross, which is exactly what it read as. The mark wants to be
         most of the button; the button is the target. */
      width: 20px; height: 20px; padding: 0; border: 0; border-radius: var(--r);
      display: grid; place-items: center;
      background: var(--panel); color: var(--ink);
      /* ...and its own line, or it is the one object left on either widget that
         is a fill with no edge — which at 17px on a pale card is a smudge. The
         small nib, for the reason `--edge-sm` gives. */
      --sil: inset 0 0 0 1px var(--crease);
      --edge: var(--edge-sm); --press: var(--press-sm);
      box-shadow: var(--sil), var(--edge), var(--cast-sm);
      font-size: 12px; line-height: 0; cursor: pointer;
      opacity: 0; transition: opacity .12s ease, background .1s ease;
    }
    .corner-x:active { transform: translateY(var(--press)); box-shadow: var(--sil); }
    /* Focus as well, or the button is unreachable by keyboard — it is invisible
       until a pointer is over it, and a pointer is not the only way in. */
    /* FULL STRENGTH, not 75%. The wash was there when this appeared over a
       widget you might only be passing across; it appears on hover, which means
       by the time it is on screen you are already pointing at the thing it
       belongs to — and three quarters of an opacity on a 20px chip takes the
       contour with it, so the one thing that says "button" goes grey at exactly
       the moment somebody is trying to read it. */
    html.can-hover #rci:hover .corner-x, #rci:active .corner-x,
    html.can-hover #radio:hover .corner-x, #radio:active .corner-x,
    .corner-x:focus-visible { opacity: 1; }
    html.can-hover .corner-x:hover { opacity: 1; background: var(--accent, #7a9a5b); color: #fff; }

    /* ---- the shop radio ---------------------------------------------------
       A player rather than a row in a menu, because the thing it is for is
       *changing your mind about the music*, and a control you have to open a
       panel to reach is one you use once and then stop noticing.

       Sized and pinned like #rci, and draggable the same way, so the top-left
       column stays one column. It dims when idle for the same reason that one
       does: it is a readout you glance at, sitting over the thing you are
       actually looking at. */
    #radio {
      position: relative;
      width: var(--corner-w);
      background: var(--panel-dim); border-radius: var(--r); padding: 7px 8px 6px;
      box-shadow: var(--cast-sm);
      transition: background .12s ease;
      cursor: grab; touch-action: none;
    }
    /* The same split #rci makes: the fill stands back, the contour does not.
       Both children rather than the element, because the element is what the
       line is drawn on. */
    #lcd, #lcdbtns { opacity: .62; transition: opacity .12s ease; }
    html.can-hover #radio:hover, html.can-hover #radio:active { background: var(--panel); }
    html.can-hover #radio:hover #lcd, html.can-hover #radio:active #lcd,
    html.can-hover #radio:hover #lcdbtns, html.can-hover #radio:active #lcdbtns { opacity: 1; }
    #radio:active { cursor: grabbing; }
    /* The screen. Dark, inset and slightly green — a little LCD, which is the
       one place in this HUD allowed to look like hardware rather than paper. */
    #lcd {
      background: #24301f; border-radius: var(--r); overflow: hidden;
      /* The well STAYS, and it is the one soft edge left in this HUD. It is a
         recess rather than a drop shadow — the thing it says is that the screen
         is set into the case, which is a fact about the object and not a way of
         lifting it off the paper. The contour goes on top of it, because a dark
         rectangle on a cream card needs the line more than anything else up
         here does. */
      box-shadow: inset 0 1px 3px rgba(0,0,0,.5), inset 0 0 0 1.5px var(--ink-line);
      padding: 3px 0; margin-bottom: 4px;
    }
    #lcdtrack {
      display: flex; gap: 34px; width: max-content;
      animation: lcdroll 13s linear infinite;
    }
    /* Two copies of the text, scrolled by exactly half the track's width, so
       the second one is where the first was when the loop restarts. One copy
       would leave a gap the width of the screen on every pass; a percentage of
       the *track* rather than of the screen is what makes it seamless at any
       title length. */
    #lcdtrack span {
      font: 700 9.5px ui-monospace, "SF Mono", Menlo, monospace;
      letter-spacing: .08em; text-transform: uppercase;
      color: #9ede7a; text-shadow: 0 0 5px rgba(158,222,122,.45);
      white-space: nowrap;
    }
    @keyframes lcdroll { to { transform: translateX(calc(-50% - 17px)); } }
    /* Stopped: the screen holds still, so a paused radio is legible rather than
       a title sliding past forever. */
    #radio.off #lcdtrack { animation-play-state: paused; }
    #radio.off #lcdtrack span { color: #6a8459; text-shadow: none; }

    #lcdbtns { display: flex; gap: 4px; }
    #lcdbtns button {
      flex: 1; border: 0; border-radius: var(--r); padding: 2px 0;
      background: rgba(58,49,40,.09); color: var(--ink);
      font-size: 8.5px; letter-spacing: .04em; cursor: pointer;
      transition: background .1s ease;
    }
    html.can-hover #lcdbtns button:hover { background: rgba(58,49,40,.19); }
    #lcdbtns button:active { background: rgba(58,49,40,.29); }
    /* Repeat is a state, not an action, so it stays lit while it is on — the
       same call `.picked` makes on a palette button. Without it the only way to
       know is to wait and see whether the track changes. */
    #lcdbtns button.on {
      background: var(--accent, #7a9a5b); color: #fff;
    }
    #rci:active { cursor: grabbing; }
    .mtr { display: grid; grid-template-columns: 1fr 56px; align-items: center; gap: 7px; }
    .mtr-tag {
      font-size: 8.5px; font-weight: 800; letter-spacing: .02em;
      text-transform: uppercase; opacity: .55; text-align: right;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    /* A world event pulling this department. On the label rather than the bar,
       because the bar already has the event folded into its length and marking
       it twice would read as two facts. */
    .mtr-tag.hot { opacity: .95; color: var(--accent); }
    .mtr-tag.cold { opacity: .3; }
    /* A fixed plot with the zero line down its middle, so every bar is measured
       against the same axis instead of against its own. Each row draws its own
       segment; stacked, they form one continuous line. */
    .mtr-plot { position: relative; height: 7px; }
    .mtr-plot::after {
      content: ''; position: absolute; left: 50%; top: -3px; bottom: -3px;
      width: 1px; background: var(--crease);
    }
    .mtr-bar { position: absolute; top: 0; bottom: 0; border-radius: var(--r);
      box-shadow: inset 0 0 0 1px rgba(23, 18, 25, .45); }
    .mtr.up .mtr-bar { left: 50%; background: var(--good); }
    .mtr.down .mtr-bar { right: 50%; background: var(--accent); }

    /* What to actually do about all of the above. Derived entirely from the
       same snapshot — no new server field — and capped at three, because a
       to-do list you can't finish is wallpaper rather than a prompt. */
    #todo { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; }
    #todo .todo-line, #todo .todo-alert {
      display: flex; flex-wrap: wrap; gap: 6px; justify-content: center;
    }
    #todo .todo-line { width: 100%; }
    /* `:has`, because the meter's rows are a child now and the panel itself is
       never empty — it holds its own close button. Without it an unfurnished
       shop draws an empty card with a ✕ on it before the first snapshot. */
    #todo:empty, #rci:has(> #rci-rows:empty) { display: none; }
    .todo {
      background: var(--panel); border-radius: var(--r); padding: 2px 9px 2px 7px;
      font-size: 11.5px; font-weight: 600; color: var(--ink);
      box-shadow: 0 2px 7px rgba(58,49,40,.11);
      display: inline-flex; align-items: center; gap: 5px;
    }
    .todo svg { width: 12px; height: 12px; opacity: .7; flex: none; }
    .todo b { font-weight: 800; }
    /* The goal chip's progress, as a rule along the bottom edge.

       A bar and not a fraction: "$106 / $500" has to be divided before it means
       anything, where a length is read without looking at it — the same call the
       demand meter makes about twelve departments.

       It was a WASH across the chip's own background, and that was wrong in a
       way only visible once a rung was part way along: the fill's edge lands
       somewhere in the middle of the words, so the chip reads as two boxes
       shoved together rather than as one chip with a measure on it. A rule under
       the text has an edge that belongs to nothing but itself.

       `overflow: hidden` on the chip, or the 2px rule squares off the rounded
       bottom corners it is sitting inside. */
    /* A TRACK as well as a fill, which is what makes the length mean anything.
       A lone green rule stopping at 45% is an underline that ends early — you
       cannot see how far it had to go, so it reads as a rendering fault rather
       than as a measure. The track is the distance and the fill is the part
       done. 3px because 2 disappeared into the chip's own shadow. */
    /* Bigger than the chips behind it, and the only one in the strip that is.
       It is the line that says what all the others are FOR, it is true all day
       where they come and go, and it is the one thing here you can press. A
       goal drawn at the same weight as "1 shelf empty" is a goal nobody reads
       twice. */
    .todo.goal {
      position: relative; overflow: hidden;
      font-size: 12.5px; padding: 4px 11px 5px 9px;
      box-shadow: 0 3px 10px rgba(58, 49, 40, .16);
    }
    .todo.goal svg { width: 14px; height: 14px; opacity: .85; }
    .todo.goal::before {
      content: ''; position: absolute; left: 0; right: 0; bottom: 0; height: 3px;
      background: rgba(58, 49, 40, .16);
    }
    .todo.goal::after {
      content: ''; position: absolute; left: 0; bottom: 0; height: 3px;
      width: var(--pct, 0%); background: var(--good);
    }
    /* The one that is costing you money right now, rather than merely pending. */
    .todo.hot { background: #ffd66b; box-shadow: 0 2px 9px rgba(200,150,20,.32); }
    .todo.hot svg { opacity: .9; }
    /* The shutters stop every other task, so this is a warning rather than an
       amber suggestion: a distinct centered line, with the same red the shut
       sign itself uses. */
    .todo.shut {
      background: #a8442f; color: #fff; font-size: 12.5px;
      padding: 4px 11px 5px 9px; box-shadow: 0 3px 10px rgba(168,68,47,.35);
    }
    .todo.shut svg { opacity: .95; }
    /* A chip with something to press behind it (see `todoList`). It has to be
       INDISTINGUISHABLE from the ones without, so this is a reset and nothing
       else — the browser's own control has a border, an outline and a font of
       its own, and one chip in the strip wearing them reads as a bug rather than
       as an invitation. `font-size` and `font-weight` are deliberately not
       inherited back: `.todo` already sets both, and a shorthand here would
       out-specify them and shrink the chip. `pointer-events`, because #hq is
       behind the pointer entirely and its children opt back in one at a time. */
    button.todo {
      appearance: none; -webkit-appearance: none;
      border: 0; margin: 0; font-family: inherit; color: inherit;
      text-align: inherit; outline: none;
      pointer-events: auto; cursor: pointer;
    }
    button.todo:active { transform: translateY(1px); }

    /* The nav: one icon per menu, along the bottom centre. The only thing on
       screen that says the game has menus at all — before it, three unrelated
       letter keys were the entire discovery story.

       It ran down the top-right corner until the build palette moved to the
       bottom. With the thing you press most at the bottom centre and the way
       into every menu diagonally opposite it, every session was a stream of
       corner-to-corner mouse journeys. Now the nav, the bar above it and the
       panel above that are one column under the pointer. */
    #rail {
      bottom: var(--nav-bot); left: 50%; transform: translateX(-50%);
      display: flex; gap: 6px; max-width: calc(100vw - 16px); flex-wrap: wrap;
      justify-content: center;
    }
    /* The contour and the cast are two decisions, and the old note here said
       they were one — which is how the whole HUD ended up brutalist.

       The CONTOUR is the ink. 1.5px because `INK.SIL_WIDTH` is 1.4 screen
       texels and a 40px card at this scale is the same line read at the same
       distance, and `--ink-soft` rather than `--ink-line` because the shop's
       own line fades on what you are not up against.

       The CAST is not ink at all, and pretending it was is the mistake. The
       reasoning ran: an ink pass is coverage rather than light, so nothing
       behind this button has a soft edge, so the shadow has to be a hard offset
       too. It is a good argument and it produces a sticker — a solid black copy
       of the button lying beside it, which is a thing no drawing has ever had.
       What the button actually needs to say is that it is nearer than the shop,
       and the honest way to say that is occlusion: short, soft, warm-dark, and
       the same on everything at this height. See `--cast-sm`.

       Both are `box-shadow` rather than a border, so the button's box is
       untouched and `--nav-h` and the whole bottom stack above it stay where
       they are. */
    .rail-btn {
      position: relative; width: 40px; height: 40px; border: 0; cursor: pointer;
      background: var(--panel); border-radius: var(--r); color: var(--ink);
      --sil: inset 0 0 0 var(--k2) var(--ink-soft);
      box-shadow: var(--sil), var(--edge), var(--cast-sm);
      display: grid; place-items: center;
      /* `transform` is deliberately NOT in the transition: it is the press, and
         a press that eases is a button that answers late. */
      font: inherit; transition: background .12s, box-shadow .12s;
    }
    /* THE LINE COMES UP TO FULL STRENGTH, and that is the whole hover. It used
       to lift the button a couple of pixels and lengthen its shadow, which is
       the one gesture a sticker can make and a drawing cannot — and in a row of
       eight it reads as the button falling out of line with its neighbours.
       A nib pressed harder is what an ink pass has instead, and it is also the
       only hover in here that costs no layout. */
    html.can-hover .rail-btn:hover { --sil: inset 0 0 0 var(--k2) var(--ink-line); }
    /* A click focuses the button, and the browser's own focus ring is a heavy
       blue box in somebody else's colours — on a row of buttons whose whole job
       is to show you which one is lit, a second, louder "this one" that follows
       the last thing you pressed is worse than no state at all.

       So the ring is ours, one rule for the whole rail, and only for the
       keyboard: `:focus-visible`, so a mouse press leaves nothing behind and Tab
       still shows you where you are. Drawn in `--ink` rather than in the lit
       yellow, and OUTSIDE the button (`outline-offset`) where the open state is
       a fill and the palette's is an inset ring — three marks that cannot be
       mistaken for one another.

       Offset 3 rather than 2 since the contour arrived: at 2 the ring lands on
       the button's own outline and the two read as one thick edge, which is the
       mark saying nothing. It still crosses the hard shadow on two sides, which
       is fine — it is a full ring in a different colour, and the shadow is on
       two. */
    .rail-btn:focus { outline: none; }
    .rail-btn:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
    /* Lit means "this menu is open" — except on Build, which is a mode rather
       than a menu, where it means the world is in it.

       Build says two things, because it is two presses (`pressBuild`): lit is
       the mode, and the pressed-in ring on top of it is the palette. The mode
       on its own now has no bar on screen, so this button is the whole of what
       says you are in it — and a mode you cannot see you are in is the complaint
       the lit state exists for. */
    .rail-btn.on { background: #ffd66b; }
    /* The palette's pressed-in ring is the contour DOUBLED rather than a second
       mark beside it — 1.5px of edge becoming 3px is the same line drawn
       harder, which is what a nib does, and it cannot be mistaken for the
       focus ring the way an inset brown one could. */
    .rail-btn.on.open, html.can-hover .rail-btn.on.open:hover {
      --sil: inset 0 0 0 3px var(--ink-line);
    }
    .rail-btn .ico { font-size: 18px; line-height: 1; }
    .rail-btn .kb { position: absolute; bottom: 2px; right: 5px; font-size: 8px; font-weight: 800; opacity: .35; }
    .rail-btn .badge {
      position: absolute; top: -4px; right: -4px; min-width: 16px; height: 16px; padding: 0 4px;
      border-radius: var(--r); background: var(--accent); color: #fff;
      font-size: 10px; font-weight: 800; display: grid; place-items: center;
      /* Its own line, or a red pill on a paper card is the one thing in the row
         with no edge to it — and it is drawn OVER the button's contour, so
         without one the two colours meet with nothing between them.
         A CREASE AND NOT A CONTOUR, at 1px. It is drawn on the button rather
         than beside it, which is the definition of the second thing, and it is
         16px across: `INK.FADE` draws a small object with a lighter line, and
         1.5px of near-black round a 16px pill is a quarter of its area spent on
         edge. It casts nothing for the same reason — it is ON the button, and
         a badge that dropped a shadow onto the thing it is attached to is the
         sticker tell in miniature. */
      box-shadow: inset 0 0 0 1px var(--crease);
    }
    .rail-btn .badge[hidden] { display: none; }

    /* The delivery ring. It traces the button's own border — see RING_PATH in
       client/rail.js for why that shape rather than a circle.

       `pointer-events: none` is not a nicety: the svg covers the whole button,
       so without it the ring eats every click on the one control it is drawn
       on. It sits first in the markup so the badge and the icon paint over it
       at the corner, where the two overlap by a pixel or so.

       Both strokes are faded in together rather than the arc alone, or an empty
       ring at the start of a wait is indistinguishable from no ring at all —
       the track is what says "this is filling up", and it is the half that
       makes a countdown legible from one glance rather than two. */
    .rail-btn .ring {
      position: absolute; inset: 0; width: 100%; height: 100%;
      pointer-events: none; overflow: visible;
    }
    .rail-btn .ring path { fill: none; stroke-width: 2.5; opacity: 0; transition: opacity .25s; }
    /* The track is the contour's colour at low alpha rather than `--line`'s
       brown, so an empty ring reads as the button's own outline showing through
       rather than as a second, warmer circle drawn inside it. */
    .rail-btn .ring .trk { stroke: rgba(23, 18, 25, .18); }
    .rail-btn .ring .arc {
      stroke: var(--warn); stroke-linecap: round;
      /* Long and linear, because the arc is written about once a minute (see
         `updateRings`) — the transition is what turns a hundred stepped writes
         into something that looks like it is moving at all. An eased one would
         visibly stall between steps. */
      transition: stroke-dashoffset .5s linear, stroke .3s, opacity .25s;
    }
    .rail-btn.waiting .ring path { opacity: 1; }

    /* How much is on the way. Opposite corner to the badge, and a different
       colour, because they are different kinds of news: the badge is a problem
       you can act on (red, top right, where every notification count in the
       world lives) and this is money already spent that has not landed yet.
       Sharing one slot would have them flicker between two unrelated numbers.

       It wears the ring's colour rather than its own, so the count and the arc
       read as one readout — the number is what the ring is counting down. */
    .rail-btn .cargo {
      position: absolute; bottom: -4px; left: -4px; min-width: 16px; height: 16px; padding: 0 4px;
      border-radius: var(--r); background: var(--warn); color: #fff;
      font-size: 10px; font-weight: 800; display: grid; place-items: center;
      box-shadow: inset 0 0 0 1px var(--crease);
      transition: background .3s;
    }
    .rail-btn .cargo[hidden] { display: none; }
    .rail-btn.landing .cargo { background: var(--good); }
    /* Pulling in. Green because the wait is over, and moving because a full
       ring holding still is the same picture as a full ring that has finished. */
    .rail-btn.landing .ring .arc { stroke: var(--good); animation: van-in 1.1s ease-in-out infinite; }
    @keyframes van-in { 50% { opacity: .3; } }
    /* A REDUCED-MOTION FALLBACK REPLACES THE CUE, IT DOES NOT DELETE IT.
       The pulse above is not decoration — it is the second channel, and the
       comment beside it says so. Amber against green is ΔE 8.6 to a protanope
       on a 16px badge, which is "needs a second cue", so switching the motion
       off and stopping there leaves the one state change on the rail resting
       on the one pair of colours that carries it worst. The ring goes solid
       instead: same "the wait is over", said with weight rather than with
       movement, and it costs a still frame nothing. */
    @media (prefers-reduced-motion: reduce) {
      .rail-btn.landing .ring .arc { animation: none; stroke-width: 4; }
      .rail-btn.landing .cargo { box-shadow: inset 0 0 0 2px var(--ink-line); }
    }

    /* ---- the tooltip -------------------------------------------------------
       One element, moved to whatever is hovered — see client/tip.js for why it
       is not an `::after` on the button.

       Above the HUD (10) and below the modal layers (50/60): it explains the
       HUD, so it has to clear it, and it explains nothing about a dialog that
       has taken the whole screen. `pointer-events: none` is load-bearing rather
       than tidy — the box sits directly over the row above the rail, and a tip
       that could be hovered would swallow clicks on whatever it covers, as well
       as fighting its own `pointerout`. */
    #tip {
      /* Chrome that never wanted `.hud` — it explains the HUD, so it sits above
         it on its own z-index — which means it has to be handed the size dial by
         name. A tooltip left at full size beside an 85% rail is the one thing on
         screen that says the setting only half worked. `Tip.place` converts, see
         client/ui-scale.js. */
      zoom: var(--ui);
      position: fixed; z-index: 40; pointer-events: none;
      max-width: 240px; padding: 7px 10px 8px;
      background: var(--panel-solid); color: var(--ink);
      border-radius: var(--r); box-shadow: 0 8px 22px rgba(58,49,40,.22);
      font-size: 12px; line-height: 1.3;
      opacity: 0; transform: translateY(5px) scale(.93);
      /* Out fast and flat, in slower with an overshoot past 1: a tip that
         springs into place reads as the shop answering you, and the same curve
         on the way out reads as it bouncing off the screen. Leaving is not an
         event and should not be animated like one. */
      transition: opacity .09s ease, transform .09s ease;
    }
    #tip.show {
      opacity: 1; transform: translateY(0) scale(1);
      transition: opacity .13s ease, transform .22s cubic-bezier(.34, 1.56, .64, 1);
    }
    /* Flipped below, for anything near the top of the screen. It springs DOWN
       out of its caret rather than up, or a tip under the meters would rise
       into the thing it is describing.

       These sit after `.show` deliberately: `#tip.down` and `#tip.show` are the
       same specificity, so the later rule is the one that wins the transform,
       and swapping the two blocks would break the flip with nothing in either
       one looking wrong. */
    #tip.down { transform: translateY(-5px) scale(.93); }
    #tip.down.show { transform: translateY(0) scale(1); }
    /* Shadow cast the other way with it. Left pointing down it would fall
       across the box it is attached to, which reads as a smudge on the card. */
    #tip.down .arrow { bottom: auto; top: -3px; box-shadow: -2px -2px 6px rgba(58,49,40,.12); }

    #tip .row { display: flex; align-items: center; gap: 8px; }
    #tip .ttl { font-weight: 800; letter-spacing: -.01em; }
    /* The hotkey as a key cap, which is the same thing `.kb` says on the button
       itself — said properly, because here there is room for it. */
    #tip .key {
      margin-left: auto; padding: 1px 5px; border-radius: var(--r);
      background: rgba(58,49,40,.09); box-shadow: inset 0 -1px 0 rgba(58,49,40,.14);
      font-size: 9.5px; font-weight: 800; opacity: .6;
    }
    #tip .key[hidden] { display: none; }
    /* The second line: what the thing is doing right now. Quieter than the
       name, because you read the name to find the button and this to find out
       what it has to say. */
    #tip .note { margin-top: 2px; opacity: .62; font-size: 11px; }
    #tip .note[hidden] { display: none; }
    /* ...unless it is live, in which case it is the reason you hovered. It
       wears the same two colours the delivery ring does, so the arc on the
       button and the sentence above it are visibly one readout. */
    #tip .note[data-tone] { opacity: 1; font-weight: 700; }
    #tip .note[data-tone="warn"] { color: #b5801f; }
    #tip .note[data-tone="good"] { color: #46803f; }
    /* The caret. A rotated square rather than a border triangle, so it takes
       the box's own background and shadow and stays one shape with it — and it
       is positioned by script rather than centred here, because a tip pushed
       off the screen edge must still point at its button. */
    #tip .arrow {
      position: absolute; bottom: -3px; width: 10px; height: 10px;
      margin-left: -5px; border-radius: var(--r);
      background: var(--panel-solid); transform: rotate(45deg);
      /* The box's own shadow stops at the box, so without this the caret is a
         flat tab hanging off a lifted card. Offset down-and-right in the
         element's own axes, which after the 45° turn is straight down the
         screen — a shadow is transformed with the thing that casts it. */
      box-shadow: 2px 2px 6px rgba(58,49,40,.12);
    }
    @media (prefers-reduced-motion: reduce) {
      #tip, #tip.show { transition: opacity .1s ease; transform: none; }
    }

    /* The drag joystick draws nothing — see client/main.js. */

    /* bottom-right: event log.
       `align-items: end` so a short line is a short pill — the column is a
       width bound, not a shape every line has to fill — and the pills line up
       on the edge they are anchored to rather than ragging away from it.

       It is the one thing in the bottom stack that does NOT clear the nav, and
       that is the point rather than an oversight. Everything else down there is
       something you press, so it is worth the arithmetic in `--nav-top` /
       `--build-h` to keep it above whatever the bar is doing. A feed is the
       opposite: you never touch it, and a column of lines that jumped every
       time the build bar opened or closed was six things moving in answer to a
       press that had nothing to do with them. So it takes the corner and stays
       there. */
    #log {
      right: 12px; bottom: 12px; max-width: min(520px, 46vw);
      display: flex; flex-direction: column; align-items: flex-end; gap: 3px;
      /* The feed sits over a corner of the FLOOR, so every pill was a patch of
         shop you could not tap to walk to — quietly, because a press that lands
         on nothing looks like a press you got wrong. It has never needed the
         pointer, and now that hovering means something it still doesn't:
         `hoverLog` hit-tests rectangles instead. */
      pointer-events: none;
    }
    /* Quieter at rest than anything you are meant to be reading — this is a feed
       you glance at over the top of the shop, and six opaque cards in the corner
       of the floor is a wall. Pointing at one gives it back in full; see
       `hoverLog` for why that is hit-tested rather than `:hover`. */
    #log div {
      display: flex; align-items: center; gap: 6px;
      background: var(--panel); border-radius: var(--r); padding: 4px 10px;
      font-size: 11.5px; line-height: 1.35; box-shadow: 0 2px 7px rgba(58,49,40,.09);
      opacity: .74; transition: opacity .18s, transform .3s;
    }
    #log div.held { opacity: 1; }
    /* Last, so it beats both of the above — a line on its way out fades from
       wherever it happened to be. Off the edge it is anchored to, so it reads
       as leaving the screen rather than sliding under the shop. */
    #log div.out { opacity: 0; transform: translateX(8px); }
    /* Who did it, in front of the sentence that names them. Round, because the
       plate under an item is a shelf and the plate under a person is not — the
       two want telling apart at a glance down a column of lines. A flex child
       rather than a float, so it centres against a wrapped message instead of
       pinning to its first line. */
    #log .lg-who {
      flex: none; width: 21px; height: 21px;
      margin-left: -3px; border-radius: var(--r); padding: 2px;
      background: rgba(58,49,40,.07);
    }
    #log .lg-who > svg { width: 100%; height: 100%; display: block; }
    /* Goods inside a line, as "2x <picture>" — see `paintLogLine`. The count is
       the loud half: what the icon says is *which*, and you already know which
       shop you are in. The plate behind the art is the board tip's, and for the
       same reason — item art is authored in shop colours, so a dark loaf on a
       dark card is a smudge whatever somebody authors next.

       Inline, so the count keeps the sentence's baseline; only the picture is
       centred on it. Made a flex box, the chip centres its own number against
       its icon and the number then floats off the line of the words. */
    #log .lg-good { font-weight: 800; white-space: nowrap; }
    #log .lg-good > svg {
      width: 17px; height: 17px; display: inline-block; vertical-align: middle;
      margin-left: 2px;
      padding: 1px; border-radius: var(--r); background: rgba(58,49,40,.05);
    }
    /* bottom-right: what is in your hands, a row per pile.
       It was one long sentence, which at three kinds ran the width of the
       screen and put the *verb* — the half telling you how to put it down —
       off the right-hand edge. A column stops growing sideways however mixed
       an armful is, and lines the counts up under each other so a glance
       reads how much rather than parsing a list. */
    /* bottom-centre: the chase bar. Only ever on screen while it is not full,
       which is what keeps it out of the way of a game that is mostly not a
       chase — see `syncStamina`. Centred rather than tucked in a corner
       because it is read while sprinting, when your eyes are on the person you
       are running after and a corner is somewhere you are not looking. */
    #stam {
      left: 50%; transform: translateX(-50%); bottom: 76px;
      width: 132px; height: 6px; border-radius: var(--r);
      background: rgba(58,49,40,.22); overflow: hidden;
      pointer-events: none; opacity: 0; transition: opacity .18s;
    }
    #stam.show { opacity: 1; }
    #stam i {
      display: block; height: 100%; width: 100%; border-radius: var(--r);
      background: var(--good); transform-origin: left center;
      transition: transform .08s linear;
    }
    /* Run yourself flat and the bar says so rather than just sitting empty:
       `winded` is a state you are IN, and an empty bar alone reads as a bar
       that has stopped working. */
    #stam.spent i { background: var(--accent); }
    #carry {
      right: 12px; background: var(--panel); font-size: 11.5px;
      border-radius: var(--r); padding: 6px 9px 7px;
      box-shadow: 0 2px 7px rgba(58,49,40,.09);
      display: flex; flex-direction: column; gap: 3px; max-width: 220px;
    }
    #carry:empty { display: none; }
    #carry .cy-what {
      font-size: 9.5px; font-weight: 800; letter-spacing: .07em;
      text-transform: uppercase; opacity: .5;
    }
    #carry .cy-row { display: flex; align-items: center; gap: 5px; }
    /* Right-aligned so "2x" and "12x" share an edge down the column. */
    #carry .cy-n { font-weight: 800; min-width: 24px; text-align: right; flex: none; }
    #carry .cy-row > svg {
      width: 19px; height: 19px; flex: none; display: block;
      padding: 1px; border-radius: var(--r); background: rgba(58,49,40,.05);
    }
    #carry .cy-name {
      font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    #carry .cy-hint { font-size: 10.5px; font-weight: 600; opacity: .55; line-height: 1.3; }

    /* "Harvesting…" — what standing here is about to do. Sits low and centre,
       near where your hand already is, and vanishes the moment nothing is in
       range. */
    #prompt {
      left: 50%; transform: translate(-50%, 8px); opacity: 0;
      background: rgba(58,49,40,.86); color: #fff; padding: 7px 16px;
      border-radius: var(--r); font-size: 14px; font-weight: 600;
      pointer-events: none; transition: opacity .14s, transform .14s;
      white-space: nowrap;
    }
    #prompt.show { opacity: 1; transform: translate(-50%, 0); }
    #prompt.going { background: #ffd66b; color: var(--ink); }
    #prompt b { font-weight: 800; }

    /* ...and which button does it, once per press that means anything here. One
       row, divided — the pill stays the one pill it always was and only gets
       longer. Left-button entries read glyph-first and right-button ones are
       reversed, so each mouse sits on its own outside edge and the side of the
       divider a job is written on is which finger presses it. */
    /* Wraps rather than running off the screen: four entries fit a desktop and
       do not fit a phone, and a pill whose last entry is past the edge is the
       one arrangement that loses information without saying so. */
    #prompt {
      display: flex; align-items: center; flex-wrap: wrap; justify-content: center;
      max-width: min(92vw, 760px); white-space: normal;
    }
    /* A `<button>` where there is a press behind it and a `<span>` where there
       is not (see `paintPrompt`) — and the two have to be INDISTINGUISHABLE
       here, because on a desktop this is a caption and nothing else: the mouse
       is the button, and the pill only says which one. Without the reset the
       browser draws its own control on top of the shop, which is a grey chip
       with a border and an outline in somebody else's design language sitting
       inside a pill that had neither. `appearance` first, then every property a
       default button brings with it — a partial reset is the tell-tale one, and
       the one it always misses is `font`. */
    #prompt .pr-say {
      display: flex; align-items: center; gap: 6px;
      appearance: none; -webkit-appearance: none;
      background: none; border: 0; border-radius: 0; box-shadow: none;
      margin: 0; padding: 0; color: inherit; font: inherit; text-align: inherit;
      outline: none;
    }
    #prompt .pr-say.pr-r { flex-direction: row-reverse; }
    /* ...and a row the shop would refuse RIGHT NOW keeps its place and goes
       dim. The list's older rule is "offer nothing you cannot do", which is
       right about a press aimed somewhere else and wrong about one whose only
       problem is your hands: dropping it makes four buttons two, the card
       reflows under your thumb mid-press, and nothing left on screen says why.
       Dim rather than gone, and it still answers the press with the reason —
       see `off` in `pressHints` and the handler in client/ui.js.
       Opacity alone, on purpose: the words, the tag and the mouse are all still
       the right ones, and anything that recoloured them would be inventing a
       second look for a state that is "the same row, not now". */
    #prompt .pr-say.pr-off { opacity: .42; }
    /* A hairline rather than a dot or a gap: these are alternatives, and a
       middle dot reads as "and then", which is the opposite of what it means. */
    #prompt .pr-say + .pr-say,
    /* ...and the same hairline after the NAME, which is not an alternative to
       anything — it is the subject the rows are all about. It gets the divider
       because the rule above is keyed on a row FOLLOWING a row, and the first
       row stops being the first the moment a name is in front of it: without
       this the name and the first verb run together as one phrase, which reads
       as "Raised Bed Open it" rather than as a thing and what you can do to it. */
    #prompt .pr-about + .pr-say {
      margin-left: 10px; padding-left: 10px;
      border-left: 1px solid rgba(58,49,40,.22);
    }
    /* Quieter than the verbs and never pressable. The rows are what you came to
       the card for; this only has to answer "which one", which is a glance
       rather than a read — so it is set at the tag's weight rather than at the
       words'. `max-width` because a long piece name must not push the presses
       off a narrow screen: the verbs are the control and the name is the label
       on it. */
    #prompt .pr-about {
      font-size: 12px; font-weight: 800; letter-spacing: .02em; opacity: .62;
