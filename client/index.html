       empty track, so a short block leaves a gap and every tile in the menu is
       the same tile.

       The GUTTER is 8, where it was 3. A 3px gutter is right for a 60px tile in
       a strip of them and wrong the moment the tile is 110px square with a 2px
       contour of its own: the lines of two neighbours a hair apart read as one
       thick ruling and the block goes to plaid. */
    .grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr));
      gap: 8px; margin: 6px 0;
    }
    /* SQUARE, and the tile fills the cell. Sized off the row rather than the
       tallest label in it, which is the half that was wrong: a two-line name or
       the stepper on a chip made one cell tall and left the rest hanging off
       the top of it, so the block read as having lost its ruling. An
       `aspect-ratio` takes the answer off the content entirely — the columns
       are `1fr` of the panel, so the height follows the width and every tile in
       the grid is the same box whatever is written on it. `align-content`
       centres what is inside, rather than packing it against the lid. */
    .gcell { position: relative; display: grid; aspect-ratio: 1; }
    /* A CARD, not a faded one. The whole tile used to sit at `opacity: .5` on a
       grey wash, so an unlit switch was grey ink on grey card inside a grey
       hairline — three greys, and the name of the thing is the one part of it
       anybody is reading. Fading a control to say it is off is the same mistake
       `.gtile.on`'s own note names about colour: OFF is already written on the
       tile, in a word, and the yellow already says which one is on. So the card
       is solid, the ring is the panel's own 2px crease, and the only things
       held back are the parts that are not the label — the glyph a little, the
       state word more. */
    .gtile {
      width: 100%; height: 100%; border: 0; font: inherit; color: var(--ink); cursor: pointer;
      background: var(--panel-solid); border-radius: var(--r); padding: 7px 5px 5px;
      display: grid; justify-items: center; align-content: center; gap: 3px; text-align: center;
      transition: background .1s;
      --sil: inset 0 0 0 var(--k1) var(--crease);
      box-shadow: var(--sil), var(--edge);
    }
    html.can-hover .gtile:not(.chip):hover { background: #fff; }
    .gtile.on { background: #fff3d0; --sil: inset 0 0 0 var(--k1) var(--ink-line); }
    /* Sized up with the tile: 15px was a glyph over two words on a 60px-tall
       box, and on a 107px square it reads as a tile with nothing on it. */
    .gtile .gico { font-size: 19px; line-height: 1; opacity: .72; }
    .gtile.on .gico { opacity: 1; }
    .gtile .gico svg { display: block; width: 1em; height: 1em; }
    /* Wraps rather than ellipsises. A two-word name is the common case here and
       a tile that clipped one would be a switch you cannot read — the grid is
       already the short version, so the words are the whole of it. */
    .gtile .gname { font-size: 11px; font-weight: 700; line-height: 1.2; }
    .gtile .gstate {
      font-size: 8px; font-weight: 800; letter-spacing: .05em;
      text-transform: uppercase; opacity: .4;
    }
    .gtile.on .gstate { opacity: .7; }
    /* A NUMBER ON A TILE. Not a switch, so it never lights and it is never
       faded — the tile is the frame round a stepper rather than a press of its
       own, and only the two nudges inside it are pressable. It takes the
       stepper's own look from `.stp`/`.rbtn` below, which are scoped `.row`
       first and `.chip` second rather than being restated here: one definition,
       so a stepper cannot come to mean two shapes depending which block it
       landed in. The top padding comes back off the bottom, since the stepper's
       own 1px well already stands the number off the edge. */
    .gtile.chip { cursor: default; padding: 7px 5px 4px; }
    .gtile.chip .stp { margin-top: 1px; }
    /* The rare second verb, in the corner of the tile it belongs to. Small on
       purpose: it must be findable and must never be the thing your thumb hits
       when you meant the switch, so it sits clear of the glyph and the words. */
    .gsub {
      position: absolute; top: 3px; right: 3px; width: 16px; height: 16px;
      border: 0; padding: 0; border-radius: var(--r); cursor: pointer;
      background: rgba(58,49,40,.10); color: var(--ink);
      display: grid; place-items: center; font-size: 9px; opacity: .45;
      --sil: inset 0 0 0 1px var(--crease);
      --edge: var(--edge-sm); --press: var(--press-sm);
      box-shadow: var(--sil), var(--edge);
    }
    html.can-hover .gsub:hover { opacity: 1; background: rgba(58,49,40,.22); }
    .gsub svg { display: block; width: 1em; height: 1em; }
    /* THE SECOND PRESS AS A STRIP RATHER THAN A DOT.
       `.gsub` above is a corner dot for the rare second verb, and the conveyor
       side cards are the opposite case: the tile itself is the calm press (pick
       this side, light it up in the shop) and the toggle on it is the one you
       came to make. A 16px dot for the frequent press is the thing a thumb
       misses every time.
       So it is a bar along the foot of the card, wearing the state word that
       used to sit there as text — it is already the right size and already says
       what it would change, so it becomes the button rather than gaining one.
       A SIBLING inside `.gcell`, never a child of the tile: `.gtile` is a
       `<button>`, and a button inside a button is hoisted out by the parser, so
       the nested version does not render wrong — it renders somewhere else. The
       tile's own padding is what keeps its words clear of this. */
    .gbar {
      position: absolute; left: 5px; right: 5px; bottom: 5px;
      border: 0; padding: 3px 2px; border-radius: var(--r); cursor: pointer;
      background: rgba(58,49,40,.10); color: var(--ink);
      font: inherit; font-size: 8px; font-weight: 800; letter-spacing: .05em;
      text-transform: uppercase; opacity: .62;
      --sil: inset 0 0 0 1px var(--crease);
      --edge: var(--edge-sm); --press: var(--press-sm);
      box-shadow: var(--sil), var(--edge);
    }
    html.can-hover .gbar:hover { opacity: 1; background: rgba(58,49,40,.2); }
    /* On a lit card the strip is the loud part, because on those it is the
       thing that is no longer the default — same argument `.gtile.on` makes
       about the yellow. */
    .gtile.on + .gbar, .gcell:has(.gtile.on) .gbar { opacity: .9; background: rgba(58,49,40,.16); }
    /* ...and the tile gives up the room. The strip is laid over the card rather
       than in it, so without this the words centre under it and the last line
       reads through the bar — which looks like a rendering fault rather than a
       spacing one. Scoped to cells that HAVE one, or every switch grid in the
       game grows a hole at the bottom. */
    .gcell:has(.gbar) .gtile { padding-bottom: 27px; }

    /* Icon over price, one narrow column. */
    .lead { display: flex; flex-direction: column; align-items: center; gap: 1px; width: 26px; flex: none; }
    .lead .cost { font-size: 9px; font-weight: 700; opacity: .6; font-variant-numeric: tabular-nums; }
    .sep {
      font-size: 9px; font-weight: 800; text-transform: uppercase; letter-spacing: .06em;
      opacity: .45; padding: 6px 7px 2px; border-top: 1px solid var(--line); margin-top: 4px;
    }
    /* ---- THE FOOT OF A TAB ------------------------------------------------
       Two presses side by side, against the bottom of the panel, under a dashed
       rule. See `rowHtml`'s `footBar` for why this is neither a `grid` nor a
       pair of `midrow`s.

       PINNED, and that is the half a heading could never buy them. The Menu's
       two ways out had been centred tiles, then ordinary rows, then a bar — each
       trying to buy presence with WEIGHT, when what they wanted was position:
       the settings sit at the top, these sit at the bottom, and the gap between
       is what says they are not the same kind of thing. It is free, because the
       panel is already held at the height of its tallest tab (`steadyHeight`),
       so the space this pushes into is space that was there and empty. On a tab
       whose content fills the panel it does nothing at all, which is right
       rather than a limitation: no slack, no gap.

       A DASHED rule and not the solid one `.sep` draws. Every other separator
       in the panel means "and now another group"; this one means "and now the
       way out", and it is the only place in the menu that needs to say it.

       NOTHING STRETCHES. A `flex: 1` on the tip jar is the obvious way to tell
       it apart from the way out, and it turns the button into a field of colour
       with four words floating in it the moment the window is wider than the
       mock-up it was drawn against. A button's job is to be the size of what it
       says; the two are told apart by their labels being different lengths,
       which is true at any width and is what keeps a thumb travelling down the
       tab off the one press it cannot take back. `wrap` for the narrowest
       panel, since a button that shrank would be the same mistake from the
       other end.

       `:has()` rather than a flag the section has to set: the body holds every
       menu in the game and only this one wants a column, so the question being
       asked is exactly "is there a foot in here". `flex: none` on the children
       is the guard that costs nothing and saves a real bug — a flex child
       defaults to shrinking, so a tab longer than the panel would squash its
       rows instead of scrolling. `:not(.pnl-mid)` is the one exception and it
       is the opposite case rather than a hole in that guard: a tab that
       declared a scrolling middle (`paneWrap`, client/ui.js) is saying which
       part of it gives, so that part must be the one child here that is
       allowed to. Written as a `:not` rather than left to the cascade — the
       paned rule above does out-specify this one, which is a fact about two
       selectors in two halves of a stylesheet and not something the next
       person to touch either should have to work out.

       ACCENT ON THE TIP JAR, and it is the stepped-down `#a8442f` rather than
       `--accent` for the reason the boot error and the Shop report's warning
       tiles give: `--accent` is a *mark* colour measured against a panel, and a
       14px word on a tinted keyline owes its reader 4.5:1. This pair is 4.8. */
    #panel-body:has(> .footbar) { display: flex; flex-direction: column; }
    #panel-body:has(> .footbar) > *:not(.pnl-mid) { flex: none; }
    /* A WELL RATHER THAN A LEDGE. `#panel-body` is `0 9px 3px`, so a bar that
       only padded its top sat its buttons 9px off each side and 3px off the
       bottom — and a `.fbtn` carries a 3px drop, which lands the drop itself on
       the panel's own border. The pair reads as the buttons having slipped out
       of the card. The 9 here rides on the body's own 3, so the drop falls
       inside it and what shows under the shadow matches what shows beside the
       button. */
    .footbar {
      margin-top: auto; padding: 13px 0 9px; border-top: 2px dashed var(--crease);
      display: flex; flex-wrap: wrap; gap: 8px; align-items: stretch;
    }
    .fbtn {
      flex: none; border: 0; cursor: pointer; font: inherit;
      display: flex; align-items: center; justify-content: center; gap: 8px;
      padding: 10px 15px 11px; border-radius: var(--r);
      font-size: 13.5px; font-weight: 800; line-height: 1.25;
      color: var(--ink); background: var(--panel-solid);
      box-shadow: inset 0 0 0 2px var(--ink-line), 0 3px 0 var(--ink-line);
      transition: background .1s;
    }
    /* Sized off the words beside it, the same call `.midtop svg` makes. */
    .fbtn svg { display: block; width: 1em; height: 1em; flex: none; opacity: .6; }
    /* The tip jar takes the left and pushes the way out to the far end, which is
       the pairing argument said in space: two presses that both leave the screen
       want a gap between them, not a 8px gutter. */
    .fbtn.love { background: #ffe0d9; color: #a8442f; margin-right: auto; }
    .fbtn.love svg { color: var(--accent); opacity: 1; }
    html.can-hover .fbtn:hover { background: #fff; }
    html.can-hover .fbtn.love:hover { background: #ffd0c5; }
    .fbtn:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
    .foot { font-size: 10px; opacity: .55; padding: 6px 7px; line-height: 1.35; }

    /* ---- the shop report -------------------------------------------------
       The one menu that is a PICTURE rather than a list. Everything else in
       this panel is `.row`, which is right for anything you might press and
       wrong for a report: a list gives every number the same size, and the
       whole reading here is that today's profit and "4 picked" are not the
       same size of fact. See client/report.js for what each block is and why.

       Two colours do all the work and they are the ones the rest of the game
       already uses for this: --good and --accent, the same pair as the corner
       cashflow readout and every heat pill. They are also the worst pair alive
       for a red-green colourblind reader, so nothing in here rests on them —
       the week's sign is which side of the axis a column is on, the hero says
       "profit" or "loss" in words, and every delta carries an arrow. */
    .rp { padding: 2px 3px 6px; }
    .rp-blk { padding: 8px 8px 10px; }
    /* One column until there is room for two, and a real GRID when there is —
       cells in step across a row, not two independent columns side by side.
       That distinction is the whole of what makes it look segmented: two
       columns end wherever their own content ends, so the seam between them is
       ragged and a tall block on one side is marooned beside empty panel. Cells
       in a row are the same height by construction, so the lines run all the
       way across and meet the one down the middle.

       The lines ARE the grid gap: a 1px gutter with the rule colour behind it,
       and each cell painting itself back in over the top. One declaration draws
       every line in the panel, they cross exactly, and no cell has to know
       which of its four edges is an outside edge — which is the part that gets
       wrong by hand the moment a block moves. `--panel-solid` rather than
       `--panel`, because 94% over 94% is a line you can see through the cell
       next to it.

       The panel's own width moves on the same query: a 620px panel with one
       column of content in it is just a long line to read. */
    @media (min-width: 700px) {
      #panel.wide { width: 620px; }
      .rp.pnl-wide {
        display: grid; grid-template-columns: 1fr 1fr;
        gap: 1px; background: var(--line); padding: 0;
      }
      .rp.pnl-wide > .rp-blk { background: var(--panel-solid); }
      /* The gap draws every divider now. The stacked rule would double up on
         the one down the middle and miss the one across. */
      .rp.pnl-wide > .rp-blk + .rp-blk { border-top: none; }
      /* What went wrong belongs to neither column — it is the evidence for
         both — so it takes the whole bottom row, which is also the width its
         three tiles want. */
      .rp.pnl-wide > .rp-full { grid-column: 1 / -1; }
    }
    .rp-blk + .rp-blk { border-top: 1px solid var(--line); }
    .rp-blk h4 {
      margin: 0 0 8px; font-size: 9px; font-weight: 800;
      text-transform: uppercase; letter-spacing: .06em; opacity: .45;
      display: flex; align-items: baseline; gap: 6px;
    }
    .rp-blk h4 small { font-weight: 700; letter-spacing: 0; text-transform: none; opacity: .8; }
    /* Sentences under a block. Same size and weight as a row's `.tags`, because
       a caption in a report and a caption on a row are the same kind of thing
       and there is no reason for the panel to have two of them. */
    .rp-note { margin: 8px 0 0; font-size: 10.5px; line-height: 1.35; opacity: .55; }
    .rp-note b { font-weight: 800; opacity: .85; }

    /* --- today ---------------------------------------------------------- */
    /* THE hero figure — one per view. 34px against an 12px panel is three
       times the body, which is what "hero" means here; the 48px the desktop
       rule asks for is a number scaled to a full-page dashboard and would be a
       quarter of the width of this one. Proportional figures, not tabular:
       tabular gives every digit the width of a `0`, which at this size makes
       a number like $121 look full of holes. */
    .rp-hero { display: flex; align-items: baseline; gap: 10px; }
    .rp-hero > b { font-size: 34px; font-weight: 800; line-height: 1; letter-spacing: -.02em; }
    .rp-hero.up > b { color: var(--good); }
    .rp-hero.down > b { color: var(--accent); }
    /* Before the first sale of the day it is neither, and stays the panel's own
       ink — a green $0.00 is a claim about a day nothing has happened in. */
    .rp-hero.idle > b { opacity: .3; }
    .rp-heroside { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
    .rp-heroside > em { font-style: normal; font-size: 10.5px; font-weight: 700; opacity: .5; }
    .rp-delta {
      display: flex; align-items: baseline; gap: 4px;
      font-size: 11px; font-weight: 700; font-variant-numeric: tabular-nums;
    }
    .rp-delta > i { font-style: normal; font-size: 9px; }
    .rp-delta > em { font-style: normal; font-weight: 600; opacity: .45; font-size: 10px; }
    .rp-delta.up { color: var(--good); }
    .rp-delta.down { color: var(--accent); }
    .rp-delta.flat { opacity: .55; }

    /* Taken split into what went back out and what stayed. The gap between the
       two segments is 2px of the panel's own colour — a border round a fill is
       ink that isn't data, and at this height it would be most of the mark. */
    .rp-split { margin-top: 10px; }
    .rp-track {
      display: flex; gap: 2px; height: 10px; border-radius: var(--r);
      background: rgba(58,49,40,.08);
    }
    .rp-seg { display: block; height: 100%; }
    .rp-seg:first-child { border-radius: var(--r) 0 0 var(--r); }
    .rp-seg:last-child { border-radius: 0 var(--r) var(--r) 0; }
    .rp-seg:only-child { border-radius: var(--r); }
    .rp-seg.base { background: rgba(58,49,40,.3); }
    .rp-seg.kept { background: var(--good); }
    .rp-seg.short { background: var(--accent); }
    .rp-split.empty .rp-track { background: rgba(58,49,40,.06); }
    .rp-legend {
      margin: 5px 0 0; display: flex; justify-content: space-between; gap: 8px;
      font-size: 10.5px; opacity: .55;
    }
    .rp-legend b { font-weight: 800; opacity: .85; font-variant-numeric: tabular-nums; }

    /* --- the week ------------------------------------------------------- */
    /* Two label bands, one at each end of the plot, and they are not optional.
       The best day's bar reaches the top of the plot BY CONSTRUCTION — it is
       what the scale is built from — so its value label always sits outside,
       and the worst day's always sits under the bottom edge. Without the bands
       the top one rides up into the heading and the bottom one lands exactly on
       the row of day numbers. Neither is visible in a week that happens to have
       its extremes in the middle of the range, because there is no such week. */
    .rp-week { padding-top: 14px; }
    /* The columns and the two hairlines share one positioning context, so the
       axis and the average are placed by the same arithmetic the bars are. */
    .rp-plot {
      position: relative; height: var(--plot);
      display: flex; align-items: stretch; gap: 4px; margin-bottom: 30px;
    }
    .rp-col { position: relative; flex: 1 1 0; min-width: 0; }
    /* Two stacked halves: everything above the axis, everything below it. The
       bar sits at the axis end of its half, which is what makes both signs
       grow OUT of the same line. */
    .rp-up, .rp-dn { display: flex; justify-content: center; }
    .rp-up { align-items: flex-end; }
    .rp-dn { align-items: flex-start; }
    .rp-up > i, .rp-dn > i { display: block; width: 18px; max-width: 100%; }
    .rp-up > i { background: var(--good); border-radius: var(--r) var(--r) 0 0; }
    .rp-dn > i { background: var(--accent); border-radius: 0 0 var(--r) var(--r); }
    /* The day number, under the plot. `tabular-nums` here and NOT on the hero,
       because these are a row of figures that have to line up with each other. */
    .rp-col > b {
      position: absolute; top: calc(var(--plot) + 16px); left: 0; right: 0;
      text-align: center; font-size: 9px; font-weight: 700; opacity: .4;
      font-variant-numeric: tabular-nums;
    }
    /* Only the best day and the worst carry a value — a number on every column
       is chaos and goes unread. It rides the far end of its own bar, so it can
       never sit on top of the mark it is labelling. */
    .rp-pin {
      position: absolute; left: 50%; transform: translateX(-50%);
      font-style: normal; font-size: 9.5px; font-weight: 800; white-space: nowrap;
      font-variant-numeric: tabular-nums;
    }
    .rp-pin.over { margin-bottom: 2px; color: var(--good); }
    .rp-pin.under { margin-top: 2px; color: var(--accent); }
    .rp-axis, .rp-avg {
      position: absolute; left: 0; right: 0; height: 0;
      border-top: 1px solid rgba(58,49,40,.22); pointer-events: none;
    }
    /* The average is a reference, so it is quieter than zero. Solid, like the
       axis: a dashed rule reads as a projection, and this is arithmetic on bars
       that are right there.
       It carries no label of its own — the figure is in the heading, because
       the only two places a chip on this line could sit are on top of a bar and
       in the band the best day's label already owns. The line says WHERE, the
       heading says what, and neither has to dodge the other. */
    .rp-avg { border-top-color: rgba(58,49,40,.14); }

    /* The same week in the shop's other currency, sharing the x axis and
       nothing else. It is deliberately the junior row: a third of the height,
       10px bars against the plot's 18, and a heading in the panel's quietest
       ink — two charts of equal weight stacked would read as a dashboard, and
       this is one chart with a footnote you can see the shape of. Colours are
       the same green and red as the plot above ON PURPOSE, because the whole
       job of the strip is to be compared with it row for row. */
    /* Air above it, and it is load-bearing: the plot reserves 30px under itself
       for the day numbers, so a strip that starts where that margin ends puts
       its own heading 3px under a row of labels and the two read as one
       jumbled band. The gap is what says the numbers belong to the chart above
       and the words below start something new. */
    .rp-strip { display: flex; flex-direction: column; gap: 4px; margin-top: 9px; }
    .rp-shead {
      font-size: 8.5px; font-weight: 800; text-transform: uppercase;
      letter-spacing: .06em; opacity: .32;
    }
    .rp-rep { position: relative; height: var(--rep); display: flex; align-items: stretch; gap: 4px; }
    .rp-rcol { position: relative; flex: 1 1 0; min-width: 0; }
    .rp-rup, .rp-rdn { display: flex; justify-content: center; }
    .rp-rup { align-items: flex-end; }
    .rp-rdn { align-items: flex-start; }
    .rp-rup > i, .rp-rdn > i { display: block; width: 12px; max-width: 100%; }
    .rp-rup > i { background: var(--good); border-radius: var(--r) var(--r) 0 0; }
    .rp-rdn > i { background: var(--accent); border-radius: 0 0 var(--r) var(--r); }
    .rp-raxis {
      position: absolute; left: 0; right: 0; height: 0;
      border-top: 1px solid rgba(58,49,40,.22); pointer-events: none;
    }

    /* --- going wrong ---------------------------------------------------- */
    .rp-tiles { display: flex; gap: 6px; }
    .rp-tile {
      flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; gap: 1px;
      padding: 6px 7px; border-radius: var(--r); background: rgba(58,49,40,.05);
    }
    /* Status colour only where there is something to say. A tile at zero stays
       in the panel's own ink, so the eye finds the lit ones without reading. */
    .rp-tile.bad { background: #f9e2dd; }
    .rp-tile.warn { background: #fbeed3; }
    .rp-tile > b { font-size: 17px; font-weight: 800; line-height: 1.1; }
    /* NOT --accent and --warn themselves. Those are mark colours — they are
       measured against the panel and they are the right red and amber on a
       10px bar — and at 17px of text on a tinted tile they come out at 2.99:1
       and 3.14:1, under the 4.5:1 a figure this size owes a reader. These are
       the same two hues stepped down until they pass (4.8 and 5.4), and the red
       is the one the heat pills already use, so the shop has one dark red
       rather than two. The 34px hero is the other way round and stays on the
       mark colours: over 18.66px bold the bar is 3:1, and it clears it. */
    .rp-tile.bad > b { color: #a8442f; }
    .rp-tile.warn > b { color: #8a5410; }
    .rp-tname { font-size: 10px; font-weight: 700; }
    /* .7 rather than the .55 every caption in the panel wears: those sit on the
       panel's own cream, and a tinted tile is a lighter ground to be read off. */
    .rp-tsub {
      font-size: 9.5px; line-height: 1.25; opacity: .7;
      display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden;
    }

    /* --- reputation ------------------------------------------------------
       Where it stands, then what moved it. 20px is deliberately well under the
       hero's 34: there is one hero per view and it is today's profit, and this
       is the second-biggest fact in the panel rather than a rival to it. */
    .rp-rnow { display: flex; align-items: baseline; gap: 8px; }
    .rp-rnow > b { font-size: 20px; font-weight: 800; line-height: 1; letter-spacing: -.01em; }

    /* One row per cause, all of them measured off the same centre line: gains
       to the right of it, losses to the left. The sign is therefore carried by
       WHICH SIDE a bar is on and by the signed figure beside it, and the colour
       only agrees — which is what keeps the block legible to a reader who
       cannot tell this green from this red, and they are the worst pair alive
       for exactly that. */
    .rp-causes { margin-top: 9px; display: flex; flex-direction: column; gap: 7px; }
    .rp-cause { display: grid; grid-template-columns: 1fr auto; gap: 3px 8px; align-items: baseline; }
    .rp-cname { font-size: 11px; font-weight: 700; }
    /* NOT --good and --accent. Those are mark colours — right on the bar below
       and on the week's columns — and as 10.5px text on the panel's cream they
       come out at 3.0:1 and 3.6:1, under the 4.5:1 a figure this size owes a
       reader. These are the same two hues stepped down until they pass (5.1 and
       5.8), and the red is the one the heat pills and the warning tiles already
       use, so the shop still has one dark red rather than two. */
    .rp-cval { font-size: 10.5px; font-weight: 800; font-variant-numeric: tabular-nums; }
    .rp-cval.up { color: #3f7a3c; }
    .rp-cval.down { color: #a8442f; }
    .rp-ctrack {
      grid-column: 1 / -1; position: relative; height: 6px; border-radius: var(--r);
      background: rgba(58,49,40,.06);
    }
    /* The centre. A hairline rather than a gap, because with one row on each
       side a gap is invisible and the whole reading rests on there being a line
       both are measured from. */
    .rp-ctrack::before {
      content: ''; position: absolute; left: 50%; top: -1px; bottom: -1px;
      width: 1px; background: rgba(58,49,40,.2);
    }
    .rp-ctrack > i { position: absolute; top: 0; bottom: 0; display: block; }
    .rp-ctrack > i.up { background: var(--good); border-radius: 0 var(--r) var(--r) 0; }
    .rp-ctrack > i.dn { background: var(--accent); border-radius: var(--r) 0 0 var(--r); }

    /* The one row in the panel that is advice rather than measurement, and it
       has to look like it: a tinted card, the way the `Going wrong` tiles are,
       so it reads as a note ABOUT the bars above it rather than as another of
       them. No status colour at all — amber would make "what to do" look like a
       ninth thing going wrong, and the tile it sat under would be saying the
       same thing in a louder voice.

       The kicker is a block label rather than an inline lead-in because the
       sentence runs to three lines at this width, and a bolded phrase at the
       head of a paragraph is read as part of it. */
    .rp-fix {
      margin: 9px 0 0; padding: 7px 8px; border-radius: var(--r);
      background: rgba(58,49,40,.05);
    }
    .rp-fix > b {
      display: block; font-size: 9px; font-weight: 800; letter-spacing: .07em;
      text-transform: uppercase; opacity: .5; margin-bottom: 2px;
    }
    /* .8 rather than the .55 the panel's captions wear: this is an instruction,
       and it is read once and acted on rather than skimmed past. */
    .rp-fix > span { display: block; font-size: 10.5px; line-height: 1.4; opacity: .8; }

    /* --- the shop ------------------------------------------------------- */
    .rp-meter { display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; margin-bottom: 8px; }
    .rp-mname { font-size: 11px; font-weight: 700; }
    .rp-mval { font-size: 10.5px; opacity: .55; font-variant-numeric: tabular-nums; }
    /* The empty part of the track is a lighter step of the fill rather than
       neutral grey, so how full it is reads across the whole bar. */
    .rp-mtrack {
      grid-column: 1 / -1; height: 5px; border-radius: var(--r);
      background: rgba(90,163,86,.18); overflow: hidden;
    }
    .rp-mtrack > i {
      display: block; height: 100%; border-radius: var(--r);
      background: var(--good); transition: width .25s ease;
    }
    .rp-clear { margin: 0; font-size: 11px; opacity: .55; line-height: 1.4; }

    /* ---- a menu with more rows than fit ----------------------------------
       What the thing IS stays at the top, what you can DO stays at the bottom,
       and the list between them scrolls. Sticky rather than a three-pane flex
       rebuild of #panel-body, because `.tabs` already pins itself this way and
       #panel-body is already the scroller — one mechanism, not two.

       The background has to be opaque or the rows scroll visibly *through* the
       pinned parts; --panel is the same colour the panel is already painted. */
    .pnl-head, .pnl-foot { position: sticky; z-index: 2; background: var(--panel-solid); }
    .pnl-head {
      top: calc(-1 * var(--panel-pad)); padding-top: var(--panel-pad);
      border-bottom: 1px solid var(--line);
    }
    .pnl-foot {
      bottom: calc(-1 * var(--panel-pad)); padding-bottom: var(--panel-pad);
      border-top: 1px solid var(--line);
    }
    /* Its own border is the divider; the heading's would double it. */
    .pnl-foot .sep { border-top: 0; margin-top: 0; }
    /* ...and the same doubling at the OTHER end, which is the identical fault
       and was simply never looked at: `.pnl-head` closes with a border, and the
       first heading in the scroller opens with one, so every fixture menu in the
       game drew two rules four pixels apart under its own title. It reads as a
       stray divider rather than as two correct borders meeting, which is why it
       survived — you have to be looking at an empty band to see it, and until
       the conveyor cards moved up there the first thing under the title was
       always a heading with rows under it. Only the FIRST, so headings between
       two lists keep the rule that separates them. */
    .pnl-mid > .sep:first-child { border-top: 0; margin-top: 0; }

    /* The verbs, as one row of squares rather than five labelled lines.
       Deliberately the mirror of `.tabs` at the other end of the panel: the
       same trade, the same size, the same reason — 214px does not have room
       for five words AND the list they act on. Tabs choose what you are
       looking at, these do something to it, and having them read as a matched
       pair top and bottom is worth more than either being prettier alone. */
    .fx-verbs { display: flex; gap: 3px; padding: 4px 0 2px; }
    .fx-verb {
      /* `min-width: 0` or the longest caption sets every square's width and the
         row overflows the panel instead of five equal columns ellipsising. */
      flex: 1; min-width: 0; position: relative;
      display: flex; flex-direction: column; align-items: center; gap: 1px;
      /* The top padding is a BAND RESERVED FOR THE BADGE, and it is on every
         square rather than only the ones wearing one. Both badges are absolute
         at `top: 0`, so they used to be laid over the first 4px of the icon —
         which is why a row of identical buttons read as unevenly spaced: they
         measure the same to the pixel (36 tall, icon at 5, caption at 21), and
         the two with `Del` and `+$85` on them looked crowded against the two
         without. Reserving it on all six is what keeps the icons on one line;
         reserving it only where a badge exists would fix the crowding and
         introduce the unevenness it was mistaken for. */
      padding: 5px 2px 4px; border: 0; border-radius: var(--r); background: transparent;
      color: var(--ink); opacity: .55; font: inherit; font-size: 13px; cursor: pointer;
      transition: opacity .1s, background .1s;
    }
    /* The word under the icon, and it is not decoration: a tooltip is a hover,
       and half of this game is played with a finger. Same treatment the build
       bar's `.tool .nm` gets, for the same reason. */
    .fx-verb .ico { font-size: 15px; line-height: 1; }
    .fx-verb .nm {
      max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      font-size: 9.5px; font-weight: 700; letter-spacing: -.01em;
    }
    /* `:not(.off)` on both, which is the whole of what makes the grey mean
       anything. The hover sets `opacity: 1` and outranks `.fx-verb.off`'s .25 on
       specificity, so a refused square LIT UP under the pointer — brighter than
       its neighbours, wearing the same lift every live verb wears, over a press
       `disabled` then swallows. A button that looks pressable and is not is the
       green-ghost rule wearing a hover. */
    html.can-hover .fx-verb:not(.off):hover { opacity: 1; background: rgba(58,49,40,.07); }
    html.can-hover .fx-verb.danger:not(.off):hover {
      background: rgba(190,60,45,.12); color: var(--accent);
    }
    /* Refused, not missing. It keeps its place in the row so the four you can
       press never shuffle sideways under your thumb, and `disabled` is what
       stops the press — greying without it is a button that lies. The `title` is
       deliberately still there: the pointer gets no feedback from the square, so
       the tooltip is the only thing that says WHY. */
    .fx-verb.off { opacity: .25; cursor: default; }
    /* A verb that is a TOGGLE, and currently on. Amber rather than the accent
       `armed` uses: red is "one press from something you cannot undo", and a
       camera that is following somebody is neither a warning nor a decision —
       it is a state, and it has to be readable as one from the same glance that
       reads Let go as dangerous. */
    .fx-verb.on {
      opacity: 1; background: rgba(217,155,31,.18);
      box-shadow: inset 0 0 0 1px rgba(217,155,31,.5);
    }
    html.can-hover .fx-verb.on:hover { background: rgba(217,155,31,.28); }
    /* One press from something that cannot be taken back. It has to be loud
       here in a way it did not have to be as a row: a row said "Tap again to
       let them go" in words, and a caption has no room for a sentence. */
    .fx-verb.armed {
      opacity: 1; background: var(--accent); color: #fff;
    }
    html.can-hover .fx-verb.armed:hover { background: var(--accent); color: #fff; }
    /* THE PRESS, which these had no version of at all.
       Hover said "you can press this" and `disabled` said "you cannot", and
       between them was the press itself — nothing. On a desktop that is a
       button that swallows a click silently; on a phone, where there is no
       hover to have said anything in the first place, it is the whole of the
       feedback missing, on the six most-used buttons in the game.

       Listed for both input kinds rather than under `html.can-hover`: a finger
       is the case that needs it most. Doubled up so it outranks the hover rules
       above, which carry `html.can-hover` and would otherwise win on
       specificity and hold the lighter plate under a finger that is still down.

       Firmer plate plus a 1px nudge — the ink-weight step the HUD uses
       everywhere, rather than a shadow. Deliberately outside the `transition`
       above: a press wants to land on the frame you pressed, where a hover
       wants to fade in. */
    .fx-verb:not(.off):active,
    html.can-hover .fx-verb:not(.off):active {
      opacity: 1; background: rgba(58,49,40,.16); transform: translateY(1px);
    }
    .fx-verb.danger:not(.off):active,
    html.can-hover .fx-verb.danger:not(.off):active {
      background: rgba(190,60,45,.26); color: var(--accent);
    }
    /* The two lit states press DARKER than their own resting colour rather than
       toward the neutral one, or an armed square goes grey for the length of the
       press it is warning you about. */
    .fx-verb.on:not(.off):active,
    html.can-hover .fx-verb.on:not(.off):active { background: rgba(217,155,31,.42); }
    .fx-verb.armed:not(.off):active,
    html.can-hover .fx-verb.armed:not(.off):active {
      background: #a8442f; color: #fff;
    }
    .fx-verb svg { display: block; }
    /* The price or the count — the two things an icon cannot say. Same corner
       and same treatment the build bar's `.have` badge uses. */
    /* The key that does this without the button. Top LEFT, because the badge
       above owns top right and a price is the thing you came here to read. Same
       weight and the same faintness the rail's own `.kb` uses, so a key cap
       reads as a key cap wherever it is. */
    .fx-verb .kb {
      position: absolute; top: 1px; left: 4px;
      font-size: 8px; font-weight: 800; line-height: 1;
      opacity: .35; pointer-events: none;
    }
    .fx-verb .have {
      position: absolute; top: 0; right: 2px;
      font-size: 9px; font-weight: 800; line-height: 1;
      color: var(--good); opacity: .95; pointer-events: none;
      font-variant-numeric: tabular-nums;
    }

    /* One fixture's own menu. The read-out at the top says what this thing is
       doing right now; the rows below are what you can do about it. */
    .fx-detail { padding: 4px 8px 5px; }
    /* Tight on purpose: this block is pinned, so every pixel it takes is one
       the scrolling list below it does not get. */
    .fx-line { display: flex; justify-content: space-between; gap: 12px; padding: 1px 0; font-size: 11.5px; }
    .fx-line span { opacity: .55; font-weight: 600; }
    .fx-line b { font-weight: 800; text-align: right; }
    /* The same two marks the supplier's count column makes — nothing on the
       shelf, and some of it on a van — said in the item's own read-out. Their
       own rule rather than reaching for `.row .held`'s: that one is scoped to a
       list row, and a colour that only worked because of where it was standing
       is the thing that breaks the day somebody moves it. */
    .fx-line i.none { font-style: normal; opacity: .3; }
    .fx-line i.coming {
      font-style: normal; font-size: 9.5px; font-weight: 800;
      color: var(--good); margin-left: 2px; opacity: .9;
    }

    /* The item, beside its figures. The same well the section rows stand their
       art in (`.sec-row .bico.art`) at the size a head can afford — one of it,
       against a row's twenty-six pixels. `flex: none` because the figures are
       the elastic half: a long "arriving 2pm" line must eat its own width. */
    .im-head { display: flex; align-items: flex-start; gap: 9px; }
    .im-figures { flex: 1; min-width: 0; }
    .im-art {
      flex: none; width: 46px; height: 40px; padding: 3px; border-radius: var(--r);
      background: radial-gradient(120% 100% at 50% 18%, rgba(255,255,255,.9), rgba(58,49,40,.055));
      box-shadow: inset 0 0 0 1px rgba(58,49,40,.06);
    }
    .im-art svg { width: 100%; height: 100%; display: block; }

    /* ---- one item's own menu ----------------------------------------------
       Everything the supplier row used to carry in the gap between a name and a
       buy button, at the width of the panel: what you charge, the standing
       order, and whether the crew may buy it at all.

       A row here is one decision — what it is, what it means, and the control —
       and the control is 32px of thumb rather than the 15px squares a list row
       could afford. That size IS the feature: the old steppers were a mouse's
       control on a game half of which is played with a finger, and no amount of
       restyling a 430px row was going to find the room. */
    .im-set {
      display: flex; align-items: center; gap: 8px;
      padding: 7px 6px; border-radius: var(--r);
    }
    html.can-hover .im-set:hover { background: rgba(58,49,40,.04); }
    /* The elastic column, and the only one that may shrink — a caption that
       ellipsises is a caption you can still read the start of, where a stepper
       that shrinks is a button you miss. */
    .im-what { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
    .im-what b { font-size: 12.5px; font-weight: 800; }
    .im-what span {
      font-size: 10.5px; font-weight: 600; opacity: .55; line-height: 1.25;
    }
    .im-step {
      flex: none; display: flex; align-items: center; gap: 3px;
      background: rgba(58,49,40,.06); border-radius: var(--r); padding: 3px;
    }
    /* Fixed and tabular, or every press shuffles the buttons under your thumb
       as the number gets wider — the same rule the row's `.stp b` made at a
       third of the size. */
    .im-step b {
      min-width: 54px; text-align: center; font-size: 13px; font-weight: 800;
      font-variant-numeric: tabular-nums;
    }
    /* Unset is a dash, not a zero: "no minimum" and "a minimum of nothing" are
       different sentences, and on the price it is the difference between a
       number you chose and the shop choosing for you. */
    .im-step b.none { opacity: .3; }
    .im-step button {
      width: 32px; height: 32px; flex: none;
      border: 0; border-radius: var(--r); background: rgba(58,49,40,.07);
      color: var(--ink); font: inherit; font-size: 17px; font-weight: 800;
      line-height: 1; cursor: pointer; display: grid; place-items: center;
      --sil: inset 0 0 0 1px var(--crease);
      box-shadow: var(--sil), var(--edge);
    }
    html.can-hover .im-step button:hover { background: rgba(58,49,40,.16); }
    .im-step button:active { background: rgba(58,49,40,.22); }
    /* Hand the decision back. A word rather than a glyph, because "clear this"
       and "step this" are the two presses on the row and a third square would
       read as a third step. */
    .im-clear {
      flex: none; border: 0; border-radius: var(--r); padding: 0 9px; height: 26px;
      background: rgba(58,49,40,.08); color: var(--ink); font: inherit;
      font-size: 11px; font-weight: 800; opacity: .6; cursor: pointer;
      --sil: inset 0 0 0 1px var(--crease);
      box-shadow: var(--sil), var(--edge);
    }
    html.can-hover .im-clear:hover { opacity: 1; background: rgba(58,49,40,.16); }
    /* The one control here that is a state rather than a number. Off is the
       loud one, exactly as it was on the row: "never order this" is the
       exception, and the default has nothing to say for itself. */
    .im-tog {
      flex: none; display: flex; align-items: center; gap: 5px;
      border: 0; border-radius: var(--r); padding: 0 11px; height: 38px;
      background: rgba(58,49,40,.07); color: var(--ink); font: inherit;
      font-size: 14px; cursor: pointer;
      --sil: inset 0 0 0 1px var(--crease);
      box-shadow: var(--sil), var(--edge);
    }
    .im-tog i { font-style: normal; font-size: 11.5px; font-weight: 800; }
    .im-tog svg { display: block; width: 1em; height: 1em; }
    .im-tog.on { opacity: .8; }
    html.can-hover .im-tog.on:hover { opacity: 1; background: rgba(58,49,40,.14); }
    .im-tog.off { background: rgba(190,60,45,.13); color: var(--accent); opacity: 1; }
    html.can-hover .im-tog.off:hover { background: rgba(190,60,45,.2); }
    /* What it is, in its own words, under the figures. The tags are what the
       whole game is built on (`shared/tags.js`) and the one line in here that
       is about the thing rather than about the money. */
    .im-tags {
      font-size: 10px; font-weight: 700; letter-spacing: .01em;
      opacity: .4; padding-top: 3px;
    }
    /* Margin as a percentage beside it in money, because neither says it alone:
       40c is good on a 60c carrot and nothing on a $16 bottle. */
    .im-pct { font-style: normal; font-size: 10px; opacity: .5; margin-left: 3px; }
    /* The heat pill again, in the title bar this time — the panel names the
       item, so the one thing the world thinks about it belongs up there with
       the name. Same shape and colours `.row .heat` uses. */
    #panel-title .heat {
      flex: none; padding: 0 5px; border-radius: var(--r);
      font-size: 9.5px; font-weight: 800; font-variant-numeric: tabular-nums;
    }
    #panel-title .heat.up { background: #d8f0d2; color: #3f7a3c; }
    #panel-title .heat.down { background: #f6dcd7; color: #a8442f; }
    /* One recipe and what it wants. Ingredients are counted against the hopper,
       so the row that isn't green is the reason the machine is standing idle. */
    /* A recipe is ONE row: what it is on the left with its batch size stacked
       under the name, and what it wants drawn on the right. It was a row per
       ingredient, then a header row over a chip row — and a four-input recipe is
       still two rows of that, which on a machine with two heads is four. The
       batch size has nowhere it needs to be except near the name, so it goes
       under it and buys the chips the rest of the line. */
    .fx-recipe {
      border-top: 1px solid var(--line); margin-top: 5px; padding-top: 4px;
      display: flex; justify-content: space-between; align-items: center; gap: 10px;
    }
    /* The name on the left, then the ingredients and the button that buys them
       packed together on the right. `margin-left: auto` and not a third gap:
       under `space-between` the free space would otherwise be split either side
       of the chips, which floats them in the middle of the row and reads as the
       button belonging to the row rather than to the goods next to it. */
    .fx-recipe .fx-chips { margin-left: auto; }
    .fx-recipe-h { display: flex; flex-direction: column; font-size: 11.5px; }
    .fx-recipe-h span { font-weight: 800; }
    /* Small enough to read as a note on the name rather than as a second line of
       the list, which is the whole reason it can share the row. */
    .fx-recipe-h b { font-weight: 700; opacity: .45; font-size: 10px; }
    /* Goods on a machine, drawn rather than named — the hopper, what it is
       making, what is on the tray, and a recipe's ingredients, which were a ROW
       PER INGREDIENT and are one row now. See `chip` in fixture-menu.js.

       `inline-flex` and NOT the log's inline chip: these are a row of their own
       rather than words in a sentence, so there is no baseline to share and the
       number wants centring against the picture. Wrapping, because `.fx-line`
       is a two-column row and four chips on a phone have to go somewhere other
       than off the right-hand edge.

       The plate behind the art is the board tip's and the log chip's, for the
       same reason both have it: item art is authored in shop colours, so a dark
       loaf on a cream card is a smudge whatever somebody authors next. */
    .fx-chips { display: inline-flex; flex-wrap: wrap; gap: 4px; justify-content: flex-end; }

    /* The machine's three states as one row of tiles — `.rp-tile`'s shape from
       the Shop report, sized for chips instead of a 17px figure. `min-width: 0`
       is what lets three of them share a narrow panel: without it a flex item
       floors at its content width and the widest hopper pushes the other two
       off the edge. */
    .fx-cards { display: flex; gap: 5px; padding: 1px 0 3px; }
    .fx-card {
      flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; gap: 3px;
      padding: 5px 6px; border-radius: var(--r); background: rgba(58,49,40,.05);
    }
    .fx-card > span:first-child {
      font-size: 9px; font-weight: 700; opacity: .5;
      text-transform: uppercase; letter-spacing: .04em;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    /* Left-aligned inside a tile, where the same chips are right-aligned against
       a `.fx-line`'s label — a tile IS the label, so there is nothing to push
       them away from. */
    .fx-card .fx-chips { justify-content: flex-start; }
    .fx-card > i { font-style: normal; opacity: .3; font-size: 11px; font-weight: 700; }
    /* A card whose content is words rather than goods — the soil, how far a crop
       has come. Wraps rather than ellipsising: a tile is as tall as the tallest
       in its row anyway, so a second line costs nothing the row was not already
       paying, where a clipped "needs turning" costs the sentence. */
    .fx-card > .fx-cval { font-size: 11px; font-weight: 800; line-height: 1.25; }
    .fx-chip {
      display: inline-flex; align-items: center; gap: 2px;
      padding: 1px 5px 1px 1px; border-radius: var(--r);
      background: rgba(58,49,40,.05);
      font-size: 11px; font-weight: 800; font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }
    .fx-chip > svg { width: 17px; height: 17px; display: block; flex: none; }
    /* A chip carrying a NAME rather than a count. `nowrap` is right for `4/8`
       and wrong for "Apple Trees", which is wider than a third of a 236px panel
       and overflowed its tile into the one next door — so the crop's name sat
       across the percentage beside it. Wrapping rather than ellipsising for the
       reason `.fx-cval` does: the tiles are already as tall as the tallest of
       them, so a second line is free, and a name is the whole content here. */
    .fx-chip.wide { white-space: normal; max-width: 100%; }
    .fx-chip.wide > b { min-width: 0; }
    /* An item whose row was deleted has no art, so the name goes in the chip or
       the count is standing next to nothing. */
    .fx-chip > i { font-style: normal; font-weight: 600; opacity: .55; padding-left: 2px; }
    /* Short and enough, in the two colours the ingredient rows already used.
       Stepped down from `--accent`/`--good` for the reason the Shop report's
       warning tiles are: these are 11px figures on a tinted ground, where the
       mark colours come out under 4.5:1. */
    .fx-chip.short b { color: #c8553d; }
    .fx-chip.ok b { color: #4e9a4e; }
    /* One board, one line: name, count, price, and the button that takes an
       armful. It used to be two lines — the name and count, then a "Price" row
       under it — so a shelf holding three things read as six rows and you had
       to pair them up by eye. A stepper reading `− $8.50 +` does not need the
       word Price in front of it; sitting on the same line as the name is what
       says which board it belongs to. */
    .fx-board {
      display: flex; align-items: center; gap: 5px;
      padding: 2px 0; font-size: 11.5px;
    }
    /* What the columns on a board row are, said once across the top instead of
       four times over in four tooltips. Same argument the supplier's `.heads`
       makes and the same weight — caption type, because these name the list
       rather than being in it — and the same reason it is needed at all: a
       tooltip is a hover, and half this game is played with a finger.

       The widths are the row's own, spelled here rather than measured the way
       `paintSection` measures the supplier's: those columns are elastic and
       these are four fixed squares and two numbers, so a measured head would be
       arithmetic to arrive at the figures already written below. */
    .fx-heads {
      display: flex; align-items: flex-end; gap: 5px;
      padding: 3px 0 2px; margin-top: 2px;
      border-bottom: 1px solid var(--line);
      font-size: 8px; font-weight: 800; letter-spacing: .04em;
      text-transform: uppercase; opacity: .38;
    }
    /* The art column has no head — a picture of the thing needs no word — so
       the first label starts past it. */
    .fx-heads .h-nm { flex: 1; min-width: 0; margin-left: 25px; }
    /* Fixed, and the row's count column is fixed to match: an auto width here
       is the width of the word "Have" and there is the width of `12/20`, so the
       two would agree at one number and drift at every other. It also stops the
       row twitching sideways as a shelf sells down, which is the same rule the
       steppers keep about their own figure. */
    .fx-heads .h-qty { width: 46px; text-align: right; }
    /* The stepper is three controls wide and its label belongs over the number
       in the middle of them, not over the minus. */
    .fx-heads .h-price { width: 94px; text-align: center; }
    /* Wide enough for the WORD, not for the button. ORDER and CLEAR are about
       thirty pixels at this size, so a head cut to the 24px square underneath it
       ran its label into the one next door — three words touching, which reads
       as one long word. The square grew to match rather than the label
       shrinking: a bigger button is the right answer on a phone anyway, and a
       head that has to be read at 7px is a head nobody reads. */
    .fx-heads .h-btn { width: 30px; text-align: center; }

    /* One board being dragged up or down the unit (`wireBoardOrder`). Lifted
       off the list rather than merely tinted: the whole gesture is that the row
       has come loose, and a row that only changed colour reads as one that is
       selected while the list reorders itself for reasons of its own. */
    .fx-boards { touch-action: pan-y; }
    /* A row you can pick up says so at rest. The hand is the one cursor that
       means "this is a thing, not a target" — and it is only on the row itself,
       so the four controls sitting in it keep the pointer that says they are
       buttons. Two rows or more, which is also when `wireBoardOrder` binds
       anything: a lone board has nowhere to go, and a grab cursor over a
       gesture that cannot happen is the green-ghost bug wearing a pointer. */
    .fx-boards:has(.fx-board + .fx-board) .fx-board { cursor: grab; }
    .fx-boards .fx-board button { cursor: pointer; }
    /* ...and closed while it is up. The row is off the list and following your
       finger, so the hand that offered to take it has taken it. */
    .fx-board.moving, .fx-board.moving * { cursor: grabbing; }
    .fx-board.moving {
      background: rgba(217,155,31,.16); border-radius: var(--r);
      box-shadow: 0 3px 10px rgba(58,49,40,.18);
      position: relative; z-index: 1;
    }
    /* The goods on that board, drawn. Smaller than the section rows' well and
       with no ground under it: those are 26px in a two-line row, and this is one
       line of a list of three, where a lit tile per row would read as three
       buttons rather than as three labels. */
    .fx-bart {
      flex: none; width: 20px; height: 18px; display: block; opacity: .95;
    }
    .fx-bart svg { width: 100%; height: 100%; display: block; }
    /* A board kept for something that has not landed is already dimmed as a
       whole (`.fx-board.pending`); the art goes with it rather than being the
       one bright thing on a row that is a promise. */
    .fx-board.pending .fx-bart { opacity: .55; }
    /* The one flexible column, and the only one allowed to lose: an authored
       item name has no length limit and everything to its right is a control
       that stops working if it shrinks.

       It carried a `title` of its own name, which is the trap `rowHtml` names
       about captions: a tooltip repeating the text underneath it is a second
       copy of the answer, and an opaque one, so hovering the row to read a name
       covers the rows either side of it. What a clipped name actually needs is
       the room, and the columns to its right have just been sized to leave it
       some. */
    .fx-board .nm {
      flex: 1; min-width: 0; font-weight: 700; opacity: .85;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    /* How many, over what it holds — the capacity dimmed, because the number
       that moves is the first one and it now has a price sat next to it. */
    .fx-board .qty {
      flex: none; width: 46px; text-align: right;
      font-weight: 800; font-variant-numeric: tabular-nums;
    }
    .fx-board .qty i { font-style: normal; font-weight: 700; opacity: .4; }
    /* What is on a van, hung off the board's own count the way the supplier
       hangs it off the shelf count — same colour, same reason. Green because it
       is the answer to the low number beside it, and small because it is a
       promise: you cannot sell it yet, and a row that shouted it would read as
       though you could. It overrides the dimmed `/cap` above rather than sitting
       next to it, or the news would be the faintest thing on the row. */
    .fx-board .qty i.coming {
      font-size: 9.5px; color: var(--good); opacity: .95; margin-left: 2px;
    }
    /* A board that is only a promise: kept for something, with nothing on it yet.
       It has to read as lighter than a board with goods on it — the two are the
       same row and the difference between them is the whole point of the count —
       but not as *disabled*, because two of its buttons work and ordering some is
       the reason you are looking at it. So the name and the count dim and the
       controls do not. */
    .fx-board.pending .nm, .fx-board.pending .qty { opacity: .5; }
    /* The stepper itself is shared — a hire's job weights use it too (`wk-w`),
       so what is specific to a board row is scoped to one below rather than
       left here to move somebody else's buttons. */
    .fx-price { display: flex; align-items: center; gap: 2px; font-size: 11.5px; }
    .fx-board .fx-price { margin-left: 3px; }
    .fx-price b { font-weight: 800; min-width: 46px; text-align: center; font-variant-numeric: tabular-nums; }
    .fx-price button {
      border: 0; background: rgba(58,49,40,.09); color: var(--ink); border-radius: var(--r);
      width: 22px; height: 22px; font: inherit; font-weight: 800; line-height: 1; cursor: pointer;
      display: grid; place-items: center; padding: 0;
      --sil: inset 0 0 0 1px var(--crease);
      --edge: var(--edge-sm); --press: var(--press-sm);
      box-shadow: var(--sil), var(--edge);
    }
    html.can-hover .fx-price button:hover { background: rgba(58,49,40,.18); }
    /* Same as `.fx-take:disabled` below and for the same reason — a stepper on a
       board with nothing to price is drawn so the row keeps its grid, and one
       drawn identically to a live one is a button that looks like it works. */
    .fx-price button:disabled { opacity: .25; cursor: default; background: transparent; }
    html.can-hover .fx-price button:disabled:hover { background: transparent; }
    .fx-take {
      border: 0; background: rgba(58,49,40,.09); color: var(--ink); border-radius: var(--r);
      width: 30px; height: 22px; font-size: 12px; cursor: pointer; flex: none;
      display: flex; align-items: center; justify-content: center;
      --sil: inset 0 0 0 1px var(--crease);
      --edge: var(--edge-sm); --press: var(--press-sm);
      box-shadow: var(--sil), var(--edge);
    }
    html.can-hover .fx-take:hover { background: rgba(58,49,40,.18); }
    .fx-take:disabled { opacity: .25; cursor: default; background: transparent; }
    .fx-take svg { display: block; }
    /* Delete this board. Quiet until you are over it — it sits next to a button
       you press all the time, and a red bin on every row would read as a shelf
       full of warnings. Never disabled: an empty board is exactly the one you
       most want gone, and the goods land in a crate rather than nowhere. */
    .fx-clear { opacity: .45; }
    html.can-hover .fx-clear:hover { opacity: 1; background: rgba(200,85,61,.16); color: var(--accent); }
    /* Order more of this board. Disabled is the interesting state and it is a
       sentence rather than a shrug — "6 already on the way" and "the bay is
       full" are both in the title, because a greyed-out button that never says
       why is the thing that reads as broken. */
    .fx-order:not(:disabled) { color: var(--good); }
    html.can-hover .fx-order:not(:disabled):hover { background: rgba(90,163,86,.18); }
    .fx-act { cursor: pointer; align-items: flex-start; }
    html.can-hover .fx-act:hover { background: rgba(58,49,40,.07); }
    .fx-act .bico { font-size: 14px; line-height: 1.2; width: 18px; text-align: center; }
    .fx-act .name { gap: 2px; }
    .fx-act .tags { line-height: 1.35; }
    .fx-act .price { color: var(--good); }
    .fx-act.danger .price { color: var(--accent); }
    /* Greyed out rather than hidden: "you need at least one till" is the whole
       answer to why the button isn't there, and hiding it never says so. */
    .fx-act.off { cursor: default; opacity: .42; }
    html.can-hover .fx-act.off:hover { background: none; }

    /* ---- one hire's own menu ---------------------------------------------
       A PROFILE: the machine on the left, everything read off it on the right.
       It was five label-and-value lines stacked down a pinned head, which is a
       spec sheet for a thing you never see — a bot spends the game two tiles
       away with its back to you, and this menu is the one place it can be stood
       up and turned round. */
    .wk-profile { position: relative; display: flex; gap: 10px; padding: 6px 8px 7px; }

    /* The well the avatar turns in — the same radial the palette stands its art
       in, at the size a portrait wants. `overflow: hidden` is doing real work:
       it is the window the filmstrip below slides past. */
    .wk-face {
      flex: none; position: relative; width: 78px; height: 86px;
      border: 0; padding: 0; border-radius: var(--r); overflow: hidden;
      background: radial-gradient(120% 100% at 50% 16%, rgba(255,255,255,.95), rgba(58,49,40,.075));
      box-shadow: inset 0 0 0 1px rgba(58,49,40,.07);
      color: var(--ink); font: inherit;
    }
    /* Only a shop with more than one look gets a button here — see `avatar`. */
    button.wk-face { cursor: pointer; }
    html.can-hover button.wk-face:hover { box-shadow: inset 0 0 0 1.5px rgba(58,49,40,.2); }
    /* The same handle the palette tile wears on the same gesture, so a hold is
       a thing you can see is on offer rather than one you have to be told. */
    .wk-face .more { position: absolute; right: 4px; bottom: 2px; font-size: 10px; opacity: .35; }
    html.can-hover button.wk-face:hover .more { opacity: .9; }

    /* THE TURNTABLE, and it is a filmstrip rather than a renderer: `thumb.js`
       hands over twenty-four stills of the same bot at fifteen degrees apart,
       laid in one row `--n` faces wide, and this slides it one face at a time.
       `steps(var(--n))` never reaches the -100% it animates to — it stops one
       frame short — which is exactly the frame before the first one comes round
       again. Nothing ticks, nothing is measured, and the whole animation costs a
       transform.

       The phase comes in as a NEGATIVE `animation-delay` from the menu, because
       this element is rebuilt every time the panel redraws. See `avatar`. */
    .wk-turn {
      display: flex; height: 100%; width: calc(100% * var(--n));
      /* Longhands rather than the shorthand, because the delay arrives inline
         and the two have to be read as one animation — a shorthand here would
         also be re-declaring the delay it is being handed. */
      animation-name: wk-spin;
      animation-duration: var(--spin);
      animation-timing-function: steps(var(--n));
      animation-iteration-count: infinite;
    }
    @keyframes wk-spin { to { transform: translateX(-100%); } }
    .wk-turn > span { flex: none; width: calc(100% / var(--n)); height: 100%; padding: 6px; }
    /* A kind nobody drew a model for. One still, in the same well. */
    .wk-still { display: block; height: 100%; padding: 6px; }
    .wk-turn svg, .wk-still svg { width: 100%; height: 100%; display: block; }
    /* A card you are reading, so the one moving thing on it gives way. */
    @media (prefers-reduced-motion: reduce) { .wk-turn { animation: none; } }

    /* What is read off them. Doing spans the block because it is the only one
       that is a sentence and the only one that moves while you watch; the four
       standing figures go in two columns under it, which is where the head got
       back the forty pixels the avatar costs. `auto-fit` so the same block is
       one column on a phone rather than two squeezed to an ellipsis. */
    .wk-facts { flex: 1; min-width: 0; }
    .wk-facts > .fx-line {
      border-bottom: 1px solid var(--line); padding-bottom: 4px; margin-bottom: 3px;
    }
    .wk-grid {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(132px, 1fr));
      column-gap: 14px;
    }
    /* One line per figure, whatever the content says. A rung is NAMED by
       content ("New behind the counter"), so the one cell in here that can be
       four words long is the one nothing in this file controls — and wrapped it
       took the label beside it out of line with the row above, which reads as a
       broken grid rather than as a long name. The whole of it is on the hover,
       the same deal every row in this panel makes with its caption.
       `min-width: 0` because a flex child will not shrink past its content
       without it, and an ellipsis that never triggers is not an ellipsis. */
    .wk-grid .fx-line { align-items: baseline; }
    .wk-grid .fx-line b {
      min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }

    /* The paints, out of the avatar you held. Rows are `.shape` — the build
       bar's shape card, which is the same question with the same shape of
       answer — so only where it hangs is new. Positioned against `.wk-profile`
       and not the head, because the head is `position: static` while the panel
       is paned and would hand the card the whole panel to be measured from. */
    .wk-skins {
      position: absolute; z-index: 5; left: 8px; top: calc(100% - 6px);
      display: flex; flex-direction: column; gap: 2px;
      width: 188px; max-width: calc(100% - 16px); max-height: 232px; overflow-y: auto;
      background: var(--panel-glass); border-radius: var(--r); padding: 5px;
      backdrop-filter: blur(14px) saturate(1.15);
      -webkit-backdrop-filter: blur(14px) saturate(1.15);
      box-shadow: 0 10px 24px rgba(58,49,40,.28), inset 0 0 0 1px rgba(58,49,40,.09);
    }
    /* A bot is taller than it is broad, where a shelf is the other way about —
       so the well `.shape` stands its picture in gets the other proportion
       here. Everything else about the row is the build bar's. */
    .wk-skins .shape { padding: 3px 8px 3px 3px; }
    .wk-skins .shape .ico.art { width: 30px; height: 36px; }

    /* The directives, in TWO COLUMNS. It is a fixed vocabulary of eight short
       rows and one column of them was a scroll for no reason — with the tabs
       gone and the head shorter, the whole list now sits on screen at once,
       which is the difference between reading a hire's shift and hunting
       through it. `auto-fit` again, and again for the phone. */
    .wk-jobs {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(184px, 1fr));
      column-gap: 4px;
    }
    /* The dial on each job row. It borrows the fixture price control wholesale
       — same buttons, same tabular value — and only shrinks it, because a
       weight is one digit where a price is five. */
    .wk-w { flex: none; gap: 4px; padding: 0; }
    .wk-w b { min-width: 16px; font-size: 11px; }
    .wk-w button { width: 24px; height: 24px; }
    .wk-job { padding: 3px 4px; }
    .wk-job .name { padding: 2px 0; }

    /* What is left of their day, in the heading of the list that spends it.
       There is one pot and nine rows drawing on it, so the count belongs above
       all of them rather than on any one — and it is the reason the standing
       paragraph explaining what a weight is could go: a number running out
       under your thumb says it where you are pressing. */
    .sep .wk-cap {
      float: right; font-size: 10px; letter-spacing: 0; opacity: .85;
      font-variant-numeric: tabular-nums;
    }
    .sep .wk-cap i { font-style: normal; opacity: .5; }
    /* Only ever reached by rolling firmware BACK — a rung takes points away and
       deliberately does not touch the list, so this is somebody carrying more
       than they are allowed until you trim them. It has to be visible: every `+`
       in the list is dead until it clears, and a dead stepper with nothing
       saying why is the thing that reads as broken. */
    .sep .wk-cap.over { color: var(--accent); opacity: 1; }

    /* How much is left in the tank. The bar sits behind the word rather than
       beside it, because the row is already two columns wide and a third one
       would push the label onto its own line. */
    .wk-energy {
       position: relative; display: inline-block; padding: 1px 7px;
       border-radius: var(--r); overflow: hidden; font-size: 11px;
    }
    .wk-energy i {
      position: absolute; inset: 0 auto 0 0; background: rgba(90,163,86,.28);
    }
    .wk-energy.low i { background: rgba(226,86,74,.3); }
    /* The build bar. Hidden entirely unless you're building — the shop floor is
       the game, and a permanent toolbar would make it look like a level editor.

       Two tiers, because the palette is a database anyone can add to: tabs for
       what sort of thing, then that tab's entries in a strip that scrolls
       sideways. A flat row could only show its first nine, which is why there
       used to be a second copy of this palette in a panel. */
    /* No `gap`. The only gap this column ever had was the one between the hint
       and the bar, and the hint carries it as a margin of its own now so that it
       can animate away with it — a gap belongs to the parent and cannot go, so a
       collapsed hint would leave 6px of nothing above the bar. */
    #build {
      bottom: var(--nav-top); left: 50%; transform: translate(-50%, 26px); opacity: 0;
      display: flex; flex-direction: column; align-items: center;
      pointer-events: none; transition: .18s;
    }
    #build.on { opacity: 1; transform: translate(-50%, 0); pointer-events: auto; }
    /* ONE WIDTH, WHATEVER IS IN IT. It used to size to its contents under a 960px
       ceiling, and the bar is centred — so a tab with four things in it was half
       the width of a tab with twelve, and switching between them slid the whole
       bar, every tab on it and the tile under your pointer sideways. You cannot
       aim at a thing that moves because you looked at something else. A width
       that is the same on every tab means the tabs are always in the same place
       and the tiles always start at the same edge; a short tab has room to its
       right, which is what a strip that scrolls looks like when it doesn't need
       to. */
    #build-bar {
      display: flex; flex-direction: column; gap: 5px;
      /* GLASS, AND IT WENT AND CAME BACK — which is the useful part, because
         both of the arguments that took it away are now spent.
         The first was that a tile casting a solid black offset onto frosted
         glass is two lighting models in one strip. Gone: no tile casts anything
         any more (see `--cast`).
         The second was that a drawn card is opaque — the contour says where an
         object stops, and something you can see the shelves through has not
         stopped anywhere. That one turns out to be an argument about the LINE
         rather than about the fill, and the line is doing its own job now: it
         is the `::after` contour on an overlay, at full strength,
         wandering, and it says where the bar stops whatever is behind it.
         What glass buys back is the thing that was lost on purpose and missed:
         760px across the bottom of the shop is a WALL at full opacity, and this
         is the only surface in the game that samples the world it is sitting
         over. `--panel-glass` is never used without `backdrop-filter` — glass
         with no blur is a panel you read a shelf through, and the moment
         somebody paints a dark floor under the bar the labels go with it.
         The tiles stay opaque. They are objects standing ON the glass, and the
         one thing a palette must never do is make you squint at the picture of
         the thing you are buying.
         The contour is an `::after` overlay for the reason the panel gives —
         `#build-strip` bleeds to the wall with a negative margin and would
         paint an inset line out along the bottom of the bar. */
      background: var(--panel-glass); border-radius: var(--r); padding: 6px;
      backdrop-filter: blur(14px) saturate(1.15);
      -webkit-backdrop-filter: blur(14px) saturate(1.15);
      --line: var(--crease);
      box-shadow: var(--cast);
      width: min(760px, calc(100vw - 28px));
      /* What the shape card is positioned against. It hangs off the top of this,
         over the world, rather than being a row inside it — see `#build-shapes`. */
      position: relative;
    }

    /* TIER ONE AND TWO SHARE A ROW. They were two stacked rows, at two different
       visual weights, and the second of them came and went — so changing tab
       changed the height of the bar, and nothing on screen said which of the two
       rows `Tab` was steering. One row is one question (where am I) read left to
       right, and it is 25px of screen back. */
    #build-nav {
      display: flex; align-items: center; gap: 6px;
      padding-bottom: 5px; border-bottom: 1px solid var(--line);
    }
    /* The two tab rows, in one scroller. `min-width: 0` is the whole of what
       makes it scroll rather than push: a flex item's floor is its content, so
       without it the row simply grows past the bar and takes the close button
       with it — which is what a phone was getting. `flex: 1` claims the space
       the close button's `margin-left: auto` used to take off the end.

       Dragged and wheeled by `wireScroll` (client/scroll.js), and the ends are
       MASKED rather than faded with a `::before`: a scroll container's own
       pseudo-element is part of its content and slides off the end it is
       marking. Same 20px and the same reasoning as `.dtabs`, which is the same
       shape of strip one panel over. */
    #build-tabs {
      display: flex; align-items: center; gap: 6px;
      flex: 1; min-width: 0; overflow-x: auto; overflow-y: hidden;
      scrollbar-width: none; scroll-padding-inline: 12px;
      touch-action: pan-x;
    }
    #build-tabs::-webkit-scrollbar { display: none; }
    #build-tabs.more-back {
      mask-image: linear-gradient(90deg, transparent 0, #000 20px);
      -webkit-mask-image: linear-gradient(90deg, transparent 0, #000 20px);
    }
    #build-tabs.more-on {
      mask-image: linear-gradient(270deg, transparent 0, #000 20px);
      -webkit-mask-image: linear-gradient(270deg, transparent 0, #000 20px);
    }
    #build-tabs.more-back.more-on {
      mask-image: linear-gradient(90deg, transparent 0, #000 20px, #000 calc(100% - 20px), transparent);
      -webkit-mask-image: linear-gradient(90deg, transparent 0, #000 20px, #000 calc(100% - 20px), transparent);
    }
    #build-groups { display: flex; gap: 3px; flex: none; }
    /* `margin-left: auto` and not `flex: 1` on anything else: the tabs above are
       deliberately content-width, so the free space in this row is space — and an
       auto margin claims it without any other cell having to know this button
       exists. Sized like a tab so the row keeps one height. */
    /* The ? sits in the ✕'s well and wears its manners — same size, same fade,
       same corner — because it is the same tier of control: a thing about the
       bar rather than a thing you build with. It takes the `margin-left: auto`
       so the pair travels together as one block on the right, and the ✕ then
       sits against it rather than re-claiming the gap. */
    #build-help {
      margin-left: auto; border: 0; background: none; color: inherit;
      font: inherit; font-size: 14px; font-weight: 800; line-height: 1; cursor: pointer;
      opacity: .5; padding: 5px 8px; border-radius: var(--r);
      transition: background .12s, opacity .12s;
    }
    #build-help[hidden] { display: none; }
    html.can-hover #build-help:hover { opacity: 1; background: rgba(58,49,40,.11); }
    #build-help:active { background: rgba(58,49,40,.2); }
    #build-help:focus { outline: none; }
    #build-help:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
    /* ...and with a ? in the row, the ✕ stops being the thing that pushes the
       pair right. */
    #build-help:not([hidden]) ~ #build-close { margin-left: 0; }

    #build-close {
      margin-left: auto; border: 0; background: none; color: inherit;
      font: inherit; font-size: 14px; line-height: 1; cursor: pointer;
      opacity: .5; padding: 5px 7px; border-radius: var(--r);
      transition: background .12s, opacity .12s;
    }
    html.can-hover #build-close:hover { opacity: 1; background: rgba(58,49,40,.11); }
    #build-close:active { background: rgba(58,49,40,.2); }
    #build-close:focus { outline: none; }
    #build-close:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
    /* WHICH STOREY. A segmented pair, sat in its own well so the two chips read
       as one control with a position in it rather than as two buttons that
       happen to be next to each other — the whole job of this thing is to say
       where you ARE, and a lone pressed button says that about half as loudly.

       Sized and coloured off `.subcat` next door, because it is the same tier of
       question (which part of the palette am I in) asked about the other axis.
       It sits between the scroller and the ✕, so it has a fixed address on a row
       whose left half moves. */
    #build-deck {
      display: flex; gap: 2px; flex: none; margin-left: 8px;
      padding: 2px; border-radius: var(--r); background: rgba(58,49,40,.07);
    }
    #build-deck[hidden] { display: none; }
    #build-deck button {
      display: flex; align-items: center; gap: 5px;
      border: 0; border-radius: var(--r); background: transparent; cursor: pointer;
      font: inherit; font-size: 10.5px; font-weight: 800; color: var(--ink);
      opacity: .45; padding: 3px 9px; white-space: nowrap;
      transition: opacity .1s, background .1s, box-shadow .1s;
      --sil: inset 0 0 0 1px var(--crease);
