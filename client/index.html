       under it was empty while the only picture of that button was a mark drawn
       round the real one — which you have to have found before you can see it.
       So the well shows the button, cloned out of the live HUD. See `mockOf` in
       client/tutor.js for what comes off the clone on the way in.

       Almost nothing is styled here on purpose: the clone keeps its own classes,
       so it is drawn by the same rules the real button is and cannot drift from
       it. What this adds is the two things a button in a well needs and a button
       on the HUD does not — a scale (set per control by `mockAt`, since the HUD
       has a size dial and the well is a fixed 168px) and the guarantee that
       nothing in the copy can be pressed or tabbed to. */
    .tt-mock { transform-origin: center; pointer-events: none; }
    .tt-mock * { pointer-events: none; }
    /* ---- a KEY, under the words --------------------------------------------
       One row per mark: the mark drawn at the size it reads at, and the sentence
       beside it. It exists because the two green stocking arrows were a clause
       in the middle of a paragraph — "a solid arrow means that shelf has some
       already, a see-through one means it starts a new pile" — which is two
       abstractions held in the head at once by somebody who has seen neither
       arrow, with the real ones three tiles away in the shop.

       UNDER the hint and never in the picture well above it: the well holds
       what the card is ABOUT, which on that card is the shelf, and a key to two
       marks is a footnote with pictures in it. */
    .tt-legend { display: flex; flex-direction: column; gap: 7px; margin: 10px 0 0; }
    .tt-legend[hidden] { display: none; }
    .tt-key-row { display: flex; align-items: center; gap: 10px; }
    /* Fixed, so both sentences start on the same line whatever the marks are. */
    .tt-key-row svg { flex: 0 0 24px; width: 24px; height: 24px; display: block; }
    .tt-key-row span { font-size: 12px; line-height: 1.35; color: rgba(58, 49, 40, .78); }
    /* A PRESS in a legend row — the pill's own mouse, with the shop's own charge
       ring round it when the press is a held one. See `pressRow` in tutor.js.
       The glyph is authored for a dark slab where it is a faint outline; on
       paper it is the thing being pointed at, so it comes up to full strength
       and takes a fill exactly as it does on the drag card. */
    .tt-key-row .tt-press { color: var(--ink); }
    .tt-key-row .tt-press .pr-mouse rect { fill: var(--panel-solid); opacity: 1; }
    .tt-key-row .tt-press .pr-mouse path { opacity: 1; }
    /* Green, because that is the colour the ring winds in on the shop floor —
       the row is a picture of the thing you are about to watch happen. */
    .tt-key-row .tt-hold-arc {
      fill: none; stroke: var(--good); stroke-width: 2.4; stroke-linecap: round;
    }
    /* The one control that cannot be cloned. `#sign` and `#doorway` are styled
       against their own ids (see them above), so a copy with the id stripped is
       an unstyled box and a copy that kept it is a second `#sign` in the
       document — which is what `holeFor` would then find. It is drawn instead,
       from the same two facts: the shut colour, and four upright letters.
       `#a8442f` and not `--accent`, for the reason `#sign.shut` gives. */
    /* The card the strip is an EDGE of, cut off. A red rectangle on its own is
       not findable; "the left end of the readout in the corner" is. The mask is
       the honest way to say the picture stops rather than the card does — a hard
       right edge would draw a small card that is nowhere on screen. */
    .tt-hudcard {
      display: flex; align-items: stretch; gap: 8px;
      width: 118px; height: 72px; padding: 5px 0 5px 0; overflow: hidden;
      background: var(--panel); border-radius: var(--r);
      box-shadow: inset 0 0 0 var(--k2) var(--ink-soft), var(--cast-sm);
      -webkit-mask-image: linear-gradient(to right, #000 52%, transparent 100%);
      mask-image: linear-gradient(to right, #000 52%, transparent 100%);
    }
    /* Same margins `#sign` takes: it eats the card's padding on the three sides
       it meets, so it runs the full height and meets the left edge. */
    .tt-sign {
      display: grid; place-items: center;
      flex: 0 0 34px; margin: -5px 0; padding: 0;
      background: var(--good); color: #fff;
      box-shadow: inset -1px 0 0 var(--crease);
    }
    .tt-sign.shut { background: #a8442f; }
    /* Two bars where the day and the balance are. See `mockOf` for why they are
       bars. */
    .tt-rows {
      display: flex; flex-direction: column; justify-content: center; gap: 7px;
      flex: 1 1 auto; padding-right: 8px;
    }
    .tt-rows i { display: block; height: 7px; border-radius: var(--r); background: var(--ink-soft); }
    .tt-rows i:last-child { width: 68%; }
    /* The three corner gauges, blown up. Drawn rather than cloned for the
       reason `gaugeArt` gives — `mockOf` strips the inline width that IS the
       bar — and about twice the size of the real thing, which is 42x5 in the
       corner of the screen and unreadable at any honest scale. The two colours
       come out of the same variables the HUD paints with, so a repaint takes
       the card with it. */
    .tt-gauges {
      display: flex; flex-direction: column; gap: 9px;
      width: 118px; padding: 11px 12px;
      background: var(--panel); border-radius: var(--r);
      box-shadow: inset 0 0 0 var(--k2) var(--ink-soft), var(--cast-sm);
    }
    .tt-gg { display: grid; grid-template-columns: 26px 1fr; align-items: center; gap: 7px; }
    .tt-gtag {
      font-size: 7px; font-weight: 800; letter-spacing: .04em;
      text-transform: uppercase; opacity: .5; text-align: right;
    }
    /* Same shape as `.repwrap`, twice up: a track with a 1px line round it, so
       an amber bar a third of the way along still reads as a bar rather than as
       a dash. */
    .tt-gtrack {
      height: 8px; border-radius: var(--r); overflow: hidden;
      box-shadow: inset 0 0 0 1px rgba(23, 18, 25, .5);
    }
    .tt-gtrack i { display: block; height: 100%; background: var(--good); }
    .tt-gtrack i.low { background: var(--warn); }
    .tt-sign span {
      writing-mode: vertical-rl; text-orientation: upright; text-align: center;
      font-size: 8px; font-weight: 800; line-height: 1;
      letter-spacing: .12em; text-transform: uppercase;
    }
    /* The one part that gives when the window is short. */
    .tt-said {
      flex: 1 1 auto; min-height: 0; overflow-y: auto;
      padding: 15px 16px 4px;
    }
    /* A card with no predicate is a thing to READ and has the room to be read:
       there is no instruction under it and no target lit for it, so the words
       sit in the middle of the card rather than at the top of a column of
       nothing. */
    .tt-card.big .tt-said { display: flex; flex-direction: column; justify-content: center; }
    .tt-card.big .tt-say { font-size: 18px; }
    .tt-say { margin: 0; font-size: 16px; font-weight: 650; line-height: 1.32; }
    .tt-hint {
      margin: 8px 0 0; font-size: 12.5px; line-height: 1.5;
      color: rgba(58, 49, 40, .68);
    }
    /* A paragraph break inside a card's copy — a blank line in the string. See
       `keyed` in client/tutor.js for why it is a spacer rather than a second
       `<p>`. Sized off the type it separates rather than in px, so it is the
       same gap on the say and on the hint. */
    .tt-gap { display: block; height: .8em; }
    /* Waiting on the world rather than on you — the van. The card says so by
       breathing, because a step you cannot complete and a step you have not
       understood are otherwise the same card. */
    .tt-card.holding .tt-say { animation: ttwait 1.8s ease-in-out infinite; }
    @keyframes ttwait { 0%, 100% { opacity: 1; } 50% { opacity: .55; } }

    /* Pinned to the bottom of the card rather than following the words, which
       is most of what the fixed height buys: Next and Skip are in the same two
       places on all thirteen beats instead of walking up and down as the hint
       gets longer. */
    .tt-feet {
      flex: 0 0 auto; display: flex; align-items: center; gap: 8px;
      padding: 10px 16px 12px; border-top: 2px solid var(--line);
    }
    /* Where you are, as ticks. A "4 of 18" invites you to work out how much is
       left, which is not the question the card wants asked. */
    .tt-nav { display: flex; align-items: center; gap: 5px; flex: 1; }
    .tt-arrow {
      font: inherit; cursor: pointer; padding: 0 4px; border: 0; background: none;
      color: rgba(58, 49, 40, .38); font-size: 15px; line-height: 1;
    }
    .tt-arrow:disabled { opacity: .3; cursor: default; }
    html.can-hover .tt-arrow:not(:disabled):hover { color: var(--ink); }
    .tt-dots { display: flex; gap: 3px; flex-wrap: wrap; align-items: center; }
    /* A 5px dot is not a press, and the hit area may not cost a pixel of
       layout: padded out, twelve of them no longer fit the feet, and the row
       wraps onto a second line that the dots themselves are too tall to sit on.
       So the target is a pseudo-element hung off the dot — off the flow, so the
       row is the width and height it always was. */
    .tt-dots button {
      position: relative; width: 5px; height: 5px; border-radius: var(--r);
      background-color: rgba(58, 49, 40, .18);
      border: 0; padding: 0; cursor: pointer;
    }
    .tt-dots button::after { content: ''; position: absolute; inset: -8px -1.5px; }
    .tt-dots button.was { background-color: rgba(58, 49, 40, .38); }
    .tt-dots button.at { background-color: var(--good); transform: scale(1.5); }
    .tt-next, .tt-skip {
      font: inherit; cursor: pointer; border-radius: var(--r); padding: 5px 11px;
      border: 1px solid var(--line); background: transparent; color: rgba(58, 49, 40, .6);
      font-size: 11px;
    }
    /* The one green press on the card, so it takes the solid side everything
       else you press in here takes — a flat fill was the last thing on this
       card still reading as a web button. */
    .tt-next {
      background: var(--good); border-color: transparent; color: #fff;
      font-weight: 650; font-size: 12px; padding: 6px 16px;
      box-shadow: var(--edge);
    }
    .tt-next[hidden] { display: none; }
    /* The step's own offer, and it is a SENTENCE rather than a button on
       purpose. A labelled button in the feet is a press with no question
       attached — somebody who has never played does not know what a build tool
       is, let alone that the game is holding some back — so the words do the
       asking and the answer is a link inside them, the shape everything else on
       this card already uses. It sits with the hint rather than in the feet,
       because it is small print about the shop and the feet are about the tour. */
    .tt-offer {
      margin: 8px 0 0; font-size: 11.5px; line-height: 1.42;
      color: rgba(58, 49, 40, .68);
    }
    .tt-offer[hidden] { display: none; }
    .tt-link {
      font: inherit; cursor: pointer; padding: 0; border: 0; background: none;
      color: var(--good); font-weight: 650; text-decoration: underline;
      text-underline-offset: 2px;
    }
    .tt-link[hidden] { display: none; }
    html.can-hover .tt-skip:hover { color: var(--ink); border-color: rgba(58, 49, 40, .3); }
    html.can-hover .tt-link:hover { text-decoration-thickness: 2px; }

    /* THE TOOLTIP USED TO BE KILLED HERE, and taking that out is a fix rather
       than a relaxation.

       `body.tutoring #tip { display: none !important }` was written when the
       card was pinned beside the thing it was pointing at, under a veil where
       exactly one press was possible: the tip landed on top of the card, saying
       a shorter, worse version of the sentence already on it. Neither half of
       that is true any more. The card is a slab down one edge, the veil is
       gone, and every other press in the shop stays live — so what the rule
       actually did was switch off the ONLY explanation half the HUD has. A
       palette tile, a rail button and a hire tile are a picture and a price;
       what they are is in the tip and nowhere else, and a lesson runs for as
       long as somebody reads it.

       There is nothing left to collide with, either: the card is
       `pointer-events: none` (see the rule above), so nothing on it can be
       hovered, and its own buttons carry no `data-tip`. */

    #award {
      position: fixed; inset: 0; z-index: 45;
      display: grid; place-items: center; padding: 16px;
    }
    #award[hidden] { display: none; }
    .award-back {
      position: absolute; inset: 0; background: rgba(58, 49, 40, .42);
      opacity: 0; transition: opacity .18s ease;
    }
    #award.show .award-back { opacity: 1; }

    .award-card {
      position: relative; width: min(340px, 100%);
      /* The gold band IS the top of the card, and the medal overlaps the seam
         between it and the cream. One background layer rather than a strip of
         markup: what makes it read as a trophy plaque is the hard line. */
      /* The band stops ABOVE the name, not through it. At 86px it ended
         halfway down the title, so the one line on the card you actually read
         was dark brown over gold for its top half and dark brown over cream for
         its bottom half, with rays behind the join — legible nowhere and
         unreadable at a glance. The band's whole job is to hold the medal and
         the kicker; the name belongs on the plain cream under it, which is
         where every other piece of text in this game is read.
         FLAT, AND THE SEAM IS AN INK LINE. It was a ramp from `#ffd66b` down to
         a `#f6b73c` nothing else in the game uses, ending on cream with no edge
         — which is two rules broken at once: the shop is cel-shaded in flat
         steps, and where one surface stops another is a CONTOUR. So it is the
         one gold this chrome already has (`.tab.on`, `.menu-btn.go`, the armed
         build slot) with the card's own weight ruled under it, which is
         `.menu-art`'s line said about a band that is painted rather than drawn.
         The richness went where richness belongs — on the medal, which is an
         object being depicted rather than a surface being drawn. */
      background:
        linear-gradient(#ffd66b 0 calc(66px - var(--k1)),
                        var(--ink-line) calc(66px - var(--k1)) 66px) 0 0 / 100% 66px no-repeat,
        var(--panel-solid);
      border-radius: var(--r); padding: 44px 18px 16px; text-align: center;
      /* CRATE. This was a 44px blurred cast with a white ring inset into it —
         a card lit from somewhere the shop is not, with a rim of paper light
         that says "app" rather than "object". The cast that is left says the
         one thing a drawing cannot, which is that this is nearer than the shop
         it has stopped; the side under it is the card's own thickness at the
         card weight; and the line round it is an overlay (see below). */
      box-shadow: var(--cast), 0 var(--d1) 0 rgba(23, 18, 25, .28);
      /* The medal is drawn OUTSIDE this box (see below), so the overflow has to
         be visible and the rays get their own mask instead. */
      overflow: visible;
      /* EVERY HAIRLINE INSIDE IT IS A CREASE, which is `#panel`'s and
         `.menu-box`'s declaration for their own subtrees: the card is one
         object and the things standing in it are recesses, not cards. */
      --line: var(--crease);
      /* ...and this screen's controls are 38–44px, the front door's size rather
         than the HUD's 26–40, so the side is 3px. Redefining the token is what
         lets the ONE press rule at the foot of this file press them. */
      --edge: 0 3px 0 var(--ink-line); --press: 3px;
    }
    /* The contour as an overlay rather than an inset shadow on the card itself,
       for the reason every other card in here does it: the gold band is a
       background and a shadow on the box is painted under it, so an inset ring
       would be buried along the whole top sixth of the card. Same rule as
       `#panel::after` and `.tt-card::after` — and `.award-card` is already
       positioned, so it does not walk into the containing-block trap that rule
       warns about. */
    .award-card::after {
      content: ''; position: absolute; inset: 0; z-index: 1;
      pointer-events: none; border-radius: inherit;
      box-shadow: inset 0 0 0 var(--k1) var(--ink-line);
    }

    /* The sunburst, behind the medal, turning slowly. A conic gradient rather
       than a fan of divs: it is one element, it costs one paint, and the wedges
       stay even at any size. Masked to a circle so it fades out rather than
       ending on a square edge halfway across the gold band. */
    .award-rays {
      position: absolute; top: -54px; left: 50%; width: 200px; height: 200px;
      margin-left: -100px; pointer-events: none;
      background: repeating-conic-gradient(
        from 0deg, rgba(255,255,255,.55) 0deg 9deg, rgba(255,255,255,0) 9deg 22deg);
      -webkit-mask-image: radial-gradient(circle, #000 24%, transparent 62%);
      mask-image: radial-gradient(circle, #000 24%, transparent 62%);
      animation: award-spin 18s linear infinite;
    }
    @keyframes award-spin { to { transform: rotate(360deg); } }

    /* The medal: a disc pushed up out of the card, which is the whole shape of
       the thing. `top` is negative against the card, so it breaks the plaque's
       top edge rather than sitting inside a padded box like every other icon in
       the HUD.
       ONE OF THREE THINGS THAT KEPT ITS CIRCLE when the UI squared off, and the
       line is what the thing IS: this is an object being depicted, not a surface
       being drawn. A medal is round the way the sun is round and the tutorial's
       reticle is round. Everything that is a panel, a button or a chip takes
       `--r`. */
    /* Over the card's own contour, which the medal breaks rather than sits
       inside — the overlay above is drawn last and would otherwise rule a line
       straight across the disc. */
    .award-medal {
      position: absolute; top: -34px; left: 50%; transform: translateX(-50%);
      z-index: 2;
      width: 68px; height: 68px; border-radius: 50%;
      display: grid; place-items: center; font-size: 34px; color: #7a4d10;
      background: radial-gradient(circle at 34% 28%, #fff7d6, #ffe28a 42%, #e8a52c);
      /* THE LINE IS OUTSIDE IT, and that is the whole change: what was here was
         a 3px white ring set INTO the gold, which is a rim of paper light on an
         object made of metal — the last "app card" mark on this screen. A ring
         drawn outside is the contour every other object in the game wears, at
         the control weight because a 68px disc is a control-sized thing rather
         than a card. The soft cast stays: the medal genuinely is lifted off the
         plaque, which is the shape of the whole ornament. */
      box-shadow: 0 0 0 var(--k2) var(--ink-line), var(--cast-sm);
    }
    /* Same reason as `.ico > svg` up the top: an inline SVG sits on the text
       baseline, which inside a 68px disc is visibly a few pixels low. */
    .award-medal > svg { display: block; }

    /* `--ink-line` on gold, which is what `.menu-btn.go` settled on for the one
       other place this chrome sets type on this exact colour. The brown it wore
       was a fourth gold-adjacent tone nobody had chosen against the others, at
       80% — a kicker that is already 11px and tracked does not also need to be
       faint to be quiet. */
    .award-kicker {
      font-size: 11px; font-weight: 800; letter-spacing: .16em;
      text-transform: uppercase; color: var(--ink-line); opacity: .72;
    }
    /* Clear of the band by 8px. The kicker runs 44→60 inside a 66px band, so
       the title starts at 68 — on cream, with the rays already faded out behind
       it. Move either number and check they still miss each other. */
    .award-name {
      margin: 8px 0 0; font-size: 22px; font-weight: 800; letter-spacing: -.02em;
      color: var(--ink);
    }
    .award-blurb {
      margin: 8px 4px 12px; font-size: 12.5px; line-height: 1.45; opacity: .65;
    }

    /* What you got. A list rather than a sentence: three short rows are read at
       a glance and a paragraph is read once, and this card is on screen for
       about four seconds. */
    .award-got { list-style: none; margin: 0 0 10px; padding: 0;
                 display: flex; flex-direction: column; gap: 6px; }
    /* A RECESS IN THE CARD, not a card in the card. A tinted fill with no line
       at all is the one shape on a drawn screen that is only a fill; a contour
       on it would be a second outline eighteen pixels inside the first. So it
       takes the crease, which is what `#panel`, `.menu-box` and the build
       palette's own tiles all put round a thing standing in a card. */
    .award-got li {
      display: flex; align-items: center; gap: 9px; text-align: left;
      background: rgba(58,49,40,.06); border-radius: var(--r); padding: 7px 11px;
      box-shadow: inset 0 0 0 1px var(--crease);
    }
    .award-got .aico { font-size: 17px; line-height: 1; }
    .award-got .atext { display: flex; flex-direction: column; min-width: 0; }
    .award-got b { font-size: 13.5px; font-weight: 800; }
    .award-got i { font-style: normal; font-size: 11px; opacity: .55; }

    /* The town, which is the number this whole feature exists to make visible —
       nothing else in the HUD has ever shown it. */
    .award-town {
      display: flex; align-items: baseline; justify-content: center; gap: 6px;
      font-size: 11.5px; opacity: .6; margin-bottom: 12px;
    }
    .award-town:empty { display: none; }
    .award-town b { font-size: 17px; font-weight: 800; opacity: .9; color: var(--good); }

    /* THE ONE PRESS ON THE CARD. Its side was `0 3px 0 rgba(0,0,0,.15)` — a
       wash of black under a green face, which on cream reads as a smudge rather
       than as thickness — and it had a `:active` of its own that half-closed it.
       Both are the pair the chrome pass took out everywhere else: a side is a
       FACE of the object, so it is a darker cut of the face above it the way
       `.menu-btn.go`'s is, and the press is the one rule at the foot of this
       file. The line on top is the same argument as `.menu-btn.go`'s: a
       coloured button with no contour at all is a fill on a drawing. */
    .award-go {
      width: 100%; border: 0; font: inherit; cursor: pointer;
      background: var(--good); color: #fff; font-weight: 800; font-size: 14px;
      border-radius: var(--r); padding: 9px;
      --sil: inset 0 0 0 var(--k2) var(--ink-line);
      --edge: 0 3px 0 #3d7139;
      box-shadow: var(--sil), var(--edge);
      transition: background .12s;
    }
    html.can-hover .award-go:hover { background: #6ab465; }
    .award-more { font-size: 11px; opacity: .5; margin-top: 7px; }
    .award-more:empty { display: none; }

    /* The tip jar, under the button, on three rungs out of forty-five. A hairline
       above it because it is the one thing on this card that is not about the
       milestone — without the rule it reads as another line of the award. */
    .award-tip {
      margin-top: 12px; padding-top: 11px;
      border-top: 1px solid var(--line);
    }
    .award-tip:empty { display: none; }
    .award-tip p { margin: 0 0 8px; font-size: 11.5px; opacity: .65; }
    /* Deliberately NOT `.award-go`'s green, and deliberately not `--accent`.
       The card already has exactly one loud button on it and this must not be a
       second: the same thing the front door's jar is, so the two places this is
       ever offered are recognisably the same offer.
       AND IT IS NOT A TILE ANY MORE, because that jar stopped being one. It
       wore a cream face with a 2px wash line round it, which on a card that now
       has a drawn contour of its own is a second object in the footer competing
       with the green press above it — `.menu-under`'s argument word for word.
       So: no fill, no line, no side, half opacity until you point at it, which
       is `#panel-close`'s treatment for a control that is not part of the job.
       Opacity is honest here for the reason it is honest there and nowhere else
       on a drawn screen — there is no contour on this to fade. */
    .award-tip a {
      display: inline-flex; align-items: center; gap: 7px;
      font-size: 11.5px; font-weight: 700; color: var(--ink);
      text-decoration: none; cursor: pointer;
      opacity: .5; transition: opacity .12s;
    }
    .award-tip a svg { display: block; flex: none; }
    html.can-hover .award-tip a:hover { opacity: 1; }

    /* In with an overshoot, the same curve the tooltip springs on — it is the
       one motion in the game that is allowed to be pleased with itself. */
    #award.show .award-card { animation: award-pop .34s cubic-bezier(.34, 1.56, .64, 1); }
    @keyframes award-pop {
      from { opacity: 0; transform: translateY(18px) scale(.9); }
      to { opacity: 1; transform: none; }
    }

    @media (max-width: 720px) {
      /* Top, not the right-hand edge. A phone is portrait, so "out of the way"
         stops being a side and becomes an end — parked halfway up, the card
         lands square over the shop, which is the one thing every beat is
         pointing at. The top is also the half a thumb never reaches, and the
         bar along the bottom is where the verbs are. */
      /* ...and the height has to come off with the width, or the portrait shape
         above lands as a 533px column down a phone screen — most of the display,
         over the one thing every beat is pointing at. A banner is as tall as its
         sentence, so the feet come back to following the words: they are pinned
         to the bottom of a card that is only ever three lines tall, which is the
         same place. */
      /* ...bounded all the same. `height: auto` is what makes it a banner as
         tall as its sentence, and with nothing over it a long page grows past
         the bottom of the screen — where `overflow: hidden` takes the feet off
         rather than letting the words give, so Skip goes with them. The cap
         restores the desktop rule's promise: the card is bounded and
         `.tt-said` is the part that gives. */
      .tt-card {
        right: 8px; left: 8px; top: 64px; transform: none;
        width: auto; max-width: none; height: auto;
        max-height: calc(100vh - 80px);
      }
      .tt-card.big .tt-said { display: block; }
      /* ...AND THE PICTURE STANDS BESIDE THE WORDS RATHER THAN OVER THEM.
         The well is a 168px block, which is right down a portrait card and is
         most of the SCREEN across a phone: a banner three lines tall grows to
         about five hundred, lands back over the shop the beat is pointing at,
         and the words it was making room for go under the fold with the feet.
         So the picture is a square beside the sentence — small enough to leave
         the copy the width of the banner, big enough to still be a picture of
         the thing, and on the left because that is the order it is read in.

         A GRID and not a float, which is not a preference: the card is a flex
         column, and a float inside a flex container does nothing at all — the
         obvious spelling here is silently a no-op. The band and the feet span
         both columns; the head row is `auto`, so a card with no picture
         collapses that column to nothing rather than leaving a gutter, which is
         what keeps this from needing a second rule for every wordy card. */
      .tt-card { display: grid; grid-template-columns: auto 1fr; align-content: start; }
      .tt-head, .tt-feet { grid-column: 1 / -1; }
      /* The bottom margin is not symmetry for its own sake. Down the portrait
         card the well is followed by the words, which bring their own padding;
         across the banner it is followed by the FEET, whose rule is a border on
         top — so with `0` the picture sits about 8px off a hairline while its
         other three sides have 13. It reads as the card having been cut off. */
      .tt-art {
        width: 108px; height: 108px; padding: 7px;
        margin: 13px 0 13px 14px; align-self: start;
      }
      /* `min-width: 0` or a long unbroken word in the copy pushes the column
         wider than the card and the picture off the left-hand edge. The bottom
         padding is 4 down the tall card because the words scroll to the feet
         there; here they end above them. */
      .tt-said { min-width: 0; padding-bottom: 13px; }
      /* The band's own row can grow; the body's must not, or a short card
         stretches its picture down an empty banner. */
      .tt-card.big .tt-said { grid-column: 1 / -1; }
      @keyframes ttpop { from { opacity: 0; transform: translateY(-8px) scale(.98); } }

      #log { display: none; }
      .tool { min-width: 52px; padding: 6px 8px 5px; }
      /* Narrower, but still ONE width — see the rule above. A roster that
         stopped shifting on a desktop and went on shifting on a phone would be
         the same bug with a media query in front of it. */
      #build.browse .tool { width: 84px; min-width: 84px; max-width: 84px; }
      .cat { padding: 5px 6px; }
      /* The open tab keeps its label — it is the one thing naming where you are,
         and the inactive four have been icons at every width since the nav rows
         merged. */
      .subcat { padding: 3px 7px; }
    }

    /* ---- narrow: the corner column stops being a corner --------------------
       Everything in the top left is pinned to a corner, which is a decision
       made once about a screen with slack in it. #stats is about 440px wide and
       the two widgets are 146 under it, so at 400px of viewport three separate
       things go wrong and only one of them is visible: the card runs off the
       right-hand edge, the meter is a third of the world, and `--hq-left` — the
       clearance the to-do chips take from the card's own measured width — is
       WIDER THAN THE SCREEN, so every chip is parked off it entirely. That last
       one is the reason this is a query rather than a tidy-up. #hq's own note
       says the bug arrives on somebody else's monitor rather than on yours;
       this is that monitor.

       So the card becomes a BAR: full width, hard against the top, and ONE ROW
       — it never wraps. The "nothing in here shrinks" rule above is right and
       is right for the same reason at any width, so what buys the row back is
       cells LEAVING rather than being squeezed — which is what the gauges' three
       labels did here for a while, and what the season and the sparkline did at
       a narrower width still, until both left the card at every width.

       The demand meter and the radio go entirely, and that is the same call one
       step further: they are the two things up here you CONSULT, both of them
       already optional (client/corner.js puts either away and the Menu brings it
       back), and neither survives being shrunk — twelve labelled rows and a
       scrolling title are readouts made of small text, so a phone-sized one is a
       widget you cannot read sitting over the shop you are trying to play.
       `display: none` rather than the class corner.js toggles, because this is
       not a thing you chose and must not be filed as though it were: the widget
       comes straight back on the same save at a wider window.

       640px rather than the 720 the block above uses. That one is about how
       wide a row of palette buttons is; this one is about a 440px card. Two
       questions, two widths — one shared number is two rules that have to move
       together for ever, and nothing would say which had asked for it. */
    @media (max-width: 640px) {
      #topleft { top: 0; left: 0; right: 0; gap: 6px; }
      /* Square along the top edge. A shadow all the way round is what makes a
         corner readout a card floating over the shop; a bar that IS the top of
         the screen has no top corners to round, and rounding them anyway draws
         two slivers of sky above a panel that is supposed to be the edge. */
      #stats {
        width: 100%; border-radius: 0 0 var(--r) var(--r);
        /* No offset here. The card is full bleed and welded to the top of the
           screen, so a shadow cast down-and-right hangs off the right edge and
           the three sides it would lift the card off are not on screen. The
           contour is unaffected — it is on `::after` and the bottom edge of it
           is the one that does any work on a phone. */
        box-shadow: none;
        padding: 5px 8px; gap: 8px;
        /* The corner card's floor is there to keep four upright letters whole
           at 8px type — see the note beside it, and the one below about what
           the sign used to do to this bar. Everything here is scaled up about a
           tenth, so the readouts clear the word without being asked to, and the
           height is theirs. */
        min-height: 0;
      }
      /* THE SIGN USED TO DECIDE HOW TALL THE BAR IS, and that was the whole of
         "it looks shrunk": `#doorway` was a fixed 48px against readouts that
         come to about 32, which in a corner nobody can see and as a full-width
         bar across the top of a phone is sixteen pixels of empty cream above
         and below every figure in the HUD — not a bar that is too tall, small
         writing in a big bar. Two rules lived here to undo it.
         Both are gone because the cause is: the strip is sized by the card now
         and sets nothing. What is left is the one number that cannot be
         inherited — this bar carries its own horizontal padding (8, not 10),
         and the sign's left margin is exactly that padding cancelled. Two
         paddings, two margins; a single spelling would be one of them wrong. */
      #sign { margin-left: -8px; }
      /* ...and the other half of filling it: the figures grow into the room
         that was there all along. Every size in this card was set against a
         readout you glance at in the corner of a big screen, and this is the
         top of a phone held at arm's length. About a tenth on each, and on ALL
         of them rather than on the money alone — a panel where only some of it
         scaled reads as a panel with a mistake in it, which is the card's own
         rule said the other way up. The width it costs is real, and `#town`'s
         ellipsis above is what it is spent against. */
      #cash { font-size: 15.5px; }
      #clock { font-size: 12px; }
      #dow, #day { font-size: 10.5px; }
      .flow { font-size: 11.5px; }
      #town { font-size: 12px; }
      #town .tw { font-size: 8.5px; }
      .rows { column-gap: 10px; row-gap: 2px; }
      /* The one cell allowed to give, and the reason there has to be one: the
         card's rule is that nothing in it shrinks, which on a bar that must be a
         single row would mean the last group simply hangs off the end. The town
         is the right one to hand it to — its second line is a sentence
         ("55 town · 32%") rather than a figure, so it ellipsizes into a shorter
         sentence, where every other cell here would clip a number. */
      #town { min-width: 0; padding-left: 10px; }
      #town .tw { overflow: hidden; text-overflow: ellipsis; }
      /* The tags STAY. They were dropped here on the arithmetic — three 6.5px
         words is about 22px of a row that had none to spare — and the arithmetic
         stopped being true two changes ago, once the row was one line and the
         season and the sparkline had left the card entirely. Three
         unlabelled bars is the readout `.gg-tag` exists to prevent: they are a
         reputation, a mood and a room, they all fill rightwards, and which is
         which is a thing you would have to have learnt. The bars give the width
         instead — 34px still reads as a fraction, and the label is the half that
         cannot be inferred. */
      .gauges { padding-left: 10px; }
      .gg { grid-template-columns: 22px 34px; gap: 4px; }
      /* The bars scale with the type for the reason above: three 4px bars beside
         a 15.5px balance is the same "only some of it grew" the figures were
         just fixed for. Wider is what they cannot have here — 34px is the whole
         of what the row can spare — so what they get is taller. */
      .gg-tag { font-size: 7px; }
      .repwrap { width: 34px; height: 5px; }

      /* The chips clear the bar's HEIGHT, because there is no width left to
         clear: `--hq-left` is the card's width and the card is the screen. Same
         argument as that measurement, on the other axis — the bar takes a
         second line the day the shop is rich enough to need one, so how far
         down the chips start is a measurement rather than a number anybody may
         write down (`--hud-h`, see `watchTopLeft` in client/ui.js). The toast
         keeps its distance below the chips rather than its literal 66px, which
         was measured against a card in a corner. */
      #hq {
        top: calc(var(--hud-h, 46px) + 6px);
        padding-left: 8px; padding-right: 8px;
      }
      /* A pill is a shape for one line. A refusal is a sentence — "that shelf is
         set aside for Carrot, change it in the shelf's menu" — and at this width
         it is three of them, so the 99px radius cuts the corners off a block of
         text and the pill runs edge to edge with nothing between the words and
         the side of the screen. It is the same call the press card made: the
         shape has to come off how much there is to say, not off how much there
         was to say on a desktop.
         `max-width` and not a width — a short refusal is still a pill, and this
         only becomes a card when it has to. */
      /* `width: max-content` IS THE FIX, and the `max-width` beside it only
         bounds what that asks for. The toast is fixed with `left: 50%` and no
         width, so the space a shrink-to-fit box is offered runs from the middle
         of the screen to its right-hand edge — HALF the width, on an element
         that is then translated back to the centre. It wrapped at 195px of a
         390px screen and looked like a margin problem; the margin was never
         there to be wrong. */
      #toast {
        top: calc(var(--hud-h, 46px) + 58px);
        width: max-content; max-width: calc(100vw - 32px);
        border-radius: var(--r); padding: 8px 14px;
        text-align: center; line-height: 1.35;
      }

      /* The two consultations. See the note above for why they go rather than
         shrink, and why this is not `.corner-off`. */
      #rci, #radio { display: none; }

      /* ---- the press pill is a LIST here, not a row ------------------------
         It is one row divided into up to four entries, and `flex-wrap` was the
         answer to that not fitting — which is the wrong shape rather than a
         tight one: a wrapped row breaks wherever it runs out, so the divider
         between two entries lands mid-line and the second line starts with
         half a sentence. Four alternatives read as four ragged fragments.

         A column is what the thing always was: these are alternatives, one per
         press, and stacking them is the arrangement that says so at any width.
         The divider goes with it — a hairline ABOVE each entry rather than to
         its left, since left and right of what is now the only column means
         nothing — and `pr-r`'s reversal goes too: it exists to put a
         right-button mouse on its own outside edge, and there is no mouse here.

         The mouse itself is NOT dropped here, and that is the one rule in this
         block that belongs somewhere else — see the input query below. A narrow
         window on a desktop is still a desktop, and left-versus-right is the
         whole of what that glyph says. */
      /* Full width and a CARD, not a pill. `border-radius: 99px` is right for
         one line of text and is what makes a column of four look like a blob
         with a list inside it, and `left: 50%` + a centring transform cannot be
         full width by construction — so both go, and `.show`'s transform has to
         go with them or the reveal drags the whole card half a screen left. */
      #prompt {
        left: 8px; right: 8px; transform: translateY(8px);
        max-width: none; border-radius: var(--r); padding: 9px 10px;
        white-space: nowrap; font-size: 15px;
        /* TWO COLUMNS, AND THE COLUMN IS THE BUTTON. Left is what you take out,
           right is what you put in — which is the one thing the mouse glyph was
           saying, and it is not on a touchscreen (see the input query below), so
           the side has to carry it instead. That is also why it is a grid rather
           than two flex columns: the sides are fixed halves, so an aisle with
           nothing to put into it still draws its takes on the left rather than
           sliding them into the middle, and the two never swap places between
           one thing you point at and the next.
           `dense` is load-bearing: `.pr-r` names column 2 explicitly, and
           without backfilling, a right-hand entry listed after two left-hand
           ones is placed on the third ROW — a right column that starts below the
           left one, with a hole above it. */
        display: grid; grid-template-columns: 1fr 1fr;
        grid-auto-flow: row dense; gap: 4px 8px; align-items: stretch;
      }
      #prompt.show { transform: none; }
      #prompt .pr-say { grid-column: 1; }
      #prompt .pr-say.pr-r { grid-column: 2; }
      /* The name is about BOTH columns, so it spans them and sits above the
         split rather than in the left-hand one — a subject filed under "things
         you take out" would read as one of them. The divider goes with it: on
         this layout the rows are stacked, so a hairline down the left of the
         first one is a line pointing at nothing. */
      #prompt .pr-about { grid-column: 1 / -1; }
      #prompt .pr-about + .pr-say {
        margin-left: 0; padding-left: 0; border-left: 0;
      }
      /* The glyph goes here too, not only on a touchscreen. The row is a
         two-column grid and the mouse has no column of its own, so it lands in
         the tag's and shunts HOLD onto a second line — a picture of a button
         stacked above the word for how long to press it, which is two halves of
         one sentence drawn as two. It has nothing left to say anyway: the SIDE
         is which button, which is the whole point of the split above. */
      #prompt .pr-mouse { display: none; }
      /* ...unless there is only one side, in which case there is no split to
         make and the empty half is a column of nothing beside a column of
         buttons — which reads as something having failed to load rather than as
         a shop with nothing to put anything into. The side means "take, not
         put", and that is only a distinction when both are on offer. `:has` on
         the pill for both directions, because the absent half is what the rule
         is about and no child can say it is the only kind. */
      #prompt:not(:has(.pr-say.pr-r)) .pr-say,
      #prompt:not(:has(.pr-say:not(.pr-r))) .pr-say { grid-column: 1 / -1; }
      /* ...and TWO rows are one row, whichever buttons they belong to. The split
         is a reading aid — takes down one side, puts down the other — and with a
         pair there is nothing to read: you can see both at once, and putting
         them one above the other spends a second line to say something the eye
         got for free. Auto placement rather than a named column, so the pair
         fills the width in the order the presses are decided.
         `:has(:nth-child(2)):not(:has(:nth-child(3)))` is "exactly two", which
         is the only way to count children in a stylesheet — and counting is
         right here rather than a class from `paintPrompt`, because how many rows
         there are is what the layout is about and nothing else needs to know. */
      #prompt:has(.pr-say:nth-child(2)):not(:has(.pr-say:nth-child(3))) .pr-say {
        grid-column: auto;
      }
      /* ...AND THE KEYED ROW PAIRS WITH THE ONE ABOVE IT, which is the one place
         in this card where two rows are one sentence. Build mode's list is Open
         it / Move it / Turn it, and the third is not a third thing to do to the
         unit — R is a *modifier* on the one you have just picked up, the other
         half of positioning it. Stacked, it read as three equal verbs and left
         the card a column of three chips for a decision with two halves.
         The pair lands on the SECOND line rather than the first, and that falls
         out of the rule above it: the rows before it are still `1 / -1`, so
         `dense` finds row 1 full and puts both halves on row 2 side by side.
         Nothing to say for a mouse — a wide pill is one flex row and they are
         already on one line, which is the whole reason this lives in here.
         `:has(+ …)` is the previous-sibling selector the pairing needs: the row
         before the key is whichever verb the key modifies, and naming it by
         class would tie this to `Move it` for ever. */
      #prompt:not(:has(.pr-say.pr-r)) .pr-say.pr-k { grid-column: 2; }
      #prompt:not(:has(.pr-say.pr-r)) .pr-say:has(+ .pr-say.pr-k) { grid-column: 1; }
      /* THE TAG GETS A COLUMN. Stacked, the rows are four sentences that each
         start wherever the one before them ended — HOLD in front of two of
         them and not the other two — and a list whose left edge moves per row
         is the ragged thing wrapping was, one axis along. So each row is a
         two-column grid with the tag's column reserved whether or not that row
         has one, and every verb starts on the same line. */
      /* Centred in the button, and the tag's column comes with it: `38px 1fr`
         reserves a lane at the LEFT EDGE, so a row with no HOLD on it starts its
         verb 38px in from a button whose text is the only thing in it — a column
         of chips each indented past a gutter that is empty in half of them. What
         the reserved lane was for is the verbs lining up with each other, and
         inside a button they line up on the button. `auto auto` sizes the two
         cells to what is in them and `justify-content: center` puts the pair in
         the middle, so a row with a tag is [HOLD][verb] centred and a row
         without is [verb] centred. */
      #prompt .pr-say {
        display: grid; grid-template-columns: auto auto;
        justify-content: center; align-items: center; gap: 7px;
        text-align: center;
      }
      #prompt .pr-say.pr-r { flex-direction: row; }
      #prompt .pr-say > b { grid-column: 2; }
      #prompt .pr-hold { grid-column: 1; text-align: right; }
      /* The hairline goes with the row. It separated two entries that were
         side by side on one line; in a grid, "the entry before this one" is not
         the entry beside it or above it, so the same rule draws a line between
         two things that are not adjacent. Each entry is a pressable chip
         instead — which it now is (see the input query below), so the shape is
         saying what the thing does rather than only holding it apart. */
      #prompt .pr-say + .pr-say {
        margin-left: 0; padding-left: 0; border-left: 0; border-top: 0;
      }
      /* ...and the rows become presses HERE, on the width, rather than under the
         input query below. `pointer: coarse` is the honest test for "there is no
         right button" and it is the wrong one for this, twice: a phone in a
         desktop browser's device emulation does not reliably report it, so the
         buttons would be dead in the one place they get tested — and a genuinely
         narrow desktop window has the same problem the split solves, since the
         pill is the only thing on screen naming what a press would do.
         The pill itself keeps `pointer-events: none`: it is a caption over the
         middle of the shop, and one that ate clicks would be a strip of floor
         you could not reach. The rows take the pointer, the gaps between them
         still go to the shop. */
      #prompt { pointer-events: none; }
      #prompt .pr-say {
        background: rgba(58,49,40,.09); border-radius: var(--r); padding: 6px 9px;
        pointer-events: auto; cursor: pointer; text-align: left;
        /* A held press is the gesture here, and a browser reads a held press on
           a control as a request for its own menu, its own callout and a text
           selection — all three land in the middle of a winding ring. Same three
           the canvas turns off (`#game`), for the same reason and not by
           coincidence: this is the second surface in the game where how LONG you
           press is the input. The `contextmenu` half is document-wide, in
           client/main.js. */
        -webkit-tap-highlight-color: transparent;
        -webkit-touch-callout: none;
        touch-action: none; user-select: none; -webkit-user-select: none;
      }
      #prompt .pr-say:active { background: rgba(58,49,40,.2); }
      /* A dim chip does not press IN. It still takes the tap — that is how the
         reason gets said — but the chip darkening under a finger is the picture
         of a button working, and this one is not going to. `cursor: default`
         for the narrow-desktop case, where there is a pointer to change. */
      #prompt .pr-say.pr-off, #prompt .pr-say.pr-off:active {
        background: rgba(58,49,40,.09); cursor: default;
      }
      /* ---- the hold, drawn on the button ----------------------------------
         THE BUTTON IS THE RING. In the world a held press winds a ring on the
         thing you are pointing at, which is where you are already looking; on
         the pill you are holding a chip at the bottom of the screen while that
         ring turns somewhere behind your thumb, so the one gesture in the game
         that is *made of* its duration had nothing anywhere to say how long was
         left. It fills left to right off `--pr`, which `markPress` sets from the
         same `action.progress` the ring is drawn from — one number, so the two
         can never disagree about how far through you are.

         A gradient rather than a child element or a `::before`, because the row
         is rebuilt from `innerHTML` whenever its words change and anything
         inside it goes with them. Hard stops at the same position, so it is a
         bar with an edge rather than a smear — a soft one reads as a shadow.
         `background-color` stays under it as the chip's own fill, since a
         gradient with a transparent tail would show the pill through it. */
      #prompt .pr-say.pr-busy {
        background-image: linear-gradient(90deg,
          rgba(58,49,40,.26) 0 calc(var(--pr, 0) * 100%),
          rgba(0,0,0,0) calc(var(--pr, 0) * 100%));
      }
      /* Gone, and still in the way — deliberately. The press that was on its way
         to a row that just left has to land on something that does nothing, or
         it lands on the shop. Invisible (no `.show`, so opacity 0) and inert:
         see `paintPrompt` for why taking the pointer is only half of it. */
      #prompt.guard { pointer-events: auto; }

      /* ---- and the menus, which are the same claim about the other end -----
         `min(430px, 100vw - 24px)` is a floating panel that has stopped
         floating: at this width the 24px is not a view of the shop either side
         of it, it is a margin on a page. Edge to edge, and the radius stays —
         there is still a bar and a nav under it, so it is a card resting on the
         stack rather than a sheet stuck to the bottom of the screen.

         `!important`, AND THAT IS THE POINT OF THE RULE RATHER THAN A BLUNT
         INSTRUMENT. A panel that was ever dragged is pinned by an INLINE
         `left`/`top`/`bottom` (see `place` in client/panel-drag.js), stored per
         menu and re-applied by `restorePos` every repaint — so a position
         chosen at 1400px comes back on a phone, and with `width: 100%` under it
         the panel does not merely sit off-centre, it starts partway across and
         runs its whole width off the right-hand edge. Inline styles are the one
         thing a stylesheet cannot outrank without this. Clearing the saved
         position instead would be the wrong fix twice over: it throws away a
         choice made for the window it was made in, and dragging is meaningless
         at this width anyway — there is nowhere to drag a full-width panel TO,
         which is why overriding it costs nothing here. */
      /* ...and it is a SHEET here, which is a claim about its height rather than
         its width. Anchored at the bottom with `max-height`, the panel is as
         tall as whatever is in it — so every tab, every search term and every
         snapshot that adds a row moves the top edge, and the thing you were
         reading walks up and down the screen under your thumb. On a desktop
         that is a small panel twitching in the corner of a big window; on a
         phone it is most of the screen, and the header you aim at is never
         twice in the same place.
         So both edges are named and the height stops being a consequence:
         `#panel-body` already scrolls, so a long list gives inside a box that
         does not move. Under the HUD bar rather than over it, because the money
         and the clock are what you opened the menu to act on. */
      #panel {
        left: 0 !important; right: 0; width: 100%; transform: none !important;
        top: calc(var(--hud-h, 46px) + 6px) !important;
        bottom: calc(var(--nav-top) + var(--build-h) + 8px) !important;
        max-height: none; border-radius: var(--r);
      }
      /* The header is the one row of a panel you aim at rather than read, and
         both halves of it were sized for a pointer: a 15px ✕ is about 15px of
         target, which is half of what a thumb can be asked to hit, and it is
         pinned in the corner where the hand comes from. Bigger hit area rather
         than a bigger glyph — the negative margin keeps the header the height
         it was, so nothing below it moves. The title goes up a size with it: it
         names what you are looking at, and at 12.5px it was the smallest thing
         on a full-screen sheet. */
      #panel header { padding: 10px 10px 10px 12px; }
      #panel-title { font-size: 15px; gap: 8px; }
      /* The close is a square button now (see INK WEIGHT), so the phone gets a
         BIGGER square rather than the padding-and-negative-margin trick that
         used to grow a bare glyph's target — that trick was right about a glyph
         and would blow the shape out of a thing with an edge on it. */
      #panel-close { width: 34px; height: 34px; font-size: 16px; opacity: .9; }
      /* ---- the nav ---------------------------------------------------------
         Seven 40px buttons on a 6px pitch is 322px of row, so anything under
         about 340 wraps — and three rows of nav is a third of a phone screen
         spent on the thing you press to get at the shop, with the panel that
         opens above it starting a row and a half higher than `--nav-top` says.
         So the buttons come down to 34 and `--nav-h` comes down WITH them: that
         var is what the panel and the build bar are stacked off, and a rail that
         shrank without it would leave a gap the exact height of what it saved.
         The key hints go: they are 8px letters naming a shortcut on the one kind
         of screen with no keyboard to press it on, and they are the only thing
         in the button that is not the button.

         AND THE ROW STOPS WRAPPING AT ALL, because a smaller fixed size is the
         same bug at a different width — seven buttons at 34 want 266px and the
         screens this is for start below that. So the nav is the one thing in
         here that does shrink: `nowrap`, and each button is a flex item whose
         BASIS is `--nav-h` and which is allowed to give from there, so the row
         divides whatever width there is between however many items the rail
         happens to hold (`RAIL_ITEMS` — a count no stylesheet may hardcode).
         `aspect-ratio` is what keeps them square while that happens; without it
         a shrunken button is a letterbox. `--nav-h` therefore becomes the
         button's CEILING rather than its size, which is the right way round for
         the stack above it: the panel clears the tallest the nav can be. */
      :root { --nav-h: 52px; --nav-bot: 10px; }
      /* IT FILLS THE ROW. `flex: 1 1 0` divides the width evenly between however
         many items the rail holds, so the buttons are as big as one row allows
         rather than a fixed size that happens to fit — which is the same trap a
         narrower literal is: 34px fits a phone and is a postage stamp on it,
         and neither number knows how wide the screen is or how many buttons
         `RAIL_ITEMS` has. `--nav-h` is the CEILING (and what the panel and the
         bar stack off, so it has to be the biggest they can get, never the
         current size); `min-width` is the floor under which the row gives up and
         wraps. `aspect-ratio` keeps them square while they move; without it a
         stretched button is a letterbox. `#rail` needs a WIDTH and not only a
         max — it is centred by a transform, so with content-sized width there is
         nothing for the children to divide. */
      #rail {
        gap: 5px; width: calc(100vw - 8px); max-width: calc(100vw - 8px);
        flex-wrap: nowrap;
      }
      .rail-btn {
        flex: 1 1 0; width: auto; height: auto;
        aspect-ratio: 1; min-width: 26px; max-width: var(--nav-h);
      }
      .rail-btn .ico { font-size: 22px; }
      .rail-btn .kb { display: none; }
      /* ...and every other key cap with it. The rail hid its own the day the nav
         became a phone toolbar; the fixture menu's verbs (M, R) and the tip's
         cap were written later and inherited nothing, so they went on printing a
         key at a hand that has none. One rule for all of them, under the width
         that decides the whole grammar (`pillDrives`). */
      /* ...and the palette's own, which that rule missed and which is nine of
         them in a row rather than one: `1` through `9` printed across the build
         strip, on the surface where a finger has least room to spare and most to
         read. It also frees the corner the tile needed — see the name rule up in
         `#build:not(.browse) .tool`. */
      /* ...and the press pill's, which is the one of these whose ROW still
         works: a keyed row is a button like every other row, so only the cap
         goes and the words stay pressable. */
      .fx-verb .kb, #tip .key, .tool .key, #prompt .pr-key { display: none; }

      /* The front door has always been `min(440px, 100%)`, so the only thing
         between it and the edges is the screen's own padding — and the wordmark
         no longer needs a rule here, because it stopped being a title sized for
         a monitor the day it became a line in the card's own header. It is ONE
         COLUMN AT EVERY WIDTH: all a big screen changes is what is around it. */
      .outdoors { padding: 14px 10px; }
    }

    /* ---- no mouse, no mouse glyph -----------------------------------------
       A question about the INPUT and not about the width, which is why it is
       its own query: a narrow window on a desktop is still a desktop, and
       left-versus-right is the whole of what that picture says. On a
       touchscreen it names a button that does not exist, drawn first, so every
       row leads with the reason you cannot do it. */
    @media (hover: none) and (pointer: coarse) {
      #prompt .pr-mouse { display: none; }
    }

    /* ---- THE PRESS -------------------------------------------------------
       One rule for every control in the HUD, and it has to be the LAST thing in
       this file. `:active` on a bare class is (0,1,1) at best, which ties with
       the rules it is overriding — so what decides it is source order, and a
       press written next to the button it presses would be beaten by the next
       state anybody adds under it. Everything it presses stores its own contour
       in `--sil` and never in `box-shadow`, so this drops the SIDE and keeps
       whatever line the control is wearing: lit, armed, open, hovered, all of
       them press the same way and none of them has a rule here.

       `transform` and not `margin-top`: the strip is measured for `--build-h`
       and the rail sets `--nav-h`, so a press that moved a box would move the
       whole bottom stack of the HUD by 2px every time you clicked anything.

       A tile you cannot buy does not press. That is the point of `not-allowed`
       — the refusal is in `bar.js` and the button is still there to be asked
       why, but it must not answer a click with the animation that means yes. */
    .tool:active,
    .rail-btn:active,
    .tab:active,
    .dtab:active,
    .row button:active,
    .midrow:active,
    /* ...but not a CHIP, which is a frame round a stepper rather than a press.
       `:active` matches ancestors, so nudging the number inside one would
       depress the whole tile — which moves the number under the finger that is
       aiming at it, the shuffle `.stp`'s own fixed width exists to prevent. The
       two nudges answer with their hover state, as they do in a row. */
    .gtile:not(.chip):active,
    .gsub:active,
    .im-step button:active,
    .im-clear:active,
    .im-tog:active,
    .fx-price button:active,
    .cat:active,
    .subcat:active,
    #build-deck button:active,
    .fx-take:active,
    /* AND THE FRONT DOOR, which used to have four `:active` rules of its own
       scattered through its own section — one per control, each restating the
       whole box-shadow, and one of them forgetting to drop the side at all.
       They are gone. This screen redefines `--edge` and `--press` on
       `.menu-box` and stores every contour in `--sil`, which is the whole of
       what it takes to join in: the same rule presses a 30px dropdown and a
       44px Start it, and none of the states either wears — hovered, open, lit,
       focused — needs a line here.
       TWO SELECTORS, WHERE THERE WERE FIVE, AND THE ABSENCES ARE THE POINT.
       A SAVE ROW is not in here on purpose: it is the biggest pressable thing
       on the screen, it carries no side, and a list that squashed under the
       cursor would be a shop you can push. Neither are the tip jar and the
       mute, which have no face and no side at all now (see `.menu-under`) — a
       press that moved them down 3px would be a control sinking into nothing. */
    .menu-btn:active,
    .dbtn:active,
    /* AND THE AWARD CARD'S ONE PRESS, which had an `:active` of its own
       restating a wash-black side at a third of its height. It is gone: the
       card redefines `--edge`/`--press` and stores its line in `--sil`, which
       is the whole of what it takes to join in. Its tip jar is NOT in here, for
       the reason the front door's is not — it has no face and no side, and a
       press that moved it down 3px would be a control sinking into nothing. */
    .award-go:active {
      transform: translateY(var(--press));
      box-shadow: var(--sil);
    }
    /* It carries its own centring transform, so the press is added to it rather
       than replacing it — the 3px is the nudge sitting off the strip's midline,
       and a press that forgot it would jump the chip half its own height. */
    .nudge:active {
      transform: translateY(calc(-50% - 3px + var(--press)));
      box-shadow: var(--sil);
    }
    .tool.poor:active, .tool.off:active,
    .fx-take:disabled:active, .fx-price button:disabled:active {
      transform: none;
      box-shadow: var(--sil), var(--edge);
    }

    /* ---- AND THE RING THAT ISN'T OURS ------------------------------------
       `.rail-btn` has had this since it was written and says why at length: the
       browser's own focus ring is a heavy blue box in somebody else's colours,
       and on a row whose entire job is showing you which one is lit, a second
       and louder "this one" following the last thing you pressed is worse than
       no state at all. Every control that grew a press in this pass has the
       same problem and none of them had the same answer — a mouse click focuses
       a `<button>`, so pressing the Building tab left a blue rectangle round it
       that had nothing to do with the tab being open.
       `:focus-visible` and not `:focus`, so a mouse leaves nothing behind and
       Tab still shows you where you are; `--ink` rather than the lit yellow,
       and OUTSIDE the control, where its own state lives on the inside. */
    .tab:focus, .dtab:focus, .tool:focus, .midrow:focus, .gtile:focus,
    .gsub:focus, .im-step button:focus, .im-clear:focus, .im-tog:focus,
    .fx-price button:focus, .fx-take:focus, .row button:focus, .nudge:focus,
    .shape:focus, .cat:focus, .subcat:focus,
    .menu-mute:focus, .menu-support:focus, .menu-btn:focus, .dbtn:focus,
    .dopt:focus, .shop:focus, .shop-row .x:focus,
    .award-go:focus, .award-tip a:focus,
    .corner-x:focus { outline: none; }
    .tab:focus-visible, .dtab:focus-visible, .tool:focus-visible,
    .midrow:focus-visible, .gtile:focus-visible, .gsub:focus-visible,
    .im-step button:focus-visible, .im-clear:focus-visible, .im-tog:focus-visible,
    .fx-price button:focus-visible, .fx-take:focus-visible,
    .row button:focus-visible, .nudge:focus-visible, .shape:focus-visible,
    .cat:focus-visible, .subcat:focus-visible,
    #build-deck button:focus-visible, .corner-x:focus-visible,
    /* The front door's, which had between them one ring and it was in
       `--accent`. Everything else on that screen answered a keyboard with the
       browser's blue box — including the tip jar, an `<a>` that leaves the page
       with an unsaved shop behind it, which is the one press on the front door
       most worth being sure about before you send it.
       The SAVE ROW is in here even though it is not in the press rule above:
       it is the one control on the screen that a Tab lands on and the one whose
       press is not undoable, so "where am I" matters most on exactly the thing
       that must not squash. The ✕ beside it has to be reachable too, or the
       only way to delete a shop is with a mouse. */
    .menu-mute:focus-visible, .menu-support:focus-visible,
    .menu-btn:focus-visible, .dbtn:focus-visible, .dopt:focus-visible,
    .shop:focus-visible, .shop-row .x:focus-visible,
    /* The award's two, and the tip jar is the same argument the front door's
       makes: it is an `<a>` that leaves the page with a live shop behind it. */
    .award-go:focus-visible, .award-tip a:focus-visible {
      outline: 2px solid var(--ink); outline-offset: 2px;
    }
    /* INSET, because the row is full-bleed inside a scroll container: an
       outline drawn 2px outside it is 2px outside the list's own clip, so the
       left and right sides of the ring are simply not painted and what you get
       is two horizontal dashes. Same call `#panel`'s own focus ring makes about
       a card that clips. */
    .shop:focus-visible { outline-offset: -2px; }
    /* ...and a ✕ that is invisible until you point at it has to turn up when
       something ELSE points at it. Without this, tabbing to the delete button
       draws a ring round nothing at all. */
    html.can-hover .shop-row .x:focus-visible { opacity: 1; }
  </style>
</head>
<body>
  <canvas id="game"></canvas>
  <div id="edge" aria-hidden="true"></div>
  <!-- The loading screen. Static markup rather than something `boot.js` builds,
       because it has to be on the screen before any module has run — the whole
       point of it is the seconds before there is any JavaScript running to make
       it. The bot slots into `.boot-stage` when the crew lands; see
       client/boot.js. -->
  <div id="boot" class="outdoors">
    <div class="boot-box">
      <div class="boot-stage"></div>
      <!-- The first thing said, before any module has run. Deliberately the
           vaguest of the four: which one is true depends on how the page was
           opened, and `bootSay` replaces it within a tick either way. -->
      <div class="boot-say">Loading…</div>
      <div class="boot-bar" aria-hidden="true"><i></i></div>
    </div>
  </div>
  <div id="menu" class="outdoors" hidden></div>

  <div id="topleft" class="hud">
    <div id="stats">
      <button id="sign" type="button" title="Close the shop (O)">
        <span id="doorway" aria-hidden="true"></span>
      </button>
      <div class="rows">
        <span id="when"><span id="dow">Mon</span><span id="day">Day 1</span></span>
        <button id="clock" type="button" title="Stop the clock (Space)">
          <span id="clock-t">8am</span><i id="clock-pp" aria-hidden="true"></i>
        </button>
        <span id="cash">$0.00</span>
        <div id="flow"></div>
      </div>
      <div id="town">
        <span class="tn"><span class="ico"></span><b>–</b><span class="of"></span></span>
        <span class="tw"></span>
      </div>
      <div class="gauges">
        <div class="gg"><span class="gg-tag">Rep</span>
          <div class="repwrap"><div id="rep" style="width:50%"></div></div></div>
        <div class="gg"><span class="gg-tag">Mood</span>
          <div class="repwrap"><div id="mood" style="width:100%"></div></div></div>
        <div class="gg"><span class="gg-tag">Room</span>
          <div class="repwrap"><div id="full" style="width:100%"></div></div></div>
      </div>
    </div>
    <div id="rci"><div id="rci-rows"></div></div>
    <div id="radio" title="Shop radio">
      <div id="lcd"><div id="lcdtrack"><span></span><span></span></div></div>
      <div id="lcdbtns">
        <button data-m="prev" type="button" aria-label="previous track">◀◀</button>
        <button data-m="play" type="button" aria-label="play or pause">❚❚</button>
        <button data-m="next" type="button" aria-label="next track">▶▶</button>
        <button data-m="rep" type="button" aria-label="repeat this track">↻</button>
      </div>
    </div>
  </div>
  <div id="hq" class="hud">
    <div id="todo"></div>
  </div>
  <div id="rail" class="hud"></div>
  <div id="log" class="hud"></div>
  <div id="carry" class="hud"></div>
  <div id="stam" class="hud"><i></i></div>
  <button id="rotbtn" class="hud" type="button" aria-label="Turn it"></button>
  <button id="closebtn" class="hud" type="button" aria-label="Done building"></button>
  <!-- The glyphs are inline rather than from `ICONS`, because `client/icons.js`
       is generated by `npm run icons` from a fetched set and these two are not
       in it. A pair of stroked arrows is four path commands; adding a build step
       and a network dependency to avoid writing them would be the larger change. -->
  <button id="undobtn" class="hud" type="button" aria-label="Undo the last build">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
         stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/>
    </svg>
  </button>
  <button id="redobtn" class="hud" type="button" aria-label="Redo the last build">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
         stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="m15 14 5-5-5-5"/><path d="M20 9H9.5a5.5 5.5 0 0 0 0 11H13"/>
    </svg>
  </button>
  <!-- Picking several, and getting rid of them. The marquee corners with a tick
       is a shape people know from every editor; the bin is `ICONS.remove`, set
       from `ui.js` so this button and the fixture menu's own Remove square are
       one glyph rather than two drawings of a bin. -->
  <button id="pickbtn" class="hud" type="button" aria-pressed="false"
          aria-label="Pick several">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
         stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M4 8.5V5.6A1.6 1.6 0 0 1 5.6 4h2.9M15.5 4h2.9A1.6 1.6 0 0 1 20 5.6v2.9"/>
      <path d="M20 15.5v2.9a1.6 1.6 0 0 1-1.6 1.6h-2.9M8.5 20H5.6A1.6 1.6 0 0 1 4 18.4v-2.9"/>
      <path d="m8.8 12.2 2.4 2.4 4.6-5"/>
    </svg>
  </button>
  <button id="delbtn" class="hud" type="button" aria-label="Remove what is picked"></button>
  <!-- The camera, on the thumb that is not building. Same reason the two above
       are inline: neither glyph is in the fetched set, and both are three path
       commands. The crosshair is `locate` rather than a house on purpose — the
       button puts the camera back on YOU, and a house is where a home button
       usually goes, which is nowhere in this shop. -->
  <button id="viewbtn" class="hud" type="button" aria-label="Turn the view">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
         stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/>
    </svg>
  </button>
  <button id="homebtn" class="hud" type="button" aria-label="Centre the view on you">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
         stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <circle cx="12" cy="12" r="3.6"/>
      <path d="M12 2.5v3.2M12 18.3v3.2M2.5 12h3.2M18.3 12h3.2"/>
    </svg>
  </button>
  <!-- The box you drag round part of the shop. A plain div rather than anything
       in the scene, because it is a SCREEN rectangle: it is drawn in the plane
       the drag happens in, and a quad in the world would shear with the camera
       and stop being the shape your hand made. -->
  <div id="marquee" class="hud"></div>
  <div id="reticle" class="hud" aria-hidden="true"></div>
  <div id="prompt" class="hud"></div>
  <!-- The four things you can say with your arms, while V is held. Filled once
       on the first press out of `shared/emotes.js` — see `showEmotes` — rather
       than written out here, so a fifth emote is one line in that file and
       reaches the strip, the number keys and the renderer together. -->
  <div id="emotes" class="hud" role="group" aria-label="Emotes"></div>
  <div id="boardtip" class="hud"></div>
  <!-- Every unit's card at once, while Alt is held. Its own layer rather than
       cards parented to anything, because they are pinned to the WORLD: each is
       positioned every frame from `scene.worldToScreen`, and a layer that
       scrolled or transformed underneath them would move them off the shelves
       they name. -->
  <div id="peek" class="hud"></div>
  <div id="toast" class="hud"></div>

  <div id="build" class="hud">
    <div id="build-hint" class="gone"></div>
    <div id="build-bar">
      <div id="build-nav">
        <!-- TIERS ONE AND TWO SCROLL TOGETHER, and the way out does not. The two
             rows are content-width by design, so on a phone a tab with sub-tabs
             on it ran off the side of the screen with nothing to drag: the last
             chips were unreachable, and so was the ✕ beside them, which is the
             one control that must never be. One scroller round both — `#build-close`
             stays outside it, pinned. -->
        <div id="build-tabs">
          <div id="build-groups"></div>
          <div id="build-subs" hidden></div>
        </div>
        <!-- WHICH STOREY, and it is a pair rather than a toggle on purpose.
             The ceiling shipped reachable by one key and nothing else: E, with
             nothing on screen saying the key existed and nothing saying which
             storey it had left you on — so every press after it landed four
             metres above where you were looking, and the only tell was a ghost
             drawn high enough that an angled camera reads it as the tile behind.

             A pair says both halves at once. One toggle showing the storey you
             are ON cannot be told from one showing the storey it would take you
             TO, which is the worst thing a mode button can be ambiguous about;
             two chips with one lit is the same question answered as a place you
             are standing rather than as a press you might make. It also says the
             thing a key never could — that there ARE two storeys.

             Outside `#build-tabs` (which scrolls) and before `#build-close`, so
             it has an address: whichever tab you are on and however far you have
             dragged the row, the storey is in the same place. `hidden` unless
             what is armed can use one — see `deckable` in client/ui.js. -->
        <div id="build-deck" hidden role="group" aria-label="Which storey">
          <button type="button" data-deck="0" title="Build on the floor (E)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
                 stroke-linecap="round" aria-hidden="true">
              <path d="M3 17h18"/><path d="M7 7h10" opacity=".28"/>
            </svg>
            <span>Floor</span>
          </button>
          <button type="button" data-deck="1" title="Build overhead, on the ceiling (E)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
                 stroke-linecap="round" aria-hidden="true">
              <path d="M3 7h18"/><path d="M7 17h10" opacity=".28"/>
            </svg>
            <span>Overhead</span>
          </button>
        </div>
        <!-- WHAT ALL THIS IS. One briefing per tab (client/tutor.js `LESSONS`),
             next-through, a page per piece with the piece's own picture on it —
             including the ones the ladder has not handed over yet, which say so.

             Beside the ✕ and outside the scroller for the same reason the storey
             pair is: it has to be in the same place whichever tab you are on and
             however far you have dragged the row. `hidden` unless the tab you are
             on has one, or it is a button that does nothing on four tabs out of
             seven — which is the "tier that changes no number" trap wearing a
             question mark. -->
        <button id="build-help" type="button" hidden
          title="What everything on this tab does" aria-label="What everything on this tab does">?</button>
        <!-- The way out. B and Escape are the way out on a desktop and neither
             is a key a phone has, which left the rail's own Build button as the
             only exit — a control on the far side of the screen from the bar you
             are trying to close, that you have to know toggles rather than
             opens. Same glyph and the same corner as `#panel-close`, because it
             is the same sentence: this thing is up, and this is how it stops
             being up. -->
        <button id="build-close" type="button" title="Done building (B)"
          aria-label="Done building">✕</button>
      </div>
      <div id="build-strip">
        <div id="build-tools"></div>
        <button id="build-back" class="nudge" type="button" hidden aria-label="More to the left"></button>
        <button id="build-on" class="nudge" type="button" hidden aria-label="More to the right"></button>
        <!-- The bulldozer, pinned. It is on every tab, so it was the last tile
             of a row that scrolls — which means its position depended on the tab
             you were on and how far you had dragged, for the one press you go
             looking for when something is in the wrong place. `bar.js` fills it
             from the same entry the strip would have drawn. -->
        <button id="build-raze" class="tool raze" type="button" hidden></button>
      </div>
      <div id="build-shapes" hidden></div>
    </div>
  </div>

  <div id="award" hidden></div>
  <div id="tutor" hidden></div>

  <div id="panel" class="hud">
    <!-- FIND is a button in the title bar and the box only exists once you have
         pressed it. It was a permanently open field between the header and the
         tabs: a row of chrome on every menu in the game, above the thing you
         came to look at, for a control most sessions never touch. Static HTML
         like the box itself, and for the same reason — `paintSection` rebuilds
         everything below the header ten times a second, and a find button that
         was re-rendered would be re-rendered out from under the press that
         opened it. -->
    <header><span id="panel-title">Panel</span><button id="panel-find" hidden
      title="Find" aria-label="Find"></button><button id="panel-close">✕</button></header>
    <div id="panel-filter" hidden>
      <label id="panel-searchwrap">
        <span class="ico" id="search-icon"></span>
        <!-- The manager opt-outs are the same set `NO_FILL` carries in
             client/menu.js, and this is the one input in the game that cannot
             use the constant because it is authored in static HTML rather than
             rendered. See the note there for why `autocomplete` alone is not
             enough — it was here on its own and a 1Password icon sat in the
             search box regardless. `spellcheck` stays: this one is a search
             box, so a red underline under half an item name is noise. -->
        <input id="panel-search" type="text" placeholder="search…" spellcheck="false"
          autocomplete="off" data-1p-ignore data-lpignore="true" data-bwignore="true"
          data-protonpass-ignore="true" data-form-type="other" />
      </label>
    </div>
    <div id="panel-body"></div>
  </div>

  <script type="module" src="/main.js"></script>
</body>
</html>
