    /* Faded until you want it, because it is the one readout up here that is
       always saying something. Twelve rows of live bars over the shop floor is
       a lot of ink for a thing you consult rather than watch, and the corner it
       sits in is where the farm is. Full strength the moment you point at it —
       so it costs a glance to read and nothing to ignore.

       It is also draggable (see `wireDrag` in client/ui.js): it is its own
       handle, hence `cursor: grab`. Dragging pins it with an inline
       `position: fixed`, and double-clicking gives it back to this column —
       which is why nothing here hardcodes a `top`. See the note above #topleft
       for what happened the last time anything up here did. */
    #rci {
      position: relative;
      width: var(--corner-w);
      background: var(--panel); border-radius: 13px; padding: 7px 10px;
      box-shadow: 0 4px 14px rgba(58,49,40,.14);
      opacity: .45; transition: opacity .12s ease;
      cursor: grab; touch-action: none;
    }
    /* The rows are a child rather than the panel's own children, because the
       close button is a child too and `ui.update` rewrites the meter from
       `innerHTML` ten times a second — anything sharing that element with the
       bars lives about a tenth of a second. See client/corner.js. */
    #rci-rows { display: flex; flex-direction: column; gap: 2px; }
    /* `:active` as well as `:hover`, because a drag captures the pointer and can
       take it outside the element — without it the meter fades out from under
       you halfway through moving it, which reads as having dropped it. */
    html.can-hover #rci:hover, html.can-hover #rci:active { opacity: 1; }

    /* ---- putting a corner readout away ------------------------------------
       Both of these are always on screen and neither is urgent, so both can be
       closed and both come back from the Menu — see client/corner.js for why
       the way back may not be on the thing you closed.

       One class rather than a rule per widget, and `!important` because #rci
       sets its own `display` at an id's specificity: a widget you put away must
       not come back the next time somebody edits the rule above. */
    .corner-off { display: none !important; }
    /* A chip on the corner rather than a button inside it. The meter is twelve
       rows on a fixed pitch and the radio is a screen with four buttons under
       it — neither has a spare line, and hanging it off the edge means adding
       one costs no layout at all. Hidden until you point at the widget, which
       is the same moment the widget itself comes up to full strength: it is a
       control for a thing you are already looking at. */
    .corner-x {
      position: absolute; top: -6px; right: -6px;
      width: 17px; height: 17px; padding: 0; border: 0; border-radius: 50%;
      display: grid; place-items: center;
      background: var(--panel); color: var(--ink);
      box-shadow: 0 2px 6px rgba(58,49,40,.22);
      font-size: 9px; line-height: 0; cursor: pointer;
      opacity: 0; transition: opacity .12s ease, background .1s ease;
    }
    /* Focus as well, or the button is unreachable by keyboard — it is invisible
       until a pointer is over it, and a pointer is not the only way in. */
    html.can-hover #rci:hover .corner-x, #rci:active .corner-x,
    html.can-hover #radio:hover .corner-x, #radio:active .corner-x,
    .corner-x:focus-visible { opacity: .75; }
    html.can-hover .corner-x:hover { opacity: 1; background: var(--accent, #7a9a5b); color: #fff; }

    /* ---- the shop radio ---------------------------------------------------
       A player rather than a row in a menu, because the thing it is for is
       *changing your mind about the music*, and a control you have to open a
       panel to reach is one you use once and then stop noticing.

       Sized and pinned like #rci, and draggable the same way, so the top-left
       column stays one column. It dims when idle for the same reason that one
       does: it is a readout you glance at, sitting over the thing you are
       actually looking at. */
    #radio {
      position: relative;
      width: var(--corner-w);
      background: var(--panel); border-radius: 13px; padding: 7px 8px 6px;
      box-shadow: 0 4px 14px rgba(58,49,40,.14);
      opacity: .45; transition: opacity .12s ease;
      cursor: grab; touch-action: none;
    }
    html.can-hover #radio:hover, html.can-hover #radio:active { opacity: 1; }
    #radio:active { cursor: grabbing; }
    /* The screen. Dark, inset and slightly green — a little LCD, which is the
       one place in this HUD allowed to look like hardware rather than paper. */
    #lcd {
      background: #24301f; border-radius: 5px; overflow: hidden;
      box-shadow: inset 0 1px 3px rgba(0,0,0,.5);
      padding: 3px 0; margin-bottom: 4px;
    }
    #lcdtrack {
      display: flex; gap: 34px; width: max-content;
      animation: lcdroll 13s linear infinite;
    }
    /* Two copies of the text, scrolled by exactly half the track's width, so
       the second one is where the first was when the loop restarts. One copy
       would leave a gap the width of the screen on every pass; a percentage of
       the *track* rather than of the screen is what makes it seamless at any
       title length. */
    #lcdtrack span {
      font: 700 9.5px ui-monospace, "SF Mono", Menlo, monospace;
      letter-spacing: .08em; text-transform: uppercase;
      color: #9ede7a; text-shadow: 0 0 5px rgba(158,222,122,.45);
      white-space: nowrap;
    }
    @keyframes lcdroll { to { transform: translateX(calc(-50% - 17px)); } }
    /* Stopped: the screen holds still, so a paused radio is legible rather than
       a title sliding past forever. */
    #radio.off #lcdtrack { animation-play-state: paused; }
    #radio.off #lcdtrack span { color: #6a8459; text-shadow: none; }

    #lcdbtns { display: flex; gap: 4px; }
    #lcdbtns button {
      flex: 1; border: 0; border-radius: 5px; padding: 2px 0;
      background: rgba(58,49,40,.09); color: var(--ink);
      font-size: 8.5px; letter-spacing: .04em; cursor: pointer;
      transition: background .1s ease;
    }
    html.can-hover #lcdbtns button:hover { background: rgba(58,49,40,.19); }
    #lcdbtns button:active { background: rgba(58,49,40,.29); }
    /* Repeat is a state, not an action, so it stays lit while it is on — the
       same call `.picked` makes on a palette button. Without it the only way to
       know is to wait and see whether the track changes. */
    #lcdbtns button.on {
      background: var(--accent, #7a9a5b); color: #fff;
    }
    #rci:active { cursor: grabbing; }
    .mtr { display: grid; grid-template-columns: 1fr 56px; align-items: center; gap: 7px; }
    .mtr-tag {
      font-size: 8.5px; font-weight: 800; letter-spacing: .02em;
      text-transform: uppercase; opacity: .55; text-align: right;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    /* A world event pulling this department. On the label rather than the bar,
       because the bar already has the event folded into its length and marking
       it twice would read as two facts. */
    .mtr-tag.hot { opacity: .95; color: var(--accent); }
    .mtr-tag.cold { opacity: .3; }
    /* A fixed plot with the zero line down its middle, so every bar is measured
       against the same axis instead of against its own. Each row draws its own
       segment; stacked, they form one continuous line. */
    .mtr-plot { position: relative; height: 7px; }
    .mtr-plot::after {
      content: ''; position: absolute; left: 50%; top: -3px; bottom: -3px;
      width: 1px; background: rgba(58,49,40,.16);
    }
    .mtr-bar { position: absolute; top: 0; bottom: 0; border-radius: 2px; }
    .mtr.up .mtr-bar { left: 50%; background: var(--good); }
    .mtr.down .mtr-bar { right: 50%; background: var(--accent); }

    /* What to actually do about all of the above. Derived entirely from the
       same snapshot — no new server field — and capped at three, because a
       to-do list you can't finish is wallpaper rather than a prompt. */
    #todo { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; }
    /* `:has`, because the meter's rows are a child now and the panel itself is
       never empty — it holds its own close button. Without it an unfurnished
       shop draws an empty card with a ✕ on it before the first snapshot. */
    #todo:empty, #rci:has(> #rci-rows:empty) { display: none; }
    .todo {
      background: var(--panel); border-radius: 99px; padding: 2px 9px 2px 7px;
      font-size: 11.5px; font-weight: 600; color: var(--ink);
      box-shadow: 0 2px 7px rgba(58,49,40,.11);
      display: inline-flex; align-items: center; gap: 5px;
    }
    .todo svg { width: 12px; height: 12px; opacity: .7; flex: none; }
    .todo b { font-weight: 800; }
    /* The one that is costing you money right now, rather than merely pending. */
    .todo.hot { background: #ffd66b; box-shadow: 0 2px 9px rgba(200,150,20,.32); }
    .todo.hot svg { opacity: .9; }
    /* A chip with something to press behind it (see `todoList`). It has to be
       INDISTINGUISHABLE from the ones without, so this is a reset and nothing
       else — the browser's own control has a border, an outline and a font of
       its own, and one chip in the strip wearing them reads as a bug rather than
       as an invitation. `font-size` and `font-weight` are deliberately not
       inherited back: `.todo` already sets both, and a shorthand here would
       out-specify them and shrink the chip. `pointer-events`, because #hq is
       behind the pointer entirely and its children opt back in one at a time. */
    button.todo {
      appearance: none; -webkit-appearance: none;
      border: 0; margin: 0; font-family: inherit; color: inherit;
      text-align: inherit; outline: none;
      pointer-events: auto; cursor: pointer;
    }
    button.todo:active { transform: translateY(1px); }

    /* The nav: one icon per menu, along the bottom centre. The only thing on
       screen that says the game has menus at all — before it, three unrelated
       letter keys were the entire discovery story.

       It ran down the top-right corner until the build palette moved to the
       bottom. With the thing you press most at the bottom centre and the way
       into every menu diagonally opposite it, every session was a stream of
       corner-to-corner mouse journeys. Now the nav, the bar above it and the
       panel above that are one column under the pointer. */
    #rail {
      bottom: var(--nav-bot); left: 50%; transform: translateX(-50%);
      display: flex; gap: 6px; max-width: calc(100vw - 16px); flex-wrap: wrap;
      justify-content: center;
    }
    .rail-btn {
      position: relative; width: 40px; height: 40px; border: 0; cursor: pointer;
      background: var(--panel); border-radius: 12px; color: var(--ink);
      box-shadow: 0 4px 14px rgba(58,49,40,.15); display: grid; place-items: center;
      font: inherit; transition: background .12s, transform .12s;
    }
    html.can-hover .rail-btn:hover { transform: translateY(-2px); }
    /* A click focuses the button, and the browser's own focus ring is a heavy
       blue box in somebody else's colours — on a row of buttons whose whole job
       is to show you which one is lit, a second, louder "this one" that follows
       the last thing you pressed is worse than no state at all.

       So the ring is ours, one rule for the whole rail, and only for the
       keyboard: `:focus-visible`, so a mouse press leaves nothing behind and Tab
       still shows you where you are. Drawn in `--ink` rather than in the lit
       yellow, and OUTSIDE the button (`outline-offset`) where the open state is
       a fill and the palette's is an inset ring — three marks that cannot be
       mistaken for one another. */
    .rail-btn:focus { outline: none; }
    .rail-btn:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
    /* Lit means "this menu is open" — except on Build, which is a mode rather
       than a menu, where it means the world is in it.

       Build says two things, because it is two presses (`pressBuild`): lit is
       the mode, and the pressed-in ring on top of it is the palette. The mode
       on its own now has no bar on screen, so this button is the whole of what
       says you are in it — and a mode you cannot see you are in is the complaint
       the lit state exists for. */
    .rail-btn.on { background: #ffd66b; }
    .rail-btn.on.open {
      box-shadow: inset 0 0 0 2px var(--ink), 0 4px 14px rgba(58,49,40,.15);
    }
    .rail-btn .ico { font-size: 18px; line-height: 1; }
    .rail-btn .kb { position: absolute; bottom: 2px; right: 5px; font-size: 8px; font-weight: 800; opacity: .35; }
    .rail-btn .badge {
      position: absolute; top: -4px; right: -4px; min-width: 16px; height: 16px; padding: 0 4px;
      border-radius: 99px; background: var(--accent); color: #fff;
      font-size: 10px; font-weight: 800; display: grid; place-items: center;
      box-shadow: 0 2px 6px rgba(58,49,40,.25);
    }
    .rail-btn .badge[hidden] { display: none; }

    /* The delivery ring. It traces the button's own border — see RING_PATH in
       client/rail.js for why that shape rather than a circle.

       `pointer-events: none` is not a nicety: the svg covers the whole button,
       so without it the ring eats every click on the one control it is drawn
       on. It sits first in the markup so the badge and the icon paint over it
       at the corner, where the two overlap by a pixel or so.

       Both strokes are faded in together rather than the arc alone, or an empty
       ring at the start of a wait is indistinguishable from no ring at all —
       the track is what says "this is filling up", and it is the half that
       makes a countdown legible from one glance rather than two. */
    .rail-btn .ring {
      position: absolute; inset: 0; width: 100%; height: 100%;
      pointer-events: none; overflow: visible;
    }
    .rail-btn .ring path { fill: none; stroke-width: 2.5; opacity: 0; transition: opacity .25s; }
    .rail-btn .ring .trk { stroke: var(--line); }
    .rail-btn .ring .arc {
      stroke: var(--warn); stroke-linecap: round;
      /* Long and linear, because the arc is written about once a minute (see
         `updateRings`) — the transition is what turns a hundred stepped writes
         into something that looks like it is moving at all. An eased one would
         visibly stall between steps. */
      transition: stroke-dashoffset .5s linear, stroke .3s, opacity .25s;
    }
    .rail-btn.waiting .ring path { opacity: 1; }

    /* How much is on the way. Opposite corner to the badge, and a different
       colour, because they are different kinds of news: the badge is a problem
       you can act on (red, top right, where every notification count in the
       world lives) and this is money already spent that has not landed yet.
       Sharing one slot would have them flicker between two unrelated numbers.

       It wears the ring's colour rather than its own, so the count and the arc
       read as one readout — the number is what the ring is counting down. */
    .rail-btn .cargo {
      position: absolute; bottom: -4px; left: -4px; min-width: 16px; height: 16px; padding: 0 4px;
      border-radius: 99px; background: var(--warn); color: #fff;
      font-size: 10px; font-weight: 800; display: grid; place-items: center;
      box-shadow: 0 2px 6px rgba(58,49,40,.25);
      transition: background .3s;
    }
    .rail-btn .cargo[hidden] { display: none; }
    .rail-btn.landing .cargo { background: var(--good); }
    /* Pulling in. Green because the wait is over, and moving because a full
       ring holding still is the same picture as a full ring that has finished. */
    .rail-btn.landing .ring .arc { stroke: var(--good); animation: van-in 1.1s ease-in-out infinite; }
    @keyframes van-in { 50% { opacity: .3; } }
    @media (prefers-reduced-motion: reduce) {
      .rail-btn.landing .ring .arc { animation: none; }
    }

    /* ---- the tooltip -------------------------------------------------------
       One element, moved to whatever is hovered — see client/tip.js for why it
       is not an `::after` on the button.

       Above the HUD (10) and below the modal layers (50/60): it explains the
       HUD, so it has to clear it, and it explains nothing about a dialog that
       has taken the whole screen. `pointer-events: none` is load-bearing rather
       than tidy — the box sits directly over the row above the rail, and a tip
       that could be hovered would swallow clicks on whatever it covers, as well
       as fighting its own `pointerout`. */
    #tip {
      position: fixed; z-index: 40; pointer-events: none;
      max-width: 240px; padding: 7px 10px 8px;
      background: var(--panel-solid); color: var(--ink);
      border-radius: 11px; box-shadow: 0 8px 22px rgba(58,49,40,.22);
      font-size: 12px; line-height: 1.3;
      opacity: 0; transform: translateY(5px) scale(.93);
      /* Out fast and flat, in slower with an overshoot past 1: a tip that
         springs into place reads as the shop answering you, and the same curve
         on the way out reads as it bouncing off the screen. Leaving is not an
         event and should not be animated like one. */
      transition: opacity .09s ease, transform .09s ease;
    }
    #tip.show {
      opacity: 1; transform: translateY(0) scale(1);
      transition: opacity .13s ease, transform .22s cubic-bezier(.34, 1.56, .64, 1);
    }
    /* Flipped below, for anything near the top of the screen. It springs DOWN
       out of its caret rather than up, or a tip under the meters would rise
       into the thing it is describing.

       These sit after `.show` deliberately: `#tip.down` and `#tip.show` are the
       same specificity, so the later rule is the one that wins the transform,
       and swapping the two blocks would break the flip with nothing in either
       one looking wrong. */
    #tip.down { transform: translateY(-5px) scale(.93); }
    #tip.down.show { transform: translateY(0) scale(1); }
    /* Shadow cast the other way with it. Left pointing down it would fall
       across the box it is attached to, which reads as a smudge on the card. */
    #tip.down .arrow { bottom: auto; top: -3px; box-shadow: -2px -2px 6px rgba(58,49,40,.12); }

    #tip .row { display: flex; align-items: center; gap: 8px; }
    #tip .ttl { font-weight: 800; letter-spacing: -.01em; }
    /* The hotkey as a key cap, which is the same thing `.kb` says on the button
       itself — said properly, because here there is room for it. */
    #tip .key {
      margin-left: auto; padding: 1px 5px; border-radius: 5px;
      background: rgba(58,49,40,.09); box-shadow: inset 0 -1px 0 rgba(58,49,40,.14);
      font-size: 9.5px; font-weight: 800; opacity: .6;
    }
    #tip .key[hidden] { display: none; }
    /* The second line: what the thing is doing right now. Quieter than the
       name, because you read the name to find the button and this to find out
       what it has to say. */
    #tip .note { margin-top: 2px; opacity: .62; font-size: 11px; }
    #tip .note[hidden] { display: none; }
    /* ...unless it is live, in which case it is the reason you hovered. It
       wears the same two colours the delivery ring does, so the arc on the
       button and the sentence above it are visibly one readout. */
    #tip .note[data-tone] { opacity: 1; font-weight: 700; }
    #tip .note[data-tone="warn"] { color: #b5801f; }
    #tip .note[data-tone="good"] { color: #46803f; }
    /* The caret. A rotated square rather than a border triangle, so it takes
       the box's own background and shadow and stays one shape with it — and it
       is positioned by script rather than centred here, because a tip pushed
       off the screen edge must still point at its button. */
    #tip .arrow {
      position: absolute; bottom: -3px; width: 10px; height: 10px;
      margin-left: -5px; border-radius: 2px;
      background: var(--panel-solid); transform: rotate(45deg);
      /* The box's own shadow stops at the box, so without this the caret is a
         flat tab hanging off a lifted card. Offset down-and-right in the
         element's own axes, which after the 45° turn is straight down the
         screen — a shadow is transformed with the thing that casts it. */
      box-shadow: 2px 2px 6px rgba(58,49,40,.12);
    }
    @media (prefers-reduced-motion: reduce) {
      #tip, #tip.show { transition: opacity .1s ease; transform: none; }
    }

    /* The drag joystick draws nothing — see client/main.js. */

    /* bottom-right: event log.
       `align-items: end` so a short line is a short pill — the column is a
       width bound, not a shape every line has to fill — and the pills line up
       on the edge they are anchored to rather than ragging away from it.

       It is the one thing in the bottom stack that does NOT clear the nav, and
       that is the point rather than an oversight. Everything else down there is
       something you press, so it is worth the arithmetic in `--nav-top` /
       `--build-h` to keep it above whatever the bar is doing. A feed is the
       opposite: you never touch it, and a column of lines that jumped every
       time the build bar opened or closed was six things moving in answer to a
       press that had nothing to do with them. So it takes the corner and stays
       there. */
    #log {
      right: 12px; bottom: 12px; max-width: min(520px, 46vw);
      display: flex; flex-direction: column; align-items: flex-end; gap: 3px;
      /* The feed sits over a corner of the FLOOR, so every pill was a patch of
         shop you could not tap to walk to — quietly, because a press that lands
         on nothing looks like a press you got wrong. It has never needed the
         pointer, and now that hovering means something it still doesn't:
         `hoverLog` hit-tests rectangles instead. */
      pointer-events: none;
    }
    /* Quieter at rest than anything you are meant to be reading — this is a feed
       you glance at over the top of the shop, and six opaque cards in the corner
       of the floor is a wall. Pointing at one gives it back in full; see
       `hoverLog` for why that is hit-tested rather than `:hover`. */
    #log div {
      display: flex; align-items: center; gap: 6px;
      background: var(--panel); border-radius: 9px; padding: 4px 10px;
      font-size: 11.5px; line-height: 1.35; box-shadow: 0 2px 7px rgba(58,49,40,.09);
      opacity: .74; transition: opacity .18s, transform .3s;
    }
    #log div.held { opacity: 1; }
    /* Last, so it beats both of the above — a line on its way out fades from
       wherever it happened to be. Off the edge it is anchored to, so it reads
       as leaving the screen rather than sliding under the shop. */
    #log div.out { opacity: 0; transform: translateX(8px); }
    /* Who did it, in front of the sentence that names them. Round, because the
       plate under an item is a shelf and the plate under a person is not — the
       two want telling apart at a glance down a column of lines. A flex child
       rather than a float, so it centres against a wrapped message instead of
       pinning to its first line. */
    #log .lg-who {
      flex: none; width: 21px; height: 21px;
      margin-left: -3px; border-radius: 99px; padding: 2px;
      background: rgba(58,49,40,.07);
    }
    #log .lg-who > svg { width: 100%; height: 100%; display: block; }
    /* Goods inside a line, as "2x <picture>" — see `paintLogLine`. The count is
       the loud half: what the icon says is *which*, and you already know which
       shop you are in. The plate behind the art is the board tip's, and for the
       same reason — item art is authored in shop colours, so a dark loaf on a
       dark card is a smudge whatever somebody authors next.

       Inline, so the count keeps the sentence's baseline; only the picture is
       centred on it. Made a flex box, the chip centres its own number against
       its icon and the number then floats off the line of the words. */
    #log .lg-good { font-weight: 800; white-space: nowrap; }
    #log .lg-good > svg {
      width: 17px; height: 17px; display: inline-block; vertical-align: middle;
      margin-left: 2px;
      padding: 1px; border-radius: 5px; background: rgba(58,49,40,.05);
    }
    /* bottom-right: what is in your hands, a row per pile.
       It was one long sentence, which at three kinds ran the width of the
       screen and put the *verb* — the half telling you how to put it down —
       off the right-hand edge. A column stops growing sideways however mixed
       an armful is, and lines the counts up under each other so a glance
       reads how much rather than parsing a list. */
    /* bottom-centre: the chase bar. Only ever on screen while it is not full,
       which is what keeps it out of the way of a game that is mostly not a
       chase — see `syncStamina`. Centred rather than tucked in a corner
       because it is read while sprinting, when your eyes are on the person you
       are running after and a corner is somewhere you are not looking. */
    #stam {
      left: 50%; transform: translateX(-50%); bottom: 76px;
      width: 132px; height: 6px; border-radius: 3px;
      background: rgba(58,49,40,.22); overflow: hidden;
      pointer-events: none; opacity: 0; transition: opacity .18s;
    }
    #stam.show { opacity: 1; }
    #stam i {
      display: block; height: 100%; width: 100%; border-radius: 3px;
      background: var(--good); transform-origin: left center;
      transition: transform .08s linear;
    }
    /* Run yourself flat and the bar says so rather than just sitting empty:
       `winded` is a state you are IN, and an empty bar alone reads as a bar
       that has stopped working. */
    #stam.spent i { background: var(--accent); }
    #carry {
      right: 12px; background: var(--panel); font-size: 11.5px;
      border-radius: 11px; padding: 6px 9px 7px;
      box-shadow: 0 2px 7px rgba(58,49,40,.09);
      display: flex; flex-direction: column; gap: 3px; max-width: 220px;
    }
    #carry:empty { display: none; }
    #carry .cy-what {
      font-size: 9.5px; font-weight: 800; letter-spacing: .07em;
      text-transform: uppercase; opacity: .5;
    }
    #carry .cy-row { display: flex; align-items: center; gap: 5px; }
    /* Right-aligned so "2x" and "12x" share an edge down the column. */
    #carry .cy-n { font-weight: 800; min-width: 24px; text-align: right; flex: none; }
    #carry .cy-row > svg {
      width: 19px; height: 19px; flex: none; display: block;
      padding: 1px; border-radius: 5px; background: rgba(58,49,40,.05);
    }
    #carry .cy-name {
      font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    #carry .cy-hint { font-size: 10.5px; font-weight: 600; opacity: .55; line-height: 1.3; }

    /* "Harvesting…" — what standing here is about to do. Sits low and centre,
       near where your hand already is, and vanishes the moment nothing is in
       range. */
    #prompt {
      left: 50%; transform: translate(-50%, 8px); opacity: 0;
      background: rgba(58,49,40,.86); color: #fff; padding: 7px 16px;
      border-radius: 99px; font-size: 14px; font-weight: 600;
      pointer-events: none; transition: opacity .14s, transform .14s;
      white-space: nowrap;
    }
    #prompt.show { opacity: 1; transform: translate(-50%, 0); }
    #prompt.going { background: #ffd66b; color: var(--ink); }
    #prompt b { font-weight: 800; }

    /* ...and which button does it, once per press that means anything here. One
       row, divided — the pill stays the one pill it always was and only gets
       longer. Left-button entries read glyph-first and right-button ones are
       reversed, so each mouse sits on its own outside edge and the side of the
       divider a job is written on is which finger presses it. */
    /* Wraps rather than running off the screen: four entries fit a desktop and
       do not fit a phone, and a pill whose last entry is past the edge is the
       one arrangement that loses information without saying so. */
    #prompt {
      display: flex; align-items: center; flex-wrap: wrap; justify-content: center;
      max-width: min(92vw, 760px); white-space: normal;
    }
    /* A `<button>` where there is a press behind it and a `<span>` where there
       is not (see `paintPrompt`) — and the two have to be INDISTINGUISHABLE
       here, because on a desktop this is a caption and nothing else: the mouse
       is the button, and the pill only says which one. Without the reset the
       browser draws its own control on top of the shop, which is a grey chip
       with a border and an outline in somebody else's design language sitting
       inside a pill that had neither. `appearance` first, then every property a
       default button brings with it — a partial reset is the tell-tale one, and
       the one it always misses is `font`. */
    #prompt .pr-say {
      display: flex; align-items: center; gap: 6px;
      appearance: none; -webkit-appearance: none;
      background: none; border: 0; border-radius: 0; box-shadow: none;
      margin: 0; padding: 0; color: inherit; font: inherit; text-align: inherit;
      outline: none;
    }
    #prompt .pr-say.pr-r { flex-direction: row-reverse; }
    /* A hairline rather than a dot or a gap: these are alternatives, and a
       middle dot reads as "and then", which is the opposite of what it means. */
    #prompt .pr-say + .pr-say {
      margin-left: 10px; padding-left: 10px;
      border-left: 1px solid rgba(58,49,40,.22);
    }
    /* Tap and hold are the one thing about this shop nobody can guess, so the
       longer press is labelled rather than implied. Small, dim, and in front of
       the words on its own side. */
    #prompt .pr-hold {
      font-style: normal; font-size: 9.5px; font-weight: 800;
      letter-spacing: .07em; text-transform: uppercase; opacity: .5;
    }
    /* ...and a row whose press is a key wears the key instead of a mouse — see
       `keyCap`. Sized off the mouse beside it rather than off the words, because
       the two sit in one row and a cap the height of the text reads as a badge
       on the sentence rather than as the thing you press. It does NOT nudge: the
       animation on the mouse says which button, and there is only one R. */
    #prompt .pr-key {
      flex: none; min-width: 15px; padding: 2px 4px; border-radius: 5px;
      background: rgba(255,255,255,.13);
      box-shadow: inset 0 -1px 0 rgba(0,0,0,.28);
      font: inherit; font-size: 10px; font-weight: 800; line-height: 1;
      text-align: center; opacity: .75;
    }
    /* The mouse nudges with its own button, which is most of what makes it read
       as a press rather than as a light coming on. */
    #prompt .pr-mouse {
      width: 11px; height: 15.7px; flex: none; display: block;
      animation: prNudge 2s ease-in-out infinite;
    }
    #prompt .pr-press { opacity: .32; animation: prClick 2s ease-in-out infinite; }
    @keyframes prClick {
      0%, 16%, 100% { opacity: .32; }
      5%, 12% { opacity: 1; }
    }
    @keyframes prNudge {
      0%, 16%, 100% { transform: none; }
      5%, 12% { transform: translateY(.6px); }
    }
    @media (prefers-reduced-motion: reduce) {
      #prompt .pr-press { animation: none; opacity: 1; }
      #prompt .pr-mouse { animation: none; }
    }

    /* ---- what is that pile? ----------------------------------------------
       A card that follows the pointer while it is over one board of a shelf.
       The gold cage says WHICH pile you are on and could never say what it is:
       goods are drawn as themselves at about a dozen pixels, so four loaves and
       four buns are the same little heap from this camera, and how many of them
       there are was a number you had to open the unit to read.

       Dark rather than a `--panel` card, and that is the one deliberate break
       from the rest of the HUD: everything else up there is pinned furniture
       you glance at, and this sits ON the shop, an inch from what it is
       labelling. A pale card there reads as another panel that has drifted into
       the middle of the screen. `#prompt` made the same call for the same
       reason and this matches it, so the two things that speak *about the
       world* look like each other.

       `pointer-events: none` is load-bearing rather than tidy — the card is
       under the cursor by construction, so without it the shelf it is
       describing stops being clickable the moment the label appears. */
    #boardtip {
      opacity: 0; transform: translateY(3px); transition: opacity .1s, transform .1s;
      /* Over the rest of the HUD, which is the one thing in here that has to be
         said out loud: an open panel is later in the document and would paint
         over a card that only ever appears where the pointer is — and the
         pointer being on the canvas is exactly the case this is for. */
      pointer-events: none; z-index: 11;
      background: rgba(58,49,40,.9); color: #fff;
      border-radius: 11px; padding: 6px 11px 7px 7px;
      box-shadow: 0 6px 18px rgba(58,49,40,.28);
      white-space: nowrap; line-height: 1.25;
      display: flex; align-items: center; gap: 8px;
    }
    #boardtip.show { opacity: 1; transform: translateY(0); }
    /* The item, drawn from its own model — `artForModel`, the same art the heap
       on the shelf is built from. A glyph here would be the five-floors-one-grey-
       icon bug again: goods differ by their art and by nothing else.

       The plate behind it is not decoration. Item art is authored in shop
       colours against a pale floor, and a dark loaf on a dark card is a smudge;
       a light tile under it puts every item back on the ground it was drawn
       for, whatever colour somebody authors next. */
    #boardtip .bt-ico {
      flex: none; width: 30px; height: 30px; padding: 3px;
      border-radius: 8px; background: rgba(255,252,245,.16);
    }
    #boardtip .bt-ico > svg { width: 100%; height: 100%; display: block; }
    #boardtip .bt-ico:empty { display: none; }
    #boardtip .bt-name { font-size: 13px; font-weight: 800; }
    /* The second line is the numbers, and they are deliberately quieter than
       the name: you look at this to find out what a heap IS, and then at how
       much of it there is. */
    #boardtip .bt-sub {
      font-size: 11.5px; font-weight: 700; opacity: .72;
      display: flex; gap: 7px; align-items: center;
    }
    /* Full boards say so, because "8/8" is why the van's crate is still on the
       pad. `--warn` rather than the alarm colour: a full shelf is a good
       problem. */
    #boardtip .bt-sub .full { color: var(--warn); opacity: 1; }
    #boardtip .bt-sub .bt-dot { opacity: .4; }

    /* toast */
    /* Just below #hq's single strip. */
    #toast {
      top: 66px; left: 50%; transform: translate(-50%, -12px); opacity: 0;
      background: var(--ink); color: #fff; padding: 6px 14px; border-radius: 99px;
      font-size: 12.5px; font-weight: 700; pointer-events: none; transition: .25s;
    }
    #toast.show { opacity: 1; transform: translate(-50%, 0); }
    #toast.bad { background: var(--accent); }

    /* A word above the rail — see `Rail.note`. The build hint's pill exactly,
       because it is the build hint's job one press earlier: what the mode is
       holding, said over the nav, before there is a bar for the real one to sit
       on. Only the height is set in JS (the rail wraps); centring is `left: 50%`
       here, since the rail is centred on the screen itself.

       z-index over the bar and the panel (both 10), or a note about the button
       under it would open beneath whatever the press just put up. */
    /* `width: max-content` IS THE CENTRING, not a nicety — see the same three
       lines on #toast in the narrow query below, which is the same bug found
       first. This is fixed with `left: 50%` and no width, so the space a
       shrink-to-fit box is offered runs from the MIDDLE of the screen to its
       right-hand edge: half the width, on an element that is then translated
       back to the centre. So the note wrapped at about 190px of a 390px phone —
       "Drag things about — click again for" over "the menu" — and read as a
       padding problem in a pill that has no padding wrong with it. The
       `max-width` only bounds what max-content asks for; a note longer than the
       screen still wraps, which is what it should do. */
    #rail-note {
      position: fixed; z-index: 12; left: 50%; pointer-events: none;
      width: max-content; max-width: calc(100vw - 24px);
      background: rgba(58,49,40,.82); color: #fff; border-radius: 99px;
      padding: 4px 12px; font-size: 12px; font-weight: 600;
      opacity: 0; transform: translate(-50%, 7px);
      transition: opacity .15s, transform .18s;
    }
    #rail-note.show { opacity: 1; transform: translate(-50%, 0); }

    /* The panel is what the nav expands into: it rises out of the button you
       pressed, above whatever bar is up, and is the top of the same column. */
    #panel {
      bottom: calc(var(--nav-top) + var(--build-h) + 8px);
      left: 50%; transform: translateX(-50%);
      /* Wider than it was, and it can afford to be: 214px was the width of a
         strip pinned against the right rail, and at that width a worker's
         read-out wrapped every line — "looking for something to do" over two,
         "New behind the counter" over two — so the head ate the room the job
         list needed. Wider costs horizontal space nothing else is using and
         buys back four rows of vertical.

         The height is the real space above the stack rather than a flat vh, so
         a taller bar shortens the panel instead of pushing it off the top. */
      width: min(430px, calc(100vw - 24px));
      max-height: min(72vh, calc(100vh - var(--nav-top) - var(--build-h) - 20px));
      background: var(--panel);
      border-radius: 18px; box-shadow: 0 10px 34px rgba(58,49,40,.22);
      display: none; flex-direction: column; overflow: hidden;
    }
    #panel.show { display: flex; }
    /* The header is also the grab handle: drag to move the panel, double-click
       to give it back to the stylesheet. `touch-action` because without it a
       drag on a touchscreen is a scroll gesture before it is ever a drag. */
    #panel header {
      display: flex; justify-content: space-between; align-items: center;
      padding: 7px 10px; border-bottom: 1px solid var(--line); font-weight: 800;
      cursor: move; touch-action: none;
    }
    /* `flex: 1` so a note inside it can be pushed to the far end — the header is
       space-between over two children, which only ever puts the close button on
       the right. `min-width: 0` because the title is the elastic one now and a
       long section name must shrink rather than shove the clock off the edge. */
    #panel-title { display: flex; align-items: center; gap: 7px; font-size: 12.5px; flex: 1; min-width: 0; }
    /* What is on the road, on the right of the title bar. `auto` rather than a
       spacer element, and `pointer-events: none` because this strip is the drag
       handle: a readout you can accidentally grab-and-not-drag reads as the
       window having stuck. */
    .pnl-note {
      margin-left: auto; display: flex; align-items: center; gap: 6px;
      font-weight: 600; pointer-events: none;
    }
    .pnl-note .n { font-size: 10.5px; opacity: .6; white-space: nowrap; }
    /* The clock as a pill rather than loose text. Tabular figures so it does not
       jitter as the digits change — a countdown whose width moves reads as the
       panel twitching — and a fixed ink so it stays legible when the title beside
       it is a long section name at .6. */
    .pnl-note .clock {
      font-size: 10.5px; font-variant-numeric: tabular-nums; letter-spacing: .02em;
      padding: 2px 6px; border-radius: 999px; white-space: nowrap;
      background: rgba(58,49,40,.09); color: var(--ink); opacity: .85;
    }
    /* Pulling in. The one state worth colouring: it is the difference between a
       number to plan around and a thing about to happen on the floor. */
    .pnl-note .clock.now { background: #ffd66b; opacity: 1; }
    /* The one thing in the note you can press, so it opts back into the pointer
       its parent gave up. Sized off the close button beside it — two controls in
       one header that are different sizes read as one of them being broken. */
    .pnl-note .pnl-btn {
      pointer-events: auto; border: 0; background: none; padding: 2px; margin: -2px;
      color: var(--ink); opacity: .45; cursor: pointer; font-size: 12px; line-height: 0;
      border-radius: 6px;
    }
    html.can-hover .pnl-note .pnl-btn:hover { opacity: 1; background: rgba(58,49,40,.08); }
    #panel-close {
      border: 0; background: none; font: inherit; cursor: pointer; font-size: 15px;
      color: var(--ink); opacity: .5; padding: 0;
    }
    html.can-hover #panel-close:hover { opacity: 1; }
    /* The scroller. Its padding is named because the sticky head and foot below
       have to cancel it exactly — a sticky `top: 0` pins to the padding edge, so
       without that the rows scroll through a sliver of gap above the pinned
       block and it reads as a rendering fault. */
    /* `--bar-y` is the one vertical figure every sticky strip in a panel uses,
       top and bottom — see the note above `.tabs`. */
    #panel-body { --panel-pad: 3px; --bar-y: 5px; overflow-y: auto; padding: var(--panel-pad); }

    /* A menu that declared a middle pane. The body stops scrolling and becomes
       a column: head, tabs, the one thing that scrolls, foot. `min-height: 0`
       on the scroller is the whole trick — a flex child defaults to
       `min-height: auto`, which means "as tall as my content", so without it
       the pane never overflows, never scrolls, and pushes the foot off the
       bottom of the panel instead. */
    #panel-body.paned {
      display: flex; flex-direction: column; overflow: hidden;
      /* It is itself a flex child of #panel, and it stopped being a scroller —
         so without these it grows to fit its content and takes the panel's
         max-height with it. `overflow-y: auto` was doing this job implicitly. */
      flex: 1 1 auto; min-height: 0;
    }
    #panel-body.paned .pnl-mid { flex: 1 1 auto; min-height: 0; overflow-y: auto; }
    #panel-body.paned .pnl-head,
    #panel-body.paned .pnl-foot,
    #panel-body.paned .tabs,
    /* The aisle strip is a chooser like the tabs above it, so it is pinned like
       them: it decides what the middle holds, and a strip that scrolled away
       would leave you in a narrowed list with no way back to the whole one. */
    #panel-body.paned .dwrap { flex: none; }
    /* Sticky was how these pinned themselves when the whole body scrolled.
       Nothing scrolls past them now, so the offsets that cancelled the body's
       padding would only shift them by it. */
    #panel-body.paned .pnl-head,
    #panel-body.paned .pnl-foot,
    #panel-body.paned .tabs,
    #panel-body.paned .dwrap { position: static; }

    /* A game does not get the operating system's scrollbar — and it does not
       get a hand-drawn one either. It was thin and in the panel's own ink,
       which is better than 15px of grey chrome down a 214px panel and still a
       strip of settings dialog stood beside a shop.

       So the list is DRAGGED, the way the bottom bar's is (`client/scroll.js`),
       and what is left is the question the bar was answering badly: is there
       more. That is a fade at whichever end has any — a mask rather than an
       overlay, because a scroll container's own `::before` is part of its
       content and would scroll away with it, and because the panel behind is
       glass and a gradient painted in one flat colour would read as a smear.

       Both spellings of the hiding, because they are not the same feature:
       `scrollbar-width` is the standard one Firefox has, `::-webkit-scrollbar`
       is what Chrome and Safari read, and neither is a fallback for the other. */
    #panel-body, #panel-body .pnl-mid {
      scrollbar-width: none;
      /* A drag over a list of words selects them, and a half-highlighted menu
         is what a scroll would leave behind on every pull. Given back to the
         fields you type in — the Menu names a shop and a player in there, and a
         box you cannot select the contents of is a box you cannot correct. */
      user-select: none; -webkit-user-select: none;
    }
    #panel-body input, #panel-body textarea {
      user-select: text; -webkit-user-select: text;
    }
    #panel-body::-webkit-scrollbar,
    #panel-body .pnl-mid::-webkit-scrollbar { display: none; }
    /* 20px, and the same at both ends. Any more eats the row it is fading; any
       less reads as a rendering seam rather than as "there is more". */
    #panel-body.more-back, #panel-body .pnl-mid.more-back {
      mask-image: linear-gradient(180deg, transparent 0, #000 20px);
      -webkit-mask-image: linear-gradient(180deg, transparent 0, #000 20px);
    }
    #panel-body.more-on, #panel-body .pnl-mid.more-on {
      mask-image: linear-gradient(0deg, transparent 0, #000 20px);
      -webkit-mask-image: linear-gradient(0deg, transparent 0, #000 20px);
    }
    #panel-body.more-back.more-on, #panel-body .pnl-mid.more-back.more-on {
      mask-image: linear-gradient(180deg, transparent 0, #000 20px, #000 calc(100% - 20px), transparent);
      -webkit-mask-image: linear-gradient(180deg, transparent 0, #000 20px, #000 calc(100% - 20px), transparent);
    }

    /* Search and tag chips. A comprehensive catalogue you cannot search is
       what mods get written to fix, and ours grows live while you play. */
    #panel-filter { padding: 5px 7px; border-bottom: 1px solid var(--line); }
    #panel-filter[hidden] { display: none; }
    #panel-searchwrap {
      display: flex; align-items: center; gap: 7px; padding: 0 9px;
      background: rgba(58,49,40,.06); border-radius: 9px;
    }
    #panel-searchwrap:focus-within { outline: 2px solid #ffd66b; }
    #panel-searchwrap .ico { font-size: 13px; opacity: .4; }
    #panel-search {
      flex: 1; border: 0; background: none; color: var(--ink); outline: 0;
      padding: 5px 0; font: inherit; font-size: 12px; font-weight: 600; min-width: 0;
    }
    /* The tag chips that used to sit here listed every tag on screen — thirty
       above eighteen items — to do what typing in the box already does. */
    /* Icon tabs at the top of a menu that declared groups. Sticky, because the
       body is what scrolls — tabs that scrolled away would leave you in a list
       with no way back to the one you wanted. Icon-only: the panel is 214px and
       four labelled tabs would each get nine characters. */
    /* THE SPACE UNDER A STICKY BAR IS PADDING, NEVER MARGIN.
       A margin is outside the background box, so the three bars in this stack
       each painted themselves opaque and then left a 4px transparent band under
       the hairline — a slot the list scrolls through. On screen it is a green
       heat pill and half a red × sliding between the tabs and the aisles, which
       reads as the panel having come apart rather than as a gap: everything IS
       covered, in three strips with holes between them.
       The gaps must stay the same size, because `paintSection` measures where
       each bar ends to stick the next one under it — padding of the same figure
       keeps every offset identical and simply fills it in.

       ...and a sticky bar has to be as wide as the SCROLLPORT, which is the
       whole panel and not the column the rows sit in. `#panel-body` is padded,
       so a bar that stopped at the content edge left `--panel-pad` of clear
       glass down each side for the list to slide past — the same hole as the
       one above turned ninety degrees, and the same fix `.pnl-head` makes about
       the top edge: cancel the padding with a negative margin and put it back
       as padding of its own, so what the bar CONTAINS has not moved a pixel and
       what it PAINTS reaches the wall.

       ...and "the same figure" is `--bar-y`, which it was not. Each bar had been
       tuned on its own — 2/10 on the tabs, 0/8 on the aisles, 2/7 on the heads —
       so three strips of the same kind of thing, stacked and hairlined alike,
       sat at three different heights above and below their own contents. None of
       that is visible in any ONE bar; what you see is the stack, where the chips
       crowd the strip above them and the tabs float in a band twice as deep. One
       number, top and bottom, on all three: the rhythm is the thing being
       designed, and it is not something three separate paddings can agree on by
       being individually reasonable. */
    .tabs {
      position: sticky; top: 0; z-index: 2; display: flex; gap: 3px;
      margin-inline: calc(-1 * var(--panel-pad));
      padding: var(--bar-y) var(--panel-pad);
      background: var(--panel-solid); border-bottom: 1px solid var(--line);
    }
    .tab {
      flex: 1; display: grid; place-items: center; padding: 5px 0;
      border: 0; border-radius: 8px; background: transparent;
      color: var(--ink); opacity: .4; font-size: 13px; cursor: pointer;
      transition: opacity .1s, background .1s;
    }
    html.can-hover .tab:hover { opacity: .8; background: rgba(58,49,40,.06); }
    .tab.on { opacity: 1; background: #ffd66b; }
    .tab svg { display: block; }
    /* A section's tab says its own name — see `paintSection`, which is also
       where the argument for it is. A row of glyphs beside a word rather than
       stacked over it, because the strip under it (`.dtabs`) is a row of words
       and two strips of text at right angles to each other read as two
       different kinds of control. It shrinks rather than shoving: the panel is
       430px on a desktop and the width of a phone on a phone, so the label
       ellipsises on the narrow one and the icon — the thing you aim at — never
       moves. */
    .tab.named {
      display: flex; align-items: center; justify-content: center; gap: 5px;
      min-width: 0; padding-inline: 5px;
    }
    .tab .tlabel {
      font-size: 11px; font-weight: 700; letter-spacing: .01em;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    /* How many are behind the tab. `position: relative` on the button and the
       count in the corner rather than beside the glyph: these are six equal
       columns of a 214px panel, so a number ON the row would halve the icon,
       and the icon is what you actually aim at. */
    /* ---- the aisle strip --------------------------------------------------
       Departments, under the icon tabs, in a shelf's item list. Text rather
       than icons because there is no picture of "condiment" and these are read
       rather than aimed at — see `deptStrip` in client/fixture-menu.js.

       IT SCROLLS SIDEWAYS, and it wrapped for four steps on an argument that
       reads well and is about the wrong thing: twelve short words have no order
       you can predict a position from, so a strip you have to scroll hides the
       very aisle you came for. True — and what it was buying that with is
       VERTICAL space in a popover whose entire job is the list underneath.
       Eight chips is two lines and nine is three, so authoring one condiment
       pushes every item you were reading down a row, and the strip that is
       supposed to be a rule under the tabs becomes a paragraph of words. One
       row that scrolls is a fixed cost forever, which is the same call
       `#build-strip` makes about tools, for the same reason.
       What makes the old objection survivable is that nothing about this is a
       row you HUNT along: the aisle you chose is scrolled back into view every
       repaint (`wireDepts`), and the fades below say which end has more — so
       the two things it could hide, where you are and that there is more, are
       both answered without moving.

       Dragged rather than scrollbarred, and the fade is a MASK: see the note on
       `#panel-body` above for both halves of why — a scroll container's own
       `::before` is part of its content and scrolls away from the end it was
       marking, and the panel behind this is glass. `client/scroll.js` puts the
       classes on. */
    /* Sticky under the sticky tab strip. `top` is set in JS off where the tabs
       end (`paintSection`) — a written-down offset would be a copy of this
       file's own padding, and it would be wrong the day a tab gets taller. In
       the paned layout (a fixture menu) nothing here applies: the middle
       scrolls and this is pinned outside it. */
    /* The BAR is not the scroller — see `deptStrip`. The fade is a mask, and a
       mask takes the background with it, so a strip that was both painted a
       20px window in itself at whichever end had more and let the list scroll
       through it. `.dwrap` is the opaque, sticky, full-width half; `.dtabs`
       inside it is the part that moves and fades. */
    .dwrap {
      position: sticky; top: 0; z-index: 1;
      /* Out to the panel wall, and the padding puts the strip back where it
         was — see `.tabs`. */
      margin-inline: calc(-1 * var(--panel-pad));
      padding: var(--bar-y) var(--panel-pad);
      background: var(--panel-solid);
      border-bottom: 1px solid var(--line);
    }
    .dtabs {
      display: flex; flex-wrap: nowrap; gap: 3px;
      overflow-x: auto; overflow-y: hidden;
      /* A touch flicks it natively; the mouse drag is `wireScroll`'s. */
      touch-action: pan-x;
      /* `scrollIntoView` aligns to the scrollport, so without this the chip it
         brings back sits flush against the edge with none of the gap the rest
         of the row has — and a chip against the wall reads as a chip that is
         cut off rather than as the first one. */
      scroll-padding-inline: 12px;
      scrollbar-width: none;
      /* The space under the strip belongs to `.dwrap`, which is the half that
         is opaque — anything here would be inside the mask. */
      padding: 1px 0 0;
    }
    .dtabs::-webkit-scrollbar { display: none; }
    /* 20px at each end, the same figure and the same reasoning as the panel's
       own fades — any more eats the chip it is fading, any less reads as a
       rendering seam rather than as "there is more". */
    .dtabs.more-back {
      mask-image: linear-gradient(90deg, transparent 0, #000 20px);
      -webkit-mask-image: linear-gradient(90deg, transparent 0, #000 20px);
    }
    .dtabs.more-on {
      mask-image: linear-gradient(270deg, transparent 0, #000 20px);
      -webkit-mask-image: linear-gradient(270deg, transparent 0, #000 20px);
    }
    .dtabs.more-back.more-on {
      mask-image: linear-gradient(90deg, transparent 0, #000 20px, #000 calc(100% - 20px), transparent);
      -webkit-mask-image: linear-gradient(90deg, transparent 0, #000 20px, #000 calc(100% - 20px), transparent);
    }

    /* WHAT THE COLUMNS ARE — the third sticky bar, over a list that has become
       a table. Same `gap` and same side padding as `.row`, because the cells
       under it are a row's cells and the widths come from measuring them
       (`paintSection`); anything else here would be a second opinion about a
       row's geometry. `top` is set in JS for the reason `.dtabs`' is.

       Stepper type rather than row type: this is the same 8px uppercase the
       `min`/`max` tags inside the steppers already wear, which is what makes
       the strip read as labelling the numbers rather than as a row of them. */
    .heads {
      position: sticky; top: 0; z-index: 1;
      display: flex; align-items: flex-end; gap: 7px;
      /* Padding rather than a margin under it, and out to the wall at the sides
         — see `.tabs`. This is the one that leaked onto the list itself: a row
         slid under the column heads and showed through the 3px between them.
         The side figure is the row's own 7px PLUS the panel padding the margin
         just cancelled, or the heads stop naming the columns they sit over. */
      margin-inline: calc(-1 * var(--panel-pad));
      padding: var(--bar-y) calc(7px + var(--panel-pad));
      background: var(--panel-solid);
      border-bottom: 1px solid var(--line);
    }
    .heads .hcell {
      flex: none; font-size: 8px; font-weight: 800; letter-spacing: .04em;
      text-transform: uppercase; opacity: .42; white-space: nowrap; overflow: hidden;
    }
    .heads .grow { flex: 1; min-width: 0; }
    .heads .mid { text-align: center; }
    .heads .end { text-align: right; }

    /* ...and a head is only true of a column every row agrees on, which two of
       these were not: what is on a van hangs off the count (`4` against `4+6`),
       and the one button slot holds `×6`, `Cancel` or `Stock`. Widened to the
       longest of each, so the numbers line up down the list as well as under
       the word naming them — the row is the only elastic column and pays for
       it, which is the trade `.name` is there to make. `min-width`, so a
       three-figure count grows rather than spilling. */
    .cols .row .held { min-width: 36px; }
    .cols .row .rule { min-width: 96px; justify-content: flex-end; }
    .cols .row > button[data-btn], .cols .row .bpad { min-width: 58px; flex: none; }
    /* The cells a row has nothing to put in. A made-here item is not ordered
       and has no standing order, and an absent cell would slide its name and
       its count out from under the heads naming them. */
    .cols .row .bpad { display: block; }
    /* Caption type, not row type. These name the list rather than being IN it,
       so they sit at the weight of `.sep` above the rows — anything bigger
       competes with the item names, which are the thing you came to read.

       Equal cells with the text centred, and a hairline between them: the same
       shape as the icon tabs a row up, which is what makes it read as a second
       row of tabs rather than as a paragraph of words. A `font` SHORTHAND does
       not work here — `font: 700 9px inherit` names no family, so the whole
       declaration is invalid and dropped, and what you get is body type in a
       pill. Separate properties. */
    /* Badges, each as wide as its own word. Two shapes were tried first and both
       are worth naming. Equal cells with rules between them made the last line
       stretch three words across the whole panel — a second paragraph rather
       than a rule under the tabs. Content-width cells with rules between them
       fixed the stretching and left the dividers meaning nothing, since a gap
       already separates two chips. So: no rules, a chip each, and the badge
       shape the rest of this panel already uses for a small fact on a row. */
    .dtab {
      flex: 0 0 auto; text-align: center;
      border: 0; border-radius: 99px;
      padding: 2px 7px; color: var(--ink);
      background: rgba(58,49,40,.07);
      font-size: 8px; font-weight: 800; letter-spacing: .04em;
      text-transform: uppercase; line-height: 1.5;
      opacity: .5; cursor: pointer; transition: opacity .1s, background .1s;
    }
    html.can-hover .dtab:hover { opacity: .9; background: rgba(58,49,40,.14); }
    /* The same yellow the icon tab uses for "you are here", because it is the
       same fact one row down — two colours for one state would read as two
       different kinds of selection. */
    .dtab.on { opacity: 1; background: #ffd66b; }

    .tab { position: relative; }
    .tab .tcount {
      position: absolute; top: 0; right: 2px;
      font-size: 8.5px; font-weight: 700; font-style: normal; line-height: 1;
      opacity: .75; pointer-events: none;
    }
    /* ...and a tab that says its name has somewhere to put the number: after the
       word, in the line, where it reads as part of the sentence. The corner is
       what you do when the button is a glyph and there is no line to be in — a
       superscript over a word is a footnote mark. */
    .tab.named .tcount {
      position: static; font-size: 10px; opacity: .6; flex: none;
    }
    /* An empty tab is still drawn — that is what keeps the strip the same shape
       morning to morning — but it must not read as a place worth pressing. Faded
       past `.tab`'s resting .4, and its zero fades further: the tab is the
       answer, and the digit is only there so the fade is not ambiguous with the
       panel having failed to draw. */
    .tab.none { opacity: .22; }
    .tab.none .tcount { opacity: .5; }
    .tab.none.on { opacity: 1; }

    .row { display: flex; align-items: center; gap: 7px; padding: 4px 7px; border-radius: 9px; }
    html.can-hover .row:hover { background: rgba(58,49,40,.05); }
    .row.owned { opacity: .5; }
    /* "There is already one of these somewhere" — a nudge, not a refusal, so it
       has to stay clearly darker than `.owned`. At the same .5 a row you can
       still press looked exactly like one with nothing to press, and the list
       read as half disabled. The name keeps its weight and only the sub-line
       steps back, because what is muted is the ARGUMENT for the row, not the
       item's name — which is the thing you are scanning for. */
    .row.muted { opacity: .82; }
    .row.muted .tags { opacity: .72; }
    /* The title stays on one line — it's short, and a wrapping bold heading
       reads as two rows. The description wraps but is clamped at two lines, so
       a menu fed from a live database still can't grow taller than the screen;
       anything past that is on the hover title. */
    .row .name {
      flex: 1; min-width: 0; font-size: 12px; font-weight: 700;
      display: flex; flex-direction: column;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .row .tags {
      font-weight: 500; font-size: 10.5px; line-height: 1.3; opacity: .55;
      white-space: normal; overflow: hidden;
      display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2;
    }
    /* The name gets a line to itself, and everything said ABOUT the item shares
       the one under it.
       Three arrangements to get here and the middle one is the lesson: the pill
       next to the name reads better in a mock-up and is wrong in the panel,
       because it is a fixed-width thing competing with the only elastic thing in
       the row. Nine characters of pill came straight off the name, so "Berry
       Smoothie" ellipsised to "Berry S…" and the list stopped being readable at
       the one column that identifies a row. News and description sit together on
       line two; the name never gives way to either. */
    .row .name > .t { overflow: hidden; text-overflow: ellipsis; }
    .row .meta { display: flex; align-items: center; gap: 6px; min-width: 0; }
    .row .meta .tags { min-width: 0; }
    /* A state the row is in, as one glyph with the sentence in its tooltip —
       see `rowHtml`. `flex: none` for the reason the heat pill has it: this
       shares the line with the only elastic thing in the panel, and a glyph
       that could be squeezed would take its width out of the caption instead
       of holding its own. Sized off the text around it rather than in pixels,
       so it sits on the same baseline as the tags it stands in for. */
    .row .mark {
      flex: none; display: inline-flex; align-items: center;
      font-size: 12px; opacity: .5; cursor: help;
    }
    .row .mark.warn { color: var(--accent); opacity: .75; }
    .row .heat {
      flex: none; padding: 0 5px; border-radius: 99px;
      font-size: 9.5px; font-weight: 800; letter-spacing: .01em;
      font-variant-numeric: tabular-nums;
    }
    .row .heat.up { background: #d8f0d2; color: #3f7a3c; }
    .row .heat.down { background: #f6dcd7; color: #a8442f; }
    /* The key hint never shrinks and never wraps — it's the shortest thing in
       the row and the whole reason the row is there, so the name gives way. */
    .row .price {
      font-weight: 700; font-variant-numeric: tabular-nums;
      flex: none; white-space: nowrap; font-size: 11px; opacity: .85;
    }
    .row button {
      border: 0; background: var(--good); color: #fff; border-radius: 8px;
      padding: 3px 9px; font: inherit; font-size: 11px; font-weight: 700; cursor: pointer; flex: none;
    }
    /* Un-ordering, in the slot ordering lives in. `.row button.danger` rather
       than `.danger` alone for the reason the steppers below spell out: a bare
       class loses to `.row button`, and a Cancel pill would come out the same
       green as Buy — which is the one pair in this panel that must never look
       alike. */
    .row button.danger { background: var(--accent); }
    /* The figure at the end of a row — how far along, what a rung costs, how
       much is left. `nowrap` and tabular because the ones that live here are
       fractions of authored units (`day 86 / day 100`): wrapped, a two-line row
       becomes a four-line one and the list stops lining up; proportional, the
       number jitters as it counts. It may take the width it needs and the name
       beside it gives way, which is the deal every elastic column in this panel
       makes with the fixed ones. */
    .row .have {
      font-size: 10.5px; opacity: .6; flex: none;
      white-space: nowrap; font-variant-numeric: tabular-nums;
    }

    /* How far along a row is. One rule, in the row system rather than in the
       menu that wanted it first, because "this thing has a target and you are
       part of the way to it" is not a fact about milestones. */
    .row .rbar {
      height: 4px; margin-top: 4px; border-radius: 99px;
      background: rgba(58,49,40,.12); overflow: hidden;
    }
    .row .rbar > i {
      display: block; height: 100%; border-radius: 99px; background: var(--good);
      transition: width .25s ease;
    }

    /* One item's standing order, on the row it is about.
       Inline rather than behind a tap, because these are the rows you scan to
       decide what to set — a rule you have to open a thing to see is a rule you
       forget you set. It is what the panel got wider for. */
    /* Every selector here has to out-specify `.row button` above, which paints
       any button in a row as the big green buy pill. It does not — a class beats
       nothing but a class-plus-type beats a class — so the steppers came out as
       seven green blobs across the row. Scoped to `.row` to win it back. */
    .row .rule { display: flex; align-items: center; gap: 4px; flex: none; }
    /* Min over max rather than beside it. The row is two lines tall because of
       the name and its caption, so the second line is already paid for — and
       side by side these two ran nearly the width of the panel and ellipsised
       the name to buy back height nothing was going to use. */
    .row .rule .stack { display: flex; flex-direction: column; gap: 2px; }
    /* A label, a number and two nudges. The number is the widest thing in it and
       it must not resize as it changes, or every press shuffles the row under
       your finger — hence a fixed width and tabular figures. */
    .row .stp {
      display: flex; align-items: center; gap: 0;
      background: rgba(58,49,40,.06); border-radius: 7px; padding: 1px;
    }
    .row .stp i {
      font-style: normal; font-size: 8px; font-weight: 800; letter-spacing: .03em;
      text-transform: uppercase; opacity: .38; padding: 0 3px 0 4px;
    }
    .row .stp b {
      min-width: 15px; text-align: center; font-size: 10.5px; font-weight: 800;
      font-variant-numeric: tabular-nums;
    }
    /* Unset is a dash, not a zero: "no minimum" and "a minimum of nothing" are
       different sentences and only one of them is true here. */
    .row .stp b.none { opacity: .28; font-weight: 700; }
    .row .rbtn {
      border: 0; background: transparent; color: var(--ink);
      border-radius: 5px; padding: 0; width: 15px; height: 16px; line-height: 1;
      font: inherit; font-size: 12px; font-weight: 800; cursor: pointer;
      display: grid; place-items: center; flex: none; opacity: .5;
    }
    html.can-hover .row .rbtn:hover { background: rgba(58,49,40,.14); opacity: 1; }
    /* A WORD rather than a nudge. The steppers are 15px squares because they
       sit either side of a number; this one is the whole control, so it has to
       be wide enough to read and sit up like something you press. */
    .row .rbtn.wide {
      width: auto; height: 20px; padding: 0 9px; font-size: 11px; opacity: .6;
      background: rgba(58,49,40,.08); border-radius: 7px;
    }
    /* The one that is a state rather than a nudge. Off is the loud one, because
       "never order this" is the exception and the default has nothing to say. */
    .row .rbtn.tog {
      width: 20px; height: 20px; font-size: 12px; opacity: .28;
      background: rgba(58,49,40,.06); margin-right: 1px;
    }
    .row .rbtn.tog svg { display: block; width: 1em; height: 1em; }
    .row .rbtn.tog.on { opacity: .7; }
    .row .rbtn.tog.off { background: rgba(190,60,45,.13); color: var(--accent); opacity: 1; }

    /* How many you are holding, on the row that orders more. The one number the
       supplier never showed and the whole reason it read as a catalogue rather
       than a stock list — "should I buy eggs" is unanswerable without it. */
    .row .held {
      flex: none; min-width: 30px; text-align: right; white-space: nowrap;
      font-size: 12px; font-weight: 800; font-variant-numeric: tabular-nums;
    }
    .row .held.short { color: var(--accent); }
    /* Nothing on the shelf. A dash rather than a 0 for the same reason an unset
       minimum is one, and dimmed on its own rather than by a `zero` class on the
       whole column, which is what this replaced — since deliveries take time the
       column can hold "none here, six coming", and fading that pair together
       fades the half that is news. */
    .row .held i.none { font-style: normal; opacity: .25; font-weight: 700; }
    /* What is on a van, hung off the count instead of taking a column of its
       own. Green because it is the answer to the red number beside it, and
       small because it is a promise rather than stock: you cannot sell it yet,
       and a row that shouted it would read as though you could. */
    .row .held .coming {
      font-style: normal; font-size: 9.5px; font-weight: 800;
      color: var(--good); margin-left: 2px; opacity: .9;
    }
    /* The sub-line is a reason now rather than a tag list, and the one reason
       that is a refusal rather than a note says so in the accent colour: you
       cannot put this anywhere, so buying it is a mistake whatever else is true. */
    .row .tags.warn { color: var(--accent); opacity: .85; font-weight: 700; }

    /* Section rows. Where the whole row is the button — picking a thing to
       build, picking a seed — the row is clickable and says so. */
    .sec-row { align-items: flex-start; }
    .sec-row.clickable { cursor: pointer; }
    .sec-row.picked { background: #fff3d0; box-shadow: inset 0 0 0 2px #ffd66b; }
    /* A row is a chip and a list of them is not a table, so they need air
       between them. Without it the failure is only visible when two rows are
       LIT: their rings meet and the pair reads as one block with a rule through
       it, since two 2px inset borders touching is a 4px seam and nothing else
       in the panel draws one. Adjacent-sibling, so a heading — which brings its
       own margin and its own rule — is not double-spaced, and the last row does
       not push against the panel's padding. */
    .sec-row + .sec-row, .fx-act + .fx-act { margin-top: 3px; }
    /* ...and the glyph is centred while the words stay top-aligned. Both rules
       are right about their own half: a caption that wraps to two lines should
       hang off the name, and a single mark for the WHOLE row lining up with the
       first line of it looks like it slipped. `align-self` rather than moving
       the row to `center`, which would take the price, the count and the
       steppers with it. */
    .sec-row > .lead, .fx-act > .bico { align-self: center; }
    .sec-row .bico { font-size: 14px; line-height: 1.2; width: 19px; text-align: center; }
    /* A row whose lead is a PICTURE of the thing rather than a glyph for its
       kind — a shape in the fixture menu, drawn from the same catalog row the
       game builds it from. The same well `.shape .ico.art` stands the palette's
       shape card in, at row size: art with no ground under it reads as a
       floating drawing, and the two lists are picking between the same shapes. */
    .sec-row .bico.art {
      width: 26px; height: 22px; padding: 2px; border-radius: 6px;
      background: radial-gradient(120% 100% at 50% 18%, rgba(255,255,255,.9), rgba(58,49,40,.055));
      box-shadow: inset 0 0 0 1px rgba(58,49,40,.06);
    }
    .sec-row .bico.art svg { width: 100%; height: 100%; display: block; }
    .sec-row .name { gap: 2px; }
    .sec-row .tags { line-height: 1.35; }
    /* A row that is a button — see `rowHtml`, which draws it as one rather than
       as a centred `.row`. The glyph is on the label's line and the caption is
       under both, which is the arrangement a two-line button has; a row centred
       in place puts the glyph outside the stack and the label adrift inside a
       column the width of the caption. */
    .midrow {
      display: block; width: 100%; border: 0; cursor: pointer; font: inherit;
      color: var(--ink); background: rgba(58,49,40,.06);
      border-radius: 9px; padding: 6px 8px 7px; margin-top: 3px; text-align: center;
      transition: background .1s;
    }
    html.can-hover .midrow:hover { background: rgba(58,49,40,.13); }
    .midtop {
      display: flex; align-items: center; justify-content: center; gap: 6px;
      font-size: 12px; font-weight: 700; line-height: 1.25;
    }
    /* Sized off the words beside it rather than in pixels, so it sits on their
       baseline — the same call `.row .mark` makes about a glyph in a line. */
    .midtop svg { display: block; width: 1em; height: 1em; opacity: .6; }
    .midsub { display: block; font-size: 10.5px; opacity: .55; line-height: 1.3; }

    /* ---- a block of switches ---------------------------------------------
       Four things you turn on and off, as tiles rather than as four rows. The
       row shape is a sentence — glyph, name, caption, state — and a switch has
       no use for the middle two: you know which one you want before the panel
       is up, and all you need back is that it moved.

       Two across, because the panel is 214px and these names are two words.
       Lit is the SAME yellow `.sec-row.picked` uses, since "this one is on" and
       "this one is chosen" are the same fact wearing two words — two colours for
       it would read as two kinds of state. Off is faded rather than greyed: the
       tile is still a press, and a disabled-looking switch is one people stop
       trying. */
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 3px; margin: 3px 0; }
    .gcell { position: relative; }
    .gtile {
      width: 100%; border: 0; font: inherit; color: var(--ink); cursor: pointer;
      background: rgba(58,49,40,.06); border-radius: 9px; padding: 7px 5px 5px;
      display: grid; justify-items: center; gap: 2px; text-align: center;
      opacity: .5; transition: opacity .1s, background .1s;
    }
    html.can-hover .gtile:hover { opacity: .9; background: rgba(58,49,40,.12); }
    .gtile.on { opacity: 1; background: #fff3d0; box-shadow: inset 0 0 0 2px #ffd66b; }
    .gtile .gico { font-size: 15px; line-height: 1; }
    .gtile .gico svg { display: block; width: 1em; height: 1em; }
    /* Wraps rather than ellipsises. A two-word name is the common case here and
       a tile that clipped one would be a switch you cannot read — the grid is
       already the short version, so the words are the whole of it. */
    .gtile .gname { font-size: 10px; font-weight: 700; line-height: 1.2; }
    .gtile .gstate {
      font-size: 8px; font-weight: 800; letter-spacing: .05em;
      text-transform: uppercase; opacity: .55;
    }
    /* The rare second verb, in the corner of the tile it belongs to. Small on
       purpose: it must be findable and must never be the thing your thumb hits
       when you meant the switch, so it sits clear of the glyph and the words. */
    .gsub {
      position: absolute; top: 3px; right: 3px; width: 16px; height: 16px;
      border: 0; padding: 0; border-radius: 6px; cursor: pointer;
      background: rgba(58,49,40,.10); color: var(--ink);
      display: grid; place-items: center; font-size: 9px; opacity: .45;
    }
    html.can-hover .gsub:hover { opacity: 1; background: rgba(58,49,40,.22); }
    .gsub svg { display: block; width: 1em; height: 1em; }

    /* Icon over price, one narrow column. */
    .lead { display: flex; flex-direction: column; align-items: center; gap: 1px; width: 26px; flex: none; }
    .lead .cost { font-size: 9px; font-weight: 700; opacity: .6; font-variant-numeric: tabular-nums; }
    .sep {
      font-size: 9px; font-weight: 800; text-transform: uppercase; letter-spacing: .06em;
      opacity: .45; padding: 6px 7px 2px; border-top: 1px solid var(--line); margin-top: 4px;
    }
    .foot { font-size: 10px; opacity: .55; padding: 6px 7px; line-height: 1.35; }

    /* ---- the shop report -------------------------------------------------
       The one menu that is a PICTURE rather than a list. Everything else in
       this panel is `.row`, which is right for anything you might press and
       wrong for a report: a list gives every number the same size, and the
       whole reading here is that today's profit and "4 picked" are not the
       same size of fact. See client/report.js for what each block is and why.

       Two colours do all the work and they are the ones the rest of the game
       already uses for this: --good and --accent, the same pair as the corner
       cashflow readout and every heat pill. They are also the worst pair alive
       for a red-green colourblind reader, so nothing in here rests on them —
       the week's sign is which side of the axis a column is on, the hero says
       "profit" or "loss" in words, and every delta carries an arrow. */
    .rp { padding: 2px 3px 6px; }
    .rp-blk { padding: 8px 8px 10px; }
    /* One column until there is room for two, and a real GRID when there is —
       cells in step across a row, not two independent columns side by side.
       That distinction is the whole of what makes it look segmented: two
       columns end wherever their own content ends, so the seam between them is
       ragged and a tall block on one side is marooned beside empty panel. Cells
       in a row are the same height by construction, so the lines run all the
       way across and meet the one down the middle.

       The lines ARE the grid gap: a 1px gutter with the rule colour behind it,
       and each cell painting itself back in over the top. One declaration draws
       every line in the panel, they cross exactly, and no cell has to know
       which of its four edges is an outside edge — which is the part that gets
       wrong by hand the moment a block moves. `--panel-solid` rather than
       `--panel`, because 94% over 94% is a line you can see through the cell
       next to it.

       The panel's own width moves on the same query: a 620px panel with one
