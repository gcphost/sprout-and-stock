<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <title>Sprocket &amp; Stock</title>
  <!-- The tab icon. A relative reference rather than an absolute one, and
       rather than a data: URI: Vite resolves it, emits it with a content hash
       and rewrites this href, which is why it works with `publicDir: false` —
       there is no static folder in this project for a favicon to sit in.

       `type` is not optional here. Without it some browsers sniff, and one that
       guesses wrong on an SVG silently falls back to asking for /favicon.ico —
       which does not exist, so what you get is the default page glyph and
       nothing anywhere saying why. See client/favicon.svg for the art. -->
  <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
  <style>
    :root {
      --ink: #3a3128;
      --panel: rgba(255, 252, 245, 0.94);
      /* The same colour at full alpha. Anything that pins itself over scrolling
         content needs this rather than --panel: 94% over 94% is still see-
         through, and rows sliding under a "solid" header read as a fault. */
      --panel-solid: #fffcf5;
      /* And the same colour with the shop showing through it, for the two things
         that sit over the world rather than over the page: the build bar and its
         shape card. Only ever used WITH `backdrop-filter` — glass without the
         blur is a panel you read a shelf through, and the text on it stops being
         readable the moment somebody paints a dark floor under the bar. */
      --panel-glass: rgba(255, 252, 245, 0.76);
      --line: rgba(58, 49, 40, 0.14);
      --accent: #e2564a;
      --good: #5aa356;
      /* The step between "fine" and "you have a problem" — a gauge that only
         had the two would jump straight from green to alarm with no warning. */
      --warn: #e0a63c;
      /* ---- the bottom stack -------------------------------------------------
         Everything you press lives in one column at the bottom centre now, so
         its offsets are arithmetic off two numbers rather than a scattering of
         literals that have to be kept in step by hand. Bottom up: the nav, then
         the bar (`--build-h`, measured, 0 when no bar is up), then the panel. */
      --nav-h: 40px;
      --nav-bot: 14px;
      --nav-top: calc(var(--nav-bot) + var(--nav-h) + 8px);
      --build-h: 0px;
      /* The two put-away-able corner widgets are one column, so they are one
         width — a meter and a radio that disagreed by a few pixels would read
         as one of them being misaligned rather than as two panels. It is a var
         because the narrow query shrinks both together and the whole point of
         them being one column is that nothing can shrink half of it. */
      --corner-w: 146px;
    }
    * { box-sizing: border-box; }
    /* The grey flash a mobile browser paints over whatever a finger just landed
       on. It is a webkit default and it is right for a page — it is the only
       feedback a link gets — and wrong for every surface in here: the canvas is
       the whole screen, so a tap anywhere in the shop tints the shop, and every
       control already answers a press with its own state (`.on`, the pressed-in
       ring, the ripple, the wind of an action ring). What it reads as is the
       screen glitching on every press, because it lands on the element the
       touch hit rather than on the thing you pressed. Inherited, so it is one
       declaration rather than one per surface. */
    html { -webkit-tap-highlight-color: transparent; }
    /* `overscroll-behavior-x` on the root is the one place that turns off the
       trackpad's swipe-back, and it has to be said here rather than on `#game`
       — where it already is, and where it does nothing, because a canvas is not
       a scroll container. The canvas was never the exposure anyway: its wheel
       handler is non-passive and calls `preventDefault`, so a two-finger swipe
       over the shop is already swallowed. What is exposed is every HUD list —
       and `wireScroll` deliberately does NOT swallow a notch at either END of a
       horizontal strip, so that the wheel goes on to whatever is behind it. The
       build bar is exactly that: flick the palette sideways, hit the end, and
       the leftover delta reaches the document as a history gesture. Which
       navigates AWAY FROM THE GAME mid-build — a whole page teardown, so what
       you get is the tab going white and then a reload, and nothing anywhere
       connects it to the strip you were scrolling. */
    html, body { margin: 0; height: 100%; overflow: hidden; overscroll-behavior-x: none; }
    body {
      font: 14px/1.45 ui-rounded, "SF Pro Rounded", "Nunito", system-ui, sans-serif;
      color: var(--ink);
      background: #cfe9f5;
      -webkit-font-smoothing: antialiased;
      /* Both spellings, for the reason `#panel-body` gives further down: these
         are not the same feature, and neither is a fallback for the other. The
         unprefixed one alone left every HUD label in the game selectable on
         WebKit — so a press and hold anywhere on the screen highlighted the
         nearest words and put a text caret in a shop. */
      user-select: none; -webkit-user-select: none;
    }
    /*
     * `touch-action: none` is not a nicety — without it the browser claims
     * every touch gesture on the canvas as a scroll or a page zoom, and takes
     * it by firing `pointercancel` a couple of events into the drag. Measured:
     * a two-finger twist arrived as 2 pointerdowns, 2 pointermoves and 2
     * pointercancels, so panning, pinch-zoom and the twist all did nothing at
     * all on a touchscreen while working perfectly under a mouse.
     *
     * `-webkit-touch-callout` is the same problem wearing iOS clothes: the
     * long press that opens a fixture's menu is also the press Safari uses to
     * offer its own callout over the element.
     */
    #game {
      display: block; width: 100vw; height: 100vh;
      touch-action: none;
      overscroll-behavior: none;
      -webkit-touch-callout: none;
      /* Said again here rather than left to `body`, because this is the element
         a drag STARTS on: every gesture in the game is a press held on the
         canvas and then moved, which is also the shape of a text selection, and
         a selection that begins here runs on across whatever HUD it reaches. */
      user-select: none; -webkit-user-select: none;
    }

    /* ---- THE EDGE: what the whole screen is doing -------------------------
     *
     * Three states, one frame. Each is a fact about the world rather than about
     * a thing in it, and each was being said by one small control at the bottom
     * or the corner of a screen you are looking at the MIDDLE of: build mode by
     * a 40px button, the shutters by a door in the readout, the pause by a
     * struck-through clock. A frame round the glass is the one mark that is in
     * view wherever you happen to be looking, which is exactly the property all
     * three of those lack.
     *
     * The colour is the whole vocabulary, so it is one variable and one shape:
     * gold you are building, grey the shop is shut, red the clock is stopped.
     *
     * PRECEDENCE IS THE ORDER OF THESE RULES, and it is deliberate: shut, then
     * paused (the clock's own note says why — a shut shop is still a shop having
     * a night, a paused one is not having anything), then building LAST, because
     * it is the only one of the three that changes what your hands do. Building
     * at night is a thing you do on purpose and the gold is the answer you need
     * while you are doing it.
     *
     * Under `.hud` (z-index 10) on purpose: this is a fact about the world below
     * the HUD, so the bar, the panel and the toast sit over it rather than
     * inside it. Behind the pointer entirely (`pointer-events: none`) — a band
     * that ate the first click near an edge of the screen would be a mode you
     * cannot build in.
     *
     * The glow is the whole of why it is not just a border: at a hairline,
     * against a canvas of grass and floorboards, a line round the edge reads as
     * the window rather than as a state. The band is 3px and the spread carries
     * it another 44px inward, which is what makes it a tint belonging to the
     * game rather than a rule drawn on the glass.
     */
    #edge {
      position: fixed; inset: 0; pointer-events: none; z-index: 9;
      opacity: 0; transition: opacity .22s;
      box-shadow: inset 0 0 0 3px var(--edge), inset 0 0 var(--edge-spread, 44px) var(--edge-glow);
    }
    /* Shut is the quiet one: it is true every single night, so it says "not
       trading" at the weight of dusk rather than of an alarm.
       QUIET IS NOT THE SAME AS FAINT, and DARK is not a colour. It was grey at
       .5, which is the two mistakes at once: too weak to see, and made of the
       one ink that reads as a shadow rather than as a state — a dark band round
       a sunlit canvas is what a vignette looks like, or a window edge, so the
       eye files it as the screen instead of as the shop. Darkening it further
       only made it a better vignette.
       So it is a COLOUR, and the colour is dusk: the other two are the accent
       and gold, and blue is the one that cannot be mistaken for either while
       saying the thing this state actually means. It keeps the stillness — the
       pulse belongs to paused, and two states wearing one animation is what
       this whole block is ordered against — and it gets reach instead, which is
       the half that reads as evening closing in rather than as a border.
       `--edge-spread` is a var so widening it here cannot widen the other two. */
    body.shut #edge {
      opacity: 1; --edge: rgba(72,102,178,.85); --edge-glow: rgba(72,102,178,.5);
      --edge-spread: 92px;
    }
    /* Held is the loud one, and it breathes on the clock's own 1.6s so the two
       marks for one state cannot fall out of step. */
    body.held #edge {
      opacity: 1; --edge: rgba(226,86,74,.9); --edge-glow: rgba(226,86,74,.26);
      animation: clockhold 1.6s ease-in-out infinite;
    }
    body.building #edge {
      opacity: 1; --edge: rgba(255,214,107,.95); --edge-glow: rgba(255,214,107,.26);
      animation: none;
    }

    /* ---- outdoors ---------------------------------------------------------
       THE FRONT DOOR IS A PLACE, not a form on a page.
       It was one flat fill behind a column of cards, which is a web page — and
       the game behind it is a sunlit isometric shop. So: sky at the top, ground
       across the bottom at the same horizon the shop is drawn on, and the tile
       lattice the whole game is built out of laid faintly over it. All of it is
       gradients on one element — nothing to load, nothing to render, and it
       cannot go stale against art it is not made of.

       A CLASS rather than `#menu`, because the loading screen wears it too. The
       two screens are consecutive views of the same place — you watch it fill
       in — and the alternative is a flat blue rectangle that gets replaced by a
       sky, which reads as the page having navigated. The other half of that
       decision is in client/boot.js: #boot HIDES while #menu is up rather than
       sitting under it, or the sun and the lattice composite with themselves. */
    .outdoors {
      position: fixed; inset: 0; overflow: hidden;
      display: grid; place-items: center; padding: 24px 16px;
      background:
        /* The lawn, hard-edged at the horizon the way a floor meets a wall. */
        linear-gradient(#8fbf6a 0 100%) bottom / 100% 34% no-repeat,
        /* Sky, warmer at the bottom where the sun is. */
        linear-gradient(#bfe2f2 0%, #d8eef7 55%, #eaf3e6 100%);
    }
    /* The lattice, and a haze along the horizon so the two do not meet on a
       ruled line. `::before` rather than a fourth background layer because it
       has to be able to fade out at the bottom of the screen, and a background
       cannot mask itself. */
    .outdoors::before {
      content: ''; position: fixed; inset: 0; pointer-events: none;
      background:
        repeating-linear-gradient(60deg, rgba(255,255,255,.14) 0 1px, transparent 1px 46px),
        repeating-linear-gradient(-60deg, rgba(255,255,255,.14) 0 1px, transparent 1px 46px);
      -webkit-mask-image: linear-gradient(transparent 46%, #000 70%);
      mask-image: linear-gradient(transparent 46%, #000 70%);
    }
    /* Sun, top-left, well out of the way of anything you read. */
    .outdoors::after {
      content: ''; position: fixed; left: -80px; top: -110px;
      width: 340px; height: 340px; border-radius: 50%; pointer-events: none;
      background: radial-gradient(circle, rgba(255,246,214,.85) 0%, rgba(255,246,214,0) 68%);
    }
    .outdoors[hidden] { display: none; }

    /* ---- the loading screen ----------------------------------------------
       See client/boot.js. A bot, a line, and a bar that does not pretend to
       know how far through it is. */
    /* Centred in the SKY rather than in the viewport. `.outdoors` puts the lawn
       across the bottom 34%, and a box this short centres straight onto the
       horizon — the bar came out sitting exactly on the line where the grass
       starts, which reads as a seam through the middle of the screen rather
       than as a place. The front door does not have this problem because its
       box is tall enough to span the join. Padding rather than a transform, so
       a short viewport squeezes it instead of pushing it off the top, and
       capped so a tall one does not strand it up in the corner. */
    #boot { z-index: 50; padding-bottom: min(32vh, 220px); }
    .boot-box {
      position: relative; z-index: 1;
      display: flex; flex-direction: column; align-items: center;
      width: min(300px, 100%);
    }
    /* The bot's well. Reserved at full height from the first frame even though
       it is empty — the crew is a fetch, and a stage that grew when it landed
       would jump the line and the bar down the screen at the one moment
       somebody is reading them. */
    .boot-stage { height: 168px; display: grid; place-items: center; }
    /* `.menu-bot` is the clip and the shadow; this is only the size, which is
       bigger here because on this screen the bot is the whole picture rather
       than a hat on a title. Under `#boot` rather than on the class alone
       BECAUSE it is an override of a rule further down the sheet — the front
       door's `.menu-bot` sets the same three properties, and at equal
       specificity the later one wins whatever this says. */
    #boot .boot-bot { width: 168px; height: 168px; margin: 0; animation: boot-in .45s ease-out both; }
    @keyframes boot-in { from { opacity: 0; transform: translateY(6px); } }

    /* Same trick the title and the tagline use: it sits on the sky, so it is
       cut out of it with a cream keyline rather than laid on top of it. */
    .boot-say {
      margin-top: 4px; font-size: 15px; font-weight: 800; text-align: center;
      color: rgba(58,49,40,.72); letter-spacing: -.01em;
      -webkit-text-stroke: 4px rgba(255,252,245,.8); paint-order: stroke fill;
    }
    /* INDETERMINATE, and the comment in boot.js says why: nothing on this path
       reports progress, so a bar that filled would be a number invented to look
       reassuring. A shuttle across a track instead — it says "still going"
       without claiming to say how far. */
    .boot-bar {
      margin-top: 14px; width: 150px; height: 6px; border-radius: 99px;
      overflow: hidden; background: rgba(58,49,40,.14);
      box-shadow: inset 0 1px 2px rgba(58,49,40,.12), 0 1px 0 rgba(255,255,255,.5);
    }
    .boot-bar i {
      display: block; width: 42%; height: 100%; border-radius: 99px;
      background: linear-gradient(90deg, rgba(255,255,255,0), var(--accent), rgba(255,255,255,0));
      animation: boot-run 1.5s cubic-bezier(.6,0,.4,1) infinite;
    }
    /* The end stop is arithmetic, not taste: `translateX` is a percentage of
       the SHUTTLE, and the shuttle is 42% of the track — so it has left the
       right-hand end at 238%, and every percent past that is a bar with nothing
       on it. At 360% that was a third of every cycle spent empty, which reads
       as the thing having finished and then starting again. */
    @keyframes boot-run {
      from { transform: translateX(-110%); }
      to { transform: translateX(240%); }
    }
    /* Failed: the sentence is the whole message now, so the thing that was
       saying "still going" has to stop saying it. */
    #boot.failed .boot-bar { display: none; }
    /* A sentence rather than two words, so it gets the room to be one. */
    #boot.failed .boot-box { width: min(420px, 100%); }
    /* The STEPPED-DOWN red, not `--accent`, for the reason the Shop report's
       warning tiles use it: `--accent` is a *mark* colour measured against a
       panel, and at 15px on a cream keyline it comes out under the 4.5:1 a
       sentence somebody has to read owes them. The bar above may keep it —
       it is a shape rather than a word, and `aria-hidden` either way. */
    #boot.failed .boot-say { color: #a8442f; }
    /* The bar is the only motion on this screen and it is decorative. */
    @media (prefers-reduced-motion: reduce) {
      .boot-bar i { animation: none; width: 100%; opacity: .5; }
      #boot .boot-bot { animation: none; }
    }

    /* ---- the front door ---------------------------------------------------
       Pick a shop, or start one. Sits above #boot rather than inside the HUD:
       there is no world behind it yet, so none of the panel system's rules
       about floating over a live canvas apply. See client/menu.js. */
    /* The PAGE does not scroll; the list of shops does. A browser scrollbar
       down the side of a title screen is the single most web-page thing on it,
       and the game already answers this everywhere else — `wireScroll`, a drag
       with a fade at whichever end has more past it. So the box is a column
       that fits the viewport and `.menu-list` is the one part of it that gives.
       `min-height: 0` is what makes that work: a grid/flex child will not
       shrink below its content without it, so the list would grow the box and
       put the bar back on the body. */
    #menu { z-index: 60; }
    /* Over both. The box is the only thing on this screen you interact with. */
    .menu-box {
      position: relative; z-index: 1;
      display: flex; flex-direction: column;
      max-height: calc(100vh - 48px); max-height: calc(100dvh - 48px);
    }
    /* `min-width: 0` is not belt and braces, it is the whole of whether this
       screen fits on a phone. `.outdoors` is a grid and the box is its item, so
       the box's automatic minimum is its MIN-CONTENT — which means `width:
       min(440px, 100%)` is a ceiling and not a limit, and any row inside that
       cannot get narrower than the screen pushes the entire front door off the
       right of it: the title, the name box, the buttons, all of it, with the sky
       ending where the viewport does and the box carrying on past it. It was the
       cash field beside the name that did it (an `<input>` carries an intrinsic
       twenty-character width, so two of them side by side ask for 395px on a
       390px phone), and the point of putting this here rather than there is that
       the next row somebody adds must not be able to do the same thing. */
    .menu-box { width: min(440px, 100%); min-width: 0; }
    /* The well the turntable spins in. Fixed height and `overflow: hidden`,
       because `.wk-turn` is a strip `--n` faces wide that slides sideways —
       without a clipping parent you get twenty-four robots in a row. */
    .menu-bot {
      height: 132px; overflow: hidden; margin: 0 auto -10px;
      width: 132px; pointer-events: none;
      /* It stands ON something. A bot floating over a title reads as a sticker;
         the same soft ellipse the shop draws under everything else makes it a
         thing in the world the menu is sitting in. */
      filter: drop-shadow(0 10px 10px rgba(40, 60, 30, .28));
    }
    .menu-bot .wk-turn > span { padding: 0; }
    /* Bottom-right of the SCREEN, not of the box. It is the only control here
       that is not about choosing a shop, and the box scrolls when the list of
       shops gets long — a button pinned inside it would scroll away from the
       one press somebody wants to make immediately. `fixed`, so it stays put;
       it goes away with the whole `#menu` element. */
    .menu-mute {
      position: fixed; bottom: 16px; right: 16px; width: 38px; height: 38px;
      display: grid; place-items: center; font-size: 16px; line-height: 1;
      border: 1px solid var(--line); border-radius: 12px; cursor: pointer;
      background: var(--panel-solid); opacity: .85; z-index: 1;
      box-shadow: 0 3px 0 rgba(58,49,40,.14);
    }
    html.can-hover .menu-mute:hover { opacity: 1; }
    .menu-mute:active { transform: translateY(3px); box-shadow: none; }
    /* A LOGO rather than a heading. Bigger, tighter, and cut out of the sky
       with a cream keyline and a shadow under it — which is the one thing that
       stops a big dark word on a pale background reading as an article title.
       `paint-order` puts the stroke behind the fill so the letterforms keep
       their weight instead of being eaten from both sides. */
    .menu-box h1 {
      margin: 0; font-size: 44px; font-weight: 800; letter-spacing: -.035em;
      text-align: center; line-height: 1;
      -webkit-text-stroke: 6px #fffcf5; paint-order: stroke fill;
      filter: drop-shadow(0 3px 0 rgba(58,49,40,.16)) drop-shadow(0 8px 14px rgba(58,49,40,.2));
    }
    .menu-box h1 span { color: var(--accent); }
    .menu-tag {
      margin: 6px 0 20px; text-align: center; font-size: 12.5px; font-weight: 700;
      color: rgba(58,49,40,.62);
      /* Same trick, quieter: it sits on the sky too. */
      -webkit-text-stroke: 4px rgba(255,252,245,.75); paint-order: stroke fill;
    }

    .menu-field {
      display: flex; align-items: center; gap: 10px; background: var(--panel);
      border-radius: 12px; padding: 7px 12px; margin-bottom: 10px;
      box-shadow: 0 3px 12px rgba(58,49,40,.1);
    }
    .menu-field span { font-size: 11px; font-weight: 800; opacity: .5; text-transform: uppercase; letter-spacing: .04em; }
    .menu-field input {
      flex: 1; min-width: 0; border: 0; background: none; outline: 0; font: inherit;
      font-size: 14px; font-weight: 700; color: var(--ink);
    }

    /* What you type, side by side: the shop's name and what is in the till.
       Two thirds and one third, because the name is words that wrap and the
       money is four digits that never do — an even split would give the number
       a box it cannot fill and take the room off the field that needs it. */
    .menu-duo { display: flex; gap: 8px; }
    .menu-duo > .menu-field { flex: 2; min-width: 0; }
    .menu-duo > .menu-field.mf-cash { flex: 1; gap: 8px; }
    .menu-duo .menu-field span { flex: none; }

    /* The spinners go: they are unhittable at this size, and the one number
       left in the form is already clamped at both ends by the server. */
    .menu-field input::-webkit-outer-spin-button,
    .menu-field input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
    .menu-field input[type=number] { -moz-appearance: textfield; appearance: textfield; }

    /* How much shop you start with. Side by side because the whole point is
       that they are compared — stacked, three sizes read as three things to
       consider rather than one row to pick from. Only the name and the money
       are on the buttons: what a size comes with is one line underneath, for
       whichever is lit, because printing four counts three times over is a
       paragraph of arithmetic where a choice should be. See shared/start.js. */
    .tiers { display: flex; gap: 6px; margin-bottom: 8px; }
    .tier {
      flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px;
      border: 0; font: inherit; cursor: pointer; color: var(--ink); text-align: left;
      border-radius: 11px; padding: 8px 9px; background: rgba(58,49,40,.06);
      box-shadow: inset 0 0 0 2px transparent;
    }
    .tier b { font-size: 12px; font-weight: 800; line-height: 1.2; }
    .tier span { font-size: 11.5px; font-weight: 700; opacity: .55; }
    html.can-hover .tier:hover { background: rgba(58,49,40,.12); }
    .tier.on { background: var(--panel); box-shadow: inset 0 0 0 2px var(--good); }
    .tier.on span { opacity: .8; }
    /* A difficulty is one word with nothing under it, so it is centred — a lone
       label ranged left in a wide button reads as the first line of something
       that hasn't loaded. The sizes keep their left edge: two lines stacked, and
       a name over a price wants a common margin to line up on. */
    .tier[data-diff] { text-align: center; align-items: center; }

    /* WHAT THE SIZE IS, as the things themselves.
       Two paragraphs used to sit here — the four counts spelled out, and then a
       sentence saying the same in shop words — directly above a third about the
       difficulty, and a form that opens with three paragraphs of prose is a page
       of notes rather than a thing you press. The art says the counts (and says
       them better: a freezer is a picture everybody already knows), so the words
       left over are the one thing no picture can show, which is what the town is
       like. Every tile is drawn from the catalog row the shop draws its own
       fixtures from — see `kitTiles` in client/menu.js. */
    .kit { margin: 0 2px 10px; }
    .kithead {
      display: block; font-size: 11px; font-weight: 800; opacity: .5;
      text-transform: uppercase; letter-spacing: .04em; margin-bottom: 5px;
    }
    .kitrow { display: flex; gap: 6px; }
    .kitem {
      flex: 1; min-width: 0; display: flex; flex-direction: column;
      gap: 3px; align-items: center;
    }
    /* The same well the build palette stands its art in, and deliberately the
       same one: these are pictures of things you will be buying more of an hour
       from now, off a bar that frames them exactly like this. */
    .kart {
      width: 100%; height: 42px; border-radius: 9px; padding: 3px;
      display: grid; place-items: center;
      background: radial-gradient(120% 100% at 50% 18%, rgba(255,255,255,.9), rgba(58,49,40,.055));
      box-shadow: inset 0 0 0 1px rgba(58,49,40,.06);
    }
    .kart svg { width: 100%; height: 100%; display: block; }
    /* One line, and it may not wrap: four tiles across 440px is about 100px
       each, and "×1 freezer" breaking in two is the row growing a line as you
       switch sizes. */
    .knum {
      max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      font-size: 10.5px; letter-spacing: .01em;
    }
    .knum b { font-weight: 800; font-variant-numeric: tabular-nums; }
    .knum span { font-weight: 700; opacity: .5; }

    /* Nothing under either row of buttons any more. The blurbs are on the
       buttons as their `title` — what a size or a setting FEELS like is worth
       having and is not worth three lines of the form it is chosen in, which is
       how a new-shop screen ended up reading as a page of notes. It also means
       neither row can resize the form under a cursor as you switch between
       them, which is the thing the delete latch on the cards below already
       exists to avoid. */

    .menu-list {
      display: flex; flex-direction: column; gap: 10px; margin: 14px 0 10px;
      overflow-y: auto; min-height: 0; flex: 1;
      /* The cards lift and cast, so the box needs room either side or the
         shadow is clipped into a hard vertical line down both edges. */
      padding: 4px 4px 8px; margin-left: -4px; margin-right: -4px;
      scrollbar-width: none;
    }
    .menu-list::-webkit-scrollbar { display: none; }
    /* Same 20px fade the panel uses, and the same class names, because it is
       the same `wireScroll` putting them on. */
    .menu-list.more-back {
      mask-image: linear-gradient(180deg, transparent 0, #000 20px);
      -webkit-mask-image: linear-gradient(180deg, transparent 0, #000 20px);
    }
    .menu-list.more-on {
      mask-image: linear-gradient(0deg, transparent 0, #000 20px);
      -webkit-mask-image: linear-gradient(0deg, transparent 0, #000 20px);
    }
    .menu-list.more-back.more-on {
      mask-image: linear-gradient(180deg, transparent 0, #000 20px, #000 calc(100% - 20px), transparent);
      -webkit-mask-image: linear-gradient(180deg, transparent 0, #000 20px, #000 calc(100% - 20px), transparent);
    }
    .menu-empty {
      font-size: 12px; opacity: .55; text-align: center; padding: 14px 4px; line-height: 1.45;
    }
    .menu-err {
      background: var(--accent); color: #fff; border-radius: 10px;
      padding: 7px 12px; font-size: 12.5px; font-weight: 700; margin-bottom: 6px;
    }
    /* "The shop in your link is gone" is news, not a failure — you are already
       looking at the list that answers it. */
    .menu-err.soft { background: #ffd66b; color: var(--ink); }

    /* A card is a THING sitting on the grass, so it has a thickness: the second
       shadow is a hard offset with no blur, which is what reads as an object
       with a side to it rather than a rectangle with a glow under it. Hover
       lifts it and shortens the base, the way picking something up does. */
    .wcard {
      background: var(--panel-solid); border-radius: 16px; padding: 12px 14px 11px;
      box-shadow: 0 4px 0 rgba(58,49,40,.11), 0 8px 20px rgba(58,49,40,.16);
      transition: transform .12s ease, box-shadow .12s ease;
    }
    html.can-hover .wcard:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 0 rgba(58,49,40,.11), 0 12px 26px rgba(58,49,40,.2);
    }
    /* The shop you were in last, so a family of four save slots opens on yours. */
    .wcard.last {
      box-shadow: 0 4px 0 rgba(58,49,40,.11), 0 8px 20px rgba(58,49,40,.16),
        inset 0 0 0 2px #ffd66b;
    }
    .wtop { display: flex; align-items: baseline; gap: 8px; }
    .wname { font-size: 16px; font-weight: 800; flex: 1; min-width: 0;
             overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .wlive {
      flex: none; background: #d8f0d2; color: #3f7a3c; border-radius: 99px;
      padding: 1px 8px; font-size: 10px; font-weight: 800;
    }
    .wstats { display: flex; gap: 9px; align-items: baseline; margin-top: 2px; font-size: 13px; }
    .wstats b { font-weight: 800; }
    .wstats span { opacity: .6; font-weight: 600; text-transform: capitalize; }
    .wsub { font-size: 10.5px; opacity: .5; margin-top: 1px; font-weight: 600; }

    /* Armed to delete. The card itself changes, not just the button, because a
       list of five cards is scanned by shape — a single word swapped inside one
       of its buttons is exactly the thing a mis-click already wasn't reading. */
    .wcard.arm {
      box-shadow: 0 4px 0 rgba(58,49,40,.11), 0 8px 20px rgba(58,49,40,.16),
        inset 0 0 0 2px var(--accent);
    }

    /* Two things that take it in turns, stacked in one grid cell so the cell is
       always as big as the biggest of them and swapping which one shows moves
       nothing. Arming a delete used to insert the warning and relabel the
       button, which grew the card, pushed every card under it down and widened
       the row — under a cursor that is one button from Play, on a screen where
       the latch also expires by itself and puts it all back four seconds later.
       Both halves of a swap are in the DOM at rest; the resting one is child 1.
       `visibility` rather than `opacity`, so a screen reader reads one label. */
    .wswap { display: grid; }
    .wswap > * { grid-area: 1 / 1; }
    .wswap > :nth-child(2) { visibility: hidden; }
    .wswap.on > :nth-child(1) { visibility: hidden; }
    .wswap.on > :nth-child(2) { visibility: visible; }

    /* Shares the `.wsub` line's cell — the one line on the card that isn't the
       shop's name or what it is worth, and so the one you can spend on saying
       what a second click does. Keep it to a line at this width or every card
       carries the taller of the two as blank space for a state that is off. */
    .wwarn {
      margin-top: 1px; font-size: 11px; line-height: 1.4; font-weight: 700;
      color: var(--accent);
    }

    /* Buttons you PRESS. The hard bottom shadow is the button's edge, and the
       press moves the face down onto it — two lines of CSS for the one bit of
       feedback that separates a game control from a link with a background on
       it. No transition on the press: a squash that eases is a lag. */
    .wacts { display: flex; gap: 7px; margin-top: 10px; }
    .wacts button {
      border: 0; font: inherit; cursor: pointer; border-radius: 10px;
      padding: 8px 14px; font-size: 13px; font-weight: 800;
      box-shadow: 0 3px 0 rgba(58,49,40,.18);
      transition: filter .12s ease;
    }
    .wacts button:active {
      transform: translateY(3px); box-shadow: none;
    }
    html.can-hover .wacts button:hover { filter: brightness(1.06); }
    .wplay {
      background: var(--good); color: #fff; flex: 1;
      box-shadow: 0 3px 0 #43793f;
    }
    .wghost { background: rgba(58,49,40,.08); color: var(--ink); }
    html.can-hover .wghost:hover { background: rgba(58,49,40,.16); }
    html.can-hover .wdel:hover { background: var(--accent); color: #fff; }
    .wdel.on { background: var(--accent); color: #fff; }

    .menu-add {
      width: 100%; border: 0; font: inherit; cursor: pointer; border-radius: 13px;
      padding: 11px; font-size: 13.5px; font-weight: 800; color: var(--ink);
      box-shadow: 0 3px 0 rgba(58,49,40,.14);
      background: rgba(255,252,245,.6); box-shadow: inset 0 0 0 2px rgba(58,49,40,.12);
    }
    html.can-hover .menu-add:hover { background: var(--panel-solid); }
    .menu-add:active { transform: translateY(3px); box-shadow: none; }
    /* New shop and Join share a row — two thirds to the thing almost everybody
       presses, one third to the thing you press when a friend has sent you a
       code. `flex` rather than a grid so that the row is still one full-width
       button in the server build, where there is nothing to join. */
    .menu-adds { display: flex; gap: 8px; }
    .menu-adds .menu-add { flex: 2; }
    .menu-adds .menu-add.menu-side { flex: 1; }
    /* Join, under an open form. Quieter than the row it comes from — the form
       above it is what you are being asked, and this is the other door. */
    .menu-adds.menu-alt { margin-top: 8px; }
    .menu-adds.menu-alt .menu-add { font-size: 12.5px; padding: 9px; opacity: .8; }
    html.can-hover .menu-adds.menu-alt .menu-add:hover { opacity: 1; }
    .menu-new { background: var(--panel); border-radius: 15px; padding: 11px 13px;
                box-shadow: 0 4px 16px rgba(58,49,40,.13); }
    .menu-new .menu-field { background: rgba(58,49,40,.06); box-shadow: none; }
    .menu-foot { text-align: center; font-size: 11px; opacity: .5; margin: 12px 0 0; }
    /* The tip jar, and it is a TILE like everything else on this screen. As a
       bare underlined link in `--accent` it was the only hyperlink on a page
       made of buttons, wearing the colour this palette keeps for marks — so it
       read as an error line rather than as an offer.

       BOTTOM-LEFT OF THE SCREEN, which is the mute button's argument said about
       the other corner: this is not a way of choosing a shop. Inside the column
       it was a sentence and a button between the last save and the bottom of
       the box — a whole section of a menu, at the size of the thing somebody
       actually came here for, pushing the list of shops up to make room for an
       ask nobody arrived to answer. Out of flow it costs the list nothing,
       which is the whole of what moving it buys. `fixed` rather than absolute
       for the reason the mute button is: the box scrolls, and a tip jar that
       scrolls away is one nobody finds.

       `.menu-add`'s language at two thirds the weight — same cream, same inset
       keyline, same press — because this must never compete with the button
       somebody actually came here for. `inline-flex` keeps the hit area on the
       words: a BLOCK link is clickable across the dead space either side of it,
       which in a corner of the sky is a stray tap that leaves the game with a
       shop unsaved behind it. */
    .menu-support {
      position: fixed; left: 16px; bottom: 16px; z-index: 1;
      display: inline-flex; align-items: center; gap: 7px;
      border-radius: 11px; padding: 8px 14px;
      font-size: 12.5px; font-weight: 800; color: var(--ink);
      text-decoration: none; cursor: pointer;
      background: rgba(255,252,245,.6);
      box-shadow: inset 0 0 0 2px rgba(58,49,40,.12);
    }
    .menu-support svg { opacity: .7; }
    html.can-hover .menu-support:hover { background: var(--panel-solid); }
    html.can-hover .menu-support:hover svg { opacity: 1; }
    .menu-support:active { transform: translateY(3px); }
    .menu-support:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

    .hud { position: fixed; z-index: 10; }

    /* Icons are inline SVG sized in em, so every font-size rule that used to
       size an emoji still sizes the icon. `display:block` because an inline
       SVG sits on the text baseline and drags a gap under every button. */
    .ico > svg, .bico > svg, #panel-close > svg { display: block; margin: 0 auto; }
    /* The title's icon is a PREFIX, not a glyph in a box, so it is the one that
       must not take `margin: 0 auto`. On a flex item an auto margin eats all the
       free space either side of it — and `#panel-title` is `flex: 1`, so that is
       most of the header: the icon settled in the middle and the name was shoved
       hard against the close button, which reads as a right-aligned title. It
       was wrong at every width and only looked survivable in a narrow panel in
       the corner of a big screen. */
    #panel-title > svg { display: block; margin: 0; }

    /* ---- top left: the passive readouts, stacked --------------------------
       One fixed column rather than two independently-pinned panels. The demand
       meter used to carry `top: 58px`, which is the height #stats happened to be
       on the day it was written — adding a row to the gauges slid the money
       panel down over it. Nothing up here has a fixed height, so nothing up here
       gets to hardcode where the next thing starts, and the cashflow readout
       going into #stats is exactly the change that would have broken it. */
    #topleft {
      top: 12px; left: 12px;
      display: flex; flex-direction: column; align-items: flex-start; gap: 8px;
    }
    /* top-left: money + day
       Sized down about a fifth from where it started, and the reason is what it
       is competing with rather than anything wrong with it: this is a readout
       you glance at, pinned over the one thing in the game you are actually
       looking at. Everything in here scales together — type, bars, sparkline,
       padding — because a panel where only some of it shrank reads as a panel
       with a mistake in it. */
    /* One line, and the spacing is a rule rather than a per-cell guess: groups
       are separated by a divider, and inside the date/money block a grid owns
       every gap there is (`.rows` below).
       The old row was five cells of five heights held apart by whatever margin
       each happened to carry, which is what put a hole between the balance and
       the clock. */
    #stats {
      background: var(--panel); border-radius: 11px;
      padding: 5px 10px; box-shadow: 0 3px 11px rgba(58,49,40,.14);
      display: flex; gap: 10px; align-items: center;
      /* THE CARD CLIPS ITS OWN CORNERS, which is what lets the sign be an EDGE
         of it rather than an object sitting inside it. `#sign` cancels the
         padding on three sides with negative margins and runs full bleed down
         the left; without this the strip would square off the two left corners
         and the panel would stop reading as a card. Clipping is the only way to
         round a child against a parent's radius — a matching radius on the
         child is the same number written twice, and they drift.
         Nothing in here overflows on purpose: every child is a flow-layout cell,
         and the one thing that used to poke out (the sign's cord, and the
         overhang that replaced it) went years ago — see `#doorway`. The one
         thing this DOES clip is an outline, which is why the focus ring below
         is drawn inset. */
      overflow: hidden;
      /* THE READOUTS OWN THE HEIGHT, AND THE FLOOR IS ONLY THERE FOR THE WORD.
         This was 58px, and 58 was never a decision about this card: `#doorway`
         was a fixed 48px plaque, so the sign was the tallest thing in the row
         and the card measured whatever a piece of lettering plus the padding
         came to. The strip that replaced it is sized BY the card, so the number
         was kept as a floor to stop the HUD quietly shrinking as a side effect
         of restyling a button — which was the right call at the time and leaves
         a card carrying about ten pixels of slack above and below two rows of
         type, on the one panel that is pinned over the thing you are looking at.
         The rows come to roughly 37px and the padding to 10, so the card now
         sits a shade under 48 and every pixel of that is a number.
         What the floor is for is the OTHER thing 58 was holding up, and it is
         the invariant `#doorway` names: four upright letters run about 40px at
         8px type, and a card shorter than they are crops the sign — which reads
         as the word being wrong rather than as the card being small. 46 is that
         claim written down. It does nothing today, deliberately: it is the thing
         that fails loudly if the type in this panel ever comes down, instead of
         a remembered height that also happened to keep the sign whole.
         The 640px bar below drops it to 0, because a full-width bar across the
         top of a phone genuinely should take its height from its contents — and
         it can afford to, because every figure in it is scaled up about a tenth,
         which puts its rows well clear of the word on their own. */
      min-height: 46px;
    }
    /* NOTHING IN HERE SHRINKS. The card is a fixed readout in a corner, not a
       column of a page, and flex's default is to shrink an item that does not
       fit — so the widest cell (the rate: a number, an arrow and a 56px
       sparkline) was squeezed until its own contents wrapped, which put the
       arrow on one line and the balance on the next with the bars hanging off
       the end. There is no width to compete for here: the panel is as wide as
       what is in it. */
    #stats > * { flex: 0 0 auto; }

    /* ---- top centre: what to do about it ---------------------------------
       A single line, sized to clear the stats panel on the left and the rail on
       the right. A stack cost vertical space in the middle of the screen, which
       is the one place the game is actually happening. */
    /* IT IS ANCHORED PAST THE READOUTS, NOT CENTRED AND TRIMMED.

       This was `left: 50%` with `max-width: min(860px, calc(100vw - 360px))`,
       and the 360 was clearance for the stats card — the width #stats HAPPENED
       to be on the day it was written, halved onto each side. That is precisely
       the trap the note above #topleft describes, said about the other axis:
       nothing up here has a fixed size, so nothing up here gets to hardcode
       where the next thing starts. #stats has grown a sparkline, a town readout
       and three gauges since, so on a wide screen there is slack and nothing
       shows, and on a narrower one the chips sit straight on top of the gauges.
       The bug arrives on somebody else's monitor rather than on yours, which is
       why it lasted.

       Being a SUBTRACTION made it worse in the other direction, and the 240px
       floor that used to be in this rule is the scar: `100vw - 360px` goes to
       nothing on a narrow window and negative on a zoomed one, so the row was
       capped at a chip squeezed to one letter — a red sliver with no words on
       it, which reads as a stray button rather than as the shop saying it is
       shut, and that chip is the first thing a new world ever says. The floor
       bought a readable chip by accepting the overlap.

       Anchoring removes the trade rather than picking a side of it. There is no
       subtraction left to go negative: the row starts after the left-hand column
       and ends at the right edge, so it is always at least the whole of the free
       space, and it wraps rather than shrinks when three chips will not fit.

       `--hq-left` is the measured right edge of #topleft — see `UI.watchTopLeft`.
       #topleft and not #stats, because the column also holds the demand meter
       and the radio, and a wrapped second row of chips reaches down past them.

       IT STAYS ON THE SCREEN'S CENTRE, and gives that up last. Anchoring the
       box at `--hq-left` and centring inside it was tried first and is wrong for
       a reason no arithmetic shows: this row reads as the middle of the HUD, so
       centring it in the free space parks it visibly off-centre on a wide
       monitor — which is a thing everybody sees, to fix a thing only a narrow
       one has.

       So the padding is SYMMETRIC. Equal padding on a full-width box leaves the
       content centred on the viewport exactly as `left: 50%` did, while making
       it impossible for that content to begin before `--hq-left`. Centring and
       clearance stop being a choice, because one is now a consequence of the
       other — which is the whole trick here and the reason nothing has to be
       measured twice.

       The right-hand side is what gives when there is genuinely not enough
       room. Symmetric padding spends the clearance TWICE, so on a small window
       the inner strip closes to nothing — the sliver bug again, wearing the
       fix's clothes. The `clamp` spends it twice while that is affordable and
       walks the right-hand side back toward 12px when it is not: full symmetry
       and true centre wherever it fits, drifting right only as far as it must,
       and never once starting before the card. 320px is the width it protects,
       which is about one chip. Under that the chips simply wrap, and a chip
       wider than the strip overflows to the RIGHT, where there is nothing to
       overlap — the asymmetry of the two edges is the point: left is the bug,
       right is only untidy. */
    #hq {
      top: 12px; left: 0; right: 0;
      padding-left: var(--hq-left, 12px);
      padding-right: clamp(12px, calc(100vw - var(--hq-left, 12px) - 320px), var(--hq-left, 12px));
      display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
      justify-content: center; pointer-events: none;
    }
    /* ---- nothing in this row may move sideways ---------------------------
       Every cell here holds a number that changes while you watch it, and they
       sit in one flex row — so a digit that is a pixel wider than the last one
       slides the clock, the buttons and the gauges along with it. It reads as
       the HUD being unable to keep still.
       Two rules, and both are needed. Tabular numerals stop a `4` being
       narrower than a `0`, which is the per-tick jitter; a floor on the width
       stops the *number of digits* changing anything, which is the jolt you
       get crossing $10,000 or Day 100. Sized to what a shop plausibly reaches
       rather than to today's value, since a floor that today's value already
       exceeds is a floor that does nothing. */
    /* ---- A GROUP IS A LINE ------------------------------------------------
       WHAT IS BESIDE WHAT IS THE WHOLE DESIGN, and the card is small — so the
       groups are the two ROWS, and each row is read straight across:

         Day 122   00:26    Summer
         $32,906   $0.00 ▼  ▁▃█▅

       Both wrong shapes this went through are worth keeping written down,
       because they are the two obvious ones. Five cells in a row, each a
       two-line stack, is what a "column per number" gets you: whatever sits
       under a thing reads as belonging to it, so the date captioned the balance
       and the clock captioned a week of trading. Putting every group on one
       long line fixes that and makes the panel as wide as the screen, which for
       a corner readout is worse than what it fixed.

       Two rows, one subject each, is both: nothing stacks *across* subjects,
       and the card stays about 250px. What is above what still matters — but
       now the thing above the money is the date AND the hour, which is a row
       about when, not a caption on a number.

       A divider rather than a wider gap between the rows and what is beside
       them, because a gap is ambiguous by nature: "which side of this space
       does that belong to" is a question the eye answers by proximity, which is
       what put the clock with the money in the first place. */
    /* ONE GRID, SO THE TWO ROWS SHARE THEIR COLUMNS.
       They were two flex rows spread with `space-between`, which fills the width
       and lines nothing up: each row divides its own slack among its own items,
       so where the clock falls depends on how long "Day 122" is and where the
       sparkline falls depends on how many digits are in the balance. Two rows
       of three things each, none of them over the other — which is the "hard to
       read" and it is not a spacing problem, it is the absence of a column.
       Three columns, both rows in them: day over balance, hour over the day's
       take, season over the week. Widths are `auto`, so a column is as wide as
       the wider of its two cells and neither row can push the other about.
       `#flow` is `display: contents` (below) so its number and its sparkline are
       two cells here rather than one, or the money row would have two cells to
       the date row's three and the third column would mean nothing. */
    .rows {
      display: grid; grid-template-columns: auto auto auto;
      column-gap: 12px; row-gap: 1px; align-items: center;
    }
    /* The last column ends the card, so it is set against the right edge rather
       than left-aligned inside whatever slack the wider of the two cells left —
       that slack is the hole that was between the season and the sparkline. */
    #season, .spark { justify-self: end; }
    /* Dividers only where a SUBJECT changes. Named rather than "every child
       after the first", because the door is not a group — it is the sign for
       the whole card, standing down the left of both rows the way it used to
       stand down the edge of the panel. */
    #town, .gauges { border-left: 1px solid var(--line); padding-left: 12px; }
    /* ...and the sign stands down the left of BOTH rows, which is what it is:
       one fact about the whole shop rather than a field in either line. It was
       a 5px stripe in exactly this position — quiet, which was the point, and a
       colour with no glyph on it can only ever say "some state changed", never
       which one. The door says which one, and being the full height of the card
       it is a target you can hit rather than 13px of its edge.

       IT IS THE LEFT EDGE OF THE CARD NOW, not a plaque standing near it.
       Three things that buys, and the last is the one that matters. The plaque
       was a coloured rectangle inside a coloured rectangle, inset by the card's
       own padding on every side — two nested boxes with 5px of cream between
       them, which reads as a badge that has been dropped on the readout rather
       than as part of it. It was also about 15px of a 34px column, so the strip
       of card either side of it was space that belonged to nothing: the button
       looked small and the gap looked like a mistake. And the target: a control
       that runs the full height and the full width of the column is one nobody
       has to aim at, where the plaque was a small object in a big space and the
       cream around it was dead to the pointer.
       The negative margins are the card's own padding, cancelled on the three
       sides it meets — so a change to `#stats`'s padding has to be made here
       too, in both places (the 640px bar sets its own). Clipped to the card's
       radius by `overflow: hidden` up there rather than rounded to match it. */
    #sign {
      align-self: stretch; display: flex;
      align-items: center; justify-content: center;
      border: 0; font: inherit; cursor: pointer;
      /* Top, right, bottom, left: eat 5px of padding above and below, meet the
         left edge, and leave the flex `gap` to hold the readouts off. */
      margin: -5px 0 -5px -10px; padding: 0; border-radius: 0;
      /* A number, and one of the few in this card that is a decision rather
         than a measurement: wide enough that the upright word has air either
         side of it, narrow enough that it stays a margin of the readout rather
         than a column of it. */
      flex: 0 0 34px; width: 34px;
      color: #fff; background: var(--good);
      transition: background .15s, filter .12s;
    }
    /* Presses in rather than down, the same as the clock beside it — but on the
       colour rather than under it: the strip IS the fill now, so a translucent
       wash over it (what this was) would be a second colour mixed into the one
       thing on the card whose colour is the state. Brightness keeps the state
       the state and says "pressed" on top of it. */
    html.can-hover #sign:hover { filter: brightness(1.08); }
    #sign:active { filter: brightness(.92); }
    /* The floors stay where the jitter is — the date (which grows a digit at Day
       100) and the balance — and they are per GROUP now, since a group is the
       cell. See the note above about nothing in this row moving sideways. */
    /* Wider than it was, and for the same reason it was 50: the floor is
       measured off the widest the group ever gets, and the group grew a weekday
       in front of the count. Left at 50 it would stop being a floor at all —
       every date is wider than that now — and the digit Day 100 adds would go
       back to shoving the hour along. */
    #when { min-width: 68px; }
    #cash { min-width: 62px; }
    /* Lit while trading, and a shut door dropped to the weight of a caption —
       being shut is already said twice over (the clock is struck through and #hq
       puts up a hot chip naming the key), so this is the glance rather than the
       announcement. */
    /* It is the sign in a shop door, and it says so in words.
       A door glyph was the wrong instrument for the same reason the clock's
       missing play triangle was: it can only say "a state changed", and reading
       WHICH state out of it needs you to have seen the other one. An open/closed
       sign is the one object in a shop whose entire job is being read from the
       pavement by somebody who has never been in — so it carries the word, and
       there is nothing left to learn.
       The strip's width is a fixed 34px and the word does not set it, which is
       the card's own rule — nothing in it moves sideways — said about the one
       cell whose contents change on a press. A sign sized by its word would
       slide the day, the balance and the clock along every time you worked the
       shutters, which is why OPEN and SHUT are both four letters as well. */
    /* It hangs DOWN the card rather than across it, and that is the shape of the
       hole rather than a preference: `#sign` is `align-self: stretch` and stands
       to the left of both rows, so what it has is height. A horizontal plaque
       spends 44px of a row that is otherwise five numbers, to say one word; a
       vertical one costs about 15px and reads the same. It is also what the
       object is — the sign in a shop door hangs on a cord, and a hanging sign is
       taller than it is wide.
       `text-orientation: upright` and not a rotation: rotated words are read by
       tilting your head, and stacked upright letters are what is actually
       painted on one of these. */
    /* IT IS THE WORD AND NOT THE PLAQUE ANY MORE. Everything that made this a
       little card of its own — the fill, the radius, the inset ring, the fixed
       height — belonged to an object standing ON the readout. The object is the
       strip now, so all of that moved up to `#sign` (one of them, the height,
       simply died: see below), and what is left here is the lettering.
       Which is also the whole of what a sign in a door is: a coloured board
       with a word painted on it. Two boards, one inside the other, was the old
       shape's cost rather than its design. */
    #doorway {
      display: block; position: relative;
      writing-mode: vertical-rl; text-orientation: upright;
      /* NO HEIGHT AT ALL, which is the one property this element lost rather
         than handed upwards, and it is worth knowing why it ever had one. It
         was `48px` — a fixed number, because `#sign` is `align-self: stretch`
         and therefore has no definite height for a percentage to resolve
         against: `100%` resolved against the fixed full-screen overlay the card
         sits in instead, and drew a plaque a thousand pixels tall with the
         whole readout stretched down beside it. That number then had a second
         job nobody asked it to do — it was SETTING how tall the card was, which
         is what the 640px branch below had to undo on a phone.
         The strip takes its height from the card and the word is centred in it
         by `#sign`, so both problems are gone: nothing here is sized, and
         nothing here can size anything else. What has to stay true is that the
         word FITS — four upright letters run about 40px at this size, against a
         card interior that has never been under 48. That is the thing to check
         if the type in this panel ever comes down.
         Both words are four letters (OPEN / SHUT) on purpose, so the sign is
         the same object in both states. */
      text-align: center;
      /* Up from 6.5px: that was type sized for a 15px plaque, and it is 34px of
         card now. Still small — it is a label on a readout, not a heading — and
         white on `--good` at 800 weight clears its contrast either way. */
      font-size: 8px; font-weight: 800; line-height: 1;
      letter-spacing: .12em; text-transform: uppercase;
      transition: color .15s;
    }
    /* The cord it hung from is gone. It was five pixels meant to say "this is a
       card hooked on a door", and it only ever said that while the plaque was an
       outline — against a filled one it stops reading as a cord and starts
       reading as a stray line above the sign, which is what a 1.5px mark with
       nothing attached to it looks like. The overhang says the same thing
       without drawing anything. */
    /* Focus is for the keyboard, not for the mouse. A press on this leaves the
       button focused, and the browser's default ring then sits round the plaque
       for as long as you play — a permanent blue outline on one HUD control,
       which reads as the sign being stuck in some state. `:focus-visible` is the
       whole fix: it is the browser's own answer to "did they arrive here by
       keyboard", so tabbing still shows a ring and clicking never does. */
    #sign:focus { outline: none; }
    /* INSET, and that is `overflow: hidden` on the card rather than taste: an
       outline is drawn OUTSIDE the border box, so a positive offset on a child
       that meets three edges of a clipping parent is a ring with three of its
       sides cut off — which reads as a rendering fault rather than as focus.
       A negative offset draws it inside the strip, where nothing clips it. */
    #sign:focus-visible { outline: 2px solid #fff; outline-offset: -4px; }
    /* Shut is the other side of the same card: turned round, so it loses its
       colour and keeps its shape. Outlined rather than filled, which is the
       quiet the old dimmed door was reaching for — being shut is said twice more
       (the hour is struck through, #hq puts up a hot chip), so this is the
       glance rather than the announcement. */
    /* Shut is the other side of the same card: same strip, same word, the other
       colour. Filled rather than outlined, which is what keeps the two states one
       object rather than a sign and a ghost of a sign — and it matters more now
       that the sign is an edge of the panel: an outlined state would be a hole
       in the card, where a filled one is the card wearing a different colour.
       `#a8442f` and NOT `--accent`. That variable is a MARK colour, measured
       against the panel on a 10px bar — white on it is about 3.3:1, and this is
       8px type, which is the size that needs contrast most. The stepped-down
       red is the one the heat pills already use for exactly this reason, and it
       clears 4.5:1 against white. The trap is a later tidy-up that "unifies"
       this back onto the variable: it looks like removing a magic number and is
       losing a contrast pass. See the note in CLAUDE.md about the Shop report.
       It is on `#sign` rather than on `#doorway` because the colour is the
       STRIP now — put on the word it would paint a 34px-tall red rectangle in
       the middle of a green edge, which is the nested-boxes look this step
       exists to get rid of. */
    #sign.shut { background: #a8442f; }
    /* ...and once, for the shop that has never been opened.
       Being shut is said three ways already — this door dims, the clock is
       struck through, #hq puts up a hot chip — and every one of them is a mark
       you have to have seen the other state to read. That is fine for a shop you
       just closed and not fine on a world's first morning, where an empty floor
       is equally a shop nobody has walked into yet: three new worlds got played
       for a while with the shutters down. So the door ASKS, once, and stops for
       ever the first time the shutters are worked either way — see `shutterUsed`
       in ui.js. A prompt that came back would be a prompt you learn to skip.

       IT IS `asking` AND NOT `nudge`, AND THAT IS NOT A PREFERENCE. `.nudge` is
       already the build strip's round scroll arrow (see it below), and that rule
       is a BARE CLASS on a stylesheet every element in the game shares — so
       spelling this state `nudge` handed the sign `position: absolute`,
       `top: 50%`, a z-index and a 22px round chip. `#sign` sets no `position` of
       its own, so nothing competed: the door stopped being a cell of the card,
       resolved against the nearest positioned ancestor (`#topleft`, which is
       `.hud` and fixed), and landed halfway down the column — on top of the
       demand meter, wearing the arrow's shadow.
       It is invisible in every shop but a new one: the class is only on while
       the shutters are down AND nobody has ever worked them, so the one player
       who sees it is the one who has never seen where the button belongs. The
       trap is the name rather than the rule — a state class on an id-scoped
       selector reads as private and is not. */
    /* It pulses the STRIP's own colour rather than washing a tint over it, for
       the reason the hover does: this element's colour is the state, so the ask
       has to be something done TO that colour rather than a second one laid on
       top. It is only ever seen shut, so what breathes is the red. */
    #sign.asking { animation: signAsk 1.6s ease-in-out infinite; }
    @keyframes signAsk {
      0%, 100% { filter: brightness(1); }
      50% { filter: brightness(1.42); }
    }
    @media (prefers-reduced-motion: reduce) {
      #sign.asking { animation: none; filter: brightness(1.28); }
    }
    #when { display: flex; align-items: baseline; gap: 5px; line-height: 1.2; }
    #cash {
      font-size: 14px; font-weight: 800; letter-spacing: -.02em;
      font-variant-numeric: tabular-nums; line-height: 1.15;
    }
    #dow, #day { font-weight: 700; font-size: 9.5px; opacity: .75; }
    /* The weekday is the word and the count is the reference, so the dot is
       inside the count rather than between two equals: "Sat · Day 62" is one
       date read left to right, where two spans either side of a separator is
       two readouts that happen to be next to each other. It is a pseudo-element
       so the day number stays a bare string — `#when` is written every snapshot
       and the count is the half of it that changes. */
    #day::before { content: '·'; opacity: .55; margin-right: 4px; }
    #season { text-transform: capitalize; opacity: .5; font-size: 8.5px; }
    /* ---- the clock, which IS the pause button ----------------------------
       The time was a readout for as long as opening was something the clock did
       to you. It is a control now: whether time runs at all is a decision you
       make while looking at the hour, so it lives on the hour rather than
       beside it.
       Two round pips used to sit here, and what they cost was about 45px of a
       row that is otherwise five numbers — to say what this element was already
       saying twice over, struck through for shut and accent-and-blinking for
       held. So what went is the pair of CONTROLS, not the pair of states: both
       states still read exactly as they did, and pressing the thing wearing one
       is the way out of it.
       Nothing about that is discoverable from a glyph, which is fine, because
       neither was a play triangle: the words were in `title` before and they
       still are, and the shutters have a hot chip in #hq naming the key. */
    /* It is the last word of the WHEN group — "Day 117 · Spring · 4:07pm", one
       sentence about when it is, read straight across. It used to be two cells
       further along, past the balance and the sparkline, and then (worse) above
       them: an hour captioning a week of takings. */
    #clock {
      border: 0; padding: 1px 3px; background: none; cursor: pointer; margin: 0 -3px;
      color: inherit; font: inherit;
      font-variant-numeric: tabular-nums; font-weight: 700; font-size: 11px;
      border-radius: 5px; transition: background .12s;
      display: inline-flex; align-items: center; gap: 3px;
    }
    /* ...and the glyph, which the note above argued this button did not need.
       It was right about what a triangle TEACHES — nobody learns what a control
       does from one — and that is a different claim from what a triangle SAYS,
       which is whether the thing is running. The states it points at both hold:
       struck through for shut, accent-and-breathing for held. What neither of
       them is, is a shape you can read at a glance across a room, and stopped
       time is the one state where being wrong about it means the shop is not
       playing while you watch it. Media convention, so it names the press
       rather than the state: bars while it runs, a triangle while it does not.
       It sits AFTER the hour, which is the one thing about it that is about the
       row rather than about the button: the hour is a figure in a line of
       figures, and a glyph in front of it indents the time by its own width, so
       the number stops lining up with the date over it and the takings under
       it. Reading order says the same thing — the time, and then what is being
       done to it. */
    #clock-pp {
      display: inline-flex; width: 9px; height: 9px; opacity: .7;
      /* Never shrinks or reflows the row: the hour beside it is tabular for the
         same reason, and a glyph that changed width would nudge the season and
         the balance along on every press. */
      flex: 0 0 auto;
    }
    #clock-pp svg { width: 100%; height: 100%; display: block; }
    #clock.paused #clock-pp { opacity: 1; }
    html.can-hover #clock:hover { background: rgba(58,49,40,.11); }
    /* Presses in rather than down: this one is a piece of text, and a piece of
       text that jumps a pixel reads as the HUD twitching. */
    #clock:active { background: rgba(58,49,40,.2); }
    /* The strike is on the HOUR and not on the button, now that the button is a
       flex container with a glyph in it: text-decoration does not reliably reach
       across flex items, and a struck-through play triangle is not what was
       being asked for anyway — what is shut is the trading, which is a fact
       about the time. */
    #clock.shut { opacity: .4; }
    #clock.shut #clock-t { text-decoration: line-through; }
    /* Paused outranks shut, because it is the bigger claim: a shut shop is still
       a shop having a night, and a paused one is not having anything. */
    #clock.paused {
      opacity: 1; color: var(--accent);
      animation: clockhold 1.6s ease-in-out infinite;
    }
    #clock.paused #clock-t { text-decoration: none; }
    @keyframes clockhold { 0%, 100% { opacity: 1; } 50% { opacity: .35; } }

    /* ---- the town ---------------------------------------------------------
       How many people are in reach of the shop. `catchment` has been on the
       wire since the shop had customers and was never drawn anywhere, so the
       one term shopkeeping cannot restock its way out of was also the one
       number nobody could see — which made growing it (parking, charm, a better
       address, and now milestones) a purchase with no readout on the other end.

       Quiet on purpose: it is a number that moves a handful of times in a whole
       game, so it sits at the weight of a caption rather than competing with
       the money. `tabular-nums` because the day it does move, the icon beside
       it must not shuffle.

       TWO CEILINGS, and the old readout drew one number against the wrong one.
       "9 / 51" put the headcount over the TOWN, which is not a capacity and can
       never be reached — nobody has ever had fifty-one people in a corner shop
       — so the fraction read as a shop that was 18% full when it might have been
       turning people away. What the near number is out of is what the building
       holds (`shopCapacity`), and the town is a second fact underneath it: how
       many could come at all, and what share of them your reputation brings in
       (`pull`). Three numbers, in the order the sentence goes.

       The word TOWN went with it. It was there because "3 / 50" of what is not
       obvious from a pair of numbers — but the icon says people, and the caption
       was naming the smaller half of what this now shows. */
    #town {
      display: flex; flex-direction: column; align-items: flex-start; gap: 1px;
      font-size: 11px; font-weight: 700; opacity: .55;
      font-variant-numeric: tabular-nums;
    }
    #town .tn { display: flex; align-items: baseline; gap: 4px; }
    #town .ico { font-size: 13px; display: block; align-self: center; }
    /* The ceiling, at the weight of a unit rather than of a number: "3" is what
       you are reading and "/50" is what it is out of, and drawn at the same
       weight the pair reads as a fraction you have to work out. */
    #town .of { font-size: 8.5px; font-weight: 700; opacity: .6; margin-left: -1px; }
    /* The town, under the shop. Caption weight because it is the slow half — it
       moves a handful of times in a game, where the line above it moves every
       minute — and flush left, not indented to the numbers above: an indent
       reserves the icon's column on a row the icon is not on, which draws as a
       glyph rowspanning two lines and a hole under it. The icon belongs to its
       own row. */
    #town .tw {
      font-size: 8px; font-weight: 700; opacity: .62;
      white-space: nowrap;
    }
    #town .tw:empty { display: none; }
    /* `.cap` lived here — the caption family shared with `.gg-tag`. Its one user
       was the word TOWN, and the icon says it now. */

    /* ---- the shutters -----------------------------------------------------
       An open sign belongs on the door, not in a toolbar — which is why this
       has never been a labelled button in a row of them, and why it is now a
       door drawn on the readout you are already looking at (`#sign` above).
       The two shapes it wore before were both about being quiet: an 18px pip
       that said what pressing it would DO, then a 5px stripe down the card's
       edge that said what was TRUE. The stripe is the better half of that and
       still could not say WHICH state — a colour with no glyph on it means "not
       the other one", and you have to have seen the other one.
       What the door adds is that it is legible cold, and what the block adds is
       the target: the sign and the thing you press to work it are the same
       object now, and it is the size of the card rather than 13px of its edge. */

    /* ---- cashflow: the rate, beside the balance -------------------------------
       Cash on hand was the only money on screen, and a balance is not a rate —
       you can watch it climb all week while every single day loses money against
       the wages. This is today's net, an arrow against yesterday, and the week's
       shape, in that order: the number you want most, then the comparison, then
       the trend. Tabular numerals because it changes ten times a second and
       proportional digits make it jitter sideways as it does. */
    /* THERE IS NO `min-width` HERE ANY MORE, and it is worth saying so, because
       the bug it was written for is the one this cell keeps having. It was a
       floor for the same reason `#cash` has one — this is the fastest changing
       number on screen — and it had to be kept equal to `SPARK_W` by hand, since
       a floor of 70 over a 38px sparkline is 32px of empty column that all pools
       on one side: what you see is the clock adrift, half a panel away from the
       readout it is nearest, and neither the floor nor the sparkline is wrong.
       The grid retired both halves. `#flow` is `display: contents`, so the
       number and the week's shape are two cells in two `auto` columns, and a
       column is exactly as wide as the wider of the two things in it — which is
       the floor, computed, for every cell in the card at once. So `SPARK_W` is
       still what sets the right-hand end of the panel; it is simply no longer a
       number anything else has to be told about. */
    /* A ROW now, not a column: the number and the week's shape are both about
       the money, so they belong on the money LINE — stacked, they were a second
       two-line cell inside a panel that is already two lines, and the card had
       four different ideas of where a row was. */
    /* `contents`, not a box: the day's take and the week's shape are two
       CELLS of the card's grid (see `.rows`) — one under the clock, one under
       the season — and a wrapper round them would be a single cell holding both,
       which is exactly the alignment this card kept failing to have. It is still
       one element in the markup and one `innerHTML` write, because the two are
       drawn together by `cashflowHtml`. */
    #flow { display: contents; }
    .flow {
      display: inline-flex; align-items: baseline; gap: 3px;
      flex: 0 0 auto; white-space: nowrap;
      font-variant-numeric: tabular-nums; font-size: 10.5px; font-weight: 800;
      letter-spacing: -.01em;
    }
    .flow.up { color: var(--good); }
    .flow.down { color: var(--accent); }
    /* The arrow says which way against *yesterday*, which is a different
       question from whether today is in profit — a better-than-yesterday day can
       still be a loss. So it is coloured on its own and never inherits. */
    .flow i { font-style: normal; font-size: 7.5px; }
    .flow i.up { color: var(--good); }
    .flow i.down { color: var(--accent); }
    .flow i.flat { color: var(--ink); opacity: .35; }
    .spark { display: block; overflow: visible; }
    .spark rect.up { fill: var(--good); opacity: .75; }
    .spark rect.down { fill: var(--accent); opacity: .8; }
    .spark line.axis { stroke: rgba(58, 49, 40, .22); stroke-width: .75; }
    /* ---- the three gauges -------------------------------------------------
       Reputation is the shop's long memory, mood is how the room feels right
       now, and full is whether there is room for anybody else. One was an
       unlabelled 52px sliver, which is fine when it is the only bar on screen
       and unreadable the moment there are three — so they get names.

       All three fill rightwards and all three are read the same way: **a long
       bar is the shop doing well.** That is why FULL is drawn against the
       turn-away line rather than against capacity. A bar that filled as the
       shop got busier would mean "good" at one end of the panel and "bad" at
       the other, and the eye does not re-read a direction per row. */
    .gauges { display: grid; gap: 2px; }
    .gg { display: grid; grid-template-columns: 22px 42px; align-items: center; gap: 5px; }
    .gg-tag {
      font-size: 6.5px; font-weight: 800; letter-spacing: .04em;
      text-transform: uppercase; opacity: .5; text-align: right;
    }
    .repwrap { width: 42px; height: 4px; background: var(--line); border-radius: 99px; overflow: hidden; }
    .repwrap > div { height: 100%; background: var(--good); transition: width .4s, background .4s; }
    /* Past the line the shop is refusing people, which is not a shade of busy —
       it is a different thing happening, so it stops being a bar and pulses. */
    #full.shut { animation: fullpulse 1.1s ease-in-out infinite; }
    @keyframes fullpulse { 50% { opacity: .35; } }

    /* ---- top left, under the money: the demand meter ----------------------
       An RCI meter, and built like one: a fixed set of channels in a fixed
       order, on screen whether or not anything is happening.

       It used to draw the active world-event modifiers folded per tag, which
       looks like this and was a different thing entirely — the rows were
       whichever tags the world director had written about, so they appeared and
       expired under you, mixed departments with moods (PANTRY next to TRENDY),
       and a week with no events drew nothing at all. You cannot learn to read a
       panel whose rows move; the only shape it ever had was "some things are
       happening". Now the twelve departments are always all there, always in
       `DEPARTMENTS` order, and only the lengths change.

       Right is "they asked and you were short", left is "this space is not
       earning". A department with nothing to say draws no bar — see DEADBAND in
       client/hud-meters.js for why a stub on every row is worse than a gap.

       It stacks under #stats because it is a passive readout and belongs with
       the other passive readouts, and because a column can carry its labels
       inline — a row of columns has to write each name sideways-on under a
       narrow bar, and "beverage" does not fit under nine pixels. */
