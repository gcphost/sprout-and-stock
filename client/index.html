      --edge: var(--edge-sm); --press: var(--press-sm);
      box-shadow: var(--sil), var(--edge);
    }
    #build-deck svg { width: 13px; height: 13px; flex: none; }
    html.can-hover #build-deck button:hover { opacity: .82; background: rgba(58,49,40,.06); }
    #build-deck button:focus { outline: none; }
    #build-deck button:focus-visible { outline: 2px solid var(--ink); outline-offset: 1px; }
    /* The storey you are on is the raised card the open tab is, same as `.cat.on`
       — one vocabulary for "this is where you are" across the whole bar. */
    #build-deck button.on {
      opacity: 1; background: linear-gradient(#fffdf8, #f3ead9);
      --sil: inset 0 0 0 var(--k2) var(--ink-line);
    }
    /* ...and overhead wears a colour on top of it, so which of the two is lit
       reads without reading the word. Deliberately NOT `--accent`, which is the
       bulldozer and every loss in the game: being up a storey is a place, not a
       warning. The slate is the conveyor deck's own family (see
       client/render/palette.js), which is the only thing that ever goes up
       there. */
    #build-deck button[data-deck="1"].on { color: #33506f; }
    /* NOT `flex: 1`. Five tabs stretched across `#build-bar`'s full width is most
       of why this bar read as enormous: the row was a wall of empty gradient, and
       each tab was a 190px target for a 15px glyph. Content width — the row is as
       wide as the words on it, and the space left over is space. */
    .cat {
      flex: none; display: flex; align-items: center; justify-content: center; gap: 5px;
      border: 0; border-radius: var(--r); background: transparent; cursor: pointer;
      font: inherit; color: var(--ink); opacity: .5; padding: 5px 8px;
      white-space: nowrap; transition: opacity .1s, background .1s, box-shadow .1s;
      /* A LINE EVEN WHEN IT IS OFF, which is `.tab`'s rule and was written
         about this row before it was true of it: without one the open tab is a
         drawn card and the other five are floating glyphs — one control and
         five captions, when they are six of the same thing. */
      --sil: inset 0 0 0 1px var(--crease);
      box-shadow: var(--sil), var(--edge);
    }
    html.can-hover .cat:hover { opacity: .85; background: rgba(58,49,40,.06); }
    /* The open tab is a raised card, not a grey wash. It is the one thing on the
       bar that says where you are, and at .5-versus-1 opacity it was saying it
       about as loudly as the four that aren't. */
    /* The line at full strength, which is what "you are here" is spelled as
       everywhere else on this bar (`.tool:hover`, `.rail-btn.on.open`). It was
       a blurred `0 1px 3px` and a 10% ring, both of which predate the ink pass
       — a soft shadow under a drawn card is the disagreement `--cast` exists to
       settle, and a 10% ring beside a contour is two marks on one edge. */
    .cat.on {
      opacity: 1; background: linear-gradient(#fffdf8, #f3ead9);
      --sil: inset 0 0 0 var(--k2) var(--ink-line);
    }
    .cat .ico { font-size: 15px; line-height: 1; }
    /* An inactive tab is its icon; the open one wears its name. Five labels
       competing is five things to read to find the one that says where you are,
       and the label belongs on the tab that IS where you are. The blurb is the
       tooltip either way, on all of them. */
    .cat .nm { display: none; font-size: 11.5px; font-weight: 800; }
    .cat.on .nm { display: block; }

    /* Tier two, and only for a tab that split: which part of it. Deliberately
       quieter than the tabs beside it — smaller, chip-shaped, words rather than
       glyphs, because "walls" and "floors" are not guessable from an icon and
       these are the labels the tabs gave up. The divider is this row's own left
       border, so it is there exactly when there is something to its left of. */
    #build-subs {
      display: flex; align-items: center; gap: 3px; flex: none;
      padding-left: 8px; border-left: 1px solid var(--line);
    }
    #build-subs[hidden] { display: none; }
    .subcat {
      display: flex; align-items: center; gap: 4px;
      border: 0; border-radius: var(--r); background: transparent; cursor: pointer;
      font: inherit; font-size: 10.5px; font-weight: 700; color: var(--ink);
      opacity: .45; padding: 3px 10px; white-space: nowrap; transition: opacity .1s, background .1s;
      /* Its own row's version of the rule above, one notch down: these are
         chips rather than cards, so the side is the small one. */
      --sil: inset 0 0 0 1px var(--crease);
      --edge: var(--edge-sm); --press: var(--press-sm);
      box-shadow: var(--sil), var(--edge);
    }
    html.can-hover .subcat:hover { opacity: .8; background: rgba(58,49,40,.06); }
    .subcat.on { opacity: 1; background: rgba(58,49,40,.09); }
    .subcat .ico { font-size: 12px; line-height: 1; }

    /* Tier three: that tab's entries. Scrolls rather than wraps, so the bar keeps
       one row's height however much anybody authors.

       NO SCROLLBAR. A grey pill under a row of cards is an operating system in
       the middle of a shop — and it was answering two questions at once, badly:
       "is there more" and "take me there". Those are split now. The strip is
       DRAGGED (`wireStrip`, bar.js), which is the same gesture the world behind
       it already answers to, and each end that has more wears an arrow you can
       press — so the answer to "is there more" is a thing you can act on rather
       than a bar you have to hit.

       THE SCROLLER OWNS THE INSET so those ends are the panel's ends: it is
       pulled out over `#build-bar`'s 6px and given that 6px back as padding of
       its own, which puts the tiles exactly where they sat while letting the
       row scroll the full width of the panel. Without it a tile parks 6px short
       of the edge and the fade beside it has a margin of dead glass to sit in.
       `scroll-padding` is the other half — `scrollIntoView` aligns to the
       scrollport, so the tile a number key selects would otherwise land flush
       against the panel edge with none of the inset the rest of the row has. */
    /* CLIPPED TO THE PANEL'S OWN CORNERS. Pulling the strip out to the bar's
       edges is what puts the ends of the row at the ends of the bar — and it
       also hands the scroll a square box where the bar has a 16px radius, so a
       tile scrolled hard against either end pokes its corner out over the world
       and reads as the bar having sprung a leak. The rounding cannot go on
       `#build-bar` itself: `#build-shapes` hangs off the top of it on purpose,
       and clipping there would cut the shape card off at the bar.
       Bottom corners only, because that is the pair this element shares with
       the panel — its top edge is in the middle of it. */
    #build-strip {
      position: relative; margin: 0 -6px -6px;
      border-radius: 0 0 var(--r) var(--r); overflow: hidden;
    }
    /* THE 3px ALONG THE TOP IS WHERE A LIFTED TILE GOES. This row scrolls
       sideways, so it is `overflow-y: hidden` — and it opened with no top
       padding at all, which means the 2px `translateY` that `:hover`, `.on` and
       `.armed` all use had nowhere to go: the tile rose two pixels into a
       boundary and had its top edge, its ring and its rounded corners sliced
       off. Invisible for as long as the only things lifting were a hover you are
       moving through and an amber ring on cream; a green ring that stays up for
       four seconds is the same clip with somebody looking at it.
       Three rather than two, so the ring has a hair of ground under it instead
       of sitting exactly on the line. The bar measures its own height
       (`--build-h`) and the HUD is stacked off that, so growing it is a number
       the layout re-reads rather than one anything has to be told. */
    #build-tools {
      display: flex; gap: 6px; overflow-x: auto; overflow-y: hidden;
      padding: 3px 6px 6px; scroll-padding-inline: 22px;
      scrollbar-width: none;
      /* A drag scrolls it; a touch still flicks it natively, which is why the
         pointer handler ignores anything that isn't a mouse. */
      touch-action: pan-x;
    }
    #build-tools::-webkit-scrollbar { display: none; }
    /* The ends, when there is more past them. A fade rather than a hard edge,
       so a tile half off the strip reads as *continuing* instead of as cut —
       and it is `pointer-events: none` because the tile under it is still a
       button you can press. Painted in the panel's own glass, which is what
       makes it read as the bar rather than as a shadow on the row. */
    #build-strip::before, #build-strip::after {
      content: ''; position: absolute; top: 0; bottom: 6px; width: 46px;
      pointer-events: none; z-index: 2; opacity: 0; transition: opacity .12s;
    }
    #build-strip::before {
      left: 0; background: linear-gradient(90deg, var(--panel-solid) 22%, rgba(255,252,245,0));
    }
    #build-strip::after {
      right: 0; background: linear-gradient(270deg, var(--panel-solid) 22%, rgba(255,252,245,0));
    }
    #build-strip.more-back::before, #build-strip.more-on::after { opacity: 1; }
    /* …and the arrow in it. A round chip rather than a bare glyph: it is a
       button, it sits over a row of buttons, and the one thing it must not read
       as is part of whichever tile it happens to be floating over. */
    .nudge {
      position: absolute; top: 50%; transform: translateY(calc(-50% - 3px));
      z-index: 3; width: 22px; height: 22px; padding: 0;
      display: grid; place-items: center; cursor: pointer;
      border: 0; border-radius: var(--r); font: inherit; font-size: 14px; line-height: 1;
      color: var(--ink); background: linear-gradient(#fffdf8, #f1e8d6);
      /* One of the three things in the bar that genuinely does float — it hangs
         over the strip and the tiles run underneath it — so it keeps a cast
         where the tiles it covers get none. */
      --sil: inset 0 0 0 var(--k4) var(--ink-soft);
      box-shadow: var(--sil), var(--edge), var(--cast-sm);
      opacity: .92; transition: opacity .1s, transform .1s;
    }
    html.can-hover .nudge:hover { opacity: 1; transform: translateY(calc(-50% - 3px)) scale(1.08); }
    .nudge[hidden] { display: none; }
    .nudge svg { display: block; }
    #build-back { left: 2px; }
    #build-on { right: 2px; }

    /* THE BULLDOZER'S OWN PLACE, at the right end of the strip and outside the
       scroller — the one press whose whole job is "not that, get rid of it",
       which means you go looking for it rather than browsing to it. A thing you
       look for has to be findable without reading, and that means the same
       pixels every time: same tab, same drag position, same thumb.

       It sits ON the strip rather than in it, so the tiles pass underneath —
       hence its own ground and a shadow, which is `.nudge`'s deal one size up.
       The scroller is padded by its width so the last tile can still be scrolled
       clear of it rather than parking permanently behind it.

       Armed, it wears `.tool.on` like any other entry: it IS an entry, drawn
       from the same row, and a bulldozer that looked different armed would be
       two vocabularies for one state.

       IT IS PINNED TO THE ROW, NOT TO THE CORNER, and that is the whole of what
       "it feels out of place" turned out to be. Bottom-anchored and sized by its
       own contents, it agreed with the tiles on exactly one edge: a tile that
       carries a price is three lines tall and this is two, so the shorter button
       hung 22px below their tops with its label sitting under theirs — near
       enough to read as a mistake rather than as a decision, which is the worst
       distance for two things to be apart. Both edges now (`top` AND `bottom`),
       so the strip's own height is what sizes it and the well takes up the
       slack: whatever tab you are on, the run and the button start and stop on
       the same two lines.

       WHAT CAME OFF IT WAS WIDTH, NOT HEIGHT. It is the GLYPH ALONE (see
       `bar.js`), so there is no name to leave room for and nothing under the bin
       — one verb in one place that you learn once, against tiles that are each a
       picture of a thing you may never have seen plus what it costs.

       It is still a BUTTON — same ground, same ring, same shadow as any tile,
       and it wears `.tool.on` armed like one. Only the width moved.

       IT HAS TO OUTRANK `#build:not(.browse) .tool`, and that is the whole
       reason this took five goes. That rule sizes every tile in the build bar
       (66px square, 4px padding, a 38px well) and it is an id PLUS two classes,
       so it beats a bare `#build-raze` on every property they share — width,
       padding and the well's height among them. What that looks like from the
       outside is a stylesheet that ignores you: the numbers here change, the
       button does not, and nothing anywhere errors. Anything this button needs
       to differ from a tile on has to be written against the same prefix. */
    #build:not(.browse) #build-raze {
      position: absolute; right: 5px; top: 3px; bottom: 6px; z-index: 3;
      width: 38px; min-width: 38px; max-width: 38px; padding: 5px 0;
      box-shadow: 0 2px 8px rgba(58,49,40,.2), inset 0 0 0 1px rgba(58,49,40,.10);
    }
    /* The well fills whatever height the row is, since there is no name under it
       to leave room for — and `.tool .ico`'s fixed 38px comes from that same
       higher-specificity block, so this has to be written the same way. */
    #build:not(.browse) #build-raze .ico {
      flex: 1; width: 100%; height: auto; border-radius: var(--r);
      font-size: 17px; color: var(--accent);
    }
    #build-raze[hidden] { display: none; }
    /* ...and the right-hand nudge steps aside for it, or the two share a corner
       and the arrow that says "more this way" is drawn on top of the button that
       is not part of the run. Only where there is a bulldozer: a browse bar has
       none and keeps its arrow in the corner. */
    #build:not(.browse) #build-on { right: 48px; }
    /* The colour moved onto the glyph when the word went. Something in here has
       to say this press destroys — it is the one entry on the strip that takes
       a thing away rather than putting one down, and a grey bin among cream
       tiles is a tidy-up. */
    /* ...and the room it takes out of the run. `padding-right` rather than a
       margin on the last tile: the strip is a scroller, so what has to grow is
       the scrollable box, or the end of the run simply sits under the button
       with no way to bring it out. */
    #build:not(.browse) #build-tools { padding-right: 48px; }
    /* An entry, and it is a slot rather than a line of text: the thing itself in
       a recessed well, its name under it, what it costs under that. Sized by a
       floor and a ceiling rather than its contents — a person's note is
       "carrying 4x tomato" where a fixture's is "$45", and a strip whose buttons
       are each as wide as their longest line is one you cannot scan. Both lines
       ellipsise instead. */
    .tool {
      position: relative; border: 0; cursor: pointer; flex: none;
      font: inherit; color: var(--ink); border-radius: var(--r); padding: 6px 8px 5px;
      display: flex; flex-direction: column; align-items: center; gap: 2px;
      min-width: 74px; max-width: 132px;
      /* A DRAWN CARD. It was slightly see-through so the glass under the strip
         read as glass; the bar is paper now (see `#build-bar`) and there is
         nothing to see through to, so the tile is opaque and carries its own
         contour like everything else you can press.
         The line is a variable because EIGHT states rewrite this shadow —
         hover, on, armed, poor, off and the three pairs of those — and a
         contour spelled eight times is a contour that will be seven places
         after the next change.

         IT CASTS NOTHING. There used to be a `--lift` here as well, a solid
         black copy of the tile offset down and right, and a strip of twelve of
         them is where that treatment did the most damage: at 74px a tile is
         mostly edge already, and twelve shadows falling on the paper they are
         printed on is a sheet of stickers rather than a row of things drawn on
         a bar. The tile is ON the bar. The bar casts; the tile does not.
         So the LINE is the whole hierarchy — resting is `--ink-soft`, hover is
         the same line at full strength, and a state that means "this one" is
         that line doubled. Three weights of one mark, which is what a nib has,
         and no state needs a colour or a shadow or a lift to say what it is. */
      --sil: inset 0 0 0 var(--k2) var(--ink-soft);
      --sil2: inset 0 0 0 3px var(--ink-line);
      background: #fffcf5;
      box-shadow: var(--sil), var(--edge);
      transition: box-shadow .09s, background .09s;
    }
    /* EVERY STATE SETS `--sil` AND NEVER `box-shadow`, which is what lets one
       `:active` rule at the foot of this file press all eight of them: it drops
       the side and keeps whatever contour the tile happens to be wearing. A
       state that restated the whole shadow would have to restate the side too,
       and the first one to forget is a tile that cannot be pressed. */
    html.can-hover .tool:hover { --sil: inset 0 0 0 var(--k2) var(--ink-line); }
    /* A HOLD, filling up. One tile asks for one (`bar.js`): the shape card on
       anything that comes in several shapes. Drawn rather than merely allowed,
       since a hold with nothing happening is indistinguishable from a press
       that missed right up until the moment it fires — the same claim
       `setHoldProgress` makes about the world's own ring, at the same 400ms:
       the animation is the timer, wearing a colour.

       A sweep UNDER the art rather than a tint over it, for the reason `.tool.on`
       gives about the ring — a solid block behind a bot turns both to mud — and
       `pointer-events: none` because it lies over the button that is listening
       for the release. */
    .tool.holding::after {
      content: ''; position: absolute; inset: 0; border-radius: inherit;
      background: linear-gradient(90deg, rgba(255,214,107,.85), rgba(255,214,107,.55));
      transform-origin: left center; animation: toolhold .4s linear forwards;
      pointer-events: none; mix-blend-mode: multiply;
    }
    @keyframes toolhold { from { transform: scaleX(0); } to { transform: scaleX(1); } }
    /* Armed. A ring rather than a fill under the art, so the thing you are about
       to build stays the brightest object in its own button — a solid amber
       block behind a wooden shelf turns both to mud. */
    /* THE RING IS THE TILE'S OWN LINE DOUBLED, and the colour moved into the
       fill. An amber ring was the state for as long as the edge was free to
       carry it; with a contour on every tile a coloured ring is a second mark
       arguing with the first about one edge, and it is the softer of the two.
       Doubling says "this one" in the same vocabulary as everything else, and
       leaves amber to mean what it means — see `.tool.armed`, which is the
       whole reason the colours have to stay told apart. */
    .tool.on {
      background: linear-gradient(#ffe6a8, #ffd66b);
      --sil: var(--sil2);
    }
    /* ASKING TWICE, AND THE ONLY STATE ON THIS STRIP THAT RUNS OUT.
       The armed hire tile (`UI.armHire`): one press from a machine on lease, and
       nothing hands the money back.

       GREEN, AND IT IS THE THIRD COLOUR THIS STATE HAS BEEN ASKED TO WEAR, so
       the argument is written down rather than had again. Amber is taken: `on`
       is a tool in your hand, a state you leave when you are done with it, and
       an armed hire is a question that runs out — two different things must not
       share a colour on one strip. Red was the first answer and it was reasoned
       from the worker menu, where Let go goes red because the next press ENDS
       somebody. It is wrong here for a reason the two tiles do not share: this
       press starts one. A whole tile washed in the colour the shop uses for a
       refusal, a shortfall and a thing that has broken says "something is wrong
       with this" about a robot you were about to hire. Green is the sentence the
       state actually makes — the next press will land — which is the one the
       build ghost has always made in the same colour.

       A RING AND A TINT, not the solid fill Let go uses. That is a 15px glyph in
       a square and this is a picture of the bot you are about to lease, and a
       block of colour behind either turns both to mud. The tint used to be
       painted into the WELL as well as onto the tile, so the colour reached the
       middle instead of only going round the outside — the well is gone (see
       `.tool .ico`) and the tile's own gradient does that unaided now, which is
       what taking the recess out bought.

       TWO GREENS, and the split is the one CLAUDE.md's contrast note draws: a
       2px rule is a MARK, which `--good` clears against this ground at 3.4:1,
       and the two lines of type are FIGURES at 10 and 11px, which it does not —
       `--good` on the tint is 2.7:1. `#3d7238` is that same green stepped down
       until it clears 4.5, and the trap is the later tidy-up that "unifies" the
       two back onto the variable.
       THE RING IS NO LONGER ONE OF THE GREENS. It is the tile's own contour
       doubled, the same as `.tool.on` — with a line on every tile a coloured
       ring is a second mark arguing about one edge. So the tint and the type
       carry the whole of what green means here, which is why the tint is lit
       rather than left alone. */
    .tool.armed {
      background: linear-gradient(#f4faf1, #ddefd8);
      --sil: var(--sil2);
    }
    /* Hover would otherwise take the ring off — `html.can-hover .tool:hover` is
       the more specific selector, which is why `.tool.on.poor` has a twin of
       this rule two blocks down and for exactly this reason. */
    html.can-hover .tool.armed:hover {
      --sil: var(--sil2);
    }
    .tool.armed .nm { color: #3d7238; }
    /* The question, where the price was. Loud on purpose: it is the one line on
       the tile that says what the NEXT press does, and the price it replaced is
       no longer the thing you are deciding. */
    .tool.armed .cost { color: #3d7238; opacity: 1; font-weight: 800; }
    /* FOUR SECONDS, DRAINING. An arm that expires with nothing saying so is a
       second tap that does nothing on the tile you just pressed, which is the
       same picture as a button that does not work — and it is worse than the
       hold this replaced, because at least a hold that let go early left the
       tile plainly untouched. The window comes off `--arm` (`bar.js`) so the
       line and the `setTimeout` that ends it are one number.

       A rule along the bottom edge rather than a sweep across the tile, unlike
       `.tool.holding`: that one fills over 400ms and is gone, and this one is on
       screen for ten times as long, over art you are meant to be reading. It
       drains from the right, so what is left of it is what is left of your
       window. */
    .tool.armed::after {
      content: ''; position: absolute; left: 5px; right: 5px; bottom: 3px; height: 2px;
      border-radius: var(--r); background: #4a8c45;
      transform-origin: right center; animation: toolarm var(--arm, 4000ms) linear forwards;
      pointer-events: none;
    }
    @keyframes toolarm { from { transform: scaleX(1); } to { transform: scaleX(0); } }
    /* The key it answers to, as a key. */
    .tool .key {
      position: absolute; top: 1px; left: 4px; z-index: 1;
      font-size: 8.5px; font-weight: 800; line-height: 12px; min-width: 12px; height: 12px;
      color: rgba(58,49,40,.5);
    }
    .tool.on .key { color: rgba(58,49,40,.72); }
    /* How many are already standing in the shop. Opposite corner to the key,
       because they are answers to different questions and both are one glyph. */
    /* A NUMBER, NOT A BADGE. It was cream on 58% brown with a line round it,
       which is the darkest thing on the whole strip — so how many shelves you
       already own was the loudest mark on a button whose job is showing you the
       shelf. It is the quiet answer to a question nobody asked yet; the key
       opposite it is set at the same weight for the same reason, and neither
       needs a ground now that the art underneath them has no well to be lost
       against. */
    .tool .have {
      position: absolute; top: 3px; right: 4px; z-index: 1;
      font-size: 8.5px; font-weight: 800; line-height: 13px; min-width: 13px; height: 13px;
      color: rgba(58,49,40,.62);
      font-variant-numeric: tabular-nums;
    }
    /* NO WELL. It was a filled, lined recess for the art to stand in, on the
       argument that it is what makes a row of art read as a row of SLOTS —
       without it every button is a picture floating on cream and the strip has
       no grid to it. That argument was written when the tile had no edge of its
       own. It has one now: the tile IS the slot, and a lined box 6px inside a
       lined box is the same claim made twice, at which point you read the boxes
       instead of the shelving they are drawn round.
       What is left is the size, which is the half that was doing the work —
       every tile reserves the same 38px whatever its art, so the names and the
       prices line up across the strip. */
    .tool .ico {
      font-size: 19px; line-height: 1; display: grid; place-items: center;
      width: 100%; height: 38px;
    }
    /* Art gets the well; a glyph is a category rather than a thing, so it stays
       small and centred instead of being blown up to fill one. */
    .tool .ico.art { padding: 3px; }
    .tool .ico.art svg { width: 100%; height: 100%; display: block; }
    .tool .nm, .tool .cost { max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .tool .nm { font-size: 11px; font-weight: 700; }
    .tool .cost { font-size: 10px; font-weight: 800; opacity: .55; font-variant-numeric: tabular-nums; }
    /* Somebody the sim cannot place — their kind was deleted out from under
       them. That is a problem rather than a job, and it should not read as one. */
    .tool.warn .cost { color: var(--accent); opacity: .9; }

    /* MORE THAN YOU HAVE. Not `disabled`, because the tip explaining why is a
       hover away and a disabled button is the one that most needs to be able to
       answer for itself — the press is refused in `bar.js` instead.

       The picture goes grey and quiet while the PRICE goes bright: the number is
       the reason, so it is the one thing on the tile that should get louder, and
       greying the whole button would fade the only part of it worth reading. No
       lift on hover and no pointer either, which between them are what a tile
       says about itself before you press it. It can be `on` as well — money
       spent after you armed something — and then the amber ring stays, because
       the tool genuinely is still in your hand. */
    /* `.off` is the other reason a tile is dead: what cannot go on the storey you
       are pointing at, while the Overhead chip is lit. Same greying, and
       deliberately NOT the same treatment of the price — the number is not what
       is wrong with a shelf on the ceiling, and shouting it would say the one
       thing that is not true. The whole tile fades instead, price included. */
    .tool.poor, .tool.off { cursor: not-allowed; }
    html.can-hover .tool.poor:hover, html.can-hover .tool.off:hover { --sil: inset 0 0 0 var(--k2) var(--ink-soft); }
    .tool.poor .ico, .tool.off .ico { opacity: .34; filter: grayscale(1); }
    .tool.poor .nm, .tool.off .nm { opacity: .45; }
    .tool.off .cost, .tool.off .have { opacity: .4; }
    .tool.poor .cost { color: var(--accent); opacity: .95; }
    /* Armed and unaffordable keeps its ring — see above — so the well under the
       art must not be greyed back to nothing against it. */
    html.can-hover .tool.on.poor:hover, html.can-hover .tool.on.poor {
      --sil: var(--sil2);
    }
    /* ...and the same for a hire you armed and then could not afford, which is a
       state you reach by standing still: a van is paid for while the tile waits.
       The ring stays for the four seconds it has left — the question is still
       open, and the answer to it is now no. */
    html.can-hover .tool.armed.poor:hover, html.can-hover .tool.armed.poor {
      --sil: var(--sil2);
    }

    /* THE BUILD STRIP IS TILES. A picture, a short name, how many you already
       own, what it costs — and that is the whole button.

       THE NAME CAME OFF ONCE AND IS BACK, and the round trip is the useful part.
       It used to sit under every entry as a full-width caption, which with the
       price made each tile three lines and 78px tall at ~100px wide: eight
       fitted on screen and the strip read as a wall of small text rather than as
       a row of things. So it went, on the argument that the art is the label —
       `thumb.js` draws the actual piece off its own row, which is the entire
       reason five floors stopped being five grey glyphs — and that a name is
       only ever a question about ONE entry, the one under the pointer, which
       `tip.js` answers at the tile where the question was asked.

       Every line of that is true and every line of it ends at HOVER. A finger
       cannot ask, so on a phone it reads "the name is available nowhere", and it
       is not much better with a mouse: a shelf, a bakery case, a produce table
       and a deli counter are four small brown boxes that differ by a few pixels
       of silhouette at 38px, and hovering four of them one at a time to find the
       one you meant is not reading a palette, it is interrogating one. The
       silhouettes only work for somebody who already knows the catalogue.

       What makes it affordable this time is that it is a SWAP rather than a
       third line, and that the tile is a chip rather than a card: two lines of
       8.5px inside 56px, clamped, because "Hot Counter" and "Bakery Case" are
       two words each and nowrap would ellipsise every fixture worth naming to
       "Bak…".

       THE PRICE KEEPS ITS ARGUMENT and moves into the well as a chip, opposite
       `.more`. $40 against $110 down a row of lamps is the actual decision and a
       comparison you can only make one tile at a time is not one — so it stays
       visible on every tile, and what it gives up is the right-aligned tabular
       column, which is worth less than knowing what the thing is.

       Browse bars keep their cards. A hire's note is what they are doing right
       now — a readout, not a hover question — and their glyph is a category
       rather than a picture of them, so there is nothing on the button to read
       them off of. */
    /* SQUARE, near enough: 66px against a button that comes out ~66 tall with a
       38px well and two lines under it. It is worth the ten pixels because of
       what they buy on the line that needed them — at 56px a name got about
       seven characters before it wrapped, so "Chiller" and "Freezer" were each
       one character from breaking, and a break is what turns a two-word name
       into a three-line tile. Ten more takes the caption to 9px as well, which
       is the smallest type in the game that is meant to be READ rather than
       glanced at. */
    #build:not(.browse) .tool {
      width: 66px; min-width: 66px; max-width: 66px;
      padding: 4px; border-radius: var(--r); gap: 1px;
    }
    /* ONE line, always. Two was the generous answer and it is the one thing a
       strip of tabs may not do: the caption box is what sets the height of the
       bar, so a tab whose names all fit on one line drew a bar 11px shorter than
       the tab next to it. Every tile, the tabs above them and the HUD that sits
       off `measureBar` all jump as you page across the palette — and what it
       reads as is the bar being unstable, because the thing that moved is not
       the thing you were looking at.

       Reserving two lines everywhere fixes it the wrong way round: the bar then
       stands permanently at the taller height to hold a second line that six
       tabs out of eight never use.

       So the height is fixed by being one line, and a long name gets smaller
       type rather than a second row. `long` is set in `bar.js` off the name's
       own length, which is the only measurement available before layout — the
       ellipsis is the backstop for the handful it still cannot hold, and the
       tile's `title` has the whole name for those. */
    #build:not(.browse) .tool .nm {
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      font-size: 9px; font-weight: 800; line-height: 1.15; letter-spacing: -.01em;
    }
    #build:not(.browse) .tool .nm.long { font-size: 8px; letter-spacing: -.03em; }
    /* This one comes in shapes: hold it, or press this. A hold nothing on screen
       mentions is a gesture nobody finds, and a shape is cosmetic enough that
       never finding it would read as the game not having them.

       In the bottom-right of the WELL rather than of the button — the well is
       4px down and 38px tall, so 30px puts a 10px chip inside its lower corner,
       clear of the price line underneath. Over the art, so it needs its own
       ground to stay legible against a dark shelf. */
    #build:not(.browse) .tool .more {
      position: absolute; top: 30px; right: 4px; z-index: 1;
      height: 10px; padding: 0 2px; border-radius: var(--r);
      font-size: 9px; font-weight: 800; line-height: 10px;
      color: rgba(58,49,40,.62); background: rgba(255,253,248,.8);
      box-shadow: inset 0 0 0 1px var(--crease);
    }
    html.can-hover #build:not(.browse) .tool:hover .more, html.can-hover #build:not(.browse) .tool.on .more {
      color: rgba(58,49,40,.85); background: rgba(255,255,255,.95);
    }
    #build:not(.browse) .tool .ico { height: 38px; border-radius: var(--r); }
    /* In the bottom-left of the WELL, which is `.more`'s rule mirrored — same
       top, same height, same chip — so a tile carrying both reads as a pair
       rather than as two unrelated marks. Its own ground because it sits over
       the art, and half of that art is a dark shelf.

       Out of the flow, so the last line in the button is the name: the whole HUD
       is measured off this button's height (`--build-h`), which is read rather
       than written down, so the strip and everything stacked above it follow the
       two-line caption without a second number to keep in step. */
    #build:not(.browse) .tool .cost {
      position: absolute; top: 30px; left: 4px; z-index: 1;
      height: 10px; padding: 0 2px; border-radius: var(--r);
      font-size: 8.5px; font-weight: 800; line-height: 10px; opacity: 1;
      color: rgba(58,49,40,.62); background: rgba(255,253,248,.8);
      box-shadow: inset 0 0 0 1px var(--crease);
    }
    #build:not(.browse) .tool.warn .cost { color: var(--accent); }
    #build:not(.browse) .tool.poor .cost { color: var(--accent); opacity: 1; }

    /* A glyph on these two is a category rather than a thing, and an empty
       recess under one is a slot with the thing missing out of it — so a glyph
       keeps the old flat button. Art does not: a hire IS drawn, and their well
       has to be the same fixed height every other slot's is or the button
       changes height with the drawing in it. */
    #build.browse .tool .ico:not(.art) { height: auto; }
    /* A ROSTER ENTRY MUST NOT RESIZE ITSELF. Its note is what that person is
       doing right now — "on the till", then "carrying 4x tomato", then "off for
       a break" — so a button sized to its own text is one that grows and
       shrinks every few seconds and shunts every button after it sideways. You
       cannot press a moving target, and the whole point of the strip is that
       who is on the tills is a glance rather than a menu.

       So the browse bars fix the width instead of ranging between the floor and
       the ceiling above, and both lines ellipsise into it. The tooltip carries
       the whole sentence, which is where an ellipsis sends you. */
    #build.browse .tool { width: 108px; min-width: 108px; max-width: 108px; }
    /* A RUN LABEL — the word in the gap before the first entry of a kind.
       Upright, because the strip's whole budget here is horizontal: a heading
       laid flat costs as much room as another hire, and the bar is a row you
       scroll. The rotation is on the inner `i` rather than on the label itself,
       or the hairline that separates one run from the last comes out on the
       wrong side of it.

       Quiet and small on purpose. It is a caption for the four buttons after
       it, and a heading that reads louder than the names it is grouping is a
       strip you scan twice. No hairline on the first, which would be a rule
       down the left of the whole bar rather than between anything. */
    #build-tools .run {
      flex: none; display: flex; align-items: center; justify-content: center;
      width: 15px; padding-left: 5px; border-left: 1px solid var(--crease);
    }
    #build-tools .run:first-child { border-left: 0; padding-left: 0; }
    #build-tools .run i {
      writing-mode: vertical-rl; transform: rotate(180deg);
      font-size: 9px; font-weight: 800; font-style: normal;
      letter-spacing: .1em; text-transform: uppercase;
      color: var(--ink); opacity: .42; white-space: nowrap;
      max-height: 100%; overflow: hidden;
    }
    /* …and it gets TWO lines to say it in, centred, clamped. One line of 108px
       cut "carrying 4x tomato" down to about "carrying 4x to", which is a
       readout you have to hover to read. Two lines is most of what anybody is
       ever doing.

       The height is fixed at both of them rather than left to the text, for the
       same reason the width is: a note that dropped to one line would shorten
       the button, and the bar measures itself (`--build-h`) so the whole HUD
       above it would step down with it. A one-line note simply sits in the top
       half. */
    #build.browse .tool .cost {
      white-space: normal; text-align: center; line-height: 1.15; height: 2.3em;
      display: -webkit-box; -webkit-line-clamp: 2; line-clamp: 2;
      -webkit-box-orient: vertical; overflow: hidden;
    }
    /* ...and the armed hire's one line sits in the MIDDLE of those two, rather
       than in the top half with a gap under it. The height above is a floor for
       the strip and not a shape for this sentence — a two-line box holding one
       loud line reads as a line that has lost the one under it, which on the one
       tile you are being asked to look at is the wrong thing to draw the eye.
       Spelled with the `#build` on the front because that is what it takes to
       out-rank the rule above; without it this loses and does nothing. */
    #build.browse .tool.armed .cost { display: grid; place-items: center; }

    /* The last tier, and the only one that is not part of the bar.

       It was a row along the bottom, drawn whenever the armed piece came in more
       than one shape — and a row that comes and goes changes the height of the
       bar, which moves every tab on it and the tile you were aiming at. Twice:
       once arriving, once leaving. A card hanging off the top of `#build-bar`
       costs the bar no height at all, so nothing moves, and it can sit over the
       world because the world behind the palette is not what you are reading.

       `left` is set by `placeChoice` — over the tile it is about. A shape is
       still not another thing to buy, so it never takes a number key, and it
       still goes when the piece does: browse to another tab and it would be a
       label for something no longer on screen. */
    /* A LIST, not a wrapped row of chips. Wrapping made a card whose shape
       changed with the number of shapes in it and whose names landed in a
       different place on every line — six things to read in a ragged block,
       when they are one question with six answers. A column is one column of
       pictures down the left and one column of words beside them, which is the
       same button the strip below is made of, stood up. */
    #build-shapes {
      position: absolute; bottom: calc(100% + 8px); left: 0;
      display: flex; flex-direction: column; align-items: stretch; gap: 2px;
      width: 186px; max-width: calc(100vw - 40px);
      /* Paper, and it stays paper now that the bar under it is glass again.
         The old note here said it was paper BECAUSE the bar was, and that half
         is dead; what survives is the other half, which was always the real
         reason — it is a LIST you read, 186px wide, hanging over the middle of
         the shop rather than over the bottom edge of it. The bar can be glass
         because it is a strip along the bottom and the alternative is a wall.
         A card of six lines of type has no such problem and gains nothing but a
         busier ground behind the words. */
      background: var(--panel-solid); border-radius: var(--r); padding: 5px;
      box-shadow: var(--cast);
    }
    #build-shapes[hidden] { display: none; }
    /* One row per shape: its picture on the left, its name beside it, both hard
       against the same two edges on every row so the list reads down. */
    .shape {
      display: flex; align-items: center; gap: 7px; text-align: left;
      border: 0; border-radius: var(--r); background: transparent; cursor: pointer;
      font: inherit; font-size: 11.5px; font-weight: 700; color: var(--ink);
      padding: 2px 8px 2px 3px; opacity: .8;
    }
    html.can-hover .shape:hover { opacity: 1; background: rgba(58,49,40,.06); }
    .shape.on { background: #ffd66b; opacity: 1; box-shadow: inset 0 0 0 1.5px #d99b1f; }
    /* The same well the tiles in the strip stand their art in, at list size —
       this is that button stood up, not a chip with a picture on it, and a
       column of art with no ground under it is a column of floating drawings. */
    .shape .ico.art {
      flex: none; width: 30px; height: 26px; padding: 2px; border-radius: var(--r);
      background: radial-gradient(120% 100% at 50% 18%, rgba(255,255,255,.9), rgba(58,49,40,.055));
      box-shadow: inset 0 0 0 1px rgba(58,49,40,.06);
    }
    .shape.on .ico.art { background: radial-gradient(120% 100% at 50% 18%, rgba(255,255,255,.92), rgba(160,110,20,.14)); }
    .shape .ico.art svg { width: 100%; height: 100%; display: block; }
    /* Vertically centred beside the picture rather than sitting on the baseline
       of a 26px box, and one line whatever its name is — "Wall corner (other
       way)" is the longest thing in here and wrapping it would make one row of
       the list twice the height of the others. */
    .shape .nm {
      min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }

    /* Above the bar, and only when it has something to report — see
       `renderBuildHint`. Below it, it sat on the very bottom edge of the screen
       and pushed everything else up for a line that was usually restating the
       lit button. */
    #build-hint {
      background: rgba(58,49,40,.82); color: #fff; border-radius: var(--r);
      padding: 4px 12px; font-size: 12px; font-weight: 600;
      /* It grows out of the bar and sinks back into it. Appearing and vanishing
         between two frames is what made this harsh — a line of text arriving at
         full contrast on the bottom edge of the screen reads as an alert, and
         "Nothing armed" is not one.

         The height is animated as well as the fade, because this element is IN
         FLOW: everything above the bar is positioned off `--build-h`, so a hint
         that only faded would still shove the HUD up the instant it appeared and
         drop it the instant it went. `max-height` rather than `height`, because
         the line has to stay free to wrap — a refusal reason on a narrow window
         is two lines and a fixed height would cut one off. The cost of that is
         the usual one: the animation ends at 4.5em rather than at the real
         height, so a one-line hint has finished growing about two thirds of the
         way through and coasts the rest on the fade and the slide, which are
         still moving. The padding goes with it or a collapsed box is 8px tall. */
      margin-bottom: 6px; max-height: 4.5em; overflow: hidden;
      pointer-events: none;
      transition: opacity .15s, transform .18s, max-height .18s,
        margin-bottom .18s, padding-top .18s, padding-bottom .18s;
    }
    /* Down and away, which is the same direction the whole bar arrives from
       (`#build` above) — so a hint leaving looks like it went back behind the
       bar rather than like it was switched off. */
    #build-hint.gone {
      opacity: 0; transform: translateY(7px);
      max-height: 0; margin-bottom: 0; padding-top: 0; padding-bottom: 0;
    }
    /* Amber is a consequence you may still choose; red is a no. Same two
       colours the ghost on the ground is using, so the words and the box can
       never disagree about what is about to happen. */
    #build-hint.warn { background: var(--warn); color: var(--ink); }
    #build-hint.bad { background: var(--accent); color: #fff; }
    /* ...and the storey, which is neither. It is the one line in here that is a
       standing fact rather than news about the tile under the pointer — you are
       working four metres up until you say otherwise — so it gets the slate the
       lit Overhead chip wears rather than either of the two judgements above. A
       hint at the default grey would read as one more thing the bar is telling
       you, and this one is the answer to "why is nothing landing where I point". */
    #build-hint.deck { background: #33506f; color: #fff; }
    /* The corner HUD clears the same stack, by the same arithmetic. `--build-h`
       is 0 when no bar is up, so there is one rule rather than one per mode —
       `body.building #log` and friends were three literals that had to be kept
       in step with a bar whose height nobody could predict.

       `#log` is deliberately not in here any more — see its own rule. These two
       are things you read *while pressing something*, so they have to move with
       the bar; the feed is not. */
    #carry, #prompt, #emotes { bottom: calc(var(--nav-top) + var(--build-h) + 8px); }

    /* ---- the emote strip ---------------------------------------------------
       Held up by V, gone on the release. It sits exactly where `#prompt` does
       and TAKES ITS PLACE (`body.emoting #prompt`) rather than stacking above
       it, because the two answer the same question — "what would a press do
       right now" — and the pill's answer is about a press you are not making
       while you are holding this open. Two captions in one spot is the shop
       telling you two different things about the same hand.

       Buttons rather than a row of glyphs, and clickable rather than only
       keyed, because the gesture is HOLD-then-choose: the key that opens the
       strip is not the key that picks from it, and a mouse is already free.
       They wear `.rail-btn` so a strip that appears for a second is in the
       same hand as everything else on screen — a second button design is the
       mixed-weight bug the icon script's header is about, wearing CSS. */
    #emotes {
      left: 50%; transform: translate(-50%, 8px); opacity: 0;
      display: flex; gap: 6px; pointer-events: none;
      transition: opacity .12s, transform .12s;
    }
    /* Fast, and faster than the pill's .14s on purpose: this is up for as long
       as a key is down, so an entrance you can watch is one that is still
       arriving when somebody has already pressed 1. */
    #emotes.show { opacity: 1; transform: translate(-50%, 0); pointer-events: auto; }
    body.emoting #prompt { display: none; }
    /* The name under the mark. A row of four hands is not self-explanatory —
       `point` and `wave` are the same hand at 18px — and this is the one strip
       in the game nobody has ever seen before, so it says what each one is
       until it doesn't have to. */
    /* Class-scoped and not `#emotes .em-btn`, which is what it was: the tutorial
       shows you this button by CLONING it into a card (see `mockOf` in
       client/tutor.js), and a copy outside the strip does not match a descendant
       selector — so the picture of the wave button was a 40px rail button with
       an unstyled word under it. Nothing else in the game wears `.em-btn`. */
    .em-btn { width: 52px; height: 52px; grid-template-rows: auto auto; gap: 1px; }
    /* The rail's own badge, moved off the corner: a 52px button with a caption
       across the bottom has no corner left, so the number sits top-right where
       nothing else is. Same size, same weight, same opacity — it is the same
       mark saying the same thing. */
    .em-btn .kb { bottom: auto; top: 3px; right: 4px; }
    .em-btn .lbl {
      font-size: 8.5px; font-weight: 800; letter-spacing: .03em;
      text-transform: uppercase; opacity: .55;
    }
    /* ...and on a phone the two of them STACK, because there the pill is not a
       caption in the middle of the screen — its rows are buttons, so it is a
       full-width block at exactly the height the carry card sits at, and it drew
       straight over it. The thing you lose is the one you most need while the
       pill is offering to put something down: what you are holding.
       `--pill-h` is measured (`measurePill`), the way `--build-h` is and for the
       same reason — a pill is one row or four depending on what you tapped. It
       is 0 while the pill is down, so nothing moves when there is nothing to
       clear. */
    @media (max-width: 640px) {
      #carry {
        bottom: calc(var(--nav-top) + var(--build-h) + var(--pill-h, 0px) + 14px);
        transition: bottom .14s;
      }
    }

    /* ---- turning the thing you are about to place -------------------------
       R turns the ghost, and so does the wheel. A phone has neither, and two
       fingers are already the camera — so on a touch screen the one decision
       you have to make BEFORE you spend the money was the one decision you
       could not make. Everything else here is reachable with a finger; this
       button is the missing quarter turn.

       It does NOT ride `--build-h` the way `#carry` and `#prompt` do, and that
       is the whole of where it sits. That variable is the height of the bar
       *and* the hint above it, so every warning that appeared — amber, a line
       or two, arriving exactly when you are lining a fixture up — shoved the
       button up the screen and out from under the thumb already on its way to
       it. A control that moves when the thing it is about goes wrong is worse
       than one in an awkward place. So: the right edge, halfway up, pinned to
       nothing that can change size.

       Hidden by default and shown by `syncRotate`, which is also what keeps it
       off a desktop: a button standing in for two controls you already have is
       clutter over the shop.

       The way OUT is the same argument said about the other thumb. Escape ends
       build mode and so does the rail's lit hammer, and a phone has neither the
       key nor — with the palette up over the bottom of the screen and a ghost
       following your finger — a comfortable reach to the rail. So `#closebtn`
       is `#rotbtn` mirrored: same size, same height, the left edge, pinned to
       nothing that can change size. One shared rule and two `left`/`right`
       lines, because two buttons of the same size at the same height that did not match
       would read as two different kinds of thing. */
    #rotbtn, #closebtn {
      top: 50%; transform: translateY(-50%);
      width: 46px; height: 46px; border-radius: var(--r); border: 0;
      background: var(--panel-solid); color: var(--ink);
      box-shadow: 0 4px 14px rgba(58,49,40,.3);
      display: none; align-items: center; justify-content: center;
      pointer-events: auto; cursor: pointer; padding: 0;
      -webkit-tap-highlight-color: transparent;
    }
    #rotbtn { right: 12px; }
    #closebtn { left: 12px; }
    #rotbtn.show, #closebtn.show { display: flex; }
    #rotbtn svg, #closebtn svg { width: 22px; height: 22px; }
    /* It is pressed repeatedly — four taps is all the way round — so the press
       has to read on the button itself. A toast or a hint would be four lines of
       news about a quarter turn you can see. */
    /* The press has to keep the centring transform in it, or pressing the button
       drops it half its own height down the screen — a transform is one
       property, and the second declaration is not an addition to the first. */
    #rotbtn:active, #closebtn:active { transform: translateY(-50%) scale(.94); background: #ffd66b; }

    /* ---- taking it back, for a thumb --------------------------------------
       Ctrl+Z is the whole of undo on a desktop and there is no Ctrl on a phone,
       so on the one device where every build press is made with a fingertip —
       the device where you are most likely to place a shelf you did not mean to
       — the feature would have shipped unreachable.

       Stacked UNDER the X rather than paired across the screen, and that is the
       only real decision here. They are a pair you press repeatedly, often
       several times in a row, so splitting them onto opposite thumbs would make
       stepping back three presses a two-handed exercise. The X is the other
       thing on that side you press once and are done with; these live beneath
       it in the order you reach for them.

       Smaller than the two above (38 against 46) because they are secondary and
       because three buttons of the same size down one edge reads as a
       toolbar rather than as a mode's controls. No `translateY`: the offsets are
       measured off the centre line the other two are pinned to, so the `:active`
       press is a plain scale and cannot drop the button half its height down the
       screen the way `#rotbtn`'s once did.

       `.off` is a button that would do nothing — an empty stack. Dimmed rather
       than hidden, because a Redo that disappears the moment you build something
       new is a control that moves under the thumb already on its way to it,
       which is the same complaint the comment above settles for `#rotbtn`. */
    /* ---- ...and picking several, which has no key at all ------------------
       Undo at least HAS a desktop spelling that a thumb is missing. Shift does
       not: there is no Shift on a phone, so picking more than one thing was not
       a control that was awkward to reach, it was a feature that did not exist
       on the device — and with it went the whole of bulk Remove, which is the
       press a selection is for.

       So `#pickbtn` is a latch rather than a modifier, because that is what a
       modifier becomes when there is no second hand to hold it: press it and
       taps add and drop fixtures, press it again and they open menus. Which is
       why it is the one button in this stack with an ON look — a latch you
       cannot see the state of is a mode, and a mode nothing announces is the
       complaint `paletteArmed` settles for the palette.

       `#delbtn` under it, and directly above nothing by accident: Undo is two
       buttons up. Tearing out six shelves is the most expensive press on this
       screen and the way back from it is under the same thumb.

       Same 38px and the same 46px pitch as undo/redo, continuing the one
       column rather than starting a second — four buttons of the same size down an edge is
       already a toolbar, and a fifth in a new place would read as a different
       kind of thing. */
    #undobtn, #redobtn, #pickbtn, #delbtn {
      width: 38px; height: 38px; border-radius: var(--r); border: 0;
      background: var(--panel-solid); color: var(--ink);
      box-shadow: 0 4px 14px rgba(58,49,40,.3);
      display: none; align-items: center; justify-content: center;
      pointer-events: auto; cursor: pointer; padding: 0; left: 16px;
      -webkit-tap-highlight-color: transparent;
    }
    #undobtn { top: calc(50% + 33px); }
    #redobtn { top: calc(50% + 79px); }
    #pickbtn { top: calc(50% + 125px); }
    #delbtn { top: calc(50% + 171px); }
    #undobtn.show, #redobtn.show, #pickbtn.show, #delbtn.show { display: flex; }
    #undobtn svg, #redobtn svg, #pickbtn svg, #delbtn svg { width: 20px; height: 20px; }
    #undobtn.off, #redobtn.off, #pickbtn.off, #delbtn.off { opacity: .38; pointer-events: none; }
    #undobtn:active, #redobtn:active, #pickbtn:active, #delbtn:active {
      transform: scale(.94); background: #ffd66b;
    }
    /* The same lit yellow `.sec-row.picked` and the build bar's armed slot wear,
       so "this one is on" means one thing everywhere in the game. */
    #pickbtn.on { background: #ffd66b; box-shadow: 0 0 0 2px #e0a92b, 0 4px 14px rgba(58,49,40,.3); }
    /* Destructive, and it is the only button on this screen that cannot be
       taken back by pressing it again — so it says so before it is pressed
       rather than after. The same red the fixture menu's own Remove square
       uses. */
    #delbtn { color: #a8442f; }

    /* ---- the camera, for a thumb ------------------------------------------
       Turning the view is `,` and `.`, and putting it back is walking anywhere
       (`recentre`). A phone has neither: the twist is a two-finger gesture on a
       surface where one thumb is doing everything, and "walk somewhere to get
       your camera back" is not a thing anybody works out. So the two controls
       that are only a convenience on a desktop are the whole of how you look
       around here.

       Under `#rotbtn` and mirroring undo/redo exactly — same 38px, same 33/79
       offsets, same edge-inset arithmetic (12 + (46 - 38) / 2) so all three
       columns line up on their own centre line. The right edge because turning
       the view and turning a fixture are the same *kind* of press and belong
       under one thumb, and because the left column is already three deep.

       Shown wherever the pill drives and NOT only in build mode, which is the
       one way these differ from every other button in this stack: looking round
       the shop is not a mode. The gap above them while `#rotbtn` is hidden is
       deliberate — a button that slid up the screen when you left build mode
       would be the moving control `#rotbtn`'s own comment is written against. */
    #viewbtn, #homebtn {
      width: 38px; height: 38px; border-radius: var(--r); border: 0;
      background: var(--panel-solid); color: var(--ink);
      box-shadow: 0 4px 14px rgba(58,49,40,.3);
      display: none; align-items: center; justify-content: center;
      pointer-events: auto; cursor: pointer; padding: 0; right: 16px;
      -webkit-tap-highlight-color: transparent;
    }
    #viewbtn { top: calc(50% + 33px); }
    #homebtn { top: calc(50% + 79px); }
    #viewbtn.show, #homebtn.show { display: flex; }
    #viewbtn svg, #homebtn svg { width: 20px; height: 20px; }
    #viewbtn:active, #homebtn:active { transform: scale(.94); background: #ffd66b; }

    /* ---- the marquee ------------------------------------------------------
       Dashed and barely filled, which is the one convention every editor shares
       and the reason it does not need a legend. `pointer-events: none` is
       load-bearing rather than tidy: the pointer is captured by the canvas for
       the whole drag, and a box under it that could take a hit would end the
       gesture the moment it grew past the cursor. */
    #marquee {
      /* THE ONE THING WEARING `.hud` THAT IS NOT CHROME, so it is the one thing
         that opts out of the size dial. This box is drawn at the pointer's own
         coordinates over the SHOP — `showMarquee` in client/main.js sets all
         four sides from `e.clientX/Y` — so it belongs in the viewport's space
         with the canvas it is dragged across. Zoomed, a drag round four shelves
         would draw a rectangle 15% of the way toward the top-left corner from
         wherever the mouse actually was, and the selection it made would be
         right the whole time, which is the worst way to be wrong. */
      zoom: 1;
      display: none; position: fixed; pointer-events: none;
      border: 1.5px dashed rgba(58,49,40,.75);
      background: rgba(217,155,31,.16);
      border-radius: var(--r);
    }
    #marquee.show { display: block; }

    /* ---- the crosshair ----------------------------------------------------
       Only ever up while the mouse has been taken away (`body.looking`, set by
       the Pointer Lock — see `grabLook` in client/main.js), and it is the whole
       reason that lock is safe: with no cursor, every press aims at the middle
       of the canvas, and a middle nobody can see is a shop answering presses at
       a spot the player never chose.

       A RING RATHER THAN CROSS HAIRS, and small. This is a shop, not a shooter
       — the thing the dot does is say which shelf a press would open, which is
       the job the hover ring already does out in the world, so it is drawn as
       the smallest possible member of that family rather than as a weapon
       sight. Two colours, dark over light: the aim sits over grass, cream
       flooring, a lit freezer and a black conveyor throat, and a single ink
       disappears into at least one of them.

       `pointer-events: none` is load-bearing rather than tidy. It sits exactly
       where every press lands. */
    #reticle {
      display: none;
      left: 50%; top: 50%; width: 7px; height: 7px; margin: -3.5px 0 0 -3.5px;
      border-radius: 50%; pointer-events: none;
      background: rgba(58,49,40,.85);
      box-shadow: 0 0 0 1.5px rgba(255,252,244,.75);
    }
    body.looking #reticle { display: block; }

    /* ---- the award card ---------------------------------------------------
       The one thing on screen that is allowed to look like a game rather than
       like a shop's paperwork. Everything else in this HUD is cream and quiet
       on purpose — it sits over the thing you are actually looking at — and an
       award drawn to those rules would read as another menu having opened. So:
       gold, a medal hanging off the top over a turning sunburst, and a pop on
       the way in.

       WHAT IT IS MADE OF IS THE HUD'S, AND WHAT IT SAYS IS ITS OWN, and holding
       those two apart is the whole of the pass this card was last through. It
       was the final thing in the game still built the way everything was before
       Crate — a 44px blurred cast, a white ring inset into the paper, a gold
       ramp ending on cream with no edge, and wash-black sides under its
       buttons — and none of that was the loudness. Loudness is the gold, the
       medal and the sunburst. The cast and the rim were just an app card
       underneath them, which is why this read as belonging to a different game
       than the menu that opens it. So it is drawn to the same four rules as
       `#panel`, `.menu-box` and `.tt-card`: a ranked contour as an OVERLAY, a
       flat face, creases inside, and a side you can push. The only marks it
       keeps that no other card has are the ones that mean "you won something".

       z-index 45 puts it over the tip (40) and under the front door (60): it
       covers everything in the shop, and the shop list is not in the shop.
       See client/award.js — the world is paused underneath it. */
    /* ---- the tutorial ------------------------------------------------------
       A veil that BLOCKS, a hole that does not, a ring round the hole and a
       robot beside it. See client/tutor.js for why the veil is four boxes
       rather than one with a hole cut in it.

       z-index 30 is over the whole HUD (10) and its notes (12) and under the
       tip (40) and the award (45). Both of those are right: an award is the
       shop congratulating you and outranks anything, and a tooltip belongs on
       top of the button it describes even when that button is the lit one. */
    #tutor { position: fixed; inset: 0; z-index: 30; pointer-events: none; }
    #tutor[hidden] { display: none; }

    /* The card's BUTTONS, and never the card — and never `#tutor`, which is a
       full-screen fixed box that would swallow every press aimed at the shop.
       The card is a pale slab over the shop and the camera is dragged across
       the shop, so anything live on it is a gesture that can end on it. There
       is nothing on the card to press but its buttons; the rest of it should be
       as transparent to the mouse as the air around it. */
    body.tutoring .tt-card { pointer-events: none; }
    body.tutoring .tt-card button { pointer-events: auto; }
    /* ...AND THE WORDS, ONCE THERE ARE MORE OF THEM THAN FIT.
       The wheel listener is on the canvas rather than on the window, so an
       event over a card that cannot be hit lands on the shop and zooms it: a
       long briefing page was a scroller nothing could reach, which reads as the
       card having cut its own sentence off. It is `.scrolls` and not a standing
       rule because the rule above is right the rest of the time — the card is a
       slab down the side of the shop, most of the tour asks you to press
       something in the shop, and 300px of dead ground on the right would be the
       whole of that. `fits` puts the class on only while the text overflows,
       which is the one state where anything on it is worth pointing at. */
    body.tutoring .tt-said.scrolls { pointer-events: auto; }

    /* A key, drawn as a key — see `keyed` in tutor.js. The same cap the tooltip
       wears over a rail button, at reading size rather than at 9.5px, because
       here it is a word in a sentence rather than a note in the corner of a
       card. `,` and `.` are the reason it exists: a full stop that is a button
       inside a sentence full of full stops is unreadable, and a cap is the one
       thing that says "this is a thing you press" without saying it. */
    .tt-key {
      display: inline-block; min-width: 1.15em; padding: 0 4px;
      border-radius: 4px; background: rgba(58, 49, 40, .1);
      box-shadow: inset 0 -1px 0 rgba(58, 49, 40, .18);
      font: inherit; font-weight: 800; font-size: .92em; text-align: center;
      /* The line box is the sentence's, or a cap in the middle of a paragraph
         pushes its own line apart and the whole hint goes ragged. */
      line-height: 1.35; vertical-align: baseline;
    }

    /* The hole's outline. It is drawn OUTSIDE the rect (a spread shadow rather
       than a border) so it never covers a pixel of the thing it is pointing at
       — a 3px border on a 40px rail button eats the badge in its corner. */
    /* GOLD, and not the green every other mark in the game uses.
       The tour's own colour was `--good`, which is right everywhere it is used
       to mean "this worked" and wrong here: this one is drawn OVER the HUD, on
       rail buttons and palette tiles that already sit on olive and cream, and a
       mid green ring on a green background is a ring you have to be told is
       there. `#ffd66b` is the shop's own armed gold — the lit tab, the rail
       button that is on, the press pill when it is live — so the tour points
       with the colour the HUD already means "here" with.
       The black is the half that makes it readable rather than just bright: a
       hairline of `--ink-line` INSIDE the gold, so the mark keeps its edge on
       cream, on olive and on a gold button that is already lit — which the
       green never had to cope with, having always been darker than what it sat
       on. */
    /* IT LANDS, rather than being there already. The mark is held back a beat
       after its target turns up (`markReady`) because a step opens the panel it
       is pointing into — so the ring and the twenty rows it is picking one of
       arrived on the same frame, which reads as one thing appearing and gives
       the eye nowhere to look first. The wait is in the script and the landing
       is here: the mark is `display: none` until then, so unhiding it plays
       this from the start. Two animations on different properties — the entry
       is opacity and scale, the loop is the shadow — so neither can tread on
       the other. */
    .tt-mark {
      position: absolute; pointer-events: none;
      box-shadow: 0 0 0 2px var(--ink-line), 0 0 0 5px #ffd66b, 0 0 0 11px rgba(255, 214, 107, .32);
      animation: ttmark-in .26s cubic-bezier(.2, .9, .3, 1) both,
        ttpulse 1.9s ease-in-out infinite;
    }
    @keyframes ttmark-in { from { opacity: 0; transform: scale(1.05); } }
    .tt-mark[hidden] { display: none; }
    .tt-ring { border-radius: var(--r); }
    /* ...and the same mark at button size, for a press INSIDE the hole. A hole
       the width of a panel says "work in here" and cannot say which of forty
       identical buttons is the one that finishes the step. It cuts nothing and
       blocks nothing — the veil is the hole's business, and the whole panel
       stays live — so this is a picture and only a picture. */
    .tt-pulse { border-radius: var(--r); }
    @keyframes ttpulse {
      0%, 100% {
        box-shadow: 0 0 0 2px var(--ink-line), 0 0 0 5px #ffd66b,
          0 0 0 10px rgba(255, 214, 107, .3);
      }
      50% {
        box-shadow: 0 0 0 2px var(--ink-line), 0 0 0 5px #ffd66b,
          0 0 0 17px rgba(255, 214, 107, 0);
      }
    }

    /* Something standing in the shop — a crate, a shelf, a tile — has no
       rectangle on the page, and it is marked IN THE SHOP rather than over it:
       `MARKER_LOOK.tutor`, a green frame on the tile with a chevron over it,
       which is the vocabulary every other marker in the game already speaks.
       There used to be a circle here, projected through `worldToScreen` every
       frame, and what was wrong with it is that it stayed a circle: everything
       else in the picture turns and foreshortens with the camera, so a
       fixed-size coin tracking a point perfectly still reads as unpinned. */

    /* Parked, and never pinned beside what it is pointing at.

       It used to be measured onto whichever side of the target had room, which
       is the right answer while a blackout means the card and the lit thing are
       the only two objects on screen. Without one it is a slab that moves every
       time the step does — over the panel you were reading, over the bar, over
       the shop — and a thing that jumps about is a thing you re-find rather
       than read. Out of the way on the right, same place every card, and the
       mark does the pointing. */
    /* PORTRAIT, AND A FIXED ONE.
       340 wide by whatever the sentence needed was a shape decided by the
       copy, so no two beats were the same card: the feet moved up and down the
       screen as the hint got longer, and Next — the one press on a read-only
       card — was never twice in the same place across thirteen of them. A card
       that is always the same size is a card you learn the shape of once.
       9:16 rather than merely tall, because the thing it competes with for the
       screen is the SHOP, and a column down one edge leaves the middle of the
       building clear where a wide slab lands across it. The height is bounded
       by the viewport so a short window shrinks the body rather than pushing
       the feet off the bottom — `.tt-said` is the part that gives.
       CRATE, at last: this was the final card in the HUD still wearing a 34px
       blurred cast and no contour, which is exactly the pair the chrome pass
       took out everywhere else. `--k1`/`--d1`, the card weight. */
    .tt-card {
      position: absolute; right: 16px; top: 50%; transform: translateY(-50%);
      width: min(300px, calc(100vw - 24px));
      height: min(533px, calc(100vh - 32px));
      display: flex; flex-direction: column;
      pointer-events: auto; overflow: hidden;
      background: var(--panel-solid); color: var(--ink);
      border-radius: var(--r);
      box-shadow: var(--cast), 0 var(--d1) 0 rgba(23, 18, 25, .28);
      animation: ttpop .22s cubic-bezier(.2, 1.4, .4, 1);
    }
    /* The contour as an overlay rather than an inset shadow on the card itself,
       for the reason every other card in here does it: the band and the feet
       have their own backgrounds, and a shadow on the box is painted under
       them. Same rule as `#panel::after`. */
    .tt-card::after {
      content: ''; position: absolute; inset: 0; z-index: 3;
      pointer-events: none; border-radius: inherit;
      box-shadow: inset 0 0 0 var(--k1) var(--ink-line);
    }
    @keyframes ttpop {
      from { opacity: 0; transform: translateY(calc(-50% + 8px)) scale(.96); }
    }

    /* THE TITLE BAR, and the gold is the same literal `#panel header` wears —
       the one the lit tab and the armed build slot wear too. Written out rather
       than tokenised because there is no token for it and inventing one here
       would be a second name for a colour three rules already share. */
    .tt-head {
      flex: 0 0 auto; display: flex; align-items: center; gap: 10px;
      padding: 9px 14px;
      background: linear-gradient(180deg, #fff8e6, #fff1cf);
      border-bottom: 2px solid var(--crease);
    }
    .tt-bot { flex: 0 0 auto; }
    .tt-face { width: 48px; height: 48px; display: block; }
    /* One crisp line round the whole machine, at the control weight — the same
       line a rail button and a palette tile wear. The eyes are OUTSIDE this
       group on purpose: they are the glow, and a glow with a black line round
       it is a sticker. */
    .tt-face .tt-ink { stroke: var(--ink-line); stroke-width: 2; stroke-linejoin: miter; }
    .tt-face .tt-bulb { fill: var(--good); animation: ttbulb 2.4s ease-in-out infinite; }
    @keyframes ttbulb { 0%, 100% { opacity: 1; } 50% { opacity: .35; } }
    /* `#5fe0d0` is the glow every hire in the game wears — see the `tint`
       colours in data/seed/workers.json. It was `#8fe3ff`, which is nothing's. */
    .tt-face .tt-eye { fill: #5fe0d0; animation: ttblink 5.2s infinite; transform-origin: center; }
    /* The blink is a scale on the eye rather than a lid drawn over it: there is
       no face behind these to reveal, so a lid would be a rectangle of body
       colour sliding over a screen. */
    @keyframes ttblink {
      0%, 92%, 100% { transform: scaleY(1); }
      95% { transform: scaleY(.08); }
    }
    .tt-face .tt-eye2 { animation-delay: .04s; }

    /* In the band it is a TITLE rather than a caption, so it takes the weight
       `#panel-title` has. It stays uppercase and tracked: these are one or two
       words naming a section of the tour, where a panel's title is the name of
       a thing, and set at title weight in sentence case they would read as the
       card's headline — which is the line underneath. */
    .tt-kicker {
      font-size: 12px; font-weight: 800; letter-spacing: .09em;
      text-transform: uppercase; color: var(--ink); min-width: 0;
    }
    /* THE PICTURE, on a lesson card. It is the piece's own palette art — same
       model, same camera, same sun — stood in a well, because art with no
       ground under it reads as a sticker rather than as a thing in a shop.
       That is the same well `.shape .ico.art` gives the build bar's shape card,
       said at the size a portrait card has room for.

       It is what the empty half of the card is FOR. A briefing has no target
       lit in the shop and asks for no press, so the fixed height would
       otherwise be a column of blank paper under three lines of type — and a
       lesson about a machine you have never seen wants a picture of it more
       than it wants any of the words. */
    .tt-art {
      flex: 0 0 auto; margin: 14px 16px 0; height: 168px;
      display: grid; place-items: center; padding: 10px;
      border-radius: var(--r);
      background: radial-gradient(120% 100% at 50% 18%, rgba(255, 255, 255, .9), rgba(58, 49, 40, .07));
      box-shadow: inset 0 0 0 var(--k3) var(--ink-soft);
    }
    .tt-art[hidden] { display: none; }
    /* The DIRECT child only. A diagram can have an SVG inside it — the view
       card nests the press pill's own mouse glyph on its arc — and a descendant
       rule would blow that one up to fill the well. */
    .tt-art > svg { width: 100%; height: 100%; display: block; }
    /* ---- a diagram, as opposed to a piece's portrait ------------------------
       The one card in either tour whose subject is a GESTURE rather than a thing
       standing in the shop, so it is drawn here rather than taken from a catalog
       row. See `dragArt` in client/tutor.js for the whole argument; these are
       just the three inks it is drawn with — the shop's boxes, the green that
       every mark in the tour is already using, and the pill's mouse borrowed
       whole. */
    .tt-diagram { color: var(--ink-line); }
    .tt-diagram .tt-ink { stroke: var(--ink-line); stroke-width: 2; stroke-linejoin: miter; }
    /* The welcome card's shopfront: the drag diagram's own building, alone in
       the well. Same drawing, four times the size, so the ink comes down with
       it — see `helloArt`. */
    .tt-diagram.tt-shopfront .tt-ink { stroke-width: .9; }
    .tt-diagram .tt-go { stroke: var(--good); stroke-width: 3.5; fill: none; }
    .tt-diagram .tt-head { fill: var(--good); stroke: none; }
    /* The glyph is authored for the pill, where it is a faint outline on a dark
       slab. On paper it is the thing being pointed at, so it comes up to full
       strength and takes a fill — the arc runs underneath it, and a transparent
       body would have the line drawn straight through the mouse. CSS rather than
       a second glyph: a presentation attribute is the weakest thing there is, so
       `fill="none"` and `opacity=".55"` both give way here without ui.js having
       to know this card exists. */
    .tt-diagram .pr-mouse rect { fill: var(--panel-solid); opacity: 1; }
    .tt-diagram .pr-mouse path { opacity: 1; }
    /* Reduced motion is NOT handled here, and that is worth a line: the sweep is
       SMIL rather than CSS, which a media query cannot switch off — `display:
       none` on an `animateMotion` is not specified to stop it. The art is built
       without the animation instead. See `stillArt` in client/tutor.js. */
    /* A page about a piece the ladder has not handed over yet. The well goes
       flat and the picture steps back — enough to read as "not yours yet" at a
       glance, nowhere near enough to stop being a picture of the thing, because
       the whole reason the page is in the briefing is so you know what is
       coming. Never `filter: grayscale`: the pieces are told apart by colour as
       much as by shape, so a grey sorter and a grey packer are one drawing. */
    .tt-art.soon { background: rgba(58, 49, 40, .05); }
    .tt-art.soon svg { opacity: .42; }
    /* ---- a picture of a CONTROL --------------------------------------------
       "Open the crew strip" is an instruction to press a button, and the well
