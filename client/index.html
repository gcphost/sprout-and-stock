<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <title>Sprout &amp; Stock</title>
  <style>
    :root {
      --ink: #3a3128;
      --panel: rgba(255, 252, 245, 0.94);
      /* The same colour at full alpha. Anything that pins itself over scrolling
         content needs this rather than --panel: 94% over 94% is still see-
         through, and rows sliding under a "solid" header read as a fault. */
      --panel-solid: #fffcf5;
      --line: rgba(58, 49, 40, 0.14);
      --accent: #e2564a;
      --good: #5aa356;
      /* The step between "fine" and "you have a problem" — a gauge that only
         had the two would jump straight from green to alarm with no warning. */
      --warn: #e0a63c;
      /* ---- the bottom stack -------------------------------------------------
         Everything you press lives in one column at the bottom centre now, so
         its offsets are arithmetic off two numbers rather than a scattering of
         literals that have to be kept in step by hand. Bottom up: the nav, then
         the bar (`--build-h`, measured, 0 when no bar is up), then the panel. */
      --nav-h: 40px;
      --nav-bot: 14px;
      --nav-top: calc(var(--nav-bot) + var(--nav-h) + 8px);
      --build-h: 0px;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; overflow: hidden; }
    body {
      font: 14px/1.45 ui-rounded, "SF Pro Rounded", "Nunito", system-ui, sans-serif;
      color: var(--ink);
      background: #cfe9f5;
      -webkit-font-smoothing: antialiased;
      user-select: none;
    }
    /*
     * `touch-action: none` is not a nicety — without it the browser claims
     * every touch gesture on the canvas as a scroll or a page zoom, and takes
     * it by firing `pointercancel` a couple of events into the drag. Measured:
     * a two-finger twist arrived as 2 pointerdowns, 2 pointermoves and 2
     * pointercancels, so panning, pinch-zoom and the twist all did nothing at
     * all on a touchscreen while working perfectly under a mouse.
     *
     * `-webkit-touch-callout` is the same problem wearing iOS clothes: the
     * long press that opens a fixture's menu is also the press Safari uses to
     * offer its own callout over the element.
     */
    #game {
      display: block; width: 100vw; height: 100vh;
      touch-action: none;
      overscroll-behavior: none;
      -webkit-touch-callout: none;
    }

    #boot {
      position: fixed; inset: 0; display: grid; place-items: center;
      background: #cfe9f5; font-size: 18px; font-weight: 600; z-index: 50;
    }

    /* ---- the front door ---------------------------------------------------
       Pick a shop, or start one. Sits above #boot rather than inside the HUD:
       there is no world behind it yet, so none of the panel system's rules
       about floating over a live canvas apply. See client/menu.js. */
    #menu {
      position: fixed; inset: 0; z-index: 60; overflow-y: auto;
      background: #cfe9f5; display: grid; place-items: center; padding: 24px 16px;
    }
    #menu[hidden] { display: none; }
    .menu-box { width: min(440px, 100%); }
    .menu-box h1 {
      margin: 0; font-size: 30px; font-weight: 800; letter-spacing: -.02em; text-align: center;
    }
    .menu-box h1 span { color: var(--accent); }
    .menu-tag { margin: 2px 0 18px; text-align: center; opacity: .55; font-size: 12.5px; }

    .menu-field {
      display: flex; align-items: center; gap: 10px; background: var(--panel);
      border-radius: 12px; padding: 7px 12px; margin-bottom: 10px;
      box-shadow: 0 3px 12px rgba(58,49,40,.1);
    }
    .menu-field span { font-size: 11px; font-weight: 800; opacity: .5; text-transform: uppercase; letter-spacing: .04em; }
    .menu-field input {
      flex: 1; min-width: 0; border: 0; background: none; outline: 0; font: inherit;
      font-size: 14px; font-weight: 700; color: var(--ink);
    }

    /* Three small numbers side by side, because stacked they read as three
       decisions to make rather than one row to skip. `min-width: 0` on the
       field or a number input's intrinsic width shoves the row wider than the
       card. The spinners go: they are unhittable at this size and the field is
       already clamped at both ends by the server. */
    .menu-row { display: flex; gap: 8px; }
    .menu-row .menu-field { flex: 1; min-width: 0; gap: 6px; padding: 7px 10px; }
    .menu-row .menu-field span { flex: none; }
    .menu-row input { width: 100%; }
    .menu-row input::-webkit-outer-spin-button,
    .menu-row input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
    .menu-row input[type=number] { -moz-appearance: textfield; appearance: textfield; }

    .menu-list { display: flex; flex-direction: column; gap: 8px; margin: 14px 0 10px; }
    .menu-empty, .menu-note {
      font-size: 12px; opacity: .55; text-align: center; padding: 14px 4px; line-height: 1.45;
    }
    .menu-note { text-align: left; padding: 2px 2px 8px; }
    .menu-err {
      background: var(--accent); color: #fff; border-radius: 10px;
      padding: 7px 12px; font-size: 12.5px; font-weight: 700; margin-bottom: 6px;
    }
    /* "The shop in your link is gone" is news, not a failure — you are already
       looking at the list that answers it. */
    .menu-err.soft { background: #ffd66b; color: var(--ink); }

    .wcard {
      background: var(--panel); border-radius: 15px; padding: 11px 13px 10px;
      box-shadow: 0 4px 16px rgba(58,49,40,.13);
    }
    /* The shop you were in last, so a family of four save slots opens on yours. */
    .wcard.last { box-shadow: 0 4px 16px rgba(58,49,40,.13), inset 0 0 0 2px #ffd66b; }
    .wtop { display: flex; align-items: baseline; gap: 8px; }
    .wname { font-size: 16px; font-weight: 800; flex: 1; min-width: 0;
             overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .wlive {
      flex: none; background: #d8f0d2; color: #3f7a3c; border-radius: 99px;
      padding: 1px 8px; font-size: 10px; font-weight: 800;
    }
    .wstats { display: flex; gap: 9px; align-items: baseline; margin-top: 2px; font-size: 13px; }
    .wstats b { font-weight: 800; }
    .wstats span { opacity: .6; font-weight: 600; text-transform: capitalize; }
    .wsub { font-size: 10.5px; opacity: .5; margin-top: 1px; font-weight: 600; }

    /* Armed to delete. The card itself changes, not just the button, because a
       list of five cards is scanned by shape — a single word swapped inside one
       of three buttons is exactly the thing a mis-click already wasn't reading. */
    .wcard.arm { box-shadow: 0 4px 16px rgba(58,49,40,.13), inset 0 0 0 2px var(--accent); }
    .wwarn {
      margin-top: 7px; font-size: 11px; line-height: 1.4; font-weight: 700;
      color: var(--accent);
    }

    .wacts { display: flex; gap: 6px; margin-top: 9px; }
    .wacts button {
      border: 0; font: inherit; cursor: pointer; border-radius: 9px;
      padding: 6px 14px; font-size: 12.5px; font-weight: 800;
    }
    .wplay { background: var(--good); color: #fff; flex: 1; }
    .wghost { background: rgba(58,49,40,.08); color: var(--ink); }
    .wghost:hover { background: rgba(58,49,40,.16); }
    .wdel:hover { background: var(--accent); color: #fff; }
    .wdel.armed { background: var(--accent); color: #fff; }

    .menu-add {
      width: 100%; border: 0; font: inherit; cursor: pointer; border-radius: 12px;
      padding: 10px; font-size: 13px; font-weight: 800; color: var(--ink);
      background: rgba(255,252,245,.6); box-shadow: inset 0 0 0 2px rgba(58,49,40,.12);
    }
    .menu-add:hover { background: var(--panel); }
    .menu-new { background: var(--panel); border-radius: 15px; padding: 11px 13px;
                box-shadow: 0 4px 16px rgba(58,49,40,.13); }
    .menu-new .menu-field { background: rgba(58,49,40,.06); box-shadow: none; }
    .menu-foot { text-align: center; font-size: 11px; opacity: .5; margin: 12px 0 0; }

    .hud { position: fixed; z-index: 10; }

    /* Icons are inline SVG sized in em, so every font-size rule that used to
       size an emoji still sizes the icon. `display:block` because an inline
       SVG sits on the text baseline and drags a gap under every button. */
    .ico > svg, .bico > svg, #panel-title > svg, #panel-close > svg { display: block; margin: 0 auto; }

    /* ---- top left: the passive readouts, stacked --------------------------
       One fixed column rather than two independently-pinned panels. #mods used
       to carry `top: 58px`, which is the height #stats happened to be on the
       day it was written — adding a row to the gauges slid the money panel
       down over the demand meter. Nothing up here has a fixed height, so
       nothing up here gets to hardcode where the next thing starts. */
    #topleft {
      top: 12px; left: 12px;
      display: flex; flex-direction: column; align-items: flex-start; gap: 8px;
    }
    /* top-left: money + day */
    #stats {
      background: var(--panel); border-radius: 13px;
      padding: 6px 11px; box-shadow: 0 4px 14px rgba(58,49,40,.14);
      display: flex; gap: 11px; align-items: center;
    }

    /* ---- top centre: what to do about it ---------------------------------
       A single line, sized to clear the stats panel on the left and the rail on
       the right. A stack cost vertical space in the middle of the screen, which
       is the one place the game is actually happening. */
    #hq {
      top: 12px; left: 50%; transform: translateX(-50%);
      display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
      justify-content: center; pointer-events: none;
      max-width: min(860px, calc(100vw - 360px));
    }
    #cash { font-size: 17px; font-weight: 800; letter-spacing: -.02em; }
    #day  { font-weight: 700; font-size: 12px; line-height: 1.25; }
    #season { text-transform: capitalize; opacity: .65; font-size: 10px; line-height: 1.25; }
    #clock { font-variant-numeric: tabular-nums; font-weight: 700; font-size: 13px; }
    #clock.shut { opacity: .4; text-decoration: line-through; }
    /* ---- the three gauges -------------------------------------------------
       Reputation is the shop's long memory, mood is how the room feels right
       now, and full is whether there is room for anybody else. One was an
       unlabelled 52px sliver, which is fine when it is the only bar on screen
       and unreadable the moment there are three — so they get names.

       All three fill rightwards and all three are read the same way: **a long
       bar is the shop doing well.** That is why FULL is drawn against the
       turn-away line rather than against capacity. A bar that filled as the
       shop got busier would mean "good" at one end of the panel and "bad" at
       the other, and the eye does not re-read a direction per row. */
    .gauges { display: grid; gap: 3px; }
    .gg { display: grid; grid-template-columns: 26px 52px; align-items: center; gap: 6px; }
    .gg-tag {
      font-size: 7.5px; font-weight: 800; letter-spacing: .04em;
      text-transform: uppercase; opacity: .5; text-align: right;
    }
    .repwrap { width: 52px; height: 5px; background: var(--line); border-radius: 99px; overflow: hidden; }
    .repwrap > div { height: 100%; background: var(--good); transition: width .4s, background .4s; }
    /* Past the line the shop is refusing people, which is not a shade of busy —
       it is a different thing happening, so it stops being a bar and pulses. */
    #full.shut { animation: fullpulse 1.1s ease-in-out infinite; }
    @keyframes fullpulse { 50% { opacity: .35; } }

    /* ---- top left, under the money: the demand meter ----------------------
       What the world wants more or less of today, as a meter the way SimCity's
       RCI is a meter rather than one sentence per tag. Seven pills reading
       "▲ bakery ×2.4" is a paragraph you parse word by word; seven bars off one
       shared axis is a shape you take in without reading.

       It stacks under #stats because it is a passive readout and belongs with
       the other passive readouts, and because a column can carry its labels
       inline — a row of columns has to write each tag sideways-on under a
       narrow bar, and "beverage" does not fit under nine pixels. Right is
       wanted, left is not, length is how much. */
    #mods {
      width: 146px;
      display: flex; flex-direction: column; gap: 3px;
      background: var(--panel); border-radius: 13px; padding: 7px 10px;
      box-shadow: 0 4px 14px rgba(58,49,40,.14);
    }
    .mtr { display: grid; grid-template-columns: 1fr 56px; align-items: center; gap: 7px; }
    .mtr-tag {
      font-size: 8.5px; font-weight: 800; letter-spacing: .02em;
      text-transform: uppercase; opacity: .55; text-align: right;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    /* A fixed plot with the zero line down its middle, so every bar is measured
       against the same axis instead of against its own. Each row draws its own
       segment; stacked, they form one continuous line. */
    .mtr-plot { position: relative; height: 7px; }
    .mtr-plot::after {
      content: ''; position: absolute; left: 50%; top: -3px; bottom: -3px;
      width: 1px; background: rgba(58,49,40,.16);
    }
    .mtr-bar { position: absolute; top: 0; bottom: 0; border-radius: 2px; }
    .mtr.up .mtr-bar { left: 50%; background: var(--good); }
    .mtr.down .mtr-bar { right: 50%; background: var(--accent); }

    /* What to actually do about all of the above. Derived entirely from the
       same snapshot — no new server field — and capped at three, because a
       to-do list you can't finish is wallpaper rather than a prompt. */
    #todo { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; }
    #todo:empty, #mods:empty { display: none; }
    .todo {
      background: var(--panel); border-radius: 99px; padding: 2px 9px 2px 7px;
      font-size: 11.5px; font-weight: 600; color: var(--ink);
      box-shadow: 0 2px 7px rgba(58,49,40,.11);
      display: inline-flex; align-items: center; gap: 5px;
    }
    .todo svg { width: 12px; height: 12px; opacity: .7; flex: none; }
    .todo b { font-weight: 800; }
    /* The one that is costing you money right now, rather than merely pending. */
    .todo.hot { background: #ffd66b; box-shadow: 0 2px 9px rgba(200,150,20,.32); }
    .todo.hot svg { opacity: .9; }

    /* The nav: one icon per menu, along the bottom centre. The only thing on
       screen that says the game has menus at all — before it, three unrelated
       letter keys were the entire discovery story.

       It ran down the top-right corner until the build palette moved to the
       bottom. With the thing you press most at the bottom centre and the way
       into every menu diagonally opposite it, every session was a stream of
       corner-to-corner mouse journeys. Now the nav, the bar above it and the
       panel above that are one column under the pointer. */
    #rail {
      bottom: var(--nav-bot); left: 50%; transform: translateX(-50%);
      display: flex; gap: 6px; max-width: calc(100vw - 16px); flex-wrap: wrap;
      justify-content: center;
    }
    .rail-btn {
      position: relative; width: 40px; height: 40px; border: 0; cursor: pointer;
      background: var(--panel); border-radius: 12px; color: var(--ink);
      box-shadow: 0 4px 14px rgba(58,49,40,.15); display: grid; place-items: center;
      font: inherit; transition: background .12s, transform .12s;
    }
    .rail-btn:hover { transform: translateY(-2px); }
    /* Lit means "this menu is open" — except on Build, which is a mode rather
       than a menu, where it means the world is in it. */
    .rail-btn.on { background: #ffd66b; }
    .rail-btn .ico { font-size: 18px; line-height: 1; }
    .rail-btn .kb { position: absolute; bottom: 2px; right: 5px; font-size: 8px; font-weight: 800; opacity: .35; }
    .rail-btn .badge {
      position: absolute; top: -4px; right: -4px; min-width: 16px; height: 16px; padding: 0 4px;
      border-radius: 99px; background: var(--accent); color: #fff;
      font-size: 10px; font-weight: 800; display: grid; place-items: center;
      box-shadow: 0 2px 6px rgba(58,49,40,.25);
    }
    .rail-btn .badge[hidden] { display: none; }

    /* The drag joystick draws nothing — see client/main.js. */

    /* bottom-left: event log */
    #log { left: 12px; max-width: 300px; display: flex; flex-direction: column; gap: 3px; }
    #log div {
      background: var(--panel); border-radius: 9px; padding: 3px 9px;
      font-size: 11.5px; line-height: 1.35; box-shadow: 0 2px 7px rgba(58,49,40,.09);
      transition: opacity .3s, transform .3s;
    }
    #log div.out { opacity: 0; transform: translateX(-8px); }
    #carry { right: 12px; font-weight: 700; background: var(--panel);
             border-radius: 9px; padding: 3px 9px; font-size: 11.5px;
             box-shadow: 0 2px 7px rgba(58,49,40,.09); }
    #carry:empty { display: none; }

    /* "Harvesting…" — what standing here is about to do. Sits low and centre,
       near where your hand already is, and vanishes the moment nothing is in
       range. */
    #prompt {
      left: 50%; transform: translate(-50%, 8px); opacity: 0;
      background: rgba(58,49,40,.86); color: #fff; padding: 7px 16px;
      border-radius: 99px; font-size: 14px; font-weight: 600;
      pointer-events: none; transition: opacity .14s, transform .14s;
      white-space: nowrap;
    }
    #prompt.show { opacity: 1; transform: translate(-50%, 0); }
    #prompt.going { background: #ffd66b; color: var(--ink); }
    #prompt b { font-weight: 800; }

    /* toast */
    /* Just below #hq's single strip. */
    #toast {
      top: 66px; left: 50%; transform: translate(-50%, -12px); opacity: 0;
      background: var(--ink); color: #fff; padding: 6px 14px; border-radius: 99px;
      font-size: 12.5px; font-weight: 700; pointer-events: none; transition: .25s;
    }
    #toast.show { opacity: 1; transform: translate(-50%, 0); }
    #toast.bad { background: var(--accent); }

    /* The panel is what the nav expands into: it rises out of the button you
       pressed, above whatever bar is up, and is the top of the same column. */
    #panel {
      bottom: calc(var(--nav-top) + var(--build-h) + 8px);
      left: 50%; transform: translateX(-50%);
      /* Wider than it was, and it can afford to be: 214px was the width of a
         strip pinned against the right rail, and at that width a worker's
         read-out wrapped every line — "looking for something to do" over two,
         "New behind the counter" over two — so the head ate the room the job
         list needed. Wider costs horizontal space nothing else is using and
         buys back four rows of vertical.

         The height is the real space above the stack rather than a flat vh, so
         a taller bar shortens the panel instead of pushing it off the top. */
      width: min(340px, calc(100vw - 24px));
      max-height: min(72vh, calc(100vh - var(--nav-top) - var(--build-h) - 20px));
      background: var(--panel);
      border-radius: 18px; box-shadow: 0 10px 34px rgba(58,49,40,.22);
      display: none; flex-direction: column; overflow: hidden;
    }
    #panel.show { display: flex; }
    /* The header is also the grab handle: drag to move the panel, double-click
       to give it back to the stylesheet. `touch-action` because without it a
       drag on a touchscreen is a scroll gesture before it is ever a drag. */
    #panel header {
      display: flex; justify-content: space-between; align-items: center;
      padding: 7px 10px; border-bottom: 1px solid var(--line); font-weight: 800;
      cursor: move; touch-action: none;
    }
    #panel-title { display: flex; align-items: center; gap: 7px; font-size: 12.5px; }
    #panel-close {
      border: 0; background: none; font: inherit; cursor: pointer; font-size: 15px;
      color: var(--ink); opacity: .5; padding: 0;
    }
    #panel-close:hover { opacity: 1; }
    /* The scroller. Its padding is named because the sticky head and foot below
       have to cancel it exactly — a sticky `top: 0` pins to the padding edge, so
       without that the rows scroll through a sliver of gap above the pinned
       block and it reads as a rendering fault. */
    #panel-body { --panel-pad: 3px; overflow-y: auto; padding: var(--panel-pad); }

    /* Search and tag chips. A comprehensive catalogue you cannot search is
       what mods get written to fix, and ours grows live while you play. */
    #panel-filter { padding: 5px 7px; border-bottom: 1px solid var(--line); }
    #panel-filter[hidden] { display: none; }
    #panel-searchwrap {
      display: flex; align-items: center; gap: 7px; padding: 0 9px;
      background: rgba(58,49,40,.06); border-radius: 9px;
    }
    #panel-searchwrap:focus-within { outline: 2px solid #ffd66b; }
    #panel-searchwrap .ico { font-size: 13px; opacity: .4; }
    #panel-search {
      flex: 1; border: 0; background: none; color: var(--ink); outline: 0;
      padding: 5px 0; font: inherit; font-size: 12px; font-weight: 600; min-width: 0;
    }
    /* The tag chips that used to sit here listed every tag on screen — thirty
       above eighteen items — to do what typing in the box already does. */
    /* Icon tabs at the top of a menu that declared groups. Sticky, because the
       body is what scrolls — tabs that scrolled away would leave you in a list
       with no way back to the one you wanted. Icon-only: the panel is 214px and
       four labelled tabs would each get nine characters. */
    .tabs {
      position: sticky; top: 0; z-index: 2; display: flex; gap: 3px;
      padding: 2px 0 6px; margin-bottom: 4px;
      background: var(--panel-solid); border-bottom: 1px solid var(--line);
    }
    .tab {
      flex: 1; display: grid; place-items: center; padding: 5px 0;
      border: 0; border-radius: 8px; background: transparent;
      color: var(--ink); opacity: .4; font-size: 13px; cursor: pointer;
      transition: opacity .1s, background .1s;
    }
    .tab:hover { opacity: .8; background: rgba(58,49,40,.06); }
    .tab.on { opacity: 1; background: #ffd66b; }
    .tab svg { display: block; }

    .row { display: flex; align-items: center; gap: 7px; padding: 4px 7px; border-radius: 9px; }
    .row:hover { background: rgba(58,49,40,.05); }
    .row.owned { opacity: .5; }
    /* The title stays on one line — it's short, and a wrapping bold heading
       reads as two rows. The description wraps but is clamped at two lines, so
       a menu fed from a live database still can't grow taller than the screen;
       anything past that is on the hover title. */
    .row .name {
      flex: 1; min-width: 0; font-size: 12px; font-weight: 700;
      display: flex; flex-direction: column;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .row .tags {
      font-weight: 500; font-size: 10.5px; line-height: 1.3; opacity: .55;
      white-space: normal; overflow: hidden;
      display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2;
    }
    /* What the world wants of this one item today, folded down from whichever
       of its tags an event is currently pushing around. Sits on the name line
       rather than with the tags, because it is news rather than description. */
    .row .heat {
      display: inline-block; margin-left: 6px; padding: 0 5px; border-radius: 99px;
      font-size: 9.5px; font-weight: 800; letter-spacing: .01em; vertical-align: 1px;
      font-variant-numeric: tabular-nums;
    }
    .row .heat.up { background: #d8f0d2; color: #3f7a3c; }
    .row .heat.down { background: #f6dcd7; color: #a8442f; }
    /* The key hint never shrinks and never wraps — it's the shortest thing in
       the row and the whole reason the row is there, so the name gives way. */
    .row .price {
      font-weight: 700; font-variant-numeric: tabular-nums;
      flex: none; white-space: nowrap; font-size: 11px; opacity: .85;
    }
    .row button {
      border: 0; background: var(--good); color: #fff; border-radius: 8px;
      padding: 3px 9px; font: inherit; font-size: 11px; font-weight: 700; cursor: pointer; flex: none;
    }
    .row .have { font-size: 10.5px; opacity: .6; }

    /* Section rows. Where the whole row is the button — picking a thing to
       build, picking a seed — the row is clickable and says so. */
    .sec-row { align-items: flex-start; }
    .sec-row.clickable { cursor: pointer; }
    .sec-row.picked { background: #fff3d0; box-shadow: inset 0 0 0 2px #ffd66b; }
    .sec-row .bico { font-size: 14px; line-height: 1.2; width: 19px; text-align: center; }
    .sec-row .name { gap: 2px; }
    .sec-row .tags { line-height: 1.35; }
    /* Icon over price, one narrow column. */
    .lead { display: flex; flex-direction: column; align-items: center; gap: 1px; width: 26px; flex: none; }
    .lead .cost { font-size: 9px; font-weight: 700; opacity: .6; font-variant-numeric: tabular-nums; }
    .sep {
      font-size: 9px; font-weight: 800; text-transform: uppercase; letter-spacing: .06em;
      opacity: .45; padding: 6px 7px 2px; border-top: 1px solid var(--line); margin-top: 4px;
    }
    .foot { font-size: 10px; opacity: .55; padding: 6px 7px; line-height: 1.35; }

    /* ---- a menu with more rows than fit ----------------------------------
       What the thing IS stays at the top, what you can DO stays at the bottom,
       and the list between them scrolls. Sticky rather than a three-pane flex
       rebuild of #panel-body, because `.tabs` already pins itself this way and
       #panel-body is already the scroller — one mechanism, not two.

       The background has to be opaque or the rows scroll visibly *through* the
       pinned parts; --panel is the same colour the panel is already painted. */
    .pnl-head, .pnl-foot { position: sticky; z-index: 2; background: var(--panel-solid); }
    .pnl-head {
      top: calc(-1 * var(--panel-pad)); padding-top: var(--panel-pad);
      border-bottom: 1px solid var(--line);
    }
    .pnl-foot {
      bottom: calc(-1 * var(--panel-pad)); padding-bottom: var(--panel-pad);
      border-top: 1px solid var(--line);
    }
    /* Its own border is the divider; the heading's would double it. */
    .pnl-foot .sep { border-top: 0; margin-top: 0; }

    /* The verbs, as one row of squares rather than five labelled lines.
       Deliberately the mirror of `.tabs` at the other end of the panel: the
       same trade, the same size, the same reason — 214px does not have room
       for five words AND the list they act on. Tabs choose what you are
       looking at, these do something to it, and having them read as a matched
       pair top and bottom is worth more than either being prettier alone. */
    .fx-verbs { display: flex; gap: 3px; padding: 4px 0 2px; }
    .fx-verb {
      flex: 1; position: relative; display: grid; place-items: center;
      padding: 7px 0; border: 0; border-radius: 8px; background: transparent;
      color: var(--ink); opacity: .55; font-size: 13px; cursor: pointer;
      transition: opacity .1s, background .1s;
    }
    .fx-verb:hover { opacity: 1; background: rgba(58,49,40,.07); }
    .fx-verb.danger:hover { background: rgba(190,60,45,.12); color: var(--accent); }
    /* Refused, not missing. It keeps its place in the row so the four you can
       press never shuffle sideways under your thumb, and `disabled` is what
       stops the press — greying without it is a button that lies. */
    .fx-verb.off { opacity: .25; cursor: default; }
    .fx-verb.off:hover { background: transparent; }
    .fx-verb svg { display: block; }
    /* The price or the count — the two things an icon cannot say. Same corner
       and same treatment the build bar's `.have` badge uses. */
    .fx-verb .have {
      position: absolute; top: 1px; right: 3px;
      font-size: 9.5px; font-weight: 700; line-height: 1;
      color: var(--good); opacity: .95; pointer-events: none;
    }

    /* One fixture's own menu. The read-out at the top says what this thing is
       doing right now; the rows below are what you can do about it. */
    .fx-detail { padding: 4px 8px 5px; }
    /* Tight on purpose: this block is pinned, so every pixel it takes is one
       the scrolling list below it does not get. */
    .fx-line { display: flex; justify-content: space-between; gap: 12px; padding: 1px 0; font-size: 11.5px; }
    .fx-line span { opacity: .55; font-weight: 600; }
    .fx-line b { font-weight: 800; text-align: right; }
    /* One recipe and what it wants. Ingredients are counted against the hopper,
       so the row that isn't green is the reason the machine is standing idle. */
    .fx-recipe { border-top: 1px solid var(--line); margin-top: 5px; padding-top: 4px; }
    .fx-recipe-h { display: flex; justify-content: space-between; gap: 12px; font-size: 11.5px; padding: 1px 0 2px; }
    .fx-recipe-h span { font-weight: 800; }
    .fx-recipe-h b { font-weight: 700; opacity: .45; }
    .fx-ing { display: flex; justify-content: space-between; gap: 12px; padding: 1px 0 1px 10px; font-size: 11px; }
    .fx-ing span { opacity: .55; font-weight: 600; }
    .fx-ing b { font-weight: 800; font-variant-numeric: tabular-nums; color: #c8553d; }
    .fx-ing.ok b { color: #4e9a4e; }
    .fx-price { display: flex; align-items: center; gap: 7px; padding: 5px 0 0; font-size: 11.5px; }
    .fx-price span { opacity: .55; font-weight: 600; flex: 1; }
    .fx-price b { font-weight: 800; min-width: 58px; text-align: center; font-variant-numeric: tabular-nums; }
    .fx-price button {
      border: 0; background: rgba(58,49,40,.09); color: var(--ink); border-radius: 8px;
      width: 30px; height: 26px; font: inherit; font-weight: 800; cursor: pointer;
    }
    .fx-price button:hover { background: rgba(58,49,40,.18); }
    .fx-act { cursor: pointer; align-items: flex-start; }
    .fx-act:hover { background: rgba(58,49,40,.07); }
    .fx-act .bico { font-size: 14px; line-height: 1.2; width: 18px; text-align: center; }
    .fx-act .name { gap: 2px; }
    .fx-act .tags { line-height: 1.35; }
    .fx-act .price { color: var(--good); }
    .fx-act.danger .price { color: var(--accent); }
    /* Greyed out rather than hidden: "you need at least one till" is the whole
       answer to why the button isn't there, and hiding it never says so. */
    .fx-act.off { cursor: default; opacity: .42; }
    .fx-act.off:hover { background: none; }

    /* One hire's own menu: the dial on each job row saying how much of their
       day it gets. It borrows the fixture price control wholesale — same
       buttons, same tabular value — and only shrinks it, because a weight is
       one digit where a price is five. */
    .wk-w { flex: none; gap: 4px; padding: 0; }
    .wk-w b { min-width: 16px; font-size: 11px; }
    .wk-w button { width: 24px; height: 24px; }
    .wk-job .name { padding: 2px 0; }

    /* How much is left in the tank. The bar sits behind the word rather than
       beside it, because the row is already two columns wide and a third one
       would push the label onto its own line. */
    .wk-energy {
       position: relative; display: inline-block; padding: 1px 7px;
       border-radius: 99px; overflow: hidden; font-size: 11px;
    }
    .wk-energy i {
      position: absolute; inset: 0 auto 0 0; background: rgba(90,163,86,.28);
    }
    .wk-energy.low i { background: rgba(226,86,74,.3); }
    /* The build bar. Hidden entirely unless you're building — the shop floor is
       the game, and a permanent toolbar would make it look like a level editor.

       Two tiers, because the palette is a database anyone can add to: tabs for
       what sort of thing, then that tab's entries in a strip that scrolls
       sideways. A flat row could only show its first nine, which is why there
       used to be a second copy of this palette in a panel. */
    #build {
      bottom: var(--nav-top); left: 50%; transform: translate(-50%, 26px); opacity: 0;
      display: flex; flex-direction: column; align-items: center; gap: 6px;
      pointer-events: none; transition: .18s;
    }
    #build.on { opacity: 1; transform: translate(-50%, 0); pointer-events: auto; }
    #build-bar {
      display: flex; flex-direction: column; gap: 5px;
      background: var(--panel); border-radius: 16px; padding: 6px;
      box-shadow: 0 8px 26px rgba(58,49,40,.24);
      max-width: min(960px, calc(100vw - 28px));
    }

    /* Tier one: what sort of thing. */
    #build-groups {
      display: flex; gap: 3px; padding-bottom: 5px; border-bottom: 1px solid var(--line);
    }
    .cat {
      flex: 1; display: flex; align-items: center; justify-content: center; gap: 5px;
      border: 0; border-radius: 10px; background: transparent; cursor: pointer;
      font: inherit; color: var(--ink); opacity: .5; padding: 5px 10px;
      white-space: nowrap; transition: opacity .1s, background .1s;
    }
    .cat:hover { opacity: .85; background: rgba(58,49,40,.06); }
    .cat.on { opacity: 1; background: rgba(58,49,40,.1); }
    .cat .ico { font-size: 15px; line-height: 1; }
    .cat .nm { font-size: 11.5px; font-weight: 800; }

    /* Tier two: that tab's entries. Scrolls rather than wraps, so the bar keeps
       one row's height however much anybody authors. */
    #build-tools {
      display: flex; gap: 6px; overflow-x: auto; overflow-y: hidden;
      scrollbar-width: thin; scrollbar-color: rgba(58,49,40,.25) transparent;
    }
    #build-tools::-webkit-scrollbar { height: 5px; }
    #build-tools::-webkit-scrollbar-thumb {
      background: rgba(58,49,40,.22); border-radius: 99px;
    }
    /* An entry. Sized by a floor and a ceiling rather than its contents: a
       person's note is "carrying 4x tomato" where a fixture's is "$45", and a
       strip whose buttons are each as wide as their longest line is one you
       cannot scan. Both lines ellipsise instead. */
    .tool {
      position: relative; border: 0; background: transparent; cursor: pointer; flex: none;
      font: inherit; color: var(--ink); border-radius: 12px; padding: 7px 12px 6px;
      display: flex; flex-direction: column; align-items: center; gap: 1px;
      min-width: 62px; max-width: 132px; overflow: hidden;
    }
    .tool:hover { background: rgba(58,49,40,.06); }
    .tool.on { background: #ffd66b; }
    .tool .key {
      position: absolute; top: 2px; left: 5px; font-size: 9px; font-weight: 800; opacity: .4;
    }
    /* How many are already standing in the shop. Opposite corner to the key,
       because they are answers to different questions and both are one glyph. */
    .tool .have {
      position: absolute; top: 2px; right: 5px; font-size: 9px; font-weight: 800; opacity: .45;
      font-variant-numeric: tabular-nums;
    }
    .tool .ico { font-size: 19px; line-height: 1; }
    .tool .nm, .tool .cost { max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .tool .nm { font-size: 11px; font-weight: 700; }
    .tool .cost { font-size: 10px; font-weight: 700; opacity: .6; font-variant-numeric: tabular-nums; }
    /* Somebody the sim cannot place — their kind was deleted out from under
       them. That is a problem rather than a job, and it should not read as one. */
    .tool.warn .cost { color: var(--accent); opacity: .9; }

    /* Tier three, and only when the selected piece comes in more than one: a
       shape is not a fourth thing to buy, so it never takes a number key. */
    #build-shapes {
      display: flex; align-items: center; gap: 4px; flex-wrap: wrap;
      padding-top: 5px; border-top: 1px solid var(--line);
    }
    #build-shapes[hidden] { display: none; }
    #build-shapes .lbl {
      font-size: 9px; font-weight: 800; text-transform: uppercase; letter-spacing: .06em;
      opacity: .45; padding: 0 4px;
    }
    .shape {
      border: 0; border-radius: 8px; background: rgba(58,49,40,.07); cursor: pointer;
      font: inherit; font-size: 11px; font-weight: 700; color: var(--ink);
      padding: 3px 9px; opacity: .75;
    }
    .shape:hover { opacity: 1; }
    .shape.on { background: #ffd66b; opacity: 1; }

    /* Above the bar, and only when it has something to report — see
       `renderBuildHint`. Below it, it sat on the very bottom edge of the screen
       and pushed everything else up for a line that was usually restating the
       lit button. */
    #build-hint {
      background: rgba(58,49,40,.82); color: #fff; border-radius: 99px;
      padding: 4px 12px; font-size: 12px; font-weight: 600;
    }
    #build-hint[hidden] { display: none; }
    /* Amber is a consequence you may still choose; red is a no. Same two
       colours the ghost on the ground is using, so the words and the box can
       never disagree about what is about to happen. */
    #build-hint.warn { background: var(--warn); color: var(--ink); }
    #build-hint.bad { background: var(--accent); color: #fff; }
    /* The corner HUD clears the same stack, by the same arithmetic. `--build-h`
       is 0 when no bar is up, so there is one rule rather than one per mode —
       `body.building #log` and friends were three literals that had to be kept
       in step with a bar whose height nobody could predict. */
    #log, #carry, #prompt { bottom: calc(var(--nav-top) + var(--build-h) + 8px); }

    @media (max-width: 720px) {
      #log { display: none; }
      .tool { min-width: 52px; padding: 6px 8px 5px; }
      /* No room for five labelled tabs — the icon is the tab at this width. */
      .cat { padding: 5px 6px; }
      .cat .nm { display: none; }
    }
  </style>
</head>
<body>
  <canvas id="game"></canvas>
  <div id="boot">Opening the shop…</div>
  <div id="menu" hidden></div>

  <div id="topleft" class="hud">
    <div id="stats">
      <span id="cash">$0.00</span>
      <div>
        <div id="day">Day 1</div>
        <div id="season">spring</div>
      </div>
      <span id="clock">08:00</span>
      <div class="gauges">
        <div class="gg"><span class="gg-tag">Rep</span>
          <div class="repwrap"><div id="rep" style="width:50%"></div></div></div>
        <div class="gg"><span class="gg-tag">Mood</span>
          <div class="repwrap"><div id="mood" style="width:100%"></div></div></div>
        <div class="gg"><span class="gg-tag">Room</span>
          <div class="repwrap"><div id="full" style="width:100%"></div></div></div>
      </div>
    </div>
    <div id="mods"></div>
  </div>
  <div id="hq" class="hud">
    <div id="todo"></div>
  </div>
  <div id="rail" class="hud"></div>
  <div id="log" class="hud"></div>
  <div id="carry" class="hud"></div>
  <div id="prompt" class="hud"></div>
  <div id="toast" class="hud"></div>

  <div id="build" class="hud">
    <div id="build-hint" hidden></div>
    <div id="build-bar">
      <div id="build-groups"></div>
      <div id="build-tools"></div>
      <div id="build-shapes" hidden></div>
    </div>
  </div>

  <div id="panel" class="hud">
    <header><span id="panel-title">Panel</span><button id="panel-close">✕</button></header>
    <div id="panel-filter" hidden>
      <label id="panel-searchwrap">
        <span class="ico" id="search-icon"></span>
        <input id="panel-search" type="text" placeholder="search…" autocomplete="off" spellcheck="false" />
      </label>
    </div>
    <div id="panel-body"></div>
  </div>

  <script type="module" src="/main.js"></script>
</body>
</html>
