<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sprocket &amp; Stock — Style Lab</title>
<!--
  A dev-only page. Vite builds `client/index.html` and nothing else, so this
  and everything under `client/lab/` is served by `npm run dev` and never
  reaches a build. See client/lab/lab.js for why it is kept at arm's length
  from the renderer it is previewing.
-->
<style>
  :root {
    --bg: #14131a;
    --panel: #1c1b24;
    --panel-2: #232231;
    --line: #302f3f;
    --ink: #e8e6f0;
    --dim: #9a97ad;
    --hot: #7cc46a;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: var(--bg); color: var(--ink);
    font: 13px/1.45 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  #view { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
  #view:active { cursor: grabbing; }

  /* ---- top bar ---- */
  #top {
    position: fixed; top: 0; left: 0; right: 0; z-index: 3;
    display: flex; gap: 18px; align-items: center; flex-wrap: wrap;
    padding: 10px 14px;
    /* Stops short of the rail, or the last button is behind it — and the one
       behind it is always the last one added. */
    padding-right: 310px;
    background: linear-gradient(#14131aee, #14131a00);
    pointer-events: none;
    transition: padding-right .18s ease;
  }
  body.rail-shut #top { padding-right: 48px; }
  #top > * { pointer-events: auto; }
  .brand { font-weight: 650; letter-spacing: .2px; margin-right: 4px; opacity: .82; }
  .brand small { display: block; font-weight: 400; font-size: 10px; color: var(--dim); letter-spacing: .06em; text-transform: uppercase; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .chips .cap { align-self: center; font-size: 10px; color: var(--dim); text-transform: uppercase; letter-spacing: .08em; margin-right: 2px; }
  button {
    font: inherit; font-size: 12px; color: var(--ink);
    background: var(--panel); border: 1px solid var(--line); border-radius: 7px;
    padding: 5px 11px; cursor: pointer;
  }
  button:hover { background: var(--panel-2); }
  button.on { background: var(--hot); border-color: var(--hot); color: #10240c; font-weight: 600; }
  .set.on { background: #5b8ff9; border-color: #5b8ff9; color: #06152e; }

  /* ---- footer note ---- */
  #foot {
    position: fixed; left: 14px; bottom: 12px; z-index: 3;
    max-width: 42ch; color: var(--dim); font-size: 12px;
    text-shadow: 0 1px 3px #0009;
  }
  #diff { color: var(--hot); font-variant-numeric: tabular-nums; }

  /* ---- rail ---- */
  #rail {
    position: fixed; top: 0; right: 0; bottom: 0; z-index: 4;
    width: 296px; display: flex; flex-direction: column;
    background: #17161ff2; border-left: 1px solid var(--line);
    backdrop-filter: blur(8px);
    transition: transform .18s ease;
  }
  body.rail-shut #rail { transform: translateX(100%); }
  #rail-head {
    display: flex; align-items: center; gap: 8px;
    padding: 10px 12px; border-bottom: 1px solid var(--line);
  }
  #rail-head b { font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--dim); flex: 1; }
  #rail-body { flex: 1; overflow-y: auto; padding: 4px 12px 24px; }
  #rail-body::-webkit-scrollbar { width: 8px; }
  #rail-body::-webkit-scrollbar-thumb { background: var(--line); border-radius: 4px; }

  #rail-toggle {
    position: fixed; top: 50%; right: 296px; z-index: 5;
    transform: translateY(-50%); border-radius: 7px 0 0 7px; border-right: 0;
    padding: 14px 5px; font-size: 11px;
    transition: right .18s ease;
  }
  body.rail-shut #rail-toggle { right: 0; }

  .grp { margin: 14px 0 0; }
  .grp h3 {
    margin: 0 0 6px; font-size: 10px; letter-spacing: .1em; text-transform: uppercase;
    color: var(--dim); border-bottom: 1px solid var(--line); padding-bottom: 5px;
  }
  .row {
    display: grid; grid-template-columns: 1fr 118px 34px;
    align-items: center; gap: 8px; padding: 3px 0; min-height: 26px;
  }
  .row.off { display: none; }
  .row .name { color: #c8c5d8; }
  .row .val { font-size: 10px; color: var(--dim); text-align: right; font-variant-numeric: tabular-nums; }
  .row-color .val { font-size: 9px; }
  .row-toggle, .row-select { grid-template-columns: 1fr auto 0; }

  input[type=range] { width: 100%; accent-color: var(--hot); }
  input[type=color] {
    width: 100%; height: 22px; padding: 0; cursor: pointer;
    background: none; border: 1px solid var(--line); border-radius: 5px;
  }
  input[type=checkbox] { accent-color: var(--hot); width: 15px; height: 15px; cursor: pointer; }
  select {
    width: 100%; font: inherit; font-size: 12px; color: var(--ink);
    background: var(--panel); border: 1px solid var(--line); border-radius: 5px; padding: 3px 6px;
  }
</style>
</head>
<body>
  <canvas id="view"></canvas>

  <div id="top">
    <div class="brand">Style Lab<small>Sprocket &amp; Stock</small></div>
    <div class="chips"><span class="cap">Look</span><span id="presets" class="chips"></span></div>
    <div class="chips"><span class="cap">Scene</span><span id="sets" class="chips"></span></div>
    <div class="chips">
      <button id="shot">Save PNG</button>
      <button id="copy">Copy settings</button>
    </div>
  </div>

  <div id="foot">
    <div id="note">Loading the catalog…</div>
    <div id="diff"></div>
  </div>

  <button id="rail-toggle">◀▶</button>
  <aside id="rail">
    <div id="rail-head"><b>Knobs</b></div>
    <div id="rail-body"></div>
  </aside>

  <script type="module" src="/lab/lab.js"></script>
</body>
</html>
